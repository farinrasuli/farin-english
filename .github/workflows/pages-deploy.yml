name: Deploy Pages (thefeschool.com)

# Publishes the marketing site (site/) at the domain root of https://thefeschool.com/.
#
# 2026-11-09: ONLY the site is published now. Before, the whole repo was copied
# through, which made internal files public (CLAUDE.md, docs-claude/, site-src/,
# lesson-template/, SEO strategy docs, keyword research) and served a second full
# copy of the site under /site/ (duplicate content). site/404.html sends old
# /site/... links to the same page at the root.
#
# app/ is deliberately EXCLUDED from this deploy: the learner app now lives
# in its own repo (farinrasuli/farin-english-app) with no custom domain, so
# it keeps being served from farinrasuli.github.io and existing users'
# localStorage progress isn't lost to a domain-redirect origin change.
# Serving a second, stale copy of the app here would just be confusing
# duplicate content. The site links to the app via its new repo's absolute
# URL instead of a local /app/ path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble published site
        run: |
          set -e
          mkdir -p _site
          # 1. The marketing site is the published site. Internal working docs
          #    that live inside site/ (strategy .md files, keyword research)
          #    stay in the repo but are not published.
          rsync -a --exclude='*.md' --exclude='keyword-research/' site/ _site/
          # 2. The few public files that live at the repo root: the two icons
          #    every page links (/icon-180.png, /icon-512.png) and the legacy
          #    app redirect stub + manifest, so old links keep working (they
          #    hop to site/app/farin-english-app.html -> the app's own origin).
          #    The app itself is NEVER copied here (HARD RULE, entities.md).
          cp icon-180.png icon-512.png farin-english-app.html manifest.json _site/
          # 3. Guard: fail the deploy if internal files ever slip back in.
          for f in CLAUDE.md docs-claude site-src lesson-template site keyword-research SEO-STRATEGY.md; do
            if [ -e "_site/$f" ]; then echo "internal path published: $f"; exit 1; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
