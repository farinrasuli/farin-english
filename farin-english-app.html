/* ============================= STATE ============================= */
const STORAGE_KEY = 'farinEnglishApp.v2';
function freshState(){
  return {
    view:'diagnostic-intro', viewParams:{}, lang:'tr',
    profile:{name:'', motivationTag:null, archetype:null, level:null, levelStage:1, learnerType:null, priorityArea:null, completedDiagnostic:false, dashboardIntroShown:false},
    progress:{sessionsExplored:0, streak:0, lastActiveDate:null, completedTraps:[], completedVocabSets:[], completedScenes:[], completedStories:[], srs:{}, badgesEarnedAt:{}, reviewsCompleted:0, roadmapChecked:{}, dailyTasksDate:null, dailyTasksChecked:{}},
    diag:{step:0, motivationTag:null, level:null, learnerType:null, priorityArea:null},
    quiz:null
  };
}
let state = load();
LANG = state.lang || 'tr';
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(parsed.profile && parsed.profile.completedDiagnostic) parsed.view = parsed.view === 'diagnostic-intro' ? 'dashboard' : parsed.view;
    const merged = Object.assign(freshState(), parsed);
    if(!merged.progress.completedStories) merged.progress.completedStories = [];
    if(!merged.progress.srs) merged.progress.srs = {};
    if(!merged.progress.badgesEarnedAt) merged.progress.badgesEarnedAt = {};
    if(merged.progress.reviewsCompleted===undefined) merged.progress.reviewsCompleted = 0;
    if(!merged.progress.roadmapChecked) merged.progress.roadmapChecked = {};
    if(merged.profile.levelStage===undefined) merged.profile.levelStage = 1;
    if(!merged.progress.dailyTasksChecked) merged.progress.dailyTasksChecked = {};
    if(merged.progress.dailyTasksDate===undefined) merged.progress.dailyTasksDate = null;
    if(merged.profile.dashboardIntroShown===undefined) merged.profile.dashboardIntroShown = true;
    return merged;
  }catch(e){ return freshState(); }
}
function save(){ state.lang = LANG; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let resetConfirmPending = false;
let navHistory = [];
let newlyEarnedBadges = [];
function pushHistoryEntry(){
  try{ history.pushState({t:Date.now()}, ''); }catch(e){}
}
function go(view, params){
  resetConfirmPending = false;
  navHistory.push({view: state.view, params: state.viewParams});
  state.view = view; state.viewParams = params || {}; save(); render(); window.scrollTo(0,0);
  pushHistoryEntry();
}
function goBack(){
  resetConfirmPending = false;
  if(state.view === 'diagnostic-step' && state.diag.step > 0){
    state.diag.step -= 1;
    save(); render(); window.scrollTo(0,0);
    return;
  }
  const prev = navHistory.pop();
  if(prev){ state.view = prev.view; state.viewParams = prev.params; }
  else { state.view = state.profile.completedDiagnostic ? 'dashboard' : 'diagnostic-intro'; state.viewParams = {}; }
  save(); render(); window.scrollTo(0,0);
}

function markActivity(){
  const today = new Date().toISOString().slice(0,10);
  const p = state.progress;
  if(p.lastActiveDate !== today){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    p.streak = (p.lastActiveDate === y) ? p.streak + 1 : 1;
    p.lastActiveDate = today;
  }
  p.sessionsExplored += 1;
  checkBadges();
}
function checkBadges(){
  BADGES.forEach(b=>{
    if(state.progress.badgesEarnedAt[b.id]) return;
    if(b.check(state)){
      state.progress.badgesEarnedAt[b.id] = todayISO();
      newlyEarnedBadges.push(b.id);
    }
  });
}

/* ============================= SPACED REPETITION (SRS) ============================= */
const LEITNER_INTERVALS = [1,2,4,7,14]; // days per box 1-5
function todayISO(){ return new Date().toISOString().slice(0,10); }
function updateSRS(itemId, kind, pct){
  const srs = state.progress.srs;
  const entry = srs[itemId] || {kind, box:0};
  if(pct >= 0.8) entry.box = Math.min(entry.box + 1, LEITNER_INTERVALS.length - 1);
  else if(pct < 0.5) entry.box = 0;
  const days = LEITNER_INTERVALS[entry.box];
  entry.kind = kind;
  entry.due = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
  srs[itemId] = entry;
}
function dueItems(){
  const today = todayISO();
  return Object.keys(state.progress.srs).filter(id => state.progress.srs[id].due <= today);
}
function progressArrForKind(kind){
  return kind==='grammar' ? state.progress.completedTraps
       : kind==='vocab' ? state.progress.completedVocabSets
       : kind==='story' ? state.progress.completedStories
       : state.progress.completedScenes;
}
function relativeDate(iso){
  if(!iso) return '—';
  const today = new Date().toISOString().slice(0,10);
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(iso === today) return L('Today','Bugün');
  if(iso === y) return L('Yesterday','Dün');
  return new Date(iso).toLocaleDateString(LANG==='tr'?'tr-TR':undefined,{month:'short', day:'numeric'});
}

/* ============================= HELPERS ============================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function highlightWord(sentence, word){
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const m = sentence.match(re);
  if(!m) return esc(sentence);
  const i = m.index;
  return esc(sentence.slice(0,i)) + '<b>' + esc(m[0]) + '</b>' + esc(sentence.slice(i+m[0].length));
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function grammarTitle(item){ return LANG==='tr' ? item.titleTr : item.title; }
function setTitle(set){ return LANG==='tr' ? set.title.tr : set.title.en; }
function whatsappLink(message){
  return 'https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent(message);
}
function goalLabel(p){
  const opt = MOTIVATION_OPTIONS.find(o=>o.value===p.motivationTag);
  return opt ? L(opt.label.en, opt.label.tr, opt.label.fa) : L('Not set','Belirtilmemiş','تنظیم‌نشده');
}
function leadInfoSuffix(p){
  return L(
    " My name is "+p.name+", my level is "+p.level+", and my goal is: "+goalLabel(p)+".",
    " Adım "+p.name+", seviyem "+p.level+", hedefim: "+goalLabel(p)+".",
    " اسم من "+p.name+" است، سطحم "+p.level+" است و هدفم: "+goalLabel(p)+"."
  );
}
function displayPhone(){
  const n = WHATSAPP_NUMBER;
  return '+'+n.slice(0,2)+' '+n.slice(2,5)+' '+n.slice(5,8)+' '+n.slice(8,10)+' '+n.slice(10,12);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}

function dateSeed(str){ let h = 0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
const DAILY_TASK_POOL = [
  {id:'grammar-round', ic:'dumbbell', cat:'gram', theme:'grammar', view:'grammar-list', title:{en:'Finish one Grammar Gym round', tr:'Bir Dilbilgisi Salonu turu bitir', fa:'یک تمرین باشگاه گرامر را تمام کن'}},

  {id:'speak-aloud', ic:'chat', cat:'lis', theme:'speaking', view:'speaking-club', title:{en:'Say 5 phrases out loud today', tr:'Bugün yüksek sesle 5 ifade söyle', fa:'امروز ۵ عبارت را با صدای بلند بگو'}},
  {id:'slang-pickup', ic:'cards', cat:'diag', theme:'vocab', view:'vocab-list', title:{en:'Pick up 3 new slang phrases', tr:'3 yeni argo ifade öğren', fa:'۳ اصطلاح عامیانه جدید یاد بگیر'}},
  {id:'roadmap-progress', ic:'compass', cat:'diag', theme:'roadmap', view:'diag-intro-review', title:{en:'Check off one step in Your Roadmap', tr:"Yol Haritan'da bir adımı işaretle", fa:'یک قدم در نقشه راهت را علامت بزن'}}
];
function buildDailyTasks(p){
  const priorityThemeMap = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'};
  const focusTheme = priorityThemeMap[p.priorityArea] || 'grammar';
  const focusTask = DAILY_TASK_POOL.find(t=>t.theme===focusTheme) || DAILY_TASK_POOL[0];
  const rest = DAILY_TASK_POOL.filter(t=>t.id!==focusTask.id);
  const seed = dateSeed(todayISO());
  const offset = seed % rest.length;
  const rotated = rest.slice(offset).concat(rest.slice(0, offset));
  return [focusTask, rotated[0], rotated[1]];
}
function displayLevel(p){ return p.levelStage===2 ? p.level+'.2' : p.level; }
function nextDisplayLevel(p){
  if(p.levelStage===1) return p.level+'.2';
  const li = LEVELS.indexOf(p.level);
  return li < LEVELS.length-1 ? LEVELS[li+1] : p.level;
}
function buildRoadmap(profile){
  const gPool = GRAMMAR_ITEMS.filter(g=>g.level===profile.level);
  const vPool = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='vocab');
  const slPool = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='slang');
  const stage = profile.levelStage===2 ? 2 : 1;
  const gHalf = Math.ceil(gPool.length/2);
  const gSlice = stage===1 ? gPool.slice(0, gHalf) : gPool.slice(gHalf);
  const items = [];
  let vi = vPool.length ? (stage===2 ? Math.ceil(vPool.length/2) : 0) : 0;
  let sli = slPool.length ? (stage===2 ? Math.ceil(slPool.length/2) : 0) : 0;
  gSlice.forEach((g, i)=>{
    items.push({type:'grammar', refId:g.id, title:L('Grammar','Dilbilgisi','گرامر')+': '+grammarTitle(g)});
    if(i % 2 === 1 && vPool.length){
      const v = vPool[vi % vPool.length]; vi++;
      items.push({type:'vocab', refId:v.id, title:L('Vocab','Kelime','کلمات')+': '+setTitle(v)});
    }
    if(i === Math.max(Math.floor(gSlice.length/2)-1, 0)){
      items.push({type:'session', refId:null, title:L('Live speaking session','Canlı konuşma seansı','جلسه زنده مکالمه')});
    }
  });
  if(slPool.length){
    const sl = slPool[sli % slPool.length];
    items.push({type:'slang', refId:sl.id, title:L('Slang','Argo','اصطلاحات')+': '+setTitle(sl)});
  }
  items.push({type:'session', refId:null, title:L('Live speaking session','Canlı konuşma seansı','جلسه زنده مکالمه')});
  return items.map((it,idx)=>Object.assign({n:idx+1}, it));
}

];
function pickGreeting(p, dueCount){
  const priorityTheme = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'}[p.priorityArea];
  const eligible = GREETINGS.filter(g=>{
    if(g.theme==='general' || g.theme==='story') return true;
    if(g.theme==='review') return dueCount>0;
    return g.theme===priorityTheme;
  });
  const bucket = Math.floor(Date.now()/(10*60*1000));
  const g = eligible[bucket % eligible.length];
  return L(g.en,g.tr,g.fa).replace('{name}', '<bdi>'+esc(p.name)+'</bdi>');
}

/* ============================= QUIZ ENGINE (shared) ============================= */
function grammarQuizQuestions(item){
  const why = L(item.exp.en, item.exp.tr);
  const pickLabel = L('Which sentence is correct?','Hangi cümle doğru?');
  const pickQ = (right, wrong) => { const opts = shuffle([right, wrong]); return {prompt:pickLabel, options:opts, correct:opts.indexOf(right), why}; };
  const fillQ = (blank) => { const opts = shuffle([blank.word, ...blank.distractors]); return {prompt:blank.sentence, options:opts, correct:opts.indexOf(blank.word), why}; };
  const tfLabel = L('True or false: this sentence is correct.','Doğru mu yanlış mı: bu cümle doğru.');
  const tfQ = (sentence, isCorrect) => { const opts = shuffle([L('True','Doğru'), L('False','Yanlış')]); const answer = isCorrect ? L('True','Doğru') : L('False','Yanlış'); return {prompt:tfLabel+'\n"'+sentence+'"', options:opts, correct:opts.indexOf(answer), why}; };
  return shuffle([
    pickQ(item.right, item.wrong),
    pickQ(item.right2, item.wrong2),
    pickQ(item.right, item.wrong2),
    pickQ(item.right2, item.wrong),
    fillQ(item.blank),
    fillQ(item.blank2),
    tfQ(item.right, true),
    tfQ(item.wrong2, false),
    tfQ(item.right2, true),
    tfQ(item.wrong, false)
  ]).slice(0, 8);
}
function vocabQuizQuestions(s){
  const sibling = VOCAB_SETS.filter(x=>x.level===s.level && x.category===s.category).flatMap(x=>x.cards);
  const blankOf = (c) => {
    const re = new RegExp(c.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    return c.sentence.replace(re, '_____');
  };
  const fillQ = (c) => {
    const pool = sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractors = shuffle(pool).slice(0,3).map(x=>x.word);
    const options = shuffle([c.word, ...distractors]);
    return {prompt: blankOf(c), options, correct: options.indexOf(c.word)};
  };
  const reverseLabel = L('Which sentence uses this word?','Bu kelimeyi hangi cümle kullanıyor?');
  const reverseQ = (c) => {
    const others = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const pool = others.length>=2 ? others : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractorCards = shuffle(pool).slice(0,2);
    const correctOpt = blankOf(c);
    const options = shuffle([correctOpt, ...distractorCards.map(blankOf)]);
    return {prompt: reverseLabel + '\n"' + c.word + '"', options, correct: options.indexOf(correctOpt)};
  };
  const tfLabel = L('True or false: this word fits the sentence.','Doğru mu yanlış mı: bu kelime cümleye uyuyor.');
  const tfQ = (c, i) => {
    const isTrue = i % 2 === 0;
    let filled;
    if(isTrue){
      filled = c.sentence;
    } else {
      const sameSet = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const pool = sameSet.length ? sameSet : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const wrongCard = shuffle(pool)[0];
      filled = blankOf(c).replace('_____', wrongCard.word);
    }
    const opts = shuffle([L('True','Doğru'), L('False','Yanlış')]);
    const answer = isTrue ? L('True','Doğru') : L('False','Yanlış');
    return {prompt: tfLabel+'\n"'+filled+'"', options: opts, correct: opts.indexOf(answer)};
  };
  const all = [...s.cards.map(fillQ), ...s.cards.map(reverseQ), ...s.cards.map(tfQ)];
  return shuffle(all).slice(0, Math.min(3*s.cards.length, 24));
}
function storyQuizQuestions(s){ return s.quiz.slice(); }
function buildReviewQuiz(){
  const due = dueItems().slice(0, 5);
  const mixed = [];
  due.forEach(id=>{
    const entry = state.progress.srs[id];
    let source, generator;
    if(entry.kind==='grammar'){ source = GRAMMAR_ITEMS.find(x=>x.id===id); generator = grammarQuizQuestions; }
    else if(entry.kind==='vocab'){ source = VOCAB_SETS.find(x=>x.id===id); generator = vocabQuizQuestions; }
    else if(entry.kind==='story'){ source = STORY_LIBRARY.find(x=>x.id===id); generator = storyQuizQuestions; }
    if(!source) return;
    const qs = generator(source).slice(0, 3);
    qs.forEach(q=>{ q.itemId = id; q.kind = entry.kind; });
    mixed.push(...qs);
  });
  return shuffle(mixed);
}
function questionTimeLimit(item){ return item.options.length <= 2 ? 5 : 10; }
function startQuiz(kind, contextId, questions, backView, backParams){

  go('quiz');
}

}
let quizTimerInterval = setInterval(function(){
  const q = state.quiz;
  if(state.view !== 'quiz' || !q || q.answered || !q.deadline) return;
  const remainingMs = q.deadline - Date.now();
  const remaining = Math.max(remainingMs/1000, 0);
  const fillEl = document.getElementById('quiz-timer-fill');

  if(fillEl) fillEl.style.width = Math.max((remaining/q.timeLimit)*100, 0)+'%';

  if(wholeSecond !== q.lastTickSecond && wholeSecond > 0){
    q.lastTickSecond = wholeSecond;
    playTick(q.timeLimit - wholeSecond, q.timeLimit);
  }
  if(remainingMs <= 0){
    handleQuizTimeout();
  }
}, 100);

function renderReviewBreakdown(q){
  const byItem = {};
  q.questions.forEach((qq, idx)=>{
    const id = qq.itemId, kind = qq.kind;
    if(!byItem[id]) byItem[id] = {kind, correct:0, total:0};
    byItem[id].total++;
    if(q.results[idx]) byItem[id].correct++;
  });
  const TYPE_META = {grammar:{ic:ICONS.dumbbell, c:'gram'}, vocab:{ic:ICONS.cards, c:'voc'}, story:{ic:ICONS.book, c:'story'}};
  const rows = Object.keys(byItem).map(id=>{
    const info = byItem[id];
    let title = id;
    if(info.kind==='grammar'){ const g = GRAMMAR_ITEMS.find(x=>x.id===id); if(g) title = grammarTitle(g); }
    else if(info.kind==='vocab'){ const v = VOCAB_SETS.find(x=>x.id===id); if(v) title = setTitle(v); }
    else if(info.kind==='story'){ const s = STORY_LIBRARY.find(x=>x.id===id); if(s) title = L(s.title.en,s.title.tr); }
    return Object.assign({id, title}, info);
  });
  return `<div class="card-flat" style="margin-top:20px; text-align:start;">
    <h3 class="display" style="font-size:14px; margin-bottom:10px;">${L('What you covered','Neler tekrar ettin','چه چیزهایی را مرور کردی')}</h3>
    <div class="stack" style="gap:2px;">
      ${rows.map(r=>{
        const m = TYPE_META[r.kind] || TYPE_META.grammar;
        const good = (r.correct/r.total) >= 0.7;
        return `<div class="row between" style="align-items:center; padding:7px 0; border-bottom:1px solid var(--border-soft);">
          <div class="row" style="gap:8px; align-items:center;">
            <span style="color:var(--cat-${m.c});">${m.ic}</span>
            <span style="font-size:13px; font-weight:600;">${esc(r.title)}</span>
          </div>
          <span class="pill" style="background:${good?'var(--success-soft)':'var(--error-soft)'}; color:${good?'var(--success)':'var(--error)'};">${r.correct}/${r.total}</span>
        </div>`;
      }).join('')}
    </div>
  </div>
  ${renderPracticeRecommendation(state.profile)}`;
}
function renderQuizResults(){
  const q = state.quiz;
  const pct = Math.round((q.correct/q.questions.length)*100);
  const CAT = {grammar:'gram', vocab:'voc', story:'story', review:'review'}[q.kind];

  const justEarned = newlyEarnedBadges.slice();
  newlyEarnedBadges = [];
  return `<div class="fade-in">
    <div class="screen" style="padding-top:32px; text-align:center;">

        <div class="big num">${pct}%</div>
        <div class="small">${L('Score','Skor','امتیاز')}</div>
      </div>
      <h2 class="display" style="font-size:19px; margin-top:6px;">${q.correct} / ${q.questions.length} ${L('correct','doğru','درست')}</h2>
      <p style="color:var(--ink-soft); font-size:13.5px; margin-top:6px;">${resultLead(pct)} ${kindLabel.toLowerCase()}.</p>
      ${justEarned.length ? `
      <div class="card badge-unlock-shine" style="margin-top:16px; text-align:start; background:var(--success-soft); border-color:var(--success-soft);">
        <div class="eyebrow" style="color:var(--success);">${L('Ta-da — new badge unlocked!','İşte bu — yeni rozet açıldı!','بفرمایید — نشان جدید باز شد!')}</div>
        ${justEarned.map(id=>{ const b = BADGES.find(x=>x.id===id); return `<div class="row" style="gap:10px; margin-top:8px; align-items:center;"><span style="color:var(--success);">${ICONS[b.icon]}</span><div><div style="font-weight:700; font-size:14px;">${esc(L(b.title.en,b.title.tr))}</div><div style="font-size:12px; color:var(--ink-soft);">${esc(L(b.desc.en,b.desc.tr))}</div></div></div>`; }).join('')}
      </div>` : ''}

      ${q.kind==='review' ? renderReviewBreakdown(q) : ''}

      <div class="whatsapp-card" style="margin-top:22px; text-align:start;">
        <h3 class="display" style="font-size:15px;">${L('Want a real teacher walking you through this?','Bunu gerçek bir öğretmenle mi çalışmak istersin?','می‌خواهی این را با یک معلم واقعی مرور کنی؟')}</h3>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:5px;">${L('Message your teacher any time — you already unlocked full access.','İstediğin zaman öğretmenine mesaj at — tüm erişimin zaten açık.','هر وقت خواستی به معلمت پیام بده — دسترسی کاملت از قبل باز است.')}</p>
        <a class="btn btn-whatsapp" style="margin-top:12px;" target="_top" rel="noopener" href="${whatsappLink(L("Hi! I'm "+p.name+" — I just finished a "+kindLabel+" in the Farin English app.","Merhaba! Ben "+p.name+" — Farin English uygulamasında bir "+kindLabel+" tamamladım.","سلام! من "+p.name+" هستم — همین الان یک "+kindLabel+" را در اپ Farin English تمام کردم.")+leadInfoSuffix(p))}">${ICONS.whatsapp} ${L('Message teacher','Öğretmene mesaj at','پیام به معلم')}</a>
        ${whatsappFallback()}
      </div>

      <div class="stack" style="margin-top:18px;">
        <button class="btn btn-ghost" data-action="quiz-back-to-list">${L('Back to list','Listeye dön','برگشت به لیست')}</button>
        <button class="btn btn-ghost" data-action="nav" data-view="dashboard">${L('Go to dashboard','Panele git','رفتن به داشبورد')}</button>
      </div>
    </div>
  </div>`;
}

/* ============================= SCREENS TABLE ============================= */
const screens = {
  'diagnostic-intro': renderDiagIntro,
  'diagnostic-step': renderDiagStep,
  'privacy-policy': renderPrivacyPolicy,
  'dashboard': renderDashboard,
  'diag-intro-review': renderDiagReview,
  'review-home': renderReviewHome,
  'profile': renderProfile,
  'settings': renderSettings,
  'grammar-list': renderGrammarList,
  'grammar-trap': ()=>renderGrammarTrap(state.viewParams.id),
  'vocab-list': renderVocabList,
  'vocab-set': ()=>renderVocabSet(state.viewParams.id, state.viewParams.cardIndex||0),
  'speaking-club': renderSpeakingClub,
  'story-list': renderStoryList,
  'story-detail': ()=>renderStoryDetail(state.viewParams.id),
  'quiz': ()=> state.quiz.index < state.quiz.questions.length ? renderQuiz() : renderQuizResults()
};

/* ============================= EVENT HANDLING ============================= */
let audioCtx = null;
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(760, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.11);
  }catch(e){}
}
function playTick(elapsed, total){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const progress = Math.min(Math.max(elapsed/total, 0), 1);
    const freq = 520 + progress*520;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.09, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.08);
  }catch(e){}
}
function bindEvents(root){
  root.onclick = function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const handler = HANDLERS[action];
    if(handler){ playClickSound(); handler(el, e); }
  };
}

const HANDLERS = {
  'toggle-lang'(){ LANG = LANG==='tr' ? 'fa' : LANG==='fa' ? 'en' : 'tr'; save(); render(); },
  'set-lang'(el){ LANG = el.dataset.lang; save(); render(); },
  'diag-start'(){ go('diagnostic-step'); },
  'diag-motivation'(el){ state.diag.motivationTag = el.dataset.value; state.diag.step = 1; save(); render(); pushHistoryEntry(); },
  'diag-level'(el){ state.diag.level = el.dataset.value; state.diag.step = 2; save(); render(); pushHistoryEntry(); },
  'diag-learner'(el){ state.diag.learnerType = el.dataset.value; state.diag.step = 3; save(); render(); pushHistoryEntry(); },
  'diag-priority'(el){ state.diag.priorityArea = el.dataset.value; state.diag.step = 4; save(); render(); pushHistoryEntry(); },
  'unlock-submit'(){
    const nameEl = document.getElementById('unlock-name');
    const name = (nameEl && nameEl.value || '').trim();
    if(name.length < 2){
      state.viewParams = {showError:true, name};
      render();
      return;
    }
    const d = state.diag;
    state.profile = {
      name, motivationTag:d.motivationTag, archetype:ARCHETYPES[d.motivationTag].name.en,
      level:d.level, levelStage:1, learnerType:d.learnerType, priorityArea:d.priorityArea, completedDiagnostic:true, dashboardIntroShown:false
    };
    save();
    go('dashboard');
  },
  'retake-diagnostic'(){
    state.diag = {step:0, motivationTag:null, level:null, learnerType:null, priorityArea:null};
    state.profile.completedDiagnostic = false;
    save();
    go('diagnostic-intro');
  },
  'toggle-roadmap-item'(el){
    const idx = el.dataset.idx;
    const rc = state.progress.roadmapChecked;
    rc[idx] = !rc[idx];
    const roadmap = buildRoadmap(state.profile);
    const allDone = roadmap.every((_,i)=>rc[i]);
    if(allDone){
      if(state.profile.levelStage === 2){
        const li = LEVELS.indexOf(state.profile.level);
        if(li < LEVELS.length-1) state.profile.level = LEVELS[li+1];
        state.profile.levelStage = 1;
      } else {
        state.profile.levelStage = 2;
      }
      state.progress.roadmapChecked = {};
    }
    save(); render();
  },
  'toggle-daily-task'(el){
    const id = el.dataset.id;
    const dc = state.progress.dailyTasksChecked;
    dc[id] = !dc[id];
    save(); render();
  },
  'reset-all'(){
    if(!resetConfirmPending){ resetConfirmPending = true; render(); return; }
    resetConfirmPending = false;
    const lang = LANG;
    state = freshState();
    LANG = lang;
    save();
    render();
  },
  'open-settings'(){ go('settings'); },
  'nav'(el){
    const view = el.dataset.view;
    const params = {id: el.dataset.id};
    if(view==='grammar-list' || view==='grammar-trap') params.level = state.viewParams.level || state.profile.level;
    if(view==='vocab-list' || view==='vocab-set'){ params.level = state.viewParams.level || state.profile.level; params.cat = state.viewParams.cat || 'vocab'; }
    if(view==='story-list' || view==='story-detail') params.level = state.viewParams.level || state.profile.level;
    go(view, params);
  },
  'set-level'(el){ state.viewParams.level = el.dataset.level; save(); render(); },
  'set-cat'(el){ state.viewParams.cat = el.dataset.cat; save(); render(); },
  'flip-card'(){ state.viewParams.flipped = !state.viewParams.flipped; render(); },
  'vocab-next'(el){ const i = +el.dataset.i; go('vocab-set', {id: el.dataset.id, cardIndex: i+1, flipped:false, level:state.viewParams.level, cat:state.viewParams.cat}); },
  'vocab-prev'(el){ const i = +el.dataset.i; go('vocab-set', {id: el.dataset.id, cardIndex: i-1, flipped:false, level:state.viewParams.level, cat:state.viewParams.cat}); },
  'start-grammar-quiz'(el){
    const t = GRAMMAR_ITEMS.find(x=>x.id===el.dataset.id);
    startQuiz('grammar', t.id, grammarQuizQuestions(t), 'grammar-list', {level: state.viewParams.level});
  },
  'start-vocab-quiz'(el){
    const s = VOCAB_SETS.find(x=>x.id===el.dataset.id);
    startQuiz('vocab', s.id, vocabQuizQuestions(s), 'vocab-list', {level: state.viewParams.level, cat: state.viewParams.cat});
  },
  'start-story-quiz'(el){
    const s = STORY_LIBRARY.find(x=>x.id===el.dataset.id);
    startQuiz('story', s.id, s.quiz, 'story-list', {level: state.viewParams.level});
  },
  'start-review'(){
    const mixed = buildReviewQuiz();
    if(!mixed.length) return;
    startQuiz('review', null, mixed, 'dashboard', {});
  },
  'quiz-answer'(el){
    const q = state.quiz, i = +el.dataset.i;
    if(q.answered) return;
    if(!q.results) q.results = [];
    q.answered = true; q.selected = i;
    const isCorrect = i === q.questions[q.index].correct;
    if(isCorrect) q.correct++;
    q.results[q.index] = isCorrect;
    save(); render();
  },
  'quiz-next'(){
    const q = state.quiz;
    q.index++; q.answered = false; q.selected = null;
    if(q.index < q.questions.length){
      q.timeLimit = questionTimeLimit(q.questions[q.index]);
      q.deadline = Date.now() + q.timeLimit*1000;
      q.lastTickSecond = null;
    }
    if(q.index >= q.questions.length){
      if(q.contextId){
        const arr = progressArrForKind(q.kind);
        if(!arr.includes(q.contextId)) arr.push(q.contextId);
        updateSRS(q.contextId, q.kind, q.correct/q.questions.length);
      } else {
        const byItem = {};
        q.questions.forEach((qq,idx)=>{
          const id = qq.itemId, kind = qq.kind;
          if(!byItem[id]) byItem[id] = {kind, correct:0, total:0};
          byItem[id].total++;
          if(q.results[idx]) byItem[id].correct++;
        });
        Object.keys(byItem).forEach(id=>{
          const {kind, correct, total} = byItem[id];
          const arr = progressArrForKind(kind);
          if(!arr.includes(id)) arr.push(id);
          updateSRS(id, kind, correct/total);
        });
        state.progress.reviewsCompleted = (state.progress.reviewsCompleted||0) + 1;
      }
      markActivity();
    }
    save(); render();
  },
  'quiz-back-to-list'(){ const q = state.quiz; go(q.backView, q.backParams || {}); },
  'copy-phone'(el){
    const original = el.textContent;
    copyText(displayPhone()).then(()=>{
      el.textContent = L('Copied!','Kopyalandı!');
      setTimeout(()=>{ el.textContent = original; }, 1500);
    });
  },
  'back'(){ try{ history.back(); }catch(e){ goBack(); } }
};

/* ============================= INIT ============================= */
if(state.profile.completedDiagnostic && state.view === 'diagnostic-intro'){ state.view = 'dashboard'; }
render();

/* Best-effort offline caching for "Add to Home Screen" use. A browser-security rule means a service
   worker script must be a real same-origin file, not an inline blob — so this only activates when
   farin-sw.js is deployed alongside this HTML file. If it's missing (e.g. this file is used standalone),
   registration just fails silently and the app works exactly as before, without offline caching. */
try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('farin-sw.js').catch(function(){});
  }
}catch(e){}

try{ window.addEventListener('popstate', function(){ goBack(); }); }catch(e){}

})();
</script>
