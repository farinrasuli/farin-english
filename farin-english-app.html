{id:'story-B1-Fiction-2', level:'B1', genre:'Fiction', title:{en:'The House on Willow Street', tr:'Willow Sokağındaki Ev'},
 text:"When Daniel moved to the quiet town of Maplewood, everyone gave him the same piece of advice. \"Stay away from the house on Willow Street.\" No one explained why. Some people said it was haunted. Others believed it had been empty for decades. A few simply smiled and changed the subject whenever Daniel asked about it.\n\nNaturally, Daniel became curious. Every morning, he passed the old house on his way to work. It stood behind a rusty iron gate, surrounded by tall trees whose branches almost touched the roof. Although the garden was overgrown, the windows were surprisingly clean. Someone had to be taking care of the place.\n\nOne Saturday afternoon, Daniel decided to walk a little closer. The front gate was unlocked. He slowly stepped inside. The garden was filled with roses, lavender, and wildflowers. Someone had clearly spent hours looking after the plants. Just as Daniel reached the front porch, the wooden door opened. An elderly woman smiled warmly. \"I've been wondering when someone would finally come in.\" Daniel looked embarrassed. \"I'm sorry. I didn't mean to disturb you.\" \"You didn't,\" she replied. \"My name is Eleanor.\" \"I'm Daniel.\"\n\nShe invited him inside for tea. The house was old but beautiful. Books covered nearly every wall. Family photographs stood on shelves beside old paintings and handmade clocks. It felt more like a home than an abandoned building. As they talked, Daniel finally asked the question everyone avoided. \"Why does the town think this house is empty?\" Eleanor laughed softly. \"Because people enjoy mysteries.\" She explained that after her husband died many years earlier, she had chosen a quiet life. She rarely attended public events and spent most of her time reading, gardening, and painting. As the years passed, fewer people visited. New families moved into town without ever meeting her. Soon, rumors replaced reality. Daniel smiled. \"So the mystery wasn't really about the house. It was about people making assumptions.\" \"Exactly,\" Eleanor replied.\n\nOver the next few weeks, Daniel visited every Sunday. Sometimes they drank tea in the garden. Other times Eleanor showed him paintings she had never displayed. One afternoon she opened a small wooden chest. Inside were dozens of watercolor paintings. Each one showed the town during a different season — spring flowers, summer festivals, autumn leaves, winter snow. Daniel looked at them in amazement. \"These are incredible. No one has ever seen them.\" \"I painted them only for myself.\"\n\nAn idea came to Daniel. \"The town library is organizing an art exhibition next month. You should display these.\" Eleanor immediately shook her head. \"Oh, no. I'm too old. And nobody would be interested.\" Daniel smiled. \"I think you're wrong.\" After several days of gentle encouragement, she finally agreed.\n\nThe exhibition opened on a sunny Saturday morning. At first, only a few visitors arrived. Then someone recognized one of the paintings. \"That's the old bridge before it was rebuilt!\" Another pointed at a painting of the town square. \"My grandparents told me about that fountain!\" Soon the exhibition hall filled with people. Parents brought their children. Older residents shared memories inspired by the paintings. Everyone wanted to meet the artist. When Eleanor quietly entered the room, people stopped talking. Then a little girl walked over. \"Did you paint these?\" Eleanor nodded. \"I love them,\" the girl said. \"They make our town look magical.\" Eleanor's eyes filled with tears. \"No one has ever said that to me before.\"\n\nAfter the exhibition, something unexpected happened. The people of Maplewood began visiting Eleanor's house. Some brought homemade cakes. Others asked if she would teach watercolor painting. Children helped her plant flowers in the garden. Teenagers recorded her stories about the town's history for a school project. The lonely house on Willow Street slowly became one of the town's happiest places. Daniel often laughed when he remembered the old rumors. People had imagined ghosts and mysteries. Instead, they had discovered kindness, art, and friendship.\n\nOne autumn evening, Daniel and Eleanor sat on the porch watching golden leaves fall from the trees. \"Thank you,\" Eleanor said quietly. \"For what?\" \"For opening the gate.\" Daniel smiled. \"I almost turned around that day.\" \"I'm glad you didn't.\" Eleanor looked toward the street. \"You know, houses don't become lonely. People do.\" Daniel thought about those words for a long time. Sometimes, the greatest adventure isn't finding a hidden treasure. Sometimes, it's simply knocking on a door everyone else is afraid to open.",
 vocab:[{word:'abandoned', en:'Left empty and no longer used.', tr:'terk edilmiş', fa:'متروک'},{word:'overgrown', en:'Covered with many plants.', tr:'yabani otlarla kaplanmış', fa:'پوشیده از علف‌های هرز'},{word:'rumor', en:'Information that may not be true.', tr:'söylenti', fa:'شایعه'},{word:'assumption', en:'Something you believe without proof.', tr:'varsayım', fa:'فرض'},{word:'watercolor', en:'A type of painting using water-based paint.', tr:'sulu boya', fa:'آبرنگ'},{word:'exhibition', en:'A public display of art or objects.', tr:'sergi', fa:'نمایشگاه'},{word:'encourage', en:'To give someone confidence or support.', tr:'cesaretlendirmek', fa:'تشویق کردن'},{word:'recognize', en:'To know someone or something because you have seen it before.', tr:'tanımak', fa:'شناختن'},{word:'magical', en:'Very beautiful or special, like magic.', tr:'büyülü', fa:'جادویی'},{word:'porch', en:'A covered area at the entrance of a house.', tr:'veranda', fa:'ایوان'},{word:'lonely', en:'Feeling sad because you are alone.', tr:'yalnız', fa:'تنها'},{word:'curiosity', en:'A strong desire to know or learn something.', tr:'merak', fa:'کنجکاوی'}],

       {prompt:'How did Daniel help Eleanor reconnect with the town?', options:['He encouraged her to display her paintings in a public exhibition','He introduced her to his own family','He convinced her to sell the house'], correct:0},

 discussionQuestions:['Have you ever judged a person or place before getting to know them?','Why do rumors spread so easily?','What hidden talent would you like to share with others?'],
 writingPractice:{prompt:'Write 10-12 sentences about someone in your community who has inspired you. You can include: Who they are. What they do. Why you admire them. What you have learned from them.'},
 funFacts:['Many artists become well known only after someone encourages them to share their work.','Rumors often grow when people have very little information.','Community art exhibitions help preserve local history and bring neighbors together.','Spending time with older people can help preserve stories that might otherwise be forgotten.'],

{id:'story-B1-Fiction-3', level:'B1', genre:'Fiction', title:{en:"The Lighthouse Keeper's Promise", tr:'Deniz Feneri Bekçisinin Sözü'},
 text:"On the edge of a rocky island stood an old lighthouse. For over fifty years, Mr. Carter had been its keeper. Every evening before sunset, he climbed the narrow stairs to light the powerful lamp that guided ships safely through the sea. People in the nearby village respected him. Many sailors believed that if they saw the lighthouse, they knew they were close to home.\n\nAs Mr. Carter grew older, climbing the stairs became more difficult. His knees hurt, and his hands shook. One day, he announced that he would retire at the end of the summer. The village was happy for him, but everyone wondered the same thing: who would take care of the lighthouse now?\n\nAmong the villagers was a young woman named Ava. She had always loved the sea and often helped fishermen repair their boats. When she heard the news, she visited Mr. Carter. \"I'd like to learn your job,\" she said. Mr. Carter smiled. \"It's not just about turning on a light. It's about responsibility.\"\n\nFor the next month, Ava visited every afternoon. She learned how to clean the large glass windows, check the weather reports, and inspect the old machinery. Most importantly, she learned that every task had to be done carefully. \"Even one small mistake,\" Mr. Carter said, \"can have serious consequences.\"\n\nOn Mr. Carter's final evening, the entire village gathered near the lighthouse. The mayor thanked him for his many years of service. Children gave him a painting of the lighthouse, and the fishermen presented him with a wooden model of his favorite boat. As the sun slowly disappeared, Mr. Carter handed Ava the old brass key. \"It belongs to you now.\" Ava smiled nervously. \"I'll do my best.\" \"I know you will,\" he replied.\n\nA few weeks later, a strong storm arrived without warning. Dark clouds covered the sky, and huge waves crashed against the rocks. The electricity suddenly went out across the island. The lighthouse became completely dark. Ava remembered her training. She quickly found the emergency oil lamp and carried it to the top of the tower. Although it was smaller than the electric light, it was bright enough to guide ships away from the dangerous rocks.\n\nThe next morning, several sailors visited the lighthouse. \"If that light hadn't appeared,\" one captain said, \"we might have crashed.\" Ava realized that even the oldest methods could still save lives.\n\nYears later, visitors often asked Mr. Carter whether he missed being the lighthouse keeper. He always smiled. \"I don't miss the job,\" he said. \"I miss the view.\" Then he looked toward the lighthouse, where Ava was preparing the evening light. \"The greatest success,\" he added, \"is knowing someone will continue your work with the same care.\" As the lamp began to shine across the sea, the village knew the promise of the lighthouse would continue for many years to come.",
 vocab:[{word:'lighthouse', en:'A tower with a bright light that guides ships.', tr:'deniz feneri', fa:'فانوس دریایی'},{word:'retire', en:'To stop working because of age.', tr:'emekli olmak', fa:'بازنشسته شدن'},{word:'responsibility', en:'The duty to take care of something.', tr:'sorumluluk', fa:'مسئولیت'},{word:'inspect', en:'To check something carefully.', tr:'denetlemek', fa:'بازرسی کردن'},{word:'consequence', en:'The result of an action.', tr:'sonuç', fa:'پیامد'},{word:'gather', en:'To come together in one place.', tr:'toplanmak', fa:'جمع شدن'},{word:'emergency', en:'A dangerous situation needing quick action.', tr:'acil durum', fa:'وضعیت اضطراری'},{word:'crash', en:'To hit something hard by accident.', tr:'çarpmak', fa:'تصادف کردن'},{word:'guide', en:'To show the correct direction.', tr:'rehberlik etmek', fa:'راهنمایی کردن'},{word:'continue', en:'To keep doing something.', tr:'devam etmek', fa:'ادامه دادن'}],

{id:'story-B1-Adventure-1', level:'B1', genre:'Adventure', title:{en:'The Lost Map of Black Ridge', tr:'Black Ridge’in Kayıp Haritası'},
 text:"Emma had always loved hiking, but she had never explored Black Ridge National Park. One weekend, she joined a small hiking group led by an experienced guide named Carlos. Along with them were Noah, a university student, and Mia, a wildlife photographer.\n\nBefore they started, Carlos gave everyone an important warning. \"Stay together,\" he said. \"The trails are safe, but it's easy to lose your way if you leave them.\" Everyone agreed.\n\nThe weather was perfect, and the group enjoyed the fresh mountain air as they climbed higher. After two hours, they reached an old wooden cabin. Inside, Emma noticed a dusty box under a broken table. Curious, she opened it. Inside was an old hand-drawn map. At the top, someone had written: \"Hidden Spring – Follow the Eagle Rocks.\" \"This must be years old,\" Noah said. Carlos examined the paper. \"I've heard stories about a hidden spring, but I've never seen it.\" They decided to follow the map carefully.\n\nThe path soon became narrow and rocky. Several signs had disappeared over the years. Sometimes they stopped to compare the map with the landscape. At one point, they reached two different trails. The map was unclear. Mia noticed a group of large rocks shaped like eagle wings. \"I think these are the Eagle Rocks.\" Carlos smiled. \"Good observation.\" They chose the left path. After another thirty minutes, they heard the sound of running water.\n\nBehind a group of tall trees, they discovered a beautiful spring. Crystal-clear water flowed into a small natural pool. Wildflowers covered the ground, and colorful butterflies flew through the air. \"It feels like nobody has been here for years,\" Emma whispered. They rested there for lunch, filled their water bottles, and took photographs. Carlos carefully marked the location on his GPS. \"We should report this to the park office,\" he said. \"They can protect this place.\" Everyone agreed. Some beautiful places should be shared—but also protected.\n\nWhen they returned to the visitor center, the park ranger was surprised. \"The Hidden Spring really exists!\" she said. She explained that old records mentioned it, but nobody had found it for decades. Thanks to the group's information, the park created a protected walking trail with signs reminding visitors to respect nature and leave no litter behind.\n\nSeveral months later, Emma returned to Black Ridge. The spring looked just as beautiful as before. Visitors admired it quietly, and everyone followed the park rules. Emma smiled. The greatest adventure had not been discovering the spring. It had been helping protect it for future hikers.",

       {prompt:'Why did the hikers report the spring to the park office?', options:['So the park could protect the location for future visitors','So they could claim ownership of the discovery','So the park would close the trail permanently'], correct:0}],

 message:{en:'Adventure is not only about discovering new places. It is also about respecting nature and protecting it so others can enjoy it in the future.'}},

{id:'story-B1-Adventure-2', level:'B1', genre:'Adventure', title:{en:'The Cave Behind the Waterfall', tr:'Şelalenin Arkasındaki Mağara'},
 text:"During their summer vacation, four friends—Lena, Oscar, Maya, and Ethan—traveled to Silver Falls National Park. The park was famous for its beautiful waterfalls, deep forests, and mountain trails. At the visitor center, a park ranger gave them a map. \"There is one rule,\" she said. \"Stay on the marked paths.\" The friends promised they would.\n\nAs they hiked through the forest, they reached the largest waterfall in the park. The water crashed loudly onto the rocks below, creating a cool mist in the air. While taking photos, Maya noticed something unusual. \"Look!\" she said. \"There seems to be a path behind the waterfall.\" The group looked carefully. Hidden behind the falling water was a narrow opening. Oscar checked the map. \"It isn't marked.\" Ethan hesitated. \"Maybe we shouldn't go.\" Lena pointed to a small sign covered by plants. It read: Authorized Hiking Route. \"It looks safe,\" she said.\n\nSlowly, they walked behind the waterfall. The sound of the water became even louder. The air felt cool and fresh. At the end of the path, they found the entrance to a small cave. Inside, sunlight entered through tiny cracks in the rocks. The walls sparkled with colorful crystals. Drops of water fell from the ceiling into a clear underground pool. \"It looks magical,\" Maya whispered.\n\nNear the pool, they found an old metal box. Inside were photographs, maps, and a notebook. The first page explained everything. Years earlier, scientists had used the cave to study the underground water system. When the project ended, they left the information behind because everything had been recorded digitally. The notebook asked visitors not to remove anything. Instead, it encouraged them to respect the cave and report its condition to the park office.\n\nThe friends explored for another twenty minutes. They took photographs but left everything exactly where they had found it. On their way back, they noticed that one section of the path had become slippery because of moss. Oscar almost fell, but Ethan quickly grabbed his backpack. \"That was close,\" Oscar laughed. \"It reminds us why we should always be careful.\"\n\nBack at the visitor center, they showed their photographs to the ranger. She smiled. \"Thank you for telling us. We'll inspect the trail and make it safer.\" She also explained that very few visitors knew about the cave because it was used mainly for educational tours. The friends felt proud. They had enjoyed an exciting adventure while helping protect the park.\n\nAs they left Silver Falls, Maya looked back at the waterfall. \"The best adventures,\" she said, \"leave nature exactly as beautiful as we found it.\" Everyone agreed.",

{id:'story-B1-Adventure-3', level:'B1', genre:'Adventure', title:{en:'Across the Frozen Lake', tr:'Donmuş Gölün Karşısında'},
 text:"Every winter, Lake Evergreen froze into a wide sheet of ice. Most visitors came to skate or take photographs, but a group of experienced guides used the frozen lake for longer winter expeditions. This year, Hannah joined the team for the first time. She had completed several hiking courses, but she had never crossed a frozen lake.\n\nBefore sunrise, their guide, Mr. Brooks, gathered everyone together. \"Crossing ice is different from hiking,\" he explained. \"We must stay together, check the ice often, and never rush.\" Everyone listened carefully.\n\nThe journey began smoothly. The cold air was fresh, and the snow-covered mountains reflected in the ice. After an hour, the group reached the middle of the lake. Suddenly, Mr. Brooks stopped. He knelt down and listened carefully. \"Did you hear that?\" A quiet cracking sound echoed across the ice. The group immediately became silent. \"It doesn't mean the ice is breaking,\" Mr. Brooks explained calmly. \"But we should choose a safer route.\" Using a long pole, he tested the ice ahead before every step. The group followed slowly behind him.\n\nLater that afternoon, heavy clouds covered the sky. Snow began to fall. Soon, it became difficult to see the trail markers. Hannah noticed a small orange flag almost buried under the snow. \"I found the next marker!\" she called. Because of her careful observation, the group stayed on the correct route. Mr. Brooks smiled. \"Good explorers don't only walk. They pay attention.\"\n\nJust before sunset, the group reached a small emergency shelter built beside the lake. Inside, they made hot soup and warmed themselves near a safe heater. Everyone shared stories about their favorite adventures. Hannah admitted, \"I thought adventure was about being fearless.\" Mr. Brooks shook his head. \"No. Adventure is about making good decisions, especially when things become difficult.\" Everyone nodded. They knew he was right.\n\nThe next morning, the weather was clear again. The group safely completed the crossing and arrived at the visitor center. Several tourists asked them what the hardest part of the journey had been. Many expected exciting stories about danger. Instead, Hannah smiled. \"The hardest part was being patient. We succeeded because we trusted each other and followed the plan.\"\n\nAs she looked back across the frozen lake, she realized something important. Courage was not walking into danger. Courage was respecting nature, preparing carefully, and staying calm when unexpected challenges appeared. That lesson would stay with her long after the winter had ended.",

{id:'story-B1-Romance-1', level:'B1', genre:'Romance', title:{en:'The Bookshop Across the Street', tr:'Sokağın Karşısındaki Kitapçı'},
 text:"When Sophie started her new job at a small café in the city, she noticed a quiet customer who came in every morning at exactly 8:15. He always ordered the same thing: black coffee and a cheese sandwich. After paying, he sat by the window with a novel and stayed for about thirty minutes before leaving. His name, according to the receipt, was Ethan.\n\nFor three weeks, they exchanged nothing more than a smile and a polite \"Good morning.\" Still, Sophie couldn't help wondering what he was reading every day. One rainy morning, Ethan accidentally left his book on the table. Sophie picked it up and ran outside. \"Excuse me!\" she called. Ethan turned around. \"You forgot this.\" He looked surprised. \"I didn't even realize it was missing. Thank you.\" Sophie smiled. \"It must be a good book if it made you forget everything else.\" He laughed. \"It really is.\" That was the beginning of their first real conversation.\n\nOver the next few weeks, Ethan visited the café as usual. This time, however, they talked for a few minutes every morning. They discovered that they both loved classic novels, photography, and long walks by the river. One Saturday, Ethan asked, \"There's a small bookshop across the street. Would you like to visit it after your shift?\" Sophie agreed.\n\nThe bookshop was warm and quiet. Old wooden shelves reached the ceiling, and the smell of old books filled the air. They spent hours recommending books to each other. Before leaving, Ethan bought a novel. Inside the cover, he wrote: \"Every good story begins with a single conversation.\" Then he gave the book to Sophie.\n\nAs autumn arrived, they became close friends. Sometimes they explored bookstores. Sometimes they sat in the park reading together. Neither of them was in a hurry. They simply enjoyed spending time together. One evening, the owner of the café smiled at Sophie. \"I've never seen you this happy.\" Sophie laughed. \"I think I've found someone who understands me.\"\n\nSeveral months later, the bookshop announced a writing competition. The winner would have their short story displayed in the shop window. Ethan encouraged Sophie to enter. \"You always tell wonderful stories,\" he said. \"You should let other people read them.\" Sophie spent weeks writing. When the results were announced, she couldn't believe it. She had won first prize.\n\nAt the award ceremony, Sophie thanked everyone who had supported her. Finally, she looked at Ethan. \"If you hadn't believed in me,\" she said, \"I might never have shared my writing.\" Ethan smiled. \"Sometimes all a person needs is someone who says, 'You can do it.'\"\n\nAs they left the bookshop together, Sophie looked at the novel Ethan had given her months before. She realized he had been right. The best stories often begin with one simple conversation.",

{id:'story-B1-Romance-2', level:'B1', genre:'Romance', title:{en:'Letters to the Flower Shop', tr:'Çiçekçiye Mektuplar'},
 text:"Anna owned a small flower shop in the center of the city. Every morning, she arranged colorful flowers in front of the store before opening the door. One Monday, she found a small white envelope lying beside a pot of roses. It simply said: \"Thank you for making this street more beautiful.\" There was no name. Anna smiled and placed the note in a drawer.\n\nThe next week, another letter appeared. This one included a short poem about spring. Again, there was no signature. Soon, Anna looked forward to Monday mornings. She never knew what the next letter would say.\n\nMonths passed, and the letters continued. Some were funny. Some shared stories about flowers and memories. Others encouraged Anna when business was slow. Although she didn't know who was writing them, they always made her day brighter. One afternoon, her neighbor Leo visited the shop. He owned a small bakery next door. \"You seem happier lately,\" he said. Anna laughed. \"I've been receiving mysterious letters.\" Leo smiled. \"Maybe someone wants to remind you that your work matters.\"\n\nAs summer arrived, the flower shop became busier. One busy morning, Anna accidentally dropped a large box of flowers. Roses, tulips, and lilies fell across the sidewalk. Before she could pick them up, Leo came running from his bakery. Together, they gathered every flower. \"Looks like flowers can be as difficult as bread,\" Leo joked. They both laughed. After that day, Leo often stopped by after work. Sometimes he brought fresh bread. Anna gave him flowers to decorate the bakery. Their friendship slowly grew.\n\nOne rainy Monday, there was no letter. Anna felt strangely disappointed. The following day, Leo entered the shop carrying a bouquet of sunflowers. \"I think these belong here,\" he said. A small envelope was tied to the ribbon. Anna opened it. Inside was a familiar message. \"Some flowers grow slowly, just like some friendships.\" She looked at Leo. \"You wrote the letters?\" He nodded. \"I wanted to thank you. When my bakery first opened, your flowers made people stop and notice this street. You helped my business without even knowing it.\" Anna smiled. \"So why didn't you tell me?\" Leo laughed. \"I wasn't brave enough.\"\n\nThat evening, they closed their shops at the same time. Instead of going home, they walked through the nearby park. The gardens were full of colorful flowers. \"I guess the mystery is over,\" Anna said. Leo smiled. \"Maybe. But I still have plenty of letters left to write.\" Anna laughed. \"I'll be waiting for every one of them.\" As they continued walking, the rain stopped, and the evening sun appeared between the clouds. Sometimes the best surprises were the ones that arrived one small letter at a time.",

{id:'story-B1-Romance-3', level:'B1', genre:'Romance', title:{en:'The Last Dance of Autumn', tr:'Sonbaharın Son Dansı'},
 text:"Every October, the town of Oakbridge celebrated the Autumn Festival. There was live music, local food, handmade crafts, and one event everyone looked forward to—the evening dance in the old town square. This year, Mia planned to attend with her friends. She loved watching people dance but had never been brave enough to join them. \"I have two left feet,\" she always joked. Her friends laughed, but they knew she was only hiding her nervousness.\n\nA week before the festival, Mia visited a local café after work. While waiting for her coffee, she noticed a poster: Free Dance Lessons – Every Wednesday Evening. The lessons were taught by Noah, a young dance instructor who had recently moved to town. Without thinking too much, Mia wrote down her name.\n\nAt the first lesson, she was shy and kept making mistakes. \"I'll never learn,\" she whispered. Noah smiled kindly. \"Everyone feels that way on the first day. The secret isn't dancing perfectly. It's enjoying the music.\" His words made Mia relax. By the end of the lesson, she was smiling instead of worrying.\n\nFor the next three weeks, Mia attended every class. She became more confident with each lesson. Sometimes she stepped on Noah's shoes. Sometimes they laughed after forgetting the next move. The classes were never about being perfect. They were about having fun. One evening, after class, Noah said, \"You've improved a lot.\" Mia laughed. \"I still have a long way to go.\" \"We all do,\" he replied.\n\nFinally, the night of the Autumn Festival arrived. The town square was filled with lights hanging from the trees. Music echoed through the cool evening air. People of all ages danced together. At first, Mia stayed near the edge of the crowd. Her old fears returned. Then Noah walked over. \"May I have this dance?\" Mia took a deep breath. \"Okay.\" As the music began, she forgot about the audience. She focused on the rhythm and enjoyed every moment. When the song ended, the crowd applauded. Not because they were the best dancers—but because they looked genuinely happy.\n\nAfter the festival, Mia and Noah sat on a bench watching colorful autumn leaves fall around them. \"I'm glad I joined your class,\" Mia said. Noah smiled. \"I'm glad you believed in yourself.\" She shook her head. \"I believed because someone else believed in me first.\" Noah looked at the glowing lights in the square. \"Confidence grows the same way trees do. It starts as something small. But if you take care of it, it becomes strong.\"\n\nMia smiled. She realized the festival had given her much more than a good memory. It had given her the courage to try new things. As they walked home through the quiet streets, the last autumn leaves drifted gently to the ground. For Mia, it wasn't the end of autumn. It was the beginning of a new chapter.",

// ===================== THRILLER =====================
{id:'story-B1-Thriller-1', level:'B1', genre:'Thriller', title:{en:'The Hotel Room That Was Never Booked', tr:'Hiç Rezerve Edilmeyen Otel Odası'},
 text:"Liam had recently started working as the evening receptionist at the historic Grand Oak Hotel. The hotel was over one hundred years old and welcomed visitors from around the world. On his first week, the hotel manager gave him one unusual instruction. \"If the computer ever shows Room 305 as occupied,\" she said, \"call me immediately.\" Liam looked confused. \"But there is no Room 305.\" The manager smiled. \"Exactly.\" Before Liam could ask another question, she walked away.\n\nSeveral quiet evenings passed without any problems. Then, one rainy Thursday, Liam was checking the reservation system when he froze. On the screen appeared: Room 305 – Guest Checked In – 8:14 PM. Liam searched the hotel map. The third floor had Rooms 301 to 304, then 306. Room 305 simply didn't exist. He called the manager. \"I think you should come downstairs.\" She arrived within minutes. Instead of looking worried, she smiled. \"So... it happened again.\"\n\nThe manager explained that every few years the old reservation system created a booking for Room 305. No technician had ever discovered why. \"It isn't dangerous,\" she said. \"But let's investigate.\" Together they searched old hotel records. In a dusty archive room, they found blueprints from 1928. To Liam's surprise, the original hotel had included a Room 305. During a renovation forty years earlier, that room had been removed to build a larger conference hall. However, some parts of the hotel's computer database had never been updated correctly.\n\nThe next morning, an IT specialist arrived. She carefully examined the old software. After several hours, she discovered the problem. Deep inside the system was an old backup file that still contained Room 305. Every few years, after a software update, the outdated file became active for a short time and created a \"ghost reservation.\" \"There are no ghosts,\" she laughed. \"Only old computer errors.\" Liam smiled with relief.\n\nAlthough the mystery had been solved, the hotel decided not to forget its unusual history. The manager created a small display in the hotel lobby. It included the old blueprint, photographs of the missing room, and a sign that read: \"The Story of Room 305: A Mystery Solved by Curiosity.\" Guests loved reading about it. Some even booked extra nights just to hear the story. One visitor said, \"I expected a ghost story.\" The manager laughed. \"The truth is often just as interesting.\"\n\nAs Liam finished another evening shift, he looked at the reservation screen. No mysterious bookings appeared. Still, whenever he passed the old conference hall, he imagined where Room 305 had once been. Sometimes history leaves behind more than memories. Sometimes it leaves behind a mystery waiting to be understood.",

{id:'story-B1-Thriller-2', level:'B1', genre:'Thriller', title:{en:'The Message in the Elevator Mirror', tr:'Asansör Aynasındaki Mesaj'},
 text:"Nora had worked in the Skyline Office Tower for almost two years. Every morning, she took the elevator to the fifteenth floor, where she worked as an architect. One Monday, she noticed something unusual. As the elevator doors closed, she saw a sentence written on the mirror with what looked like a finger: \"Look behind the clock.\" When the elevator reached her floor, she looked again. The message had disappeared. \"It must have been my imagination,\" she thought. But the next morning, the same words appeared again. This time, she was certain she had seen them.\n\nDuring lunch, Nora told her coworker, Daniel. Instead of laughing, he became curious. \"Maybe someone wrote it on the mirror when it was foggy,\" he suggested. That evening, they entered the elevator carrying a bottle of cold water. Daniel sprayed a little water onto the mirror. Slowly, hidden letters appeared. The message was real. Someone had written it with a special liquid that became visible only when the glass was covered with moisture.\n\nThe building had clocks on every floor. Which one was the message talking about? After work, Nora and Daniel checked the large clock in the lobby. Behind it, they found a small envelope. Inside was another note. \"Good. Now visit the old meeting room on Floor 12.\" They looked at each other. \"This is getting interesting,\" Daniel said.\n\nThe old meeting room had not been used for years. Inside, dusty chairs were stacked against the wall. Near the window stood an old wooden cabinet. Taped underneath one shelf was a small notebook. The first page explained everything. Ten years earlier, a group of young architects had created a puzzle for future employees. The clues led people through different parts of the building, encouraging them to learn its history and work together. At the end of the notebook, one sentence stood out: \"Great buildings are designed by great teams.\"\n\nThe next day, Nora and Daniel showed the notebook to the company director. She smiled immediately. \"I helped create this game when I first worked here. I can't believe someone finally solved it.\" She decided to restart the tradition for new employees. Each year, the newest workers would solve the mystery together during their first week. The activity quickly became everyone's favorite team-building event.\n\nAs Nora left work that evening, she smiled at the elevator mirror. Sometimes, the most unexpected message can lead to a new friendship—and remind people that the best solutions are often found by working together.",

{id:'story-B1-Thriller-3', level:'B1', genre:'Thriller', title:{en:'The Library Card with No Name', tr:'İsimsiz Kütüphane Kartı'},
 text:"Ella loved spending quiet afternoons in the city library. She usually borrowed mystery novels, but one Saturday she decided to explore the oldest section of the building. While searching through a shelf of history books, an old library card slipped out of a thick dictionary. It looked very different from modern library cards. It was yellow with age and had no name written on it. Instead, someone had written: \"If you found this card, finish my search.\" Ella looked around. No one seemed to notice. She carefully placed the card inside her notebook.\n\nThe next day, Ella returned to the library and showed the card to Mr. Harris, the head librarian. He adjusted his glasses and smiled with surprise. \"I haven't seen one of these in years.\" \"Do you know whose it is?\" Ella asked. Mr. Harris shook his head. \"But I do remember an old story. Many years ago, a history student spent months searching for a rare local journal. Before he finished his research, he suddenly moved away. No one ever knew whether he found what he was looking for.\" Ella became curious. \"Maybe this card belonged to him.\"\n\nTogether, they searched through old library records. Most were handwritten. Finally, they discovered a note from thirty years earlier. It mentioned a missing journal that had never been returned to the library shelves. The record included one clue: \"Check the reading room built after the 1995 renovation.\" The problem was that the reading room had been completely redesigned years ago.\n\nElla and Mr. Harris carefully examined the room. Near one of the windows stood an old wooden bookshelf that had been moved from the original library. While cleaning behind it, Ella noticed a narrow gap in the wall. Inside was a thin leather notebook. It wasn't the missing journal. Instead, it contained detailed notes written by the history student. On the last page he had written: \"I finally found the journal. I donated it anonymously because knowledge belongs to everyone.\" Mr. Harris smiled. \"If that's true, the journal has probably been here all along.\"\n\nThey searched again. This time, they checked the special history collection. Hidden among hundreds of old books was a journal with no donor's name. Inside the front cover was a small note. \"For every curious reader who comes after me.\" The mystery was finally solved. The student had never wanted recognition. He simply wanted future generations to learn from the journal.\n\nA few weeks later, the library created a small exhibition about the discovery. Visitors learned not only about the rare journal but also about the unknown student whose curiosity had preserved an important part of local history. Ella smiled as she looked at the old library card displayed in a glass case. One small piece of paper had led to a forgotten story. She realized that libraries held more than books. They held adventures waiting for someone curious enough to begin reading.",

{id:'story-B1-Documentary-1', level:'B1', genre:'Documentary', title:{en:'The Island That Banned Plastic', tr:'Plastiği Yasaklayan Ada'},
 text:"Blue Bay was a small island famous for its white beaches and clear blue sea. Every year, thousands of tourists visited to swim, dive, and enjoy nature. However, as tourism increased, so did plastic waste. Plastic bottles, bags, and food containers often washed onto the beaches. Sea turtles sometimes became trapped in plastic, and fishermen found more rubbish than fish in their nets. The island's residents realized they had to act before the problem became even worse.\n\nThe local government organized a public meeting. Scientists, business owners, teachers, and students all attended. After several weeks of discussion, they introduced a new rule: single-use plastic would no longer be allowed on the island.\n\nMany shop owners worried at first. They thought customers would complain. Restaurants wondered how they would serve takeaway food. To help businesses, the government offered reusable bags, paper packaging, and discounts on environmentally friendly products.\n\nThe first few months were not easy. Visitors sometimes forgot the new rules. At the ferry terminal, volunteers politely explained the changes and gave tourists reusable water bottles. Schools also joined the project. Children organized beach clean-up events every weekend. They even created posters reminding people to protect marine life. Slowly, attitudes began to change. People became proud of keeping the island clean.\n\nOne year later, scientists compared new environmental data with information from previous years. The results were encouraging. There was much less plastic on the beaches. Sea birds and turtles were spotted more often. The water near the island became cleaner, and local fishermen reported healthier fish populations.\n\nTourists also noticed the difference. Many visitors chose Blue Bay because it was one of the cleanest islands in the region. Local businesses discovered that protecting nature had also helped the island's economy.\n\nA documentary film about Blue Bay was later shown at an international environmental festival. Communities from other countries contacted the island to learn from its experience. The mayor gave a simple explanation for their success. \"We didn't solve everything overnight,\" she said. \"We succeeded because thousands of small actions became one big change.\"\n\nToday, Blue Bay continues to welcome visitors from around the world. At the entrance to the island, every tourist reads the same message: \"Take memories home—not plastic.\" Most visitors smile when they read it. By the time they leave, they understand exactly what it means.",

{id:'story-B1-Documentary-2', level:'B1', genre:'Documentary', title:{en:'The Village Powered by the Wind', tr:'Rüzgarla Çalışan Köy'},
 text:"High in the mountains of northern Spain, there was a small village called Valverde. For many years, life in the village was difficult. The roads were narrow, the winters were cold, and electricity was not always reliable. Sometimes, during heavy storms, the power went out for many hours. The villagers depended on old energy systems that were expensive and difficult to maintain. Many young people moved to bigger cities because they believed there were not enough opportunities in the village. The community began to worry about its future.\n\nOne day, a group of local engineers visited Valverde. They noticed something special about the area. The village had strong winds throughout the year. The engineers suggested building small wind turbines on the hills around the village. At first, many residents were unsure. \"We have lived here for generations,\" one farmer said. \"But we don't know anything about wind energy.\" The engineers explained that the project would not only provide cleaner electricity but also create new jobs. After many meetings, the villagers decided to support the idea.\n\nConstruction began the following spring. Workers carefully installed several wind turbines on the mountain slopes. The project was challenging because the weather was unpredictable. Strong winds sometimes stopped the work, and transporting materials to the hills was difficult. However, the community worked together. Farmers helped provide transportation. Students learned about renewable energy at school. Local businesses supported the workers. Everyone had a role.\n\nWhen the wind turbines finally started working, the results were impressive. The village produced enough clean energy for all its homes. The electricity became more affordable, and power cuts became rare. The village also started selling extra energy to nearby towns. With this new income, Valverde improved its roads, opened a small technology center, and created training programs for young people. Slowly, people who had left the village began returning. They saw new possibilities in their hometown.\n\nYears later, Valverde became an example of successful renewable energy use. Visitors from other communities came to learn from their experience. The mayor often explained the secret behind their success: \"The turbines gave us energy, but the people gave us hope.\" The village showed that technology alone cannot solve problems. People must work together and believe in change.\n\nToday, when visitors arrive in Valverde, they see the large white turbines turning above the green mountains. For the villagers, they are not just machines. They are symbols of cooperation, innovation, and a better future.",

{id:'story-B1-Documentary-3', level:'B1', genre:'Documentary', title:{en:'The Woman Who Saved a Forest', tr:'Bir Ormanı Kurtaran Kadın'},
 text:"Deep in the mountains of Kenya, there was a large forest called Green Valley Forest. For many years, the forest provided clean water, fresh air, and a home for many animals. However, over time, more and more trees were cut down. People needed wood for building houses and making fires. Farmers also cleared parts of the forest to create more land for agriculture. Slowly, the forest began to disappear. The rivers became smaller, the soil became weaker, and many animals lost their homes.\n\nA woman named Amina grew up near the forest. As a child, she loved walking among the trees and listening to birds. When she became a scientist, she returned to her hometown and saw how much the environment had changed. She was worried about the future of the forest. \"We cannot protect nature only by talking about the problem,\" she said. \"We need to take action.\"\n\nAmina started a small project with local women. They collected seeds from native trees and planted them in damaged areas. At first, many people doubted the project. Some believed planting trees would not make a difference. Others thought the work was too difficult. But Amina and her team continued. They planted trees every week and taught villagers how forests helped protect their farms and water supplies.\n\nAfter several years, the results became visible. New trees began growing. Birds and animals slowly returned. The soil became healthier, and small rivers started flowing more regularly. The project also helped local families. The women who joined Amina's group earned income by growing and selling tree seedlings. They used the money to support their children and improve their homes. Protecting the forest had created new opportunities.\n\nNews about Amina's work spread. Environmental organizations from around the world visited Green Valley Forest to learn from the project. Many people were surprised that a small local group had created such a big change. Amina always explained: \"The forest was not saved by one person. It was saved by hundreds of people who believed their actions mattered.\"\n\nToday, Green Valley Forest is healthier than it was decades ago. Children in the village learn about nature at school. They plant trees and understand the importance of protecting the environment. When visitors walk through the forest, they see tall trees, hear birds singing, and feel the difference that determination can make. Amina often stands among the trees she helped restore. She says the greatest reward is not receiving recognition. It is knowing that future generations will enjoy the same beautiful forest she loved as a child.",

{id:'story-B2-Fiction-1', level:'B2', genre:'Fiction', title:{en:'The Man Who Collected Forgotten Memories', tr:'Unutulmuş Anıları Toplayan Adam'},
 text:"In the old part of the city, hidden between modern buildings and busy streets, there was a small shop with no sign above the door. Most people walked past it without noticing. Inside the shop, shelves were filled with thousands of objects: old photographs, handwritten letters, broken watches, postcards, and forgotten toys. The owner, Daniel Reed, called it the Memory Shop. But Daniel did not sell anything. Instead, he collected objects that carried personal stories.\n\nWhen Daniel was young, his grandfather gave him an old pocket watch. \"It stopped working years ago,\" his grandfather told him. \"But it still carries a memory.\" Those words stayed with Daniel. He began to understand that objects were not valuable because of their price. They were valuable because of the moments connected to them. Years later, Daniel opened his unusual shop. People brought him things they no longer wanted but could not completely throw away.\n\nOne rainy afternoon, a young woman named Clara entered the shop. She carried a small wooden box. \"I found this while cleaning my grandmother's house,\" she explained. \"I don't know what to do with it.\" Daniel carefully opened the box. Inside were old photographs, a faded concert ticket, and a letter. He picked up the letter but did not read it. \"Some memories belong only to their owners,\" he said. Clara smiled. \"I think my grandmother wanted someone to understand her story.\"\n\nTogether, they looked through the photographs. They showed a young woman traveling through different countries, meeting new people, and exploring unfamiliar places. Clara was surprised. \"I never knew my grandmother lived such an exciting life.\" Daniel smiled. \"Many people carry entire worlds inside them, but others only see a small part.\"\n\nClara decided to learn more. She interviewed family members, searched through old documents, and discovered stories she had never heard before. Her grandmother had once wanted to become a writer but had stopped after getting married and starting a family. The photographs were from a time when she felt completely free. A month later, Clara returned to the Memory Shop. She gave Daniel a small book. \"What is this?\" he asked. \"I wrote my grandmother's story,\" Clara replied. \"I wanted to make sure her memories would not disappear.\"\n\nYears passed, and Daniel continued collecting forgotten objects. However, he noticed something changing. People no longer came only to leave things behind. They came to remember. A father brought his daughter's first drawing. A musician brought an old instrument. An elderly man brought letters from his childhood friend. Each object revealed a hidden story.\n\nOne evening, Daniel looked around his shop. Thousands of memories surrounded him. He realized that he had never really collected objects. He had collected pieces of people's lives. The world often celebrates new things and forgets old ones. But Daniel believed every person carried valuable stories. Sometimes, all a memory needs is someone willing to listen.",
 vocab:[{word:'forgotten', en:'Not remembered anymore.', tr:'unutulmuş', fa:'فراموش‌شده'},{word:'valuable', en:'Important or worth a lot.', tr:'değerli', fa:'باارزش'},{word:'memory', en:'Something remembered from the past.', tr:'anı', fa:'خاطره'},{word:'object', en:'A physical thing.', tr:'nesne', fa:'شیء'},{word:'connect', en:'To join or link ideas or feelings.', tr:'bağlamak', fa:'پیوند دادن'},{word:'unfamiliar', en:'Not known or recognized.', tr:'bilinmeyen', fa:'ناآشنا'},{word:'interview', en:'To ask someone questions to learn information.', tr:'röportaj yapmak', fa:'مصاحبه کردن'},{word:'disappear', en:'To become impossible to find or remember.', tr:'kaybolmak', fa:'ناپدید شدن'},{word:'reveal', en:'To show something hidden.', tr:'ortaya çıkarmak', fa:'آشکار کردن'},{word:'surround', en:'To be all around something.', tr:'çevrelemek', fa:'احاطه کردن'}],
 quiz:[{prompt:'Why did Daniel collect old objects?', options:['He believed they carried personal memories more valuable than their price','He planned to sell them for a high profit','He was required to by the city museum'], correct:0},
       {prompt:"What did Clara discover about her grandmother?", options:['That she had once wanted to become a writer and lived a free, adventurous youth','That she had never left her hometown','That she had been a famous photographer'], correct:0},
       {prompt:'What did Daniel realize about his Memory Shop by the end?', options:['That he had collected pieces of people’s lives, not just objects','That the shop was no longer profitable','That he should finally start selling the items'], correct:0}],
 grammarFocus:[{point:'Past Perfect', example:'Clara had never heard those stories before.'},{point:'Relative Clauses', example:'The objects that people brought carried memories.'},{point:'Used to', example:'Her grandmother used to travel around the world.'}],
 discussionQuestions:['Do you think objects can carry memories? Why?','What object from your past is important to you?','Why do people sometimes forget the stories of older generations?'],
 writingPractice:{prompt:'Write 150-180 words about an object that has a special meaning. Include: What the object is. Who gave it to you. Why it is important. What memory is connected to it.'},
 message:{en:'People are more than what we see on the surface. Every person carries invisible stories, and sometimes the smallest objects can reveal the biggest memories.'}},

{id:'story-B2-Fiction-2', level:'B2', genre:'Fiction', title:{en:'The City Beneath the City', tr:'Şehrin Altındaki Şehir'},
 text:"When Maya accepted a job as an urban historian, she expected to spend her days studying old buildings and forgotten documents. She never expected to discover an entire world hidden beneath the city. Her research focused on how cities changed over time. One afternoon, while examining old maps in the city archive, she noticed something unusual. A small section of the oldest map showed streets that did not exist anymore. At first, Maya assumed it was a mistake. However, after comparing several documents, she discovered that the streets had disappeared from official records almost one hundred years earlier. Curious, she decided to investigate.\n\nWith permission from the city museum, Maya explored an abandoned underground tunnel beneath an old railway station. The tunnel was dark and covered with dust. The walls were covered with faded signs and old advertisements from another era. After walking for several minutes, she discovered a metal door hidden behind a broken wall. The door was unlocked. Behind it was something impossible. A complete underground neighborhood.\n\nThe hidden city was not empty. People lived there. There were small houses, gardens, workshops, and even a school. Maya was shocked. A man named Elias approached her. \"You're from the surface,\" he said. Maya could hardly speak. \"Who are you?\" Elias explained that their ancestors had created the underground community during a difficult period in the city's history. Many years ago, a group of workers had lost their homes after a major construction project. Instead of leaving the city, they built a new one beneath it. Over generations, the community grew. However, they chose to remain hidden because they feared losing their way of life.\n\nMaya spent several weeks learning about the underground city. She discovered that the people had developed their own traditions. They grew food using special underground gardens. They created art from recycled materials. They taught children both ancient skills and modern knowledge. Despite living below the surface, their community was full of creativity and hope. Maya realized that history was not only found in museums. Sometimes, it was alive in places nobody knew existed.\n\nEventually, Maya faced a difficult decision. Should she tell the world about the hidden city? Her discovery could bring attention, funding, and protection. But it could also attract tourists, developers, and people who might change the community forever. She asked Elias what he wanted. He looked around at his home. \"We don't want to disappear,\" he said. \"But we also don't want to become a museum.\"\n\nAfter careful consideration, Maya wrote a report. She explained the historical importance of the underground city but protected the exact location. Instead of opening it to the public, she worked with the community to preserve its history. Years later, the city created a small exhibition about the underground civilization—with the permission of its residents. Visitors learned about their story without disturbing their lives.\n\nStanding inside the underground gardens one final time, Maya looked at the lights above her. She understood something important. A city is not only made of buildings and streets. It is made of memories, people, and stories. Some stories are written on walls. Others are hidden beneath them, waiting patiently for someone to listen.",
 vocab:[{word:'historian', en:'A person who studies the past.', tr:'tarihçi', fa:'تاریخ‌دان'},{word:'archive', en:'A collection of old documents and records.', tr:'arşiv', fa:'آرشیو'},{word:'investigate', en:'To examine something to discover the truth.', tr:'araştırmak', fa:'بررسی کردن'},{word:'abandoned', en:'Left empty and unused.', tr:'terk edilmiş', fa:'متروک'},{word:'underground', en:'Below the surface of the earth.', tr:'yer altı', fa:'زیرزمینی'},{word:'ancestor', en:'A family member from previous generations.', tr:'ata, önceki nesil', fa:'نیای'},{word:'generation', en:'People of similar age or period.', tr:'nesil', fa:'نسل'},{word:'tradition', en:'A belief or custom passed through time.', tr:'gelenek', fa:'سنت'},{word:'preserve', en:'To protect and keep something safe.', tr:'korumak', fa:'حفظ کردن'},{word:'civilization', en:'A society with its own culture and systems.', tr:'uygarlık', fa:'تمدن'}],
 quiz:[{prompt:'Why did Maya investigate the old maps?', options:['She noticed streets on an old map that no longer existed in official records','She was ordered to by the city museum','She was looking for lost treasure'], correct:0},
       {prompt:'Why did the underground community choose to stay hidden?', options:['They feared losing their way of life if discovered','They were forbidden by law from living on the surface','They had no way to reach the surface'], correct:0},
       {prompt:'How did Maya protect the community while sharing its story?', options:['She wrote a report about its historical importance but kept the exact location private','She invited tourists to visit immediately','She reported it directly to developers'], correct:0}],
 grammarFocus:[{point:'Past Perfect', example:'The community had existed underground for generations.'},{point:'Conditionals', example:'If Maya revealed the location, many people might disturb the community.'},{point:'Passive Voice', example:'The underground city was built by former workers.'}],
 discussionQuestions:['Do you think hidden communities should be revealed to the public? Why?','Is preserving history more important than modern development?','What forgotten places would you like to explore?'],
 writingPractice:{prompt:'Write 150-180 words about a hidden place you imagine discovering. Include: Where it is. Who lives there. Why it was hidden. What decision you would make after finding it.'},
 message:{en:'Discovering something new is not only about finding it—it is also about respecting it. True exploration requires curiosity, responsibility, and understanding.'}},

{id:'story-B2-Fiction-3', level:'B2', genre:'Fiction', title:{en:'The Painter Who Stole Colors', tr:'Renkleri Çalan Ressam'},
 text:"In the small coastal town of Bellmare, everyone knew the name Adrian Vale. He was considered one of the most talented painters of his generation. His paintings were displayed in famous galleries around the world. Critics praised his unique style, and collectors paid enormous amounts for his artwork. However, despite his success, Adrian felt something was missing. Every painting looked beautiful, but none of them felt alive.\n\nOne evening, while walking near the cliffs outside the town, Adrian discovered an abandoned lighthouse. Inside, he found an old wooden box covered in dust. The box contained dozens of small glass bottles. Each bottle held a different color. There was a deep blue like the ocean at midnight, a golden yellow like sunlight, and a green that reminded him of ancient forests. Attached to the box was a note: \"These colors belong to those who truly see the world.\" Adrian thought it was a strange joke. But when he used the colors in his paintings, something incredible happened.\n\nHis new paintings became extraordinary. People said they had never seen colors like that before. A painting of a rainy street looked as if the viewer could feel the cold drops. A portrait seemed to show not only a person's face but also their emotions. Adrian became more famous than ever. However, he noticed something strange. The town around him began to change. The flowers in gardens became less colorful. The ocean looked dull. The sunset lost its brightness. People didn't notice at first, but slowly the world seemed less alive.\n\nOne morning, Adrian visited the lighthouse again. Inside, he found another message. \"Beauty cannot be owned. It can only be shared.\" Suddenly, he understood. The bottles did not contain magical paint. They contained the colors that belonged to the world around him. Every time he used them selfishly, he took a little beauty away from nature. Adrian felt ashamed. He had wanted to create beautiful art, but he had forgotten where beauty came from.\n\nThe next day, Adrian closed his studio. Many people wondered why. Some believed he had lost his inspiration. Others thought he was preparing a secret project. But Adrian began something different. He traveled across the countryside, painting landscapes and teaching young artists. He showed them how to observe carefully. \"Don't try to capture the world,\" he told them. \"Try to understand it.\"\n\nYears later, Adrian returned to Bellmare. The town was colorful again. The flowers had recovered. The sea reflected the sunlight. Children painted pictures in the streets, and local artists worked together. Adrian opened a new exhibition. The paintings were simpler than his older work, but people found them more meaningful. One visitor asked him: \"Why are these paintings different?\" Adrian smiled. \"Because I stopped trying to own beauty. I learned to appreciate it.\"\n\nAt the end of the exhibition, Adrian placed the glass bottles from the lighthouse in a display case. Beside them, he wrote one final message: \"The greatest artists are not those who take the most from the world, but those who notice the most and give something back.\"",
 vocab:[{word:'talented', en:'Having a natural ability or skill.', tr:'yetenekli', fa:'بااستعداد'},{word:'critic', en:'A person who judges art, books, or performances.', tr:'eleştirmen', fa:'منتقد'},{word:'extraordinary', en:'Very unusual and impressive.', tr:'olağanüstü', fa:'خارق‌العاده'},{word:'emotion', en:'A strong feeling such as happiness or sadness.', tr:'duygu', fa:'احساس'},{word:'selfishly', en:'Caring only about yourself.', tr:'bencilce', fa:'خودخواهانه'},{word:'inspiration', en:'Something that gives you ideas.', tr:'ilham', fa:'الهام'},{word:'landscape', en:'A picture of natural scenery.', tr:'manzara', fa:'منظره'},{word:'appreciate', en:'To understand the value of something.', tr:'takdir etmek', fa:'قدردانی کردن'},{word:'meaningful', en:'Having a deep importance or purpose.', tr:'anlamlı', fa:'معنادار'},{word:'observe', en:'To watch or notice carefully.', tr:'gözlemlemek', fa:'مشاهده کردن'}],
 quiz:[{prompt:'Why did Adrian feel unhappy despite his success?', options:['His paintings looked beautiful but felt lifeless to him','He was not earning enough money','Critics constantly criticized his work'], correct:0},
       {prompt:'What did Adrian discover about the mysterious colors?', options:['They were beauty taken from nature, not magical paint','They were a hoax played by a rival artist','They were ordinary paint that improved with age'], correct:0},
       {prompt:'How did Adrian change as an artist at the end of the story?', options:['He stopped trying to own beauty and learned to appreciate and share it','He gave up painting completely','He began selling his paintings for even higher prices'], correct:0}],
 grammarFocus:[{point:'Past Perfect', example:'Adrian had forgotten where beauty came from.'},{point:'Relative Clauses', example:'The colors that he found changed his paintings.'},{point:'Third Conditional (Introduction)', example:'If Adrian had understood the colors earlier, he would not have taken them.'}],
 discussionQuestions:['Do you think art should belong to everyone or to the artist?','Can success sometimes make people forget important things?','What inspires you creatively?'],
 writingPractice:{prompt:"Write 150-180 words about a magical object that changes someone's life. Include: What the object is. How the person finds it. How it changes their life. What lesson they learn."},

{id:'story-B2-Adventure-1', level:'B2', genre:'Adventure', title:{en:'The Expedition Beyond the Map', tr:'Haritanın Ötesindeki Keşif Gezisi'},
 text:"For decades, explorers had searched the northern mountains of Arkania, but one area remained unknown. The region was called The Silent Valley. Old maps showed only empty space where the valley should have been. Some believed it was impossible to reach because of the dangerous cliffs surrounding it. Others believed it contained secrets from ancient civilizations. Dr. Elena Morris, a young geographer, became fascinated by the mystery. She spent years studying old documents, satellite images, and stories from local villagers. Finally, she organized an expedition to discover what was truly hidden beyond the mountains.\n\nThe team included five people: Elena, who studied geography; Marcus, an experienced mountain guide; Lina, a photographer; David, a wildlife researcher; and Amir, a technology specialist. Before leaving, Marcus looked at the team seriously. \"Exploration is not about proving you are brave,\" he said. \"It is about making smart decisions when things become difficult.\" Everyone understood that the journey would test them.\n\nAfter twelve days of climbing, the group reached the edge of the mountains. The path shown on their old map suddenly disappeared. They stood in front of a massive forest that was not marked anywhere. \"This is impossible,\" David said. \"The maps never showed this.\" Elena looked at the trees carefully. \"Maybe the maps were incomplete, not wrong.\" The team continued forward.\n\nDeep inside the forest, they discovered signs of human activity. There were stone paths covered with plants and remains of old buildings. Lina carefully photographed everything. \"This place has been untouched for hundreds of years,\" she whispered. They soon realized they had found the remains of an ancient settlement. The people who lived there had created a unique system of farming and water collection. Even after centuries, parts of their technology still worked.\n\nHowever, the discovery created a new challenge. A powerful storm was approaching. The team had two choices: continue exploring and risk being trapped in the valley, or return immediately and protect their safety. Elena wanted to learn more, but she remembered Marcus's advice. Discovery was important. But survival was more important. \"We have enough information for now,\" she said. \"We will return when we are prepared.\" Everyone agreed.\n\nMonths later, Elena organized a second expedition with better equipment and more researchers. The Silent Valley became one of the most important archaeological discoveries of the decade. Scientists learned about an unknown civilization, and the area was protected as a historical site. When journalists asked Elena about the greatest moment of the expedition, they expected her to talk about the discovery. Instead, she said: \"The most important lesson was knowing when to stop.\"\n\nYears later, Elena continued exploring unknown places. But she never forgot the Silent Valley. She learned that true explorers are not people who simply go farther than others. They are people who respect nature, understand risks, and leave knowledge behind for future generations.",
 vocab:[{word:'expedition', en:'A journey organized for exploration or research.', tr:'keşif gezisi', fa:'سفر اکتشافی'},{word:'explorer', en:'A person who travels to discover new places.', tr:'kâşif', fa:'کاشف'},{word:'region', en:'A specific area or part of a country.', tr:'bölge', fa:'منطقه'},{word:'civilization', en:'A developed society with its own culture.', tr:'uygarlık', fa:'تمدن'},{word:'satellite', en:'A machine sent into space to collect information.', tr:'uydu', fa:'ماهواره'},{word:'settlement', en:'A place where people live.', tr:'yerleşim yeri', fa:'استقرارگاه'},{word:'untouched', en:'Not changed or damaged by people.', tr:'dokunulmamış', fa:'دست‌نخورده'},{word:'archaeological', en:'Related to studying ancient societies.', tr:'arkeolojik', fa:'باستان‌شناسی'},{word:'approach', en:'To come closer to something.', tr:'yaklaşmak', fa:'نزدیک شدن'},{word:'risk', en:'The possibility of danger or loss.', tr:'risk', fa:'خطر'}],

       {prompt:'What did the team discover inside the valley?', options:['The remains of an ancient settlement with working water-collection technology','A modern research station','Nothing of significance'], correct:0},
       {prompt:'Why did Elena decide to stop exploring during the storm?', options:['She believed survival was more important than further discovery','She had already found everything she needed','Marcus ordered her to stop'], correct:0}],

 discussionQuestions:['What qualities make a good explorer?','Should explorers always continue when they discover something new?','Would you prefer exploring space, oceans, or unknown lands? Why?'],

{id:'story-B2-Adventure-2', level:'B2', genre:'Adventure', title:{en:'The Desert That Remembered', tr:'Hatırlayan Çöl'},
 text:"For centuries, the Great Namar Desert was considered an empty and lifeless place. Travelers crossed it quickly, believing there was nothing to discover among the endless sand dunes. However, Dr. Sofia Karim, an archaeologist specializing in ancient cultures, believed differently. She had studied old stories from desert communities that described a forgotten city hidden beneath the sand. Most researchers considered the stories legends. But Sofia noticed something unusual. Different communities, separated by hundreds of kilometers, all told similar stories about a place they called The City of Echoes.\n\nAfter years of research, Sofia organized an expedition. Her team included Omar, a desert guide; Rachel, a historian; and Leo, a photographer. Before beginning their journey, Omar warned them: \"The desert does not forgive careless people. The sand changes every day. A path that exists today may disappear tomorrow.\" The team prepared carefully. They carried special equipment, maps, and enough supplies for several weeks.\n\nAfter ten days of traveling, they found something unexpected. Among the dunes stood several large stones arranged in a perfect circle. Rachel examined them carefully. \"These are not natural formations,\" she said. \"They were placed here by humans.\" The discovery changed everything. The old stories might not have been myths after all. Using advanced scanning equipment, Leo discovered unusual shapes beneath the sand. Something large was buried below.\n\nThe team spent the next several days carefully uncovering the area. Slowly, walls began to appear. Then doorways. Then entire streets. They had found an ancient city. The buildings were surprisingly advanced. There were systems for collecting water, underground storage rooms, and beautiful artworks carved into stone. The people who lived there had adapted perfectly to one of the harshest environments on Earth.\n\nHowever, the greatest discovery was not the buildings. Inside an ancient library, Rachel found hundreds of clay tablets. They contained stories, poems, scientific knowledge, and records of daily life. The tablets revealed that the city had not disappeared because of war. Instead, the people had slowly moved away when the climate changed and water became scarce. They left behind their home, but they preserved their knowledge.\n\nAs news of the discovery spread, many people wanted to visit the hidden city. Tourism companies offered expensive trips. Some businesses wanted to build hotels nearby. Sofia faced a difficult decision. The discovery could bring money and attention to the region. But too many visitors could damage the fragile remains. She worked with local communities and government officials to create a careful protection plan. Only limited research visits were allowed.\n\nYears later, the City of Echoes became one of the most important archaeological discoveries in the world. When people asked Sofia why she called it \"the desert that remembered,\" she explained: \"The desert did not hide the city forever. It protected it until people were ready to understand its story.\" Sofia continued exploring ancient places, but she never forgot Namar. The desert taught her an important lesson: sometimes the greatest discoveries are not about finding something new. They are about listening to the voices of the past.",
 vocab:[{word:'archaeologist', en:'A person who studies ancient cultures through objects and ruins.', tr:'arkeolog', fa:'باستان‌شناس'},{word:'legend', en:'An old story that may not be completely true.', tr:'efsane', fa:'افسانه'},{word:'dune', en:'A hill of sand formed by wind.', tr:'kum tepesi', fa:'تپه شنی'},{word:'formation', en:'A shape created naturally or intentionally.', tr:'oluşum', fa:'شکل‌گیری'},{word:'uncover', en:'To discover something hidden by removing a cover.', tr:'ortaya çıkarmak', fa:'آشکار کردن'},{word:'advanced', en:'Highly developed or modern.', tr:'gelişmiş', fa:'پیشرفته'},{word:'scarce', en:'Limited and difficult to find.', tr:'kıt', fa:'کمیاب'},{word:'fragile', en:'Easily damaged or broken.', tr:'hassas, kırılgan', fa:'شکننده'},{word:'preserve', en:'To protect something from damage or loss.', tr:'korumak', fa:'حفظ کردن'},{word:'knowledge', en:'Information and understanding gained through learning.', tr:'bilgi', fa:'دانش'}],
 quiz:[{prompt:'Why did Sofia believe the City of Echoes might be real?', options:['Distant, unconnected communities all told similar legends about the same place','She had seen it in an old photograph','A government agency told her it existed'], correct:0},
       {prompt:'What did the team discover beneath the desert?', options:['An advanced ancient city with clay tablets recording its history','A modern military base','Nothing but empty sand'], correct:0},
       {prompt:'Why did Sofia limit tourism to the ancient city?', options:['She worried too many visitors could damage the fragile remains','The government banned all visitors','The city was considered cursed by locals'], correct:0}],

 discussionQuestions:['Should ancient discoveries be open to tourists or protected from visitors?','Why do humans feel connected to places from the past?','What lost civilization would you like to discover?'],
 writingPractice:{prompt:'Write 150-180 words about discovering an ancient place. Include: Where you find it. What it looks like. What secrets it contains. How you protect it.'},
 funFacts:['Archaeologists often use technology such as satellite images and scanning tools to find hidden structures.','Deserts can preserve objects for thousands of years because of their dry conditions.','Ancient civilizations developed creative ways to survive in difficult environments.','Protecting historical discoveries helps future generations learn from the past.'],

{id:'story-B2-Adventure-3', level:'B2', genre:'Adventure', title:{en:'The Mountain Where Time Stopped', tr:'Zamanın Durduğu Dağ'},
 text:"At the edge of the eastern mountain range stood Mount Arven, a place surrounded by mystery. For hundreds of years, local people told stories about a hidden valley somewhere high above the clouds. According to the legends, the valley was a place where time moved differently. Plants grew unusually slowly, ancient buildings remained untouched, and people who entered never returned with the same understanding of the world. Most scientists believed these stories were simply myths. However, Dr. Lucas Reed, a climate researcher, was fascinated by them. He believed there might be a scientific explanation behind the legends.\n\nLucas spent years studying the mountain. Using satellite images and weather data, he discovered something unusual. A small area near the peak had a unique climate system. The temperature, air pressure, and sunlight were different from the surrounding mountains. He organized an expedition to investigate. His team included Emma, a biologist; Noah, a photographer; and Karim, an experienced mountain guide.\n\nThe journey was extremely difficult. The path became narrower as they climbed higher. Snowstorms appeared suddenly, forcing them to stop and find shelter. At one point, a landslide blocked their route. For a moment, the team considered turning back. But Karim encouraged them. \"Mountains don't reveal their secrets quickly,\" he said. \"They test your patience first.\" After several days of climbing, they finally reached the hidden valley.\n\nThe first thing they noticed was the silence. There was no sound from modern technology, vehicles, or cities. Only the wind moved through the trees. The valley was beautiful. Flowers grew in unusual patterns, and ancient stone structures stood among the forests. Emma collected samples from the plants. She discovered that many species had adapted differently because of the valley's unique environment.\n\nThe team soon found evidence of an ancient settlement. Inside the stone buildings were tools, paintings, and written records. The people who lived there had not disappeared because of a disaster. Instead, they had slowly left the valley generations earlier. Their writings explained that they wanted to protect their peaceful way of life from outside influences. They believed that some places needed to remain untouched.\n\nWhile studying the area, Lucas discovered the scientific explanation behind the legends. The valley's special conditions had slowed certain natural processes. Some plants aged more slowly. Some materials lasted much longer than expected. The valley had not stopped time. It had simply changed the speed of nature.\n\nWhen the expedition returned, the team faced an important decision. Should they reveal the location of the valley to the world? Many scientists wanted access to study the unique environment. However, Lucas remembered the message left by the ancient people. They had protected the valley for a reason. After discussion, the researchers decided to keep the exact location private. They published their findings without revealing where the valley was.\n\nYears later, Lucas was asked about his greatest discovery. People expected him to mention the scientific information he collected. Instead, he said: \"The greatest discovery was understanding that not everything must be owned or revealed. Sometimes, protecting a mystery is more valuable than solving it.\" Mount Arven remained silent. The valley remained hidden. But for those who knew its story, it became a reminder that the world still contained places where nature, history, and humanity existed together.",
 vocab:[{word:'peak', en:'The highest point of a mountain.', tr:'zirve', fa:'قله'},{word:'climate', en:'The usual weather conditions of an area.', tr:'iklim', fa:'اقلیم'},{word:'satellite', en:'A device sent into space to collect information.', tr:'uydu', fa:'ماهواره'},{word:'expedition', en:'An organized journey for discovery.', tr:'keşif gezisi', fa:'سفر اکتشافی'},{word:'shelter', en:'A place that protects people from danger or weather.', tr:'sığınak', fa:'پناهگاه'},{word:'species', en:'A group of similar living things.', tr:'tür', fa:'گونه'},{word:'adapt', en:'To change in order to survive in new conditions.', tr:'uyum sağlamak', fa:'سازگار شدن'},{word:'influence', en:'The power to affect someone or something.', tr:'etki', fa:'تأثیر'},{word:'reveal', en:'To make something known or visible.', tr:'ortaya çıkarmak', fa:'آشکار کردن'},{word:'preserve', en:'To protect something and keep it unchanged.', tr:'korumak', fa:'حفظ کردن'}],
 quiz:[{prompt:'Why did Lucas decide to explore Mount Arven?', options:['He believed there was a scientific explanation behind the local legends','He wanted to become famous quickly','He was ordered to by a research institute'], correct:0},
