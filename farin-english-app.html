{id:'story-C1-Fiction-3', level:'C1', genre:'Fiction', title:{en:'The City That Forgot Its Name', tr:'Adını Unutan Şehir'},
 text:"Nobody knew why the city had lost its name. It was not destroyed by war. It was not abandoned. People still lived there, worked there, and built their futures there. Yet, one morning, every sign, document, and map showing the city's name had disappeared.\n\nThe strange event became known as The Forgotten Morning. At first, the residents believed it was a simple administrative mistake. Government offices promised to investigate. Historians searched old records. Journalists interviewed citizens. But the more they searched, the more confusing the situation became. There was no evidence that the city had ever possessed a name. According to official documents, the city had always been simply: \"The City.\"\n\nMara Ellison, a young historian, found this impossible to accept. She believed that places, like people, developed identities through their memories. A city was not only made of buildings and streets. It was made of stories. So she began interviewing older residents. She expected to discover forgotten facts. Instead, she discovered forgotten emotions.\n\nAn elderly woman told her: \"When I was young, this city was a place where people knew each other.\" A former teacher said: \"The schools were not only places for education. They were places where generations connected.\" A retired architect explained: \"Buildings are not just structures. They are evidence that someone dreamed of the future.\"\n\nMara realized something unusual. The city had not only forgotten its name. It had forgotten its history. People remembered personal experiences, but they had lost the connection between those experiences. Thousands of individual memories existed, but there was no shared story connecting them.\n\nWhile researching old archives, Mara discovered a hidden collection of documents. They revealed that the city had once changed its name several times throughout history. Each generation had tried to create a new identity by removing the previous one. Eventually, the name disappeared completely. The city had erased itself in an attempt to constantly reinvent itself.\n\nMara published her research. However, she did not suggest choosing a new name. Instead, she organized a public project. Residents were invited to share photographs, letters, stories, and memories. Children interviewed grandparents. Artists created murals. Families brought objects that represented their personal connection to the city. Slowly, a collective identity began to return.\n\nMonths later, the city council asked residents to choose a new name. Many suggestions were presented. Some wanted a name connected to history. Others wanted something modern. But in the end, people chose a name based on the idea that had brought them together: Remembrance.\n\nYears later, visitors asked Mara why she believed the city had forgotten itself. She answered: \"Because identity is not something we permanently own. It is something we continuously create.\"\n\nThe city eventually became famous, not because it had the oldest buildings or the largest population, but because it had learned an important lesson. A place does not exist only because people live there. It exists because people remember, share, and give meaning to their experiences.",
 vocab:[{word:'identity', en:'The qualities that define a person, group, or place.', tr:'kimlik', fa:'هویت'},{word:'collective', en:'Shared by a group of people.', tr:'kolektif, ortak', fa:'جمعی'},{word:'administrative', en:'Related to managing organizations or systems.', tr:'idari', fa:'اداری'},{word:'evidence', en:'Facts or information proving something.', tr:'kanıt', fa:'مدرک'},{word:'reinvent', en:'To create a new version of something.', tr:'yeniden yaratmak', fa:'از نو خلق کردن'},{word:'archive', en:'A collection of historical records.', tr:'arşiv', fa:'آرشیو'},{word:'continuously', en:'Without stopping; repeatedly over time.', tr:'sürekli olarak', fa:'پیوسته'},{word:'significance', en:'Importance or meaning.', tr:'önem, anlam', fa:'اهمیت'}],
 quiz:[{prompt:'Why did Mara believe the city had lost more than just its name?', options:['She discovered residents remembered personal experiences but had lost the shared story connecting them','She found evidence the city had never actually existed','The government confirmed the entire event was staged'], correct:0},
       {prompt:'What caused the city to lose its historical identity?', options:['Each generation tried to create a new identity by erasing the previous one, until the name disappeared entirely','An earthquake destroyed all historical records','A foreign invasion erased all local culture'], correct:0},
       {prompt:'How did residents rebuild their connection with the city?', options:['By sharing photographs, letters, stories, and memories in a public community project','By building new, modern buildings to replace the old ones','By hiring historians to invent a new official history'], correct:0}],
 grammarFocus:[{point:'Abstract Ideas', example:'Identity is created through shared experiences.'},{point:'Complex Cause and Effect', example:'Because each generation erased parts of the past, the city gradually lost its collective memory.'},{point:'Passive Structures', example:'The forgotten stories were collected by the residents.'}],
 discussionQuestions:['Can a person or place exist without a strong identity?','Is forgetting the past sometimes necessary?','How do communities create a shared identity?'],
 writingPractice:{prompt:'Write 200-250 words: "A society discovers that an important part of its history has disappeared. Should it try to recover it or create a new future?"'},
 message:{en:'Identity is not created by names, symbols, or documents alone. It is created by the memories and meanings people build together.'}},

// ===================== ADVENTURE =====================
{id:'story-C1-Adventure-1', level:'C1', genre:'Adventure', title:{en:'The Expedition That Changed Human History', tr:'İnsanlık Tarihini Değiştiren Keşif Gezisi'},
 text:"In 1987, a team of researchers began an expedition that many experts considered impossible. Their mission was not to discover a new land. It was to discover a forgotten chapter of human history. Deep beneath a remote mountain range in Central Asia, satellite images had revealed unusual underground structures. For decades, scientists had ignored the area because the harsh environment made exploration extremely difficult. However, Dr. Elena Ward, an archaeologist specializing in ancient civilizations, believed the images represented something significant.\n\nThe expedition consisted of scientists from different fields: archaeology, geology, biology, and anthropology. They knew that success would depend not only on their individual skills but also on their ability to cooperate. After several weeks of difficult travel, they reached the location. What they found exceeded every expectation. Beneath layers of rock and soil was an ancient underground settlement. But it was not simply a collection of buildings. It was a complete society.\n\nThe researchers discovered evidence of advanced agricultural systems, complex artwork, and written records. The civilization had developed unique methods of conserving water and adapting to extreme environmental conditions. More surprisingly, their discoveries challenged many existing theories about ancient societies. The civilization was far more advanced than historians had previously believed possible for that period.\n\nAs news of the discovery spread, international attention grew. Governments, universities, and private organizations wanted access to the site. Some researchers argued that the discovery should be shared immediately. They believed humanity had a right to access new knowledge. Others warned that uncontrolled exploration could damage the fragile remains. Elena found herself facing a difficult decision. The greatest discovery of her career also carried the greatest responsibility.\n\nInstead of allowing unlimited access, Elena proposed a different approach. She created an international research agreement. Scientists could study the site, but strict rules would protect the environment and cultural remains. She believed that discovery should not mean ownership. A historical site did not belong to the people who found it. It belonged to humanity.\n\nYears later, the expedition transformed the field of archaeology. New theories about ancient civilizations were developed. Textbooks were rewritten. Students around the world studied the discoveries made beneath the mountains. However, Elena often said the most important lesson was not about the ancient civilization. It was about modern humans.\n\nIn her final interview, a journalist asked: \"What was the greatest moment of your expedition?\" Many expected her to mention the discovery of the underground city. Instead, she answered: \"The greatest moment was realizing that knowledge creates responsibility. Finding something is only the beginning. Understanding how to protect it is the real challenge.\"\n\nThe expedition became a symbol of responsible exploration. It showed that adventure was not only about reaching unknown places. True exploration required curiosity, humility, and respect for what had been discovered. The greatest explorers were not those who took the most from the world. They were those who learned how to leave something valuable behind.",
 vocab:[{word:'expedition', en:'A planned journey for exploration or research.', tr:'keşif gezisi', fa:'سفر اکتشافی'},{word:'significant', en:'Important or meaningful.', tr:'önemli, anlamlı', fa:'مهم'},{word:'civilization', en:'A developed society with its own culture and systems.', tr:'uygarlık', fa:'تمدن'},{word:'anthropology', en:'The study of humans and cultures.', tr:'antropoloji', fa:'مردم‌شناسی'},{word:'preserve', en:'To protect something from damage or destruction.', tr:'korumak', fa:'حفظ کردن'},{word:'exceed', en:'To be greater than expected.', tr:'aşmak', fa:'فراتر رفتن'},{word:'fragile', en:'Easily damaged or destroyed.', tr:'hassas, kırılgan', fa:'شکننده'},{word:'responsibility', en:'A duty to act carefully and correctly.', tr:'sorumluluk', fa:'مسئولیت'},{word:'ownership', en:'The state of possessing or controlling something.', tr:'sahiplik', fa:'مالکیت'},{word:'humility', en:'The quality of not thinking you are more important than others.', tr:'alçakgönüllülük', fa:'فروتنی'}],
 quiz:[{prompt:"Why was Elena's discovery important for historians?", options:['It revealed a civilization far more advanced than historians had previously believed possible for that era','It proved that Central Asia was uninhabited in ancient times','It disproved every existing theory about agriculture'], correct:0},
       {prompt:'What ethical problem did the expedition create?', options:['Deciding whether to share the discovery immediately or protect it from damage caused by uncontrolled access','Deciding which country owned the mountain range','Deciding whether to sell artifacts to private collectors'], correct:0},
       {prompt:'Why did Elena believe discovery should not mean ownership?', options:['She believed a historical site belonged to humanity, not just to the people who found it','She believed the site legally belonged to the local government','She did not want any personal credit for the discovery'], correct:0}],
 grammarFocus:[{point:'Complex Contrast', example:'Although the discovery was extraordinary, it created serious ethical questions.'},{point:'Abstract Noun Structures', example:'The preservation of historical sites requires international cooperation.'},{point:'Advanced Relative Clauses', example:'The civilization that researchers discovered changed existing historical theories.'}],
 discussionQuestions:['Should scientists have unlimited access to discoveries?','Does discovering something give someone the right to control it?','What qualities make someone a true explorer?'],
 writingPractice:{prompt:'Write 200-250 words: "A team discovers something that could change the world, but sharing it may create problems. What should they do?" Include: The discovery. Possible benefits. Possible risks. Your final decision.'},
 message:{en:'The value of exploration is not measured only by what we discover, but by how responsibly we treat what we find.'}},

{id:'story-C1-Adventure-2', level:'C1', genre:'Adventure', title:{en:'Beyond the Edge of the Ocean', tr:'Okyanusun Sınırının Ötesinde'},
 text:"For centuries, sailors had spoken about a mysterious area of the Pacific Ocean where navigation systems often failed. Maps showed nothing unusual. Satellite images revealed only endless water. Yet, experienced sailors reported strange weather patterns, unusual currents, and unexplained changes in their instruments. Most people considered these stories exaggerated. Marine researcher Dr. Adrian Vale thought differently. He believed that unexplored places still existed, not because they were invisible, but because humans had not yet understood them.\n\nIn 2014, Adrian organized an expedition called The Horizon Project. His goal was not to search for treasure or claim new territory. He wanted to study one simple question: How much of Earth's oceans remained unknown? The team included oceanographers, engineers, photographers, and environmental scientists. Before departure, Adrian warned everyone: \"An expedition is not a battle against nature. It is a conversation with it.\"\n\nThe first weeks were calm. The team collected information about marine life, water temperature, and ocean patterns. However, after entering the unexplored region, conditions changed. Their communication systems became unreliable. The weather became unpredictable. Strong currents forced the ship away from its planned route. For several days, the crew struggled to understand their location.\n\nThe uncertainty created tension among the team. Some members questioned whether continuing the mission was worth the risk. Others argued that turning back would mean abandoning years of preparation. Adrian understood their concerns. He knew that physical challenges were only part of exploration. The greatest challenge was often psychological. Fear, doubt, and isolation could influence decisions as strongly as storms.\n\nOne evening, while reviewing their research data, the team discovered something unexpected. The unusual conditions were caused by a previously unknown underwater ecosystem. Deep beneath the surface existed a network of volcanic structures that supported rare forms of marine life. The discovery was extraordinary. It showed that life could survive in environments scientists had barely imagined.\n\nHowever, Adrian faced another difficult decision. The discovery could attract enormous scientific interest. But increased attention could also threaten the fragile ecosystem. He decided to delay public announcement until protective measures were created. Some critics argued that he was slowing scientific progress. Adrian responded: \"Knowledge without responsibility can become another form of destruction.\"\n\nAfter returning home, the team published their findings. The discovery changed scientists' understanding of ocean ecosystems. Researchers around the world began studying similar environments. New conservation programs were created to protect deep-sea habitats.\n\nYears later, when Adrian was asked about the most important moment of the expedition, he did not mention the discovery. He mentioned the moment when the team accepted uncertainty. \"Exploration is not about proving that humans can control everything,\" he said. \"It is about learning how to exist respectfully in a world much larger than ourselves.\"\n\nThe Horizon Project became a reminder that the greatest adventures are not always about reaching a destination. Sometimes, they are about changing the way we see the unknown.",
 vocab:[{word:'navigation', en:'The process of finding a direction or route.', tr:'navigasyon, yön bulma', fa:'مسیریابی'},{word:'unexplored', en:'Not examined or studied before.', tr:'keşfedilmemiş', fa:'کشف‌نشده'},{word:'resilience', en:'The ability to recover from difficulties.', tr:'dayanıklılık', fa:'تاب‌آوری'},{word:'unpredictable', en:'Impossible to know or guess in advance.', tr:'öngörülemez', fa:'غیرقابل‌پیش‌بینی'},{word:'ecosystem', en:'A community of living things and their environment.', tr:'ekosistem', fa:'اکوسیستم'},{word:'fragile', en:'Easily damaged or harmed.', tr:'hassas, kırılgan', fa:'شکننده'},{word:'conservation', en:'Protection of nature and resources.', tr:'koruma', fa:'حفاظت'},{word:'uncertainty', en:'A situation where something is unknown.', tr:'belirsizlik', fa:'عدم قطعیت'},{word:'announce', en:'To make information public.', tr:'duyurmak', fa:'اعلام کردن'},{word:'destination', en:'The place someone is trying to reach.', tr:'varış noktası', fa:'مقصد'}],
 quiz:[{prompt:'What was the main purpose of the Horizon Project?', options:['To study how much of Earth’s oceans remained unknown, not to search for treasure','To claim new territory in the Pacific Ocean for the government','To test new submarine technology'], correct:0},
       {prompt:'What challenges did the team face during the expedition?', options:['Unreliable communication, unpredictable weather, and the psychological pressure of uncertainty','A mutiny among the crew','Running out of food supplies'], correct:0},
       {prompt:'Why did Adrian delay announcing the discovery?', options:['He wanted protective measures created first, since attention could threaten the fragile ecosystem','He wanted to sell the discovery to the highest bidder','He was not confident the discovery was real'], correct:0}],
 grammarFocus:[{point:'Inversion for Emphasis', example:'Not until the discovery was analyzed did scientists understand its importance.'},{point:'Complex Passive Structures', example:'New conservation programs were created to protect the ecosystem.'},{point:'Abstract Cause and Effect', example:"Fear and uncertainty influenced the team's decision-making process."}],
 discussionQuestions:['Is exploring the unknown always worth the risk?','Should scientific discoveries ever be kept secret temporarily?','What is more important: discovering new things or protecting them?'],
 writingPractice:{prompt:'Write 200-250 words: "A group of explorers discovers something valuable but dangerous. Should they reveal it to the world?" Include: The discovery. The possible benefits. The possible consequences. Your opinion.'},
 message:{en:'The unknown does not exist only to be conquered. Sometimes it exists to remind humanity of its limits and responsibilities.'}},

{id:'story-C1-Adventure-3', level:'C1', genre:'Adventure', title:{en:'The Mountain That Revealed Its Secret', tr:'Sırrını Açığa Çıkaran Dağ'},
 text:"For generations, the people living near Mount Arava believed that the mountain was hiding something. Not gold. Not treasure. Something older. Local legends described a forgotten settlement somewhere above the clouds, a place where ancient people had lived in harmony with nature before disappearing without explanation. Most historians dismissed these stories as myths. However, Dr. Sofia Ren, an expert in ancient cultures, believed that legends often contained fragments of forgotten history.\n\nAfter years of research, Sofia discovered unusual markings on rocks near the mountain. The symbols appeared similar to those found in ancient settlements hundreds of kilometers away. She organized an expedition to investigate. The journey was not easy. The mountain was steep, the weather was unpredictable, and the area had rarely been visited by outsiders. Yet, Sofia believed that understanding the past required patience and determination.\n\nThe expedition included historians, environmental scientists, and local guides. The guides warned the team that the mountain was considered sacred. They explained that previous generations had protected the area because they believed it carried the memory of their ancestors. Sofia respected their concerns. She knew that exploration without respect could become another form of destruction.\n\nAfter several days of climbing, the team reached a hidden valley surrounded by enormous cliffs. There, beneath layers of vegetation, they discovered the remains of an ancient settlement. The discovery was extraordinary. The buildings showed advanced knowledge of architecture and environmental adaptation. The people who had lived there had created systems to collect rainwater, grow food, and protect the surrounding ecosystem.\n\nHowever, the greatest discovery was found inside a small stone chamber. The walls were covered with writings describing the philosophy of the ancient community. The people had believed that humans were not rulers of nature but participants in it. Their society had survived for centuries because they balanced human needs with environmental responsibility.\n\nNews of the discovery quickly spread. Universities wanted to study the site. Tourism companies wanted to bring visitors. Investors saw economic opportunities. Suddenly, Sofia faced a challenge greater than reaching the mountain. She had to decide what should happen next.\n\nMany argued that the discovery should be opened to the public. They believed it could bring education, tourism, and economic development to the region. Others feared that too many visitors would damage the fragile remains. Sofia understood both perspectives. Preserving history did not mean hiding it forever. But sharing history without protection could destroy it.\n\nAfter months of discussion, Sofia proposed a different solution. The site would not become a traditional tourist attraction. Instead, researchers would create a limited access program. Local communities would participate in protecting the area and sharing its history. The goal was not to transform the mountain into a product. The goal was to learn from it.\n\nYears later, Mount Arava became known as one of the most important archaeological discoveries of the century. But Sofia always emphasized that the greatest lesson was not about the ancient civilization. It was about modern society. \"We often search for advanced knowledge in the future,\" she said. \"Sometimes, the wisdom we need has already existed in the past.\"\n\nThe mountain had revealed its secret. But perhaps the deeper secret was that humanity had forgotten something it once understood: Progress means little if it separates us from the world that allows us to exist.",
 vocab:[{word:'legend', en:'A traditional story from the past, sometimes containing truth.', tr:'efsane', fa:'افسانه'},{word:'fragment', en:'A small part of something larger.', tr:'parça', fa:'پاره'},{word:'heritage', en:'Cultural traditions and history passed down through generations.', tr:'miras', fa:'میراث فرهنگی'},{word:'sacred', en:'Considered holy or deeply respected.', tr:'kutsal', fa:'مقدس'},{word:'adaptation', en:'The process of changing to survive in new conditions.', tr:'uyum sağlama', fa:'سازگاری'},{word:'philosophy', en:'A system of ideas about life and meaning.', tr:'felsefe', fa:'فلسفه'},{word:'preservation', en:'The act of protecting something from damage.', tr:'koruma', fa:'حفاظت'},{word:'perspective', en:'A particular way of understanding something.', tr:'bakış açısı', fa:'دیدگاه'},{word:'sustainable', en:'Able to continue without harming resources or nature.', tr:'sürdürülebilir', fa:'پایدار'}],
 quiz:[{prompt:'Why did Sofia believe the local legends might contain truth?', options:['She believed legends often contained fragments of forgotten history, and found matching symbols to prove it','A local guide showed her the exact settlement location','Government records confirmed the legend directly'], correct:0},
       {prompt:'What did the ancient settlement teach researchers about its society?', options:['That the people saw themselves as participants in nature, not rulers over it','That the people were technologically primitive','That the settlement was abandoned due to war'], correct:0},
       {prompt:'How did Sofia balance public interest with preservation?', options:['She created a limited access program involving local communities, instead of open tourism','She sold exclusive access rights to the highest-bidding tourism company','She kept the discovery completely secret from everyone'], correct:0}],
 grammarFocus:[{point:'Advanced Contrast', example:'Although the discovery was valuable, revealing it without protection could cause harm.'},{point:'Complex Passive Forms', example:'The ancient writings were preserved for centuries beneath the mountain.'},{point:'Abstract Concepts', example:'Progress should be measured not only by achievement but also by responsibility.'}],
 discussionQuestions:['Should historical discoveries belong to everyone or to the communities where they are found?','Can ancient knowledge help solve modern problems?','Is protecting the past more important than developing the future?'],
 writingPractice:{prompt:'Write 200-250 words: "A modern society discovers an ancient civilization with ideas that challenge current beliefs. How should people respond?" Include: The discovery. The conflict it creates. Different viewpoints. Your conclusion.'},
 message:{en:'True exploration is not only about discovering hidden places. It is about discovering forgotten wisdom and understanding our responsibility toward it.'}},

// ===================== ROMANCE =====================
{id:'story-C1-Romance-1', level:'C1', genre:'Romance', title:{en:'The Letters Between Two Strangers', tr:'İki Yabancı Arasındaki Mektuplar'},
 text:"Every morning at exactly 8:15, Clara Bennett visited the same café near the old train station. She ordered black coffee, sat by the window, and wrote. Nobody knew what she was writing. To the other customers, she was simply a quiet woman with a notebook and a habit of observing people. But Clara was not writing a novel. She was writing letters. Letters to a person she had never met.\n\nTwo years earlier, Clara had found an old notebook inside a second-hand bookstore. Between the pages, she discovered several unfinished letters written by someone named Daniel. The letters described a person's hopes, fears, regrets, and dreams. They were not addressed to anyone specific. They were simply thoughts that someone had been unable to express. Something about them affected Clara deeply. She felt as if she had discovered a hidden conversation.\n\nInstead of returning the notebook, Clara wrote a response. She knew it was unusual. She knew the original writer might never see it. But writing the letter helped her understand her own feelings. She placed her response inside the notebook and returned it to the bookstore. Months passed. Then, one rainy afternoon, she received a letter.\n\nThe handwriting was unfamiliar. The sender was Daniel. Daniel explained that he had found the notebook again while visiting the bookstore. He had been surprised to discover Clara's letter. At first, he thought it was strange. A stranger had written about his private thoughts. But after reading it several times, he realized something unexpected: She understood. Not because she knew his life. But because she recognized his emotions.\n\nTheir correspondence continued. They wrote about books, memories, fears, and dreams. They discussed questions they rarely asked other people. What makes a person happy? Why do people hide their true selves? How much of our identity is created by others' expectations? Although they had never met, they slowly became important parts of each other's lives.\n\nEventually, Daniel suggested meeting. Clara hesitated. For months, she had known him only through his words. She wondered whether reality would disappoint her. Could a person ever match the version we create in our imagination? Still, she agreed.\n\nThey met in the same café where Clara had written her first letter. At first, neither of them spoke. The person in front of them was both familiar and unfamiliar. They knew each other's thoughts, but they did not know each other's habits. They knew each other's fears, but not each other's expressions. They had built a connection through language before discovering the person behind it.\n\nAs they talked, Clara realized something important. The letters had not created a false image of Daniel. They had revealed a part of him that people often hide in everyday life. Daniel felt the same. He said: \"Maybe we didn't fall in love with an idea of each other. Maybe we discovered the parts of ourselves that we usually keep hidden.\"\n\nYears later, Clara kept the original notebook on her desk. The pages had become old. The handwriting had faded. But the words remained meaningful. She often thought about how two strangers had found each other through simple honesty. Not through appearances. Not through expectations. But through the courage to be understood.",
 vocab:[{word:'vulnerability', en:'The state of allowing others to see your weaknesses or true feelings.', tr:'savunmasızlık', fa:'آسیب‌پذیری'},{word:'correspondence', en:'Communication through letters or messages.', tr:'yazışma', fa:'مکاتبه'},{word:'unfamiliar', en:'Not known or recognized.', tr:'tanıdık olmayan', fa:'ناآشنا'},{word:'hesitation', en:'A pause caused by uncertainty or doubt.', tr:'tereddüt', fa:'تردید'},{word:'expectation', en:'A belief about what should happen.', tr:'beklenti', fa:'انتظار'},{word:'reveal', en:'To show something previously hidden.', tr:'ortaya çıkarmak', fa:'آشکار کردن'},{word:'authentic', en:'Real, genuine, and not artificial.', tr:'gerçek, samimi', fa:'اصیل'},{word:'emotional connection', en:'A strong bond based on feelings and understanding.', tr:'duygusal bağ', fa:'پیوند عاطفی'}],
 quiz:[{prompt:'Why did Clara continue writing letters to someone she had never met?', options:['Writing helped her understand her own feelings, and she felt a connection to his hidden thoughts','She needed practice for a writing course','She hoped it would help her get published'], correct:0},
       {prompt:"What made Daniel and Clara's connection unusual?", options:['They built emotional understanding through honest words before ever meeting in person','They had actually known each other since childhood','They communicated entirely through a mutual friend'], correct:0},
       {prompt:'What did Clara learn about imagination and reality?', options:['That the letters revealed Daniel’s real, hidden self rather than creating a false image of him','That reality always disappoints compared to imagination','That people should never meet after writing letters'], correct:0}],
 grammarFocus:[{point:'Complex Relative Clauses', example:"The notebook, which contained unfinished letters, changed Clara's life."},{point:'Abstract Noun Structures', example:'The discovery of the notebook created an unexpected connection.'},{point:'Contrast Structures', example:"Although they knew each other's thoughts, they did not know each other's daily lives."}],
 discussionQuestions:['Can people truly know someone through words alone?','Are people more honest when communicating anonymously?','Is emotional connection more important than physical presence?'],
 writingPractice:{prompt:'Write 200-250 words: "Two people develop a deep connection without meeting. What are the advantages and disadvantages of this relationship?" Include: How they communicate. Why they connect. What challenges they face. Your opinion.'},
 message:{en:'Sometimes people reveal their true selves not when they are seen, but when they finally feel understood.'}},

{id:'story-C1-Romance-2', level:'C1', genre:'Romance', title:{en:'The Portrait That Remembered Her', tr:'Onu Hatırlayan Portre'},
 text:"When Elena Marceau entered the abandoned gallery for the first time, she was not searching for anything extraordinary. She was researching forgotten artists for a university project. The building had been closed for almost thirty years, and most people believed it contained nothing valuable. However, hidden behind a damaged wall, Elena discovered a painting covered with dust. The portrait showed a young woman standing beside a garden. The woman's face looked familiar. Not because Elena had seen her before. Because the expression in her eyes felt strangely personal.\n\nAttached to the painting was a small note: \"For the person who taught me how to see the world.\" The artist's name was Julian Moreau. He had been a respected painter decades earlier but disappeared from public life after his final exhibition. Nobody knew why he stopped painting. Nobody knew where he went.\n\nElena became fascinated by the portrait. She began researching Julian's life. She discovered that he had once been known for painting landscapes. However, after meeting a woman named Isabelle, his artistic style changed completely. His paintings became more emotional. They focused less on places and more on human experiences. Julian believed that a person's presence could transform the meaning of a landscape.\n\nEventually, Elena found Isabelle's granddaughter, Sophie. Sophie explained that Isabelle and Julian had been deeply connected. They had shared a love for art, literature, and nature. But their relationship ended unexpectedly when Isabelle moved abroad. They promised to stay connected. Over time, however, distance changed their lives.\n\n\"Did Julian forget her?\" Elena asked. Sophie smiled sadly. \"No. He remembered her too well.\" Sophie explained that after Isabelle left, Julian continued painting. But he never painted her directly. Instead, he painted places where they had shared memories. A garden. A quiet street. A lake at sunset. He believed memories were not stored only in the mind. They existed in places, objects, and moments.\n\nElena returned to the portrait with a different understanding. The painting was not simply a picture of a woman. It was a record of a relationship. The colors, the atmosphere, and the expression represented everything Julian could not say. The portrait was not about losing someone. It was about preserving what someone had given you.\n\nMonths later, Elena organized an exhibition about Julian Moreau. Many visitors expected to see beautiful paintings. Instead, they discovered a story about love, time, and memory. People recognized parts of their own lives in his work. They remembered people they had loved. Places they had lost. Moments they wished they could experience again.\n\nDuring the exhibition, Elena received a letter from Julian. He was still alive and living quietly in another country. He had heard about the discovery. In the letter, he wrote: \"I never painted Isabelle because I wanted to keep her image. I painted because she changed the way I saw everything else.\"\n\nYears later, Elena often visited the portrait. She no longer saw it as a painting of someone from the past. She saw it as evidence of something timeless. Love does not always remain through presence. Sometimes, it survives through the way someone changes the world around us.",
 vocab:[{word:'abandoned', en:'Left empty and no longer used.', tr:'terk edilmiş', fa:'متروک'},{word:'extraordinary', en:'Very unusual or remarkable.', tr:'olağanüstü', fa:'خارق‌العاده'},{word:'portrait', en:'A painting or picture of a person.', tr:'portre', fa:'پرتره'},{word:'fascinated', en:'Extremely interested and attracted by something.', tr:'büyülenmiş, çok ilgilenmiş', fa:'مجذوب'},{word:'transform', en:'To completely change something.', tr:'dönüştürmek', fa:'دگرگون کردن'},{word:'preserve', en:'To protect and keep something from being lost.', tr:'korumak', fa:'حفظ کردن'},{word:'represent', en:'To show or symbolize something.', tr:'temsil etmek', fa:'نشان دادن'},{word:'timeless', en:'Not affected by time; always meaningful.', tr:'zamansız', fa:'بی‌زمان'}],
 quiz:[{prompt:"Why did Elena become interested in Julian's portrait?", options:['The expression in the woman’s eyes felt strangely personal, and a note hinted at a deeper story','The painting was worth an enormous amount of money','A university professor assigned her to find it'], correct:0},
       {prompt:"How did Isabelle influence Julian's art?", options:['His style shifted from landscapes to more emotional works focused on shared memories and places','She taught him formal painting techniques','She became his art dealer and sold his paintings'], correct:0},
       {prompt:'What did Elena understand about the relationship between love and memory?', options:['That love can survive not through presence, but through the way someone changes the world around us','That love always fades once someone moves away','That art cannot truly capture emotional experiences'], correct:0}],
 grammarFocus:[{point:'Metaphorical Language', example:'The painting was a record of a relationship.'},{point:'Complex Passive Structures', example:'The portrait had been hidden for decades before it was discovered.'},{point:'Emphasis Structures', example:'What mattered most was not the painting itself, but the emotions behind it.'}],
 discussionQuestions:['Can art preserve emotions better than words?','Why do people keep objects connected to the past?','Is remembering someone a way of keeping them present?'],
 writingPractice:{prompt:'Write 200-250 words: "A person discovers an object that reveals a hidden part of someone\'s life. How does this discovery change their understanding?" Include: The object. The hidden story. The emotional impact. The lesson learned.'},
 message:{en:'Some people leave our lives, but their influence remains. Love can survive not only through memories of a person, but through the way they transform us.'}},

{id:'story-C1-Romance-3', level:'C1', genre:'Romance', title:{en:'The Last Song of the Forgotten Composer', tr:'Unutulmuş Bestecinin Son Şarkısı'},
 text:"For almost forty years, the music of Adrian Bell had been forgotten. During his youth, he was considered one of the most promising composers of his generation. Critics praised his ability to transform ordinary emotions into extraordinary melodies. However, after a personal tragedy, Adrian disappeared from the public eye. His compositions were rarely performed. His name slowly vanished from the world of music.\n\nWhen Clara Weiss, a young music researcher, discovered Adrian's forgotten work, she became determined to understand his disappearance. She was studying lost composers for her doctoral thesis and believed that forgotten artists often had stories worth rediscovering. Among Adrian's unfinished pieces, one composition caught her attention. It was titled: \"The Last Morning.\" But the final pages were missing.\n\nClara searched through archives, libraries, and private collections. Eventually, she discovered that Adrian was still alive and living alone in a small coastal town. She decided to visit him. At first, Adrian refused to discuss his music. \"I stopped being a composer a long time ago,\" he said. Clara looked at the old piano in his house. \"Maybe you stopped performing,\" she replied. \"But that doesn't mean you stopped creating.\"\n\nOver several conversations, Adrian slowly revealed his past. When he was young, he had been deeply in love with a woman named Eva. She was a poet who inspired many of his early compositions. They shared a belief that art could capture emotions that ordinary language could not express. However, Eva became seriously ill and passed away before Adrian could finish his greatest composition. After her death, music no longer felt meaningful. Every melody reminded him of what he had lost.\n\nClara asked him about the unfinished piece. Adrian remained silent for a long time. Finally, he admitted: \"I was afraid to complete it.\" \"Why?\" \"Because finishing it meant accepting that the story was over.\"\n\nClara began helping Adrian organize his old manuscripts. During this process, she discovered something surprising. The missing pages of \"The Last Morning\" were not actually lost. They had been placed inside another notebook. The final section was incomplete, but the musical ideas were clear. Adrian had unknowingly left himself a path back to his own creation.\n\nMonths later, Adrian returned to the piano. At first, his hands moved slowly. Decades of silence had changed him. But gradually, the forgotten melodies returned. Clara listened as the final notes filled the room. For the first time in many years, Adrian did not hear only loss. He heard gratitude.\n\nThe completed composition was performed publicly for the first time after forty years. The audience was moved by its emotional depth. Many critics described it as a masterpiece. However, Adrian was not interested in fame anymore. After the concert, a journalist asked: \"Do you regret losing so many years?\" Adrian thought carefully. \"I regret the pain,\" he said. \"But I do not regret loving someone who changed my life.\"\n\nClara later wrote that Adrian's final composition was not really about sadness. It was about transformation. It showed that love does not disappear when someone leaves. Sometimes, it becomes part of who we are. Sometimes, it waits quietly until we are ready to understand it.",
 vocab:[{word:'promising', en:'Showing signs of future success.', tr:'umut vadeden', fa:'امیدوارکننده'},{word:'composition', en:'A piece of music created by a composer.', tr:'beste', fa:'قطعه موسیقی'},{word:'disappear', en:'To stop being seen or known.', tr:'kaybolmak', fa:'ناپدید شدن'},{word:'rediscover', en:'To find or understand something again.', tr:'yeniden keşfetmek', fa:'دوباره کشف کردن'},{word:'tragedy', en:'A very sad or painful event.', tr:'trajedi', fa:'تراژدی'},{word:'inspire', en:'To encourage creativity or action.', tr:'ilham vermek', fa:'الهام بخشیدن'},{word:'manuscript', en:'An original written document.', tr:'el yazması', fa:'نسخه خطی'},{word:'gratitude', en:'The feeling of being thankful.', tr:'minnettarlık', fa:'سپاسگزاری'},{word:'transformation', en:'A complete change in someone or something.', tr:'dönüşüm', fa:'دگرگونی'}],
 quiz:[{prompt:"Why did Adrian stop creating music after Eva's death?", options:['Every melody reminded him of his loss, making music feel meaningless','He lost the physical ability to play piano','Critics stopped supporting his career'], correct:0},
       {prompt:'What did Clara discover about "The Last Morning"?', options:['Its missing pages were not lost but placed inside another notebook','It had already been performed publicly years earlier','Eva had actually composed it, not Adrian'], correct:0},
       {prompt:"How did Adrian's understanding of his past change?", options:['He realized he did not regret loving Eva, even though he regretted the pain of losing her','He decided love was not worth the emotional risk','He concluded music could never heal his grief'], correct:0}],
 grammarFocus:[{point:'Complex Emotional Clauses', example:'Although Adrian had lost someone important, her influence continued to shape his work.'},{point:'Inversion for Emphasis', example:'Only after returning to the piano did Adrian understand the meaning of his music.'},{point:'Abstract Noun Usage', example:'Acceptance of the past allowed Adrian to move forward.'}],
 discussionQuestions:['Can creativity come from painful experiences?','Should people hold onto memories of the past or let them go?','Can love continue to influence someone after separation?'],
 writingPractice:{prompt:'Write 200-250 words: "An artist creates their most meaningful work after experiencing a major life change. Explain how the experience influences their creation." Include: The life event. The emotional impact. The creative process. The final result.'},
 message:{en:'Some experiences do not end when they are lost. They continue through the things we create, the people we influence, and the person we become.'}},

{id:'story-C1-Thriller-1', level:'C1', genre:'Thriller', title:{en:'The Algorithm That Predicted a Crime', tr:'Bir Suçu Tahmin Eden Algoritma'},
 text:"Dr. Nora Ellis had spent ten years studying human decision-making. Unlike traditional psychologists who focused mainly on past behavior, Nora was interested in a more difficult question: Could human choices be predicted before they happened? Her research eventually led her to develop an advanced artificial intelligence system called AURA. The algorithm analyzed patterns in human behavior, communication, and decision-making. At first, AURA was designed to help people make better choices. It was meant to identify harmful situations before they occurred. Nobody expected it to predict a crime.\n\nThe first warning appeared on an ordinary Tuesday morning. Nora was reviewing AURA's latest analysis when she noticed an unusual alert. The system had identified a possible violent incident that would happen within forty-eight hours. The information was limited. It showed only a location, a time, and a probability score. There was no name. No explanation. Only a prediction.\n\nNora immediately questioned the result. An algorithm could identify patterns, but could it truly understand human intention? She knew the danger of trusting technology too much. A prediction was not proof. A possibility was not a fact. However, ignoring the warning also carried risks. She reported the information to the authorities. The reaction was divided. Some officers believed the technology represented the future of crime prevention. Others were concerned. Detective Marcus Hale warned: \"People are not equations. If we start treating predictions as reality, we may punish people for things they have not done.\"\n\nDespite the disagreement, investigators monitored the location identified by AURA. The place was an old financial building in the city center. Nothing seemed unusual. Employees arrived. People attended meetings. The day appeared completely normal.\n\nThen Nora noticed something. The prediction had not been wrong. It had been misunderstood. The possible crime was not being committed by someone inside the building. It involved a person who was planning to expose illegal activity connected to the company. The \"threat\" identified by AURA was actually a whistleblower preparing to reveal corruption. The system had detected conflict. But it could not understand morality.\n\nThis discovery changed everything. The algorithm had successfully predicted a significant event. But it had failed to understand whether the event was harmful or necessary. The same pattern that could identify danger could also identify acts of courage.\n\nNora faced intense criticism. Some people argued that AURA had proven its value. Others argued that it had demonstrated why such systems were dangerous. The debate became larger than her research. It became a question about the relationship between humans and technology.\n\nMonths later, Nora redesigned AURA. She added new principles. The system could identify possibilities, but it could not make final judgments. Human experts had to evaluate context, emotions, and consequences. Technology could provide information. But responsibility remained with people.\n\nYears later, Nora gave a lecture about her work. A student asked: \"Do you believe artificial intelligence will eventually understand humans completely?\" She thought for a moment. \"No,\" she answered. \"And that may be a good thing. Understanding patterns is not the same as understanding people.\"\n\nAURA became one of the most influential research projects in modern psychology and technology. But its greatest contribution was not predicting the future. It was reminding humanity that the future should not only be calculated. It should be considered.",
 vocab:[{word:'algorithm', en:'A system of rules used to solve problems or analyze information.', tr:'algoritma', fa:'الگوریتم'},{word:'predict', en:'To say what may happen in the future.', tr:'tahmin etmek', fa:'پیش‌بینی کردن'},{word:'intention', en:"A person's purpose or plan.", tr:'niyet', fa:'نیت'},{word:'probability', en:'The likelihood that something will happen.', tr:'olasılık', fa:'احتمال'},{word:'assumption', en:'A belief accepted without complete proof.', tr:'varsayım', fa:'فرض'},{word:'whistleblower', en:'A person who reveals illegal or unethical actions.', tr:'ihbarcı', fa:'افشاگر'},{word:'corruption', en:'Dishonest or illegal behavior by people in power.', tr:'yolsuzluk', fa:'فساد'},{word:'evaluate', en:'To examine and judge carefully.', tr:'değerlendirmek', fa:'ارزیابی کردن'},{word:'consequence', en:'A result or effect of an action.', tr:'sonuç', fa:'پیامد'}],

       {prompt:"Why was AURA's prediction problematic?", options:['It correctly identified conflict but could not distinguish between a crime and an act of moral courage','It gave the wrong location entirely','It failed to activate at all'], correct:0},
       {prompt:'What lesson did Nora learn about artificial intelligence?', options:['That understanding patterns is not the same as understanding people, so responsibility must remain human','That AI should make all final judgments to remove human bias','That AURA needed to be shut down permanently'], correct:0}],

{id:'story-C1-Thriller-2', level:'C1', genre:'Thriller', title:{en:'The Room That Changed Every Night', tr:'Her Gece Değişen Oda'},
 text:"When Daniel Avery rented the old apartment on Willow Lane, he was not looking for mystery. He had recently moved to the city after accepting a research position at a university. The apartment was affordable, quiet, and close to his workplace. The building was old, but Daniel appreciated its character. The wooden floors, narrow corridors, and faded photographs on the walls reminded him of another era. However, there was one unusual detail. A small locked door existed at the end of his hallway. The landlord told him the room had not been used for years. \"Some places are better left alone,\" she said. Daniel assumed she was referring to repairs or old furniture. He did not think much about it. Until the first night.\n\nAt exactly 2:17 in the morning, Daniel woke up because he heard movement outside his bedroom. He opened the door and saw something impossible. The locked room was open. Inside was a completely different space. It was no longer an empty storage room. It was an office. A wooden desk stood near the window. Books covered the shelves. On the desk was a photograph. Daniel picked it up. It showed him. Standing inside the room.\n\nThe next morning, everything had returned to normal. The door was locked again. The room appeared empty. Daniel questioned his own memory. Perhaps he had been dreaming. Perhaps stress had affected his perception. As a researcher, he trusted evidence more than feelings. So he decided to investigate.\n\nFor the next week, Daniel recorded everything. The time. The sounds. The changes. Every night at 2:17, the room transformed. But never in the same way. One night, it became a child's bedroom. Another night, it became a hospital room. Another night, it became a library filled with books written in his own handwriting. Each version contained something connected to his life.\n\nDaniel became obsessed. He searched the history of the building and discovered that many people had lived in his apartment before. Among them was a psychologist named Dr. Elias Warren. Fifty years earlier, Elias had studied memory and human perception. His research focused on a strange idea: Could forgotten memories exist outside the mind?\n\nDaniel found Elias's old journals in a university archive. The final entry was disturbing. Elias wrote: \"The room does not show the future. It does not show the past. It shows what the mind refuses to confront.\"\n\nDaniel returned to the apartment with a new understanding. That night, when the room changed, he entered again. This time, it was a room from his childhood. He saw objects he had forgotten. Old drawings. A broken toy. A letter he had never sent. At the center of the room was a mirror. Written on it were the words: \"You cannot understand what you refuse to remember.\"\n\nDaniel realized the room was not showing random images. It was revealing parts of himself that he had avoided. Regrets. Fears. Unfinished emotions. The room was not a mystery to solve. It was a reflection.\n\nThe next morning, the locked door disappeared completely. The wall was solid. There had never been a room. Daniel never discovered whether the experience was supernatural or psychological. But he no longer searched for an explanation. Some mysteries are not meant to be solved. Some are meant to change the person who experiences them.",
 vocab:[{word:'perception', en:'The way someone understands or interprets something.', tr:'algı', fa:'ادراک'},{word:'investigate', en:'To examine something carefully to discover facts.', tr:'araştırmak', fa:'بررسی کردن'},{word:'evidence', en:'Information used to prove something.', tr:'kanıt', fa:'مدرک'},{word:'transform', en:'To change completely in form or appearance.', tr:'dönüşmek', fa:'تبدیل شدن'},{word:'obsession', en:'A powerful and difficult-to-control interest.', tr:'takıntı', fa:'وسواس فکری'},{word:'confront', en:'To face something difficult directly.', tr:'yüzleşmek', fa:'مواجه شدن'},{word:'subconscious', en:'The part of the mind that influences thoughts without awareness.', tr:'bilinçaltı', fa:'ناخودآگاه'},{word:'reflection', en:'An image or representation of something deeper.', tr:'yansıma', fa:'بازتاب'},{word:'unresolved', en:'Not completed or solved.', tr:'çözülmemiş', fa:'حل‌نشده'},{word:'supernatural', en:'Beyond scientific explanation.', tr:'doğaüstü', fa:'ماوراءالطبیعه'}],
 quiz:[{prompt:'Why did Daniel begin investigating the mysterious room?', options:['He wanted evidence rather than relying on his own uncertain memory of what he experienced','His landlord asked him to document any changes','He wanted to sell the apartment’s story to a magazine'], correct:0},
       {prompt:"What did the room actually represent according to Elias's research?", options:['What the mind refuses to confront—hidden regrets, fears, and unfinished emotions','A literal glimpse into the future','A recording device left by a previous tenant'], correct:0},
       {prompt:'How did Daniel change after experiencing the room?', options:['He stopped searching for a logical explanation and accepted the experience as transformative','He became afraid to sleep in his apartment ever again','He turned the room into a public exhibit'], correct:0}],
 grammarFocus:[{point:'Speculation About the Past', example:'Daniel might have experienced something beyond ordinary explanation.'},{point:'Abstract Metaphors', example:'The room was a reflection of his hidden emotions.'},{point:'Complex Negation', example:'Not everything that appears impossible is necessarily unreal.'}],
 discussionQuestions:['Can memories influence our present decisions?','Do people sometimes avoid facing parts of themselves?','Are all mysteries meant to have logical explanations?'],
 writingPractice:{prompt:'Write 200-250 words: "A person discovers a place that reveals something hidden about themselves. How does this experience change them?" Include: The mysterious place. What it reveals. The emotional conflict. The transformation.'},
 message:{en:'Sometimes the most difficult discoveries are not about the world around us, but about the hidden parts of ourselves.'}},

{id:'story-C1-Thriller-3', level:'C1', genre:'Thriller', title:{en:'The Day That Never Ended', tr:'Hiç Bitmeyen Gün'},
 text:"Olivia Hart had always believed that time moved in only one direction. Forward. Every second disappeared forever. That certainty ended on a rainy Tuesday. She was driving home after finishing a late meeting when the traffic lights suddenly turned red. She stopped her car and glanced at the digital clock on the dashboard. 6:42 p.m. A loud crash echoed behind her. A truck had lost control and collided with several cars. Olivia escaped without injury, but the accident left her shaken. Police officers arrived. Ambulances filled the street.\n\nAfter giving her statement, she finally drove home. When she entered her apartment, exhaustion overwhelmed her. She fell asleep almost immediately. The next morning, her alarm rang. She looked at the clock. 6:30 a.m. Everything seemed normal. Until she checked her phone. The date was yesterday. The same Tuesday. She assumed her phone had malfunctioned. Then the television reported the exact same weather forecast. The same headlines. The same political interview. By afternoon, she reached the same intersection. At 6:42 p.m., the truck crashed again. Every detail unfolded exactly as before. The screaming. The broken glass. The flashing blue lights. The next morning... Tuesday returned. Again.\n\nAfter dozens of repeated Tuesdays, Olivia stopped trying to escape the accident. Nothing changed the outcome. If she stayed home, the crash still happened. If she warned the police, nobody believed her. If she blocked the road, another chain of events caused the collision anyway. It was as though time refused to allow history to change.\n\nInstead, Olivia began observing people. She realized something unusual. Everyone repeated the same conversations. The same decisions. The same mistakes. Everyone... Except one elderly man who fed pigeons in the city square. Each morning, he smiled at her before she spoke. \"You remember too,\" he said quietly. Olivia froze. \"You know what's happening?\" The man nodded. \"I've lived this Tuesday for nineteen years.\" She stared at him in disbelief. \"Nineteen years?\" \"Not years,\" he corrected. \"The same day... repeated thousands of times.\"\n\nHe explained that every person trapped in the loop eventually searched for the wrong solution. They tried to stop the accident. Escape the city. Even end their own lives. Nothing worked. \"The loop isn't protecting the day,\" he said. \"It's waiting.\" \"For what?\" \"For someone willing to see what everyone else ignores.\"\n\nThe next cycle, Olivia watched the accident more carefully. Not the truck. Not the traffic lights. The people. Seconds before the collision, she noticed a young boy standing alone on the sidewalk. Terrified. Completely unnoticed by the crowd. Everyone rushed toward the crash. Nobody saw the child stepping into the road. Without thinking, Olivia ran. She grabbed the boy just before another speeding car reached him. For the first time, something changed. The accident still happened. But one life did not become another hidden tragedy.\n\nThe following morning, sunlight entered her bedroom. Birds were singing. Her alarm displayed a different date. Wednesday. She hurried to the city square. The old man was gone. Only a small paper bag of birdseed rested on the bench. Inside was a folded note. \"Time rarely asks us to change the world. Sometimes it only asks us to notice the person everyone else overlooks.\"\n\nOlivia never discovered whether the endless Tuesday had been a supernatural punishment, a psychological illusion, or something beyond human understanding. But from that day forward, she paid attention to the ordinary moments most people ignored. Because sometimes, the smallest act of kindness is enough to move time itself.",
 vocab:[{word:'certainty', en:'Complete confidence that something is true.', tr:'kesinlik', fa:'قطعیت'},{word:'collide', en:'To crash violently into something.', tr:'çarpışmak', fa:'برخورد کردن'},{word:'unfold', en:'To happen gradually.', tr:'gelişmek, meydana gelmek', fa:'رخ دادن'},{word:'malfunction', en:'To fail to work correctly.', tr:'arızalanmak', fa:'از کار افتادن'},{word:'trapped', en:'Unable to escape.', tr:'kapana kısılmış', fa:'گیرافتاده'},{word:'outcome', en:'The final result of a situation.', tr:'sonuç', fa:'نتیجه'},{word:'illusion', en:'Something that appears real but is not.', tr:'yanılsama', fa:'توهم'},{word:'overlook', en:'To fail to notice something important.', tr:'gözden kaçırmak', fa:'نادیده گرفتن'},{word:'compassion', en:"Deep concern for another person's suffering.", tr:'merhamet', fa:'دلسوزی'}],
 quiz:[{prompt:'Why did Olivia realize she was trapped in a repeating day?', options:['The same news, weather, and accident repeated exactly, no matter what she tried to change','She found a diary explaining the time loop','A scientist explained the phenomenon to her'], correct:0},
       {prompt:"Why couldn't she prevent the accident despite many attempts?", options:['No matter what she changed, some chain of events caused the same collision to happen anyway','She was too afraid to try anything','The police always arrested her before she could act'], correct:0},
       {prompt:'What finally allowed the time loop to end?', options:['She noticed and saved an unnoticed child instead of focusing only on the crash itself','She confronted the truck driver directly','She left the city permanently'], correct:0}],
 grammarFocus:[{point:'Mixed Conditionals', example:'If Olivia had ignored the child, she would still be trapped in the endless Tuesday.'},{point:'Inversion for Emphasis', example:'Never had Olivia imagined that one ordinary day could repeat forever.'},{point:'Symbolism', example:'The repeating Tuesday symbolized the routines that prevent people from noticing what truly matters.'}],
 discussionQuestions:['Do people often become so focused on major events that they overlook smaller but equally important moments?','If you were trapped in the same day, how would your priorities change over time?','Can a single act of kindness have consequences we never fully understand?'],
 writingPractice:{prompt:'Write 200-250 words: "A person becomes trapped in a repeating moment until they learn an important lesson. What is the lesson, and how does it change their life?" Include: The repeating event. The failed attempts to escape. The hidden lesson. The transformation.'},
 message:{en:'Sometimes the greatest changes do not come from preventing disasters or solving impossible mysteries. They come from noticing the people, choices, and moments that everyone else overlooks.'}},

{id:'story-C1-Documentary-1', level:'C1', genre:'Documentary', title:{en:'The Village That Time Almost Forgot', tr:'Zamanın Neredeyse Unuttuğu Köy'},
 text:"For centuries, hidden deep within the mountains of northern Italy, there was a tiny village that seemed untouched by the modern world. The village was called Sostila. Unlike nearby towns, Sostila had no supermarkets, no hotels, and no large roads connecting it to the outside world. For decades, only a narrow mountain path allowed visitors to reach it. Life there followed traditions that had remained almost unchanged for generations.\n\nMany of the stone houses were built hundreds of years ago. Their walls had survived wars, harsh winters, and earthquakes. Families passed the same homes from parents to children, preserving not only the buildings but also the stories connected to them. Until the middle of the twentieth century, most villagers worked as farmers or shepherds. Electricity arrived much later than in nearby cities. Television was even slower to appear.\n\nAs the rest of Europe experienced rapid industrial growth, Sostila continued living at its own pace. But change eventually reached the village. Young people left to study or find better-paying jobs in larger cities. Schools closed because there were not enough children. Shops disappeared one by one. Today, only a handful of permanent residents remain.\n\nWalking through Sostila feels like stepping into another century. Wooden doors still carry hand-carved family symbols. Old fountains continue providing fresh mountain water. Narrow streets, designed long before automobiles existed, remain almost exactly as they were hundreds of years ago. Despite its quiet appearance, the village has become increasingly valuable to historians. Researchers visit Sostila not because it contains famous monuments, but because it represents something increasingly rare: A community that changed very little while the world transformed around it.\n\nAnthropologists study its local traditions. Architects examine its construction techniques. Linguists record the unique expressions and dialect that have survived for generations. Even the recipes prepared by the remaining residents provide clues about agricultural life in earlier centuries.\n\nHowever, preserving such places presents difficult questions. Should villages like Sostila remain exactly as they are? Or should modern development improve the lives of the people who still live there? Some believe tourism offers the best solution. Visitors could provide income while helping preserve local culture. Others worry that too many tourists would gradually destroy the peaceful character that makes the village special.\n\nThis debate exists in many parts of the world. As globalization connects countries more closely than ever before, small communities often face a difficult choice. Adapt completely. Or risk disappearing.\n\nSostila has chosen a careful balance. Limited restoration projects help maintain historic buildings without dramatically changing their appearance. Local festivals invite visitors while celebrating traditions that might otherwise be forgotten. Young volunteers occasionally return during the summer to repair homes, clean hiking paths, and document family histories before they disappear forever.\n\nAlthough the village may never regain its former population, its greatest value is no longer measured by the number of people who live there. Instead, it reminds us that progress does not always require leaving the past behind. Sometimes the oldest places teach the newest generations what truly deserves to be preserved.",
 vocab:[{word:'untouched', en:'Not changed or affected.', tr:'el değmemiş', fa:'دست‌نخورده'},{word:'preserve', en:'To protect something from damage or loss.', tr:'korumak', fa:'حفظ کردن'},{word:'industrialization', en:'The development of industries in a country.', tr:'sanayileşme', fa:'صنعتی‌شدن'},{word:'anthropologist', en:'A scientist who studies human societies and cultures.', tr:'antropolog', fa:'مردم‌شناس'},{word:'dialect', en:'A regional form of a language.', tr:'lehçe', fa:'گویش'},{word:'globalization', en:'The increasing connection of countries and cultures.', tr:'küreselleşme', fa:'جهانی‌شدن'},{word:'restoration', en:'The process of repairing something old.', tr:'restorasyon', fa:'مرمت'},{word:'heritage', en:'Traditions, buildings, and culture passed through generations.', tr:'kültürel miras', fa:'میراث فرهنگی'},{word:'sustainability', en:'The ability to continue without causing harm.', tr:'sürdürülebilirlik', fa:'پایداری'}],

       {prompt:'Why do some people disagree about increasing tourism in the village?', options:['They worry too many visitors would destroy the peaceful character that makes it special','They believe tourism is illegal in that region','They think tourists would not be interested in visiting'], correct:0}],

{id:'story-C1-Documentary-2', level:'C1', genre:'Documentary', title:{en:'The Glacier That Holds the Past', tr:'Geçmişi Saklayan Buzul'},
 text:"High in the mountains, where temperatures remain below freezing for most of the year, enormous rivers of ice move so slowly that their movement is almost impossible to detect. These frozen rivers are known as glaciers. Although they may appear lifeless, glaciers are among the most valuable natural archives on Earth.\n\nEvery winter, fresh snow falls onto their surface. Over thousands of years, new layers compress the older ones beneath them. Eventually, the snow transforms into solid ice. Each layer traps tiny bubbles of ancient air, dust from distant deserts, volcanic ash, pollen, and even microscopic particles from human activity. For scientists, glaciers are like history books written in ice.\n\nBy drilling deep into a glacier and extracting long cylinders called ice cores, researchers can examine layers that formed hundreds, thousands, or even hundreds of thousands of years ago. The deeper the layer, the older it is. These frozen records reveal remarkable details about Earth's past. Scientists can estimate past temperatures by analyzing the chemical composition of the ice. They can identify periods of volcanic eruptions by finding thin layers of ash. Even changes in atmospheric pollution can be traced through particles trapped inside the ice.\n\nOne of the most significant discoveries made through ice-core research concerns carbon dioxide. Measurements show that today's concentration of carbon dioxide in the atmosphere is higher than it has been for at least 800,000 years. This evidence has helped researchers better understand the relationship between greenhouse gases and global temperatures.\n\nHowever, glaciers themselves are now changing rapidly. Across many regions of the world, rising temperatures have caused glaciers to melt at unprecedented rates. Some have lost hundreds of meters of ice within only a few decades. Others may disappear completely before the end of this century.\n\nThe consequences extend far beyond the mountains. Millions of people rely on glacier-fed rivers for drinking water, agriculture, and electricity. As glaciers shrink, water supplies become less predictable. Sea levels also rise as land-based ice melts, increasing the risk of flooding in many coastal communities.\n\nScientists continue to monitor glaciers using satellites, drones, weather stations, and field expeditions. These technologies allow researchers to measure changes in ice thickness, movement, and surface temperature with remarkable precision. At the same time, local communities are adapting to changing conditions. Some regions have built new reservoirs to store seasonal meltwater. Others have developed early warning systems for floods caused by rapidly melting glaciers.\n\nWhile these measures reduce immediate risks, they cannot replace the glaciers themselves. Once a glacier disappears, the climate record stored inside it is lost forever. Future generations would no longer have access to the frozen evidence that has helped humanity understand Earth's environmental history.\n\nGlaciers remind us that nature quietly records every chapter of our planet's story. Whether those chapters continue to exist depends largely on the choices people make today.",
 vocab:[{word:'glacier', en:'A large, slow-moving mass of ice.', tr:'buzul', fa:'یخچال طبیعی'},{word:'compress', en:'To press something into a smaller space.', tr:'sıkıştırmak', fa:'فشرده کردن'},{word:'archive', en:'A collection of historical records.', tr:'arşiv', fa:'آرشیو'},{word:'extract', en:'To remove something carefully.', tr:'çıkarmak', fa:'استخراج کردن'},{word:'composition', en:'The substances that something contains.', tr:'bileşim', fa:'ترکیب'},{word:'concentration', en:'The amount of a substance in a certain area.', tr:'yoğunluk', fa:'غلظت'},{word:'unprecedented', en:'Never experienced before.', tr:'benzeri görülmemiş', fa:'بی‌سابقه'},{word:'reservoir', en:'A place where water is stored.', tr:'su deposu, rezervuar', fa:'مخزن آب'},{word:'environmental', en:'Related to the natural world.', tr:'çevresel', fa:'زیست‌محیطی'}],
 quiz:[{prompt:'Why do scientists consider glaciers to be natural archives?', options:['Each ice layer traps ancient air, ash, and particles that reveal Earth’s climate history','They contain fossils of extinct animals','They are the oldest structures built by early humans'], correct:0},
       {prompt:'What information can researchers learn from ice cores?', options:['Past temperatures, volcanic eruptions, and levels of atmospheric pollution','The exact population of ancient civilizations','Future weather predictions for the next century'], correct:0},
       {prompt:'What are some consequences of glaciers melting too quickly?', options:['Less predictable water supplies and rising sea levels that increase flooding risk','Increased snowfall in tropical regions','A permanent decrease in global temperatures'], correct:0}],
 grammarFocus:[{point:'Relative Clauses', example:"Ice cores, which contain ancient air bubbles, provide valuable information about Earth's climate."},{point:'Present Perfect Passive', example:'Many glaciers have been monitored by satellites over the past several decades.'},{point:'Academic Cause and Effect', example:'As global temperatures rise, glaciers melt more rapidly, leading to changes in water supplies and sea levels.'}],
 discussionQuestions:["Why is it important to study Earth's climate history?", 'What responsibilities do governments and individuals have in addressing climate change?', 'Can modern technology fully replace the environmental information lost when glaciers disappear?'],
 writingPractice:{prompt:'Write 200-250 words: "Explain why glaciers are important for both science and society." Include: How glaciers form. What scientists learn from them. The effects of glacier loss. Possible solutions for protecting them.'},

{id:'story-C1-Documentary-3', level:'C1', genre:'Documentary', title:{en:'The Message That Traveled 13 Billion Years', tr:'13 Milyar Yıl Yolculuk Eden Mesaj'},
 text:"Every night, when we look up at the stars, we are not simply observing distant objects. In many cases, we are looking into the past. Light travels at a finite speed—approximately 300,000 kilometers per second. Although this speed is incredibly fast, the universe is unimaginably vast. As a result, light from distant stars and galaxies takes years, centuries, or even billions of years to reach Earth.\n\nWhen astronomers observe the Sun, they see it as it was about eight minutes ago. The light from the nearest star beyond the Sun takes more than four years to arrive. For galaxies located billions of light-years away, the light we detect today began its journey long before Earth even existed. In other words, telescopes function as time machines. Rather than traveling through time, they collect ancient light that has been crossing the universe for billions of years.\n\nOne of the greatest achievements in modern astronomy is the James Webb Space Telescope. Unlike ordinary telescopes, which mainly observe visible light, the James Webb telescope detects infrared light. This allows it to see through enormous clouds of cosmic dust where new stars and planets are forming. It also enables scientists to observe some of the oldest galaxies ever discovered. These galaxies formed only a few hundred million years after the Big Bang, nearly 13.8 billion years ago. By studying their light, astronomers can better understand how the first stars, galaxies, and even the chemical elements necessary for life gradually emerged.\n\nThe telescope does more than explore the distant universe. It also investigates planets orbiting other stars. When an exoplanet passes in front of its star, a tiny fraction of the starlight travels through the planet's atmosphere before reaching the telescope. By analyzing this light, scientists can identify gases such as water vapor, carbon dioxide, methane, and oxygen. These discoveries help researchers evaluate whether certain planets might have conditions suitable for life. Although no definitive evidence of extraterrestrial life has yet been found, each observation expands our understanding of what is possible.\n\nThe universe continues to surprise scientists. New galaxies appear where older theories predicted none should exist. Black holes grow faster than expected. Planetary systems display astonishing diversity. Every discovery raises new questions alongside new answers.\n\nAstronomy reminds us that scientific progress is not simply about collecting facts. It is about continually refining our understanding as better evidence becomes available. Every beam of ancient light reaching Earth's telescopes carries information from a different chapter in the universe's history. Each observation is like receiving a message that has traveled across space for billions of years before finally arriving in human hands.\n\nAs technology advances, scientists will continue decoding these cosmic messages. And with every new discovery, humanity gains a deeper appreciation of both the immense scale of the universe and our small—but meaningful—place within it.",
 vocab:[{word:'finite', en:'Having limits; not infinite.', tr:'sonlu', fa:'محدود'},{word:'vast', en:'Extremely large in size or extent.', tr:'engin, uçsuz bucaksız', fa:'پهناور'},{word:'infrared', en:'A type of light invisible to the human eye.', tr:'kızılötesi', fa:'مادون‌قرمز'},{word:'galaxy', en:'A massive system of stars, gas, and dust.', tr:'galaksi', fa:'کهکشان'},{word:'emerge', en:'To gradually appear or develop.', tr:'ortaya çıkmak', fa:'پدیدار شدن'},{word:'atmosphere', en:'The layer of gases surrounding a planet.', tr:'atmosfer', fa:'جو'},{word:'extraterrestrial', en:'Originating outside Earth.', tr:'dünya dışı', fa:'فرازمینی'},{word:'astonishing', en:'Extremely surprising or impressive.', tr:'şaşırtıcı', fa:'شگفت‌انگیز'},{word:'decode', en:'To understand or interpret hidden information.', tr:'çözmek', fa:'رمزگشایی کردن'}],

       {prompt:'What advantages does the James Webb Space Telescope have over many traditional telescopes?', options:['It detects infrared light, letting it see through cosmic dust and observe some of the oldest galaxies','It can travel faster than the speed of light','It only observes planets within our own solar system'], correct:0},
