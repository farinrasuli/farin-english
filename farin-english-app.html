{id:'story-A1-Adventure-1', level:'A1', genre:'Adventure', title:{en:'The Mountain Treasure', tr:'Dağdaki Hazine'},
 text:"It was the first day of the summer holiday. Leo was ten years old and loved adventures. He enjoyed climbing hills, walking in forests, and looking at maps. His best friend, Sophie, liked adventures too.\n\nOne sunny morning, Leo visited his grandfather. His grandfather lived in a small wooden house near a beautiful mountain. After breakfast, Grandpa opened an old brown box. Inside the box was an old map. Leo's eyes became big. \"Wow! What is that?\" Grandpa smiled. \"I found this map many years ago. It shows a secret place on the mountain.\" Sophie looked excited. \"A secret place?\" Grandpa nodded. \"People say there is an old treasure there.\"\n\nLeo smiled. \"Can we look for it?\" Grandpa laughed. \"Of course. But remember. The greatest treasure is not always gold.\"\n\nLeo and Sophie packed their backpacks. Leo packed water, sandwiches, a flashlight, and a notebook. Sophie packed fruit, a small first-aid kit, and a camera. Grandpa looked at them. \"You are ready.\"\n\nThe three friends started walking. The mountain path was long but beautiful. They saw colorful flowers beside the road. Butterflies flew from one flower to another. Birds sang in the trees.\n\nAfter one hour, they reached a small river. \"There isn't a bridge,\" Sophie said. Leo looked around. \"I have an idea.\" They found a long piece of wood. Grandpa helped them place it across the river. One by one, they carefully crossed. \"You were brave,\" Grandpa said.\n\nAfter crossing the river, they continued walking. Soon they heard a strange sound. Rustle... Rustle... Sophie stopped. \"What was that?\" Leo felt a little scared. Grandpa smiled. \"Let's look.\" They walked slowly toward the bushes. Suddenly, a small rabbit jumped out. \"Oh!\" Sophie laughed. \"I thought it was a monster!\" The rabbit quickly disappeared into the forest. Everyone laughed together.\n\nAfter another hour, they reached a cave. \"This must be the place!\" Leo said. The cave was dark. Leo turned on his flashlight. The walls were cold and wet. There were strange shapes on the rocks. Sophie held Grandpa's hand. \"It is a little scary.\" \"Don't worry,\" Grandpa said. \"We are together.\"\n\nDeep inside the cave, they found an old wooden box. Leo carefully opened it. His hands were shaking. Inside... there were no gold coins. There were no diamonds. Instead, they found: an old compass, a small notebook, a silver key, and a letter.\n\nGrandpa carefully opened the letter. It said: Dear Traveler, if you found this box, you are brave, kind, and curious. This is the real treasure. Nature is beautiful. Friends are important. Every adventure teaches something new. Please enjoy this mountain and protect it. Leave this box for the next explorer.\n\nLeo smiled. \"I like this treasure.\" Sophie nodded. \"So do I.\" Grandpa looked happy. \"I told you. The greatest treasure is not always gold.\"\n\nBefore leaving, they added something to the box. Leo placed a drawing of the mountain inside. Sophie added a friendship bracelet she made herself. Grandpa wrote today's date in the notebook. Then they closed the box carefully.\n\nAs they walked home, they picked up empty plastic bottles and pieces of paper they found on the path. \"We should keep the mountain clean,\" Sophie said. \"Yes,\" Leo answered. \"It belongs to everyone.\"\n\nWhen they reached Grandpa's house, they drank fresh lemonade in the garden. Grandpa asked, \"What did you learn today?\" Leo smiled. \"I learned that courage helps us explore.\" Sophie answered, \"I learned that adventures are better with friends.\" Grandpa looked at the mountain. \"And I learned that this mountain still teaches people beautiful lessons.\"\n\nThat evening, Leo looked at the map again. On the back, he wrote: The greatest treasure is friendship, nature, and the memories we make together. He folded the map and smiled. He knew this would not be his last adventure.",
 vocab:[{word:'adventure', en:'An exciting journey or experience.', tr:'macera', fa:'ماجراجویی'},{word:'mountain', en:'A very high hill.', tr:'dağ', fa:'کوه'},{word:'map', en:'A drawing that shows places and roads.', tr:'harita', fa:'نقشه'},{word:'treasure', en:'Something valuable or special.', tr:'hazine', fa:'گنج'},{word:'flashlight', en:'A small light you carry in your hand.', tr:'el feneri', fa:'چراغ‌قوه'},{word:'cave', en:'A large hole inside a mountain or rock.', tr:'mağara', fa:'غار'},{word:'compass', en:'A tool that shows north, south, east, and west.', tr:'pusula', fa:'قطب‌نما'},{word:'explorer', en:'A person who travels to discover new places.', tr:'kaşif', fa:'کاشف'},{word:'bracelet', en:'A piece of jewelry worn around the wrist.', tr:'bileklik', fa:'دستبند'},{word:'protect', en:'To keep someone or something safe.', tr:'korumak', fa:'محافظت کردن'},{word:'courage', en:'The ability to face danger or fear.', tr:'cesaret', fa:'شجاعت'}],

{id:'story-A1-Adventure-2', level:'A1', genre:'Adventure', title:{en:'The Island of the Hidden Lighthouse', tr:'Gizli Deniz Fenerinin Adası'},
 text:"It was the first week of summer vacation. Emma and her cousin Noah were staying with their grandparents near the sea. Every morning, they walked along the beach, collected shells, and watched the fishing boats.\n\nOne morning, Grandpa pointed to a small island far away. \"Do you see that island?\" he asked. \"Yes!\" Emma said. \"There is an old lighthouse there.\" Noah looked carefully. \"I can only see the top.\" Grandpa smiled. \"Many years ago, the lighthouse helped ships find the way home.\"\n\nEmma loved old stories. \"Can we visit it?\" Grandpa thought for a moment. \"The weather is sunny, and the sea is calm. I think today is a good day.\" Emma and Noah jumped with excitement.\n\nAfter breakfast, they packed their backpacks. Emma packed water, apples, sandwiches, and her camera. Noah packed a flashlight, a small rope, a notebook, and a compass. Grandma gave them hats. \"The sun is very strong today,\" she said.\n\nGrandpa started the small boat. The engine made a soft sound as they crossed the blue water. Emma looked down. \"There are fish!\" Small silver fish swam beside the boat. A white bird flew above them.\n\nSoon they reached the island. The beach was quiet. There were no houses. There were only trees, flowers, and the old lighthouse standing on a hill. \"It looks lonely,\" Noah said.\n\nThey followed a narrow path through the trees. They saw colorful butterflies and small rabbits. Everything was peaceful. When they reached the lighthouse, Emma noticed something strange. \"The door is open.\" Grandpa looked surprised. \"It is usually closed.\"\n\nThey walked inside. The stairs were old but strong. Step by step, they climbed higher. The lighthouse was dark. Noah turned on his flashlight. At the top, they found a small room. There was an old table, a chair, a dusty window, and a wooden box.\n\nEmma carefully opened the box. Inside she found an old diary. She read the first page: My name is Captain Elias. I take care of this lighthouse. Every night I turn on the light so ships can return home safely. I hope future visitors will remember that helping others is an important job.\n\nEmma smiled. \"I like this captain.\" Noah turned another page. There were drawings of ships, maps, and weather notes. Grandpa said, \"This diary tells the story of the lighthouse.\"\n\nSuddenly Noah pointed outside. \"Look!\" A baby bird was sitting on the edge of the roof. It could not fly. \"It looks scared,\" Emma whispered. Grandpa walked slowly. He gently picked up the little bird. Nearby, they saw a nest with two other baby birds. \"The wind probably moved it,\" Grandpa said. He carefully placed the bird back into the nest. The mother bird landed beside her babies and sang a happy song. Emma smiled. \"We helped someone today.\"\n\nBefore leaving, Grandpa cleaned the dusty window. Emma picked up small pieces of trash around the lighthouse. Noah swept the floor with an old broom they found. \"The lighthouse looks much better now,\" Noah said. Grandpa nodded. \"Every visitor should leave a place cleaner than they found it.\"\n\nBefore they left, Emma wrote one sentence in the visitor's notebook: Thank you, Captain Elias. We will remember your kindness. Then they closed the wooden box.\n\nAs the boat returned to the village, the sun slowly began to set. The sky became orange, pink, and purple. Emma looked back at the lighthouse. \"It still watches over the sea.\" Grandpa smiled. \"Some lights never stop helping people.\"\n\nThat evening, Emma put one shell from the island on her bedroom shelf. Whenever she looked at it, she remembered the old lighthouse, the brave captain, the little bird, and the lesson she learned. Sometimes, the greatest adventure is not finding treasure. Sometimes, it is helping others and taking care of the world around us.",
 vocab:[{word:'island', en:'A piece of land surrounded by water.', tr:'ada', fa:'جزیره'},{word:'lighthouse', en:'A tall building with a bright light to help ships.', tr:'deniz feneri', fa:'فانوس دریایی'},{word:'beach', en:'A sandy place next to the sea.', tr:'plaj, sahil', fa:'ساحل'},{word:'compass', en:'A tool that shows direction.', tr:'pusula', fa:'قطب‌نما'},{word:'diary', en:'A book where someone writes about their life.', tr:'günlük', fa:'دفتر خاطرات'},{word:'captain', en:'The leader of a ship.', tr:'kaptan', fa:'ناخدا'},{word:'nest', en:'A home made by birds.', tr:'kuş yuvası', fa:'آشیانه'},{word:'gently', en:'In a soft and careful way.', tr:'nazikçe', fa:'به‌آرامی'},{word:'visitor', en:'A person who goes to a place for a short time.', tr:'ziyaretçi', fa:'بازدیدکننده'},{word:'sunset', en:'The time when the sun goes down.', tr:'gün batımı', fa:'غروب آفتاب'}],

{id:'story-A1-Adventure-3', level:'A1', genre:'Adventure', title:{en:'The Cave Behind the Waterfall', tr:'Şelalenin Arkasındaki Mağara'},
 text:"It was the last weekend of summer vacation. Lily and her older brother, Ben, were visiting Green Valley National Park with their parents. Lily loved nature. She liked flowers, birds, and rivers. Ben loved exploring new places. He always carried a small backpack with useful things inside.\n\nAs they entered the park, a friendly park ranger smiled. \"Welcome!\" He gave each family a small map. \"There are many beautiful places here,\" he said. \"But please stay on the walking paths and respect nature.\" Lily thanked him and folded the map into her pocket.\n\nTheir family started walking through the forest. Tall green trees stood on both sides of the path. The morning air was cool and fresh. Birds sang above them. Small butterflies danced from flower to flower.\n\nAfter about one hour, they heard a loud sound. \"Can you hear that?\" Lily asked. \"It sounds like rain.\" Her father smiled. \"That is not rain. It is the waterfall.\" Soon they reached a beautiful waterfall. Clear water rushed down the rocks into a small blue lake. Tiny drops of water sparkled in the sunlight. \"It's amazing!\" Lily said. Many people were taking pictures. Some children were sitting on the rocks and eating lunch.\n\nBen looked carefully at the waterfall. \"I think I see something.\" \"What?\" Lily asked. \"There is a path behind the water.\" The family walked closer. There was a small sign. It said: Cave Behind the Waterfall. Visitors Welcome. Please Be Careful. Lily looked excited. \"Can we go inside?\" Her parents agreed. \"But stay together.\"\n\nThe path behind the waterfall was cool and a little wet. The sound of the falling water was very loud. Lily laughed. \"I can hardly hear anyone!\" Inside, the cave was larger than they expected. Sunlight entered through the waterfall, making the cave shine with beautiful colors. \"It looks magical,\" Ben whispered. The walls were covered with smooth rocks. Some rocks were white. Some were gray. Others sparkled like tiny stars.\n\nLily noticed something unusual. \"There are pictures on the wall!\" Her father looked closely. \"They are very old.\" The drawings showed deer, birds, fish, trees, and people walking through the forest. \"Who made them?\" Lily asked. \"We don't know,\" her mother answered. \"People who lived here many years ago may have drawn them.\"\n\nBen opened his notebook. \"I want to draw them too.\" He carefully sketched one picture. Lily took photos but did not touch the walls. The ranger's words came back to her. Respect nature.\n\nAfter a few minutes, Lily saw something shiny on the ground. \"It looks like a coin.\" She picked it up. It was not a coin. It was a round metal badge. On the back, it said: Junior Nature Explorer. Her father smiled. \"Someone probably dropped it.\"\n\nJust then, another family entered the cave. A little girl looked worried. \"My badge! I lost my explorer badge.\" Lily smiled. \"Is this yours?\" The little girl's face became bright. \"Yes! Thank you!\" She hugged Lily. \"I thought I would never find it.\" The girl's mother smiled. \"You are very kind.\"\n\nThe park ranger arrived a few minutes later. He heard what happened. \"You did the right thing,\" he said. \"As a thank-you, I have something for you.\" He opened a small box. Inside were green stickers with the words: Nature Protector. He gave one sticker to Lily and one to Ben. \"People who care for nature are real explorers.\"\n\nLily proudly placed the sticker on her notebook. Before leaving the cave, Ben picked up an empty plastic bottle someone had left behind. Lily found a candy wrapper near the path. Together, they put the trash into a recycling bin outside. The ranger smiled. \"You left the park better than you found it.\"\n\nOn the way home, Lily looked out of the car window. \"What was your favorite part?\" her mother asked. Ben answered first. \"I liked the cave.\" Her father smiled. \"I liked the old drawings.\" Lily thought for a moment. \"I liked helping someone. And I liked taking care of nature.\"\n\nThat evening, Lily wrote in her diary. Today I visited a cave behind a waterfall. I saw beautiful rocks and old drawings. I returned a lost badge. I learned that a real adventure is not only about finding exciting places. It is also about being honest, helping people, and protecting nature. She closed her diary with a smile. She could not wait for her next adventure.",
 vocab:[{word:'waterfall', en:'Water falling from a high place.', tr:'şelale', fa:'آبشار'},{word:'cave', en:'A large natural hole inside a mountain or rock.', tr:'mağara', fa:'غار'},{word:'ranger', en:'A person who protects a park or forest.', tr:'park görevlisi', fa:'جنگل‌بان'},{word:'sparkle', en:'To shine with small bright lights.', tr:'parıldamak', fa:'برق زدن'},{word:'drawing', en:'A picture made with a pencil or pen.', tr:'çizim', fa:'نقاشی'},{word:'badge', en:'A small sign or symbol that shows membership or achievement.', tr:'rozet', fa:'نشان'},{word:'recycle', en:'To use materials again instead of throwing them away.', tr:'geri dönüştürmek', fa:'بازیافت کردن'},{word:'protect', en:'To keep something safe from harm.', tr:'korumak', fa:'محافظت کردن'},{word:'honest', en:'Always telling the truth and doing the right thing.', tr:'dürüst', fa:'صادق'}],

{id:'story-A1-Romance-1', level:'A1', genre:'Romance', title:{en:'The Flower for Sofia', tr:'Sofia için Çiçek'},
 text:"Spring arrived in the small town of Oakville. The trees were green again, colorful flowers bloomed in every garden, and birds sang happily every morning.\n\nDaniel was ten years old. He liked drawing, reading books, and taking care of plants. Every Saturday, he helped his mother in their flower shop. One Saturday morning, Daniel was watering the roses when the shop door opened. A new girl walked inside with her grandmother. She had long black hair and kind brown eyes. She smiled politely. \"Good morning,\" she said. \"Good morning,\" Daniel answered.\n\nHis mother smiled. \"Welcome!\" The girl's grandmother looked around the shop. \"I would like some flowers for our garden.\" Daniel showed them many different flowers. \"These yellow flowers are sunflowers. These pink ones are tulips. And these white flowers are daisies.\" The girl looked at every flower carefully. \"They are all beautiful,\" she said. \"My name is Sofia.\" \"I'm Daniel.\" Sofia smiled. \"It is nice to meet you.\" \"It is nice to meet you too.\"\n\nAfter choosing the flowers, Sofia and her grandmother thanked Daniel and left. Daniel watched them walk away. His mother smiled. \"You made new customers today.\" Daniel laughed. \"I think I made a new friend.\"\n\nThe next Monday, Daniel saw Sofia again at school. Their teacher, Mrs. Parker, said, \"Class, this is Sofia. She is new in our school.\" Everyone said hello. Mrs. Parker asked, \"Daniel, can Sofia sit next to you?\" \"Of course.\" During English class, Daniel helped Sofia find the correct page in her book. At lunchtime, he showed her the school garden. \"There is my favorite tree,\" he said. \"I like reading under it.\" Sofia smiled. \"I think I will like this school.\"\n\nEvery day after school, Daniel and Sofia talked together. Sometimes they walked home. Sometimes they visited the library. Sometimes they played with their friends in the park.\n\nOne afternoon, Sofia looked a little sad. Daniel noticed. \"Are you okay?\" Sofia nodded slowly. \"I miss my old friends.\" Daniel thought for a moment. \"When I feel sad, I draw pictures. It makes me happy.\" Sofia smiled. \"I like painting. Maybe we can paint together.\" \"I would like that.\"\n\nOne week later, the school announced a Spring Festival. Every student could join an activity. Some students sang songs. Some danced. Others painted pictures. Daniel had an idea. \"Sofia, let's make a flower garden together.\" \"For the festival?\" \"Yes!\" Sofia smiled. \"That's a wonderful idea.\"\n\nFor several days, they worked after school. They planted colorful flowers. They painted small wooden signs. One sign said: Welcome! Another said: Please Protect the Flowers. Finally, the little garden was ready. It looked beautiful.\n\nOn festival day, many parents visited the school. Everyone stopped to look at the flower garden. \"It is lovely,\" one teacher said. \"The colors are amazing,\" another parent said. Mrs. Parker smiled proudly. \"You both worked very hard.\" The principal gave Daniel and Sofia a small certificate. It said: Best Teamwork Award. Daniel looked at Sofia. \"We did it.\" Sofia smiled brightly. \"We did it together.\"\n\nBefore everyone went home, Sofia gave Daniel a small flower. It was a white daisy. \"My grandmother says daisies mean kindness. Thank you for helping me feel at home.\" Daniel carefully held the flower. \"Thank you. I will keep it in my favorite book.\" Sofia laughed. \"And every time you read it, you will remember today.\" \"I will.\"\n\nThat evening, Daniel placed the daisy inside his storybook. His mother asked, \"Where did you get that flower?\" Daniel smiled. \"Sofia gave it to me.\" His mother smiled too. \"She must be a good friend.\" Daniel nodded. \"She is.\" He looked out of the window. The flowers outside moved gently in the wind. Daniel realized that friendships grow just like flowers. With kindness, time, and care. He smiled because he knew this was the beginning of a wonderful friendship.",
 vocab:[{word:'flower shop', en:'A store that sells flowers.', tr:'çiçekçi', fa:'گل‌فروشی'},{word:'sunflower', en:'A tall yellow flower that follows the sun.', tr:'ayçiçeği', fa:'آفتابگردان'},{word:'tulip', en:'A colorful spring flower.', tr:'lale', fa:'لاله'},{word:'daisy', en:'A small white flower with a yellow center.', tr:'papatya', fa:'گل مینا'},{word:'festival', en:'A special day with fun activities.', tr:'festival', fa:'جشنواره'},{word:'plant', en:'To put a flower or tree into the ground so it can grow.', tr:'dikmek', fa:'کاشتن'},{word:'certificate', en:'A paper showing that someone did something well.', tr:'sertifika', fa:'گواهی‌نامه'},{word:'teamwork', en:'Working together to do something.', tr:'takım çalışması', fa:'کار تیمی'},{word:'kindness', en:'Being friendly and helpful to others.', tr:'nezaket', fa:'مهربانی'},{word:'remember', en:'To keep something in your mind.', tr:'hatırlamak', fa:'به یاد آوردن'}],

 writingPractice:{prompt:'Write 6-8 sentences about a good friend. You can answer: What is your friend’s name? Where did you meet? What do you like to do together? Why is your friend special? What do you like most about your friendship?'},

{id:'story-A1-Romance-2', level:'A1', genre:'Romance', title:{en:'The Letter in the Library', tr:'Kütüphanedeki Mektup'},
 text:"Every Wednesday afternoon, Oliver visited the town library. He loved reading adventure books and looking at maps. The library was quiet and warm. It smelled like old books and fresh paper. Mrs. Taylor, the librarian, always smiled when she saw him. \"Hello, Oliver.\" \"Hello, Mrs. Taylor.\"\n\nOliver returned the books he finished and looked for a new one. One afternoon, while he was walking between the bookshelves, he saw a girl sitting by the window. She was reading a story about animals. She looked happy. Oliver smiled politely. The girl smiled back.\n\nMrs. Taylor walked over. \"Oliver, this is Ella. She is new in our town.\" \"Hello,\" Ella said. \"Hello,\" Oliver answered. \"What book are you reading?\" \"It's about wild animals,\" Ella replied. \"I like animals very much.\" Oliver smiled. \"I like adventure books.\" Ella laughed. \"Maybe you can tell me about your favorite adventure.\" \"And maybe you can tell me about your favorite animal.\" \"That's a good idea,\" Oliver said.\n\nEvery Wednesday, they met in the library. Sometimes they sat at the same table. Oliver talked about explorers, mountains, and forests. Ella talked about birds, dolphins, and horses. They learned many new things from each other.\n\nOne rainy afternoon, Ella looked worried. Oliver noticed. \"Is everything okay?\" Ella looked at the floor. \"I lost my library card.\" \"Oh,\" Oliver said. \"When did you see it last?\" \"This morning. I think it fell out of my book.\" Oliver wanted to help. \"Let's look together.\"\n\nThey searched between the bookshelves. They looked under the tables. They looked near the reading chairs. But they could not find it. Mrs. Taylor smiled kindly. \"Don't worry. It may still be here.\"\n\nOliver had another idea. \"What book did you borrow?\" Ella thought for a moment. \"It was a book about sea animals.\" They walked to the shelf. Oliver carefully picked up the last copy. Something small fell onto the floor. It was a blue library card. Ella picked it up. \"My card!\" She smiled with happiness. \"Thank you, Oliver!\" Oliver smiled. \"We found it together.\" Mrs. Taylor laughed. \"That is what good friends do.\"\n\nThe next week, the library announced a reading challenge. Every student who read five books would receive a special bookmark. Oliver looked at Ella. \"Do you want to join?\" \"Yes!\"\n\nFor one month, they visited the library every Wednesday. They read stories about castles, animals, space, oceans, and famous people. Sometimes they read quietly. Sometimes they talked about the stories. Oliver discovered that he liked animal books too. Ella discovered that adventure books were exciting.\n\nAt the end of the month, they both finished five books. Mrs. Taylor smiled proudly. \"Congratulations!\" She gave each of them a beautiful bookmark. Oliver's bookmark had a mountain. Ella's bookmark had a dolphin.\n\nBefore they went home, Ella gave Oliver a small envelope. \"I made something for you.\" Oliver carefully opened it. Inside was a handmade card. On the front, Ella had drawn an open book with two smiling children. Inside she wrote: Thank you for helping me. Thank you for reading with me. The library became my favorite place because I found a good friend.\n\nOliver smiled. He felt very happy. He took a small notebook out of his backpack. \"I have something for you too.\" He gave Ella one of his favorite drawings. It showed two children sitting under a tree, reading books together. Ella looked at the picture. \"It's beautiful. Thank you.\"\n\nBefore leaving, Mrs. Taylor watched them from her desk. She smiled quietly. Books helped people learn. But sometimes, books also helped people find wonderful friends.\n\nAs Oliver walked home, he placed Ella's card inside his favorite adventure book. Every time he opened the book, he saw her kind words. He smiled. Some stories are written in books. And some stories begin in a library.",
 vocab:[{word:'library', en:'A place where people borrow and read books.', tr:'kütüphane', fa:'کتابخانه'},{word:'librarian', en:'A person who works in a library.', tr:'kütüphaneci', fa:'کتابدار'},{word:'borrow', en:'To take something for a short time and return it later.', tr:'ödünç almak', fa:'قرض گرفتن'},{word:'library card', en:'A card used to borrow books from a library.', tr:'kütüphane kartı', fa:'کارت کتابخانه'},{word:'envelope', en:'A paper cover for a letter or card.', tr:'zarf', fa:'پاکت نامه'},{word:'bookmark', en:'A small object used to keep your place in a book.', tr:'kitap ayracı', fa:'نشانگر کتاب'},{word:'discover', en:'To find or learn something new.', tr:'keşfetmek', fa:'کشف کردن'},{word:'handmade', en:'Made by a person, not by a machine.', tr:'el yapımı', fa:'دست‌ساز'},{word:'favorite', en:'The one you like the most.', tr:'favori', fa:'مورد علاقه'}],

{id:'story-A1-Romance-3', level:'A1', genre:'Romance', title:{en:'The Star Festival', tr:'Yıldız Festivali'},
 text:"Every autumn, the small town of Riverdale held a special event called the Star Festival. People decorated the streets with colorful lights, paper stars, and lanterns. There were music shows, games, delicious food, and fireworks at night.\n\nThis year, Lily was very excited. It was her first Star Festival because her family had moved to Riverdale only three months before. On Saturday morning, Lily walked to the town square with her parents. The streets were full of happy people. Children were laughing. Musicians were playing songs. The smell of popcorn and fresh bread filled the air. \"It is beautiful,\" Lily said. Her mother smiled. \"I'm glad you like our new town.\"\n\nAs they walked past a small art stand, Lily saw a familiar face. It was Noah from her school. He was helping his grandfather sell handmade wooden stars. Noah smiled when he saw her. \"Hello, Lily!\" \"Hello! Your stars are beautiful.\" \"Thank you,\" Noah said proudly. \"My grandfather makes them.\" His grandfather smiled kindly. \"Would you like to paint one?\" Lily looked excited. \"Really?\" \"Of course.\"\n\nShe chose a small wooden star and painted it blue and yellow. Noah painted another one green and white. When they finished, Grandpa looked at both stars. \"They are wonderful. You can keep them.\" Lily thanked him and carefully put her star into her backpack.\n\nIn the afternoon, the town held a treasure hunt. Children received small maps. Each map showed five places around the festival. At every place, they had to answer a simple question. The winners would receive a special prize. Lily looked at her map. \"I don't know where to start.\" Noah smiled. \"We can work together.\" \"Okay!\"\n\nTheir first stop was the flower garden. A volunteer asked, \"Which flower is yellow and follows the sun?\" Lily smiled. \"A sunflower!\" \"Correct.\" They received their first stamp. Next, they visited the old clock tower. The question was: \"What time does the clock show?\" Noah looked carefully. \"It is three o'clock.\" \"Correct.\" The third stop was the library. Mrs. Green smiled. \"What animal is called the king of the jungle?\" \"Lion!\" they answered together. At the fourth stop, they solved a simple puzzle. At the fifth stop, they found a hidden paper star hanging in a tree. \"You finished!\" the volunteer said. \"Congratulations!\"\n\nThey received two small silver medals. Lily looked at Noah. \"We make a good team.\" Noah laughed. \"We really do.\"\n\nAs evening arrived, the sky slowly became dark. Families gathered in the town square. Hundreds of small lanterns glowed softly. The mayor walked onto the stage. \"Welcome to our Star Festival. Tonight, remember to spend time with your family and friends. Kindness is the brightest light of all.\" Everyone clapped. The fireworks began. Red. Blue. Gold. Purple. Bright stars filled the night sky. Lily watched quietly. \"They're amazing.\" Noah nodded. \"My grandfather says every star reminds us to keep hope in our hearts.\" Lily smiled. \"I like that.\"\n\nAfter the fireworks, people released paper lanterns into the sky. Each person wrote a wish before letting the lantern fly. Lily wrote: I hope I make many good friends in Riverdale. She folded the paper carefully. Noah looked at his lantern. \"What did you write?\" Lily asked. He smiled. \"If I tell you, it may not come true.\" They both laughed. Together, they watched their lanterns rise higher and higher until they looked like tiny stars.\n\nBefore going home, Noah gave Lily a small gift. It was the wooden star he had painted that morning. \"I want you to have this. So you remember your first Star Festival.\" Lily was surprised. \"Thank you.\" She smiled warmly. \"I have something for you too.\" She took the blue-and-yellow star from her backpack. \"I painted this one. I want you to keep it.\" Noah looked at the star. \"I will. My room has a window above my desk. I will hang it there. And every time I see it, I will remember today.\"\n\nThat night, Lily placed Noah's green-and-white star above her bed. When the moonlight entered her room, the little star shone softly. Lily smiled. She had come to Riverdale feeling lonely. Now she had wonderful memories. She had a new friend. She felt at home. She closed her eyes and whispered, \"Thank you, Star Festival.\" Outside, the stars still filled the sky. And somewhere in the quiet night, two small wooden stars reminded two young friends that the brightest light is the kindness we share with others.",
 vocab:[{word:'festival', en:'A special event where people celebrate together.', tr:'festival', fa:'جشنواره'},{word:'lantern', en:'A light inside a small case that people can carry or hang.', tr:'fener', fa:'فانوس'},{word:'fireworks', en:'Bright colorful lights in the sky during celebrations.', tr:'havai fişek', fa:'آتش‌بازی'},{word:'treasure hunt', en:'A game where people look for hidden things by following clues.', tr:'hazine avı', fa:'گنج‌یابی'},{word:'medal', en:'A small prize given for success.', tr:'madalya', fa:'مدال'},{word:'volunteer', en:'A person who helps without getting paid.', tr:'gönüllü', fa:'داوطلب'},{word:'wish', en:'Something you hope will happen.', tr:'dilek', fa:'آرزو'},{word:'celebrate', en:'To do something special for an important event.', tr:'kutlamak', fa:'جشن گرفتن'}],

       {prompt:'What gifts did Lily and Noah exchange at the end of the festival?', options:['The wooden stars they had each painted','Silver medals','Paper lanterns'], correct:0},
       {prompt:'What wish did Lily write on her lantern?', options:['That she would make many good friends in Riverdale','That the fireworks would be beautiful','That she could go home'], correct:0}],

 writingPractice:{prompt:'Write 6-8 sentences about your favorite celebration. You can answer: What is the celebration? Where does it happen? Who do you celebrate with? What food or activities do you enjoy? Why is it special?'},

// ===================== THRILLER (A1 - Suspense Without Horror) =====================
{id:'story-A1-Thriller-1', level:'A1', genre:'Thriller', title:{en:'The Light in the Old House', tr:'Eski Evdeki Işık'},
 text:"It was a cold Friday evening. The wind moved the trees, and dark clouds covered the sky. Tom and his older sister Emily were staying at their grandparents' house for the weekend.\n\nAfter dinner, Grandpa looked out of the window. \"The weather is changing,\" he said. \"I think it will rain tonight.\" Emily looked across the road. \"There is an old house over there. It looks empty.\" Grandpa nodded. \"Yes. No one lives there now.\"\n\nTom looked at the house. Its windows were dark. The garden was full of tall grass. The wooden fence was old. \"It looks a little scary,\" Tom whispered. Grandpa smiled. \"It is only an old house. There are many stories about it.\" Tom's eyes became wide. \"What stories?\" Grandpa laughed. \"Some people say they see a light in the upstairs window at night.\" Emily looked surprised. \"But nobody lives there.\" \"That is why people talk about it.\"\n\nLater that evening, rain began to fall. Tom could not sleep. He walked quietly to the bedroom window. The old house stood in the darkness. Then... a small yellow light appeared upstairs. Tom blinked. \"Emily!\" Emily woke up. \"What happened?\" \"Look!\" Emily looked through the window. \"There is a light!\" For a few seconds, they watched silently. Then the light disappeared. Tom felt nervous. \"Did you see it?\" Emily nodded slowly. \"Yes.\"\n\nThe next morning, the rain stopped. The sun came out. Tom and Emily told Grandpa what they saw. Grandpa smiled. \"So... you finally saw the light.\" Tom asked, \"What is it?\" Grandpa stood up. \"Let's find out.\"\n\nThe three of them walked across the road. The old gate made a loud sound when Grandpa opened it. \"Creeeak...\" The garden was quiet. A few birds flew away from the trees. They walked to the front door. It was locked. Grandpa looked around. \"There is another door at the back.\" They walked behind the house. The back door was open a little. Grandpa knocked. \"Hello?\" No one answered. They stepped inside.\n\nDust covered the floor. Old chairs stood against the wall. There was a broken clock. A family of spiders had made small webs in the corners. Tom held Emily's hand. \"It feels strange.\" Grandpa smiled. \"Stay close.\"\n\nThey slowly climbed the wooden stairs. Each step made a sound. \"Creek... Creek...\" When they reached the upstairs room, they looked around. There was an old table, a chair, a bookshelf, and one small window. Emily pointed. \"There!\" On the table stood an old glass lamp. Grandpa looked closely. \"It has a timer.\" \"A timer?\" Tom asked. Grandpa nodded. \"Many years ago, the owner wanted people to know if he was away. So every evening, the lamp turned on by itself.\" Emily smiled. \"It wasn't a ghost.\" Tom laughed. \"It was only a lamp!\" Grandpa picked it up carefully. \"It still works.\"\n\nAs they were leaving, Tom noticed something under the table. \"What is that?\" It was a small wooden box. Inside were old black-and-white photographs. There was also a letter. Grandpa opened it. The letter said: To the person who finds this box, this house was full of happy memories. Please remember that every old place has a story. Take care of history, and never be afraid to learn the truth.\n\nGrandpa smiled. \"The family who lived here loved this house.\" Emily looked at the photographs. \"They look happy.\" Tom nodded. \"I thought this place was scary. But it isn't. It is full of memories.\"\n\nWhen they returned home, Grandpa called the town museum. A museum worker came that afternoon. She thanked Grandpa for finding the photographs and the letter. \"We will keep these safely. They are an important part of our town's history.\" Tom smiled proudly.\n\nThat evening, the upstairs window of the old house stayed dark. The timer no longer worked. Tom looked outside one last time. \"I'm glad we visited.\" Emily smiled. \"Me too. Sometimes the truth is much more interesting than the stories.\" Grandpa laughed. \"And now you know something important. The best explorers are curious. They ask questions. They don't believe every rumor.\" Tom looked at the quiet old house. It no longer seemed scary. It simply waited for someone to remember its story.",
 vocab:[{word:'empty', en:'Having nobody inside.', tr:'boş', fa:'خالی'},{word:'fence', en:'A wooden or metal barrier around a place.', tr:'çit', fa:'نرده'},{word:'nervous', en:'Feeling worried or afraid.', tr:'gergin, endişeli', fa:'مضطرب'},{word:'dust', en:'Very small dry dirt.', tr:'toz', fa:'گردوغبار'},{word:'timer', en:'A device that starts or stops something at a set time.', tr:'zamanlayıcı', fa:'تایمر'},{word:'photograph', en:'A picture taken with a camera.', tr:'fotoğraf', fa:'عکس'},{word:'history', en:'Things that happened in the past.', tr:'tarih', fa:'تاریخ'},{word:'museum', en:'A place where old or important objects are kept.', tr:'müze', fa:'موزه'},{word:'rumor', en:'A story that people tell without knowing if it is true.', tr:'söylenti', fa:'شایعه'},{word:'curious', en:'Wanting to learn or know more.', tr:'meraklı', fa:'کنجکاو'}],

{id:'story-A1-Thriller-2', level:'A1', genre:'Thriller', title:{en:'The Last Train at Platform Three', tr:'Üçüncü Perondaki Son Tren'},
 text:"It was Saturday afternoon. Mia and her father were going to visit her aunt in the next town. They arrived at the train station early. The station was busy. People were buying tickets. Children were eating ice cream. Travelers carried heavy bags. A voice came from the loudspeaker. \"Train 24 to Lake Town will leave from Platform One.\"\n\nMia looked around. \"I like train stations,\" she said. \"There are so many people.\" Her father smiled. \"Every person is going somewhere.\" After buying two tickets, they sat on a bench. Mia watched the trains arrive and leave. Some trains were long. Some were short. Some were old. Some looked brand new.\n\nWhile they waited, Mia noticed something strange. At the end of the station was Platform Three. It looked very quiet. There were no passengers. There was no train. But every few minutes, the small station clock above Platform Three made a loud sound. Tick... Tick... Tick...\n\nMia looked again. A man wearing a blue jacket stood near the platform. He looked at his watch. Then he looked down the empty railway. A few minutes later, he walked away. Another woman arrived. She also looked at the railway. Then she left.\n\nMia became curious. \"Dad,\" she whispered. \"Why do people go to Platform Three if there is no train?\" Her father looked over. \"That's a good question.\"\n\nJust then, an old station worker walked by. He wore a red cap and carried a small toolbox. Mia smiled politely. \"Excuse me. Can I ask a question?\" \"Of course,\" the worker answered kindly. \"Why does everyone look at Platform Three?\" The worker smiled. \"Many years ago, trains left from that platform. But now it is used only once every Saturday evening.\" \"Only once?\" Mia asked. \"Yes. It is the last local train. It carries only a few passengers to small villages.\" Mia nodded. \"So that is the mystery.\" The worker laughed. \"Sometimes the answer is very simple.\"\n\nMia and her father thanked him. But before they walked away, they heard someone calling loudly. \"My bag! My bag is gone!\" An elderly woman looked worried. She searched under every bench. She looked inside the waiting room. She even looked inside the café. \"My blue bag! It has my medicine inside.\"\n\nThe station manager quickly arrived. \"When did you see it last?\" The woman thought carefully. \"I sat near Platform Three. I bought tea. When I came back... my bag was gone.\"\n\nMia remembered something. \"I saw a blue bag!\" Her father looked surprised. \"Where?\" \"I think I saw it beside the ticket machine.\" The station manager smiled. \"Let's check.\" They walked together across the station. Near the ticket machine stood a blue bag. Exactly where Mia remembered.\n\nThe elderly woman hurried over. \"It is mine!\" She opened it. Everything was inside. \"My medicine. My glasses. My notebook.\" She smiled with relief. \"Thank you so much.\" The station manager smiled at Mia. \"You have very good eyes.\" Mia laughed. \"I like watching people.\"\n\nA few minutes later, the loudspeaker spoke again. \"Attention, please. The local train to Pine Village will arrive at Platform Three in five minutes.\" Slowly, people began walking toward the platform. The man in the blue jacket returned. The woman came back too. Several families arrived with small bags. Then, from far away, Mia heard a soft sound. Whooooo... A small green train appeared around the corner. It moved slowly into the station. Its lights shone brightly. Its doors opened with a quiet hiss. Only a few people got on. The conductor smiled at every passenger. The station suddenly felt peaceful.\n\nMia watched the train leave. \"It is not a busy train.\" \"No,\" her father said. \"But it is important. It helps people who live in small villages.\" Mia smiled. \"Even a small train can do a big job.\"\n\nSoon their own train arrived. They found their seats by the window. As the train began to move, Mia looked back at Platform Three. The small green train was already disappearing into the hills. Her father smiled. \"What did you learn today?\" Mia thought for a moment. \"I learned that not every mystery is scary. Sometimes we only need to ask questions. And paying attention can help other people.\" Her father nodded proudly. \"Exactly.\" The train continued through the green countryside. Mia smiled as she watched the trees pass by. She wondered what mystery she would solve next.",
 vocab:[{word:'platform', en:'The place where people wait for a train.', tr:'peron', fa:'سکو'},{word:'loudspeaker', en:'A device that makes announcements louder.', tr:'hoparlör', fa:'بلندگو'},{word:'railway', en:'The metal tracks that trains travel on.', tr:'demiryolu', fa:'راه‌آهن'},{word:'conductor', en:'A person who helps passengers on a train.', tr:'tren görevlisi', fa:'مسئول قطار'},{word:'passenger', en:'A person traveling in a vehicle.', tr:'yolcu', fa:'مسافر'},{word:'medicine', en:'Something people take when they are sick.', tr:'ilaç', fa:'دارو'},{word:'relief', en:'The feeling when a worry is gone.', tr:'rahatlama', fa:'آسودگی خاطر'},{word:'countryside', en:'Land with farms, trees, and small villages.', tr:'kırsal bölge', fa:'حومه، روستا'},{word:'attention', en:'Careful watching or listening.', tr:'dikkat', fa:'توجه'}],

{id:'story-A1-Thriller-3', level:'A1', genre:'Thriller', title:{en:'The Footsteps in the Fog', tr:'Sisteki Ayak Sesleri'},
 text:"It was early Sunday morning. A thick white fog covered the small village of Pine Hill. The trees looked like gray shadows. The streets were quiet. Everything was still.\n\nElla woke up early because she wanted to go for a walk with her grandfather. Grandpa loved morning walks. He always said, \"The village is most beautiful before everyone wakes up.\" Ella put on her warm jacket and boots. She met Grandpa outside. \"Good morning!\" he said. \"Good morning!\" The air was cool.\n\nThey walked slowly along a narrow path near the forest. Because of the fog, they could only see a few meters ahead. \"It feels like we are walking through clouds,\" Ella said. Grandpa smiled. \"Fog can make familiar places look different.\"\n\nAs they continued walking, Ella stopped. \"Grandpa...\" \"What is it?\" \"I hear something.\" They listened carefully. Step... Step... Step... Someone — or something — was walking nearby. Ella looked around. \"I can't see anyone.\" Grandpa stayed calm. \"The sound is coming from the forest.\" The footsteps stopped. Then everything became quiet again. Ella felt curious. \"What was it?\" Grandpa smiled. \"Let's keep walking.\"\n\nA few minutes later, they heard the sound again. Step... Step... Step... This time it was a little louder. Ella looked behind her. Nobody was there. She looked in front of her. Nothing. Only white fog. She held Grandpa's hand. \"It is strange.\" Grandpa nodded. \"It is. But strange does not always mean dangerous.\"\n\nSoon they reached a small wooden bridge over a stream. The water moved quietly below them. Ella looked down. She saw fresh footprints in the mud. \"Look!\" Grandpa bent down. \"Interesting. The footprints are very small. They are not from a person.\" Ella looked surprised. \"Then whose are they?\" Grandpa smiled. \"Let's follow them.\"\n\nThe footprints crossed the bridge and continued toward a group of trees. Ella walked slowly. The fog was beginning to disappear. The sun slowly appeared behind the clouds. Everything became brighter. The footprints stopped near a large bush. Then... they heard the sound again. Step... Step...\n\nThe bush moved. Ella held her breath. Grandpa looked carefully. A small brown deer walked out from behind the bush. It looked at them for a moment. Its ears moved. Its nose smelled the fresh air. Then it quietly walked away into the forest. Ella laughed. \"It was the deer!\" Grandpa smiled. \"Yes. The fog made the sounds seem mysterious.\"\n\nAs they continued their walk, they found something else. A small blue backpack was lying beside the path. Ella picked it up. \"There is a name tag.\" It said: Max Carter. Grandpa looked at the backpack. \"It must belong to someone.\" Just then, they heard a voice. \"Has anyone seen my backpack?\" A boy came running along the path. He looked worried.\n\nElla smiled. \"Is your name Max?\" The boy nodded. \"Yes!\" \"This is your backpack.\" Max looked relieved. \"Thank you! I was collecting leaves for my school project. I forgot my backpack when I ran after a squirrel.\" Ella laughed. \"I think today is full of surprises.\" Max smiled. \"You helped me a lot.\"\n\nThe three of them walked back toward the village together. The fog had completely disappeared. The sky was bright blue. Birds were singing in the trees. Grandpa looked at the children. \"What did we learn today?\" Max answered first. \"I learned to be more careful with my things.\" Ella smiled. \"I learned that sounds can fool us.\" Grandpa nodded. \"And I learned that curiosity is good. But we should always stay calm and think before we become afraid.\"\n\nWhen they reached the village, Max thanked them again and waved goodbye. Ella and Grandpa sat on a bench in the town square. The bakery had just opened. The smell of fresh bread filled the air. Grandpa bought two warm rolls. One for himself. One for Ella. They sat quietly and watched the village wake up.\n\nElla smiled. \"This morning felt like an adventure.\" Grandpa laughed. \"Every day can be an adventure. We only need curious eyes... and a brave heart.\" Ella looked toward the forest. The fog was gone. Now she could clearly see the same path where they had walked. It no longer looked mysterious. It simply looked beautiful. She smiled. Sometimes the biggest mystery disappears when the sun comes out.",
 vocab:[{word:'fog', en:'Thick cloud close to the ground that makes it hard to see.', tr:'sis', fa:'مه'},{word:'footprint', en:"The mark left by a foot or an animal's foot.", tr:'ayak izi', fa:'ردپا'},{word:'stream', en:'A small river.', tr:'dere', fa:'جویبار'},{word:'bush', en:'A small plant with many branches.', tr:'çalı', fa:'بوته'},{word:'deer', en:'A wild animal with long legs that lives in forests.', tr:'geyik', fa:'گوزن'},{word:'relieved', en:'Happy because a worry has ended.', tr:'rahatlamış', fa:'آسوده‌خاطر'},{word:'curious', en:'Wanting to learn or know more.', tr:'meraklı', fa:'کنجکاو'},{word:'mysterious', en:'Difficult to understand or explain.', tr:'gizemli', fa:'مرموز'},{word:'peaceful', en:'Calm and quiet.', tr:'huzurlu', fa:'آرام'}],

{id:'story-A1-Documentary-1', level:'A1', genre:'Documentary', title:{en:'The Busy Bees', tr:'Çalışkan Arılar'},
 text:"One sunny morning, Mrs. Brown's class went on a school trip to a small farm. The farm was famous for its bees and honey. Many students were excited because they had never seen a beehive before. Mrs. Brown smiled. \"Today we will learn about bees. We must stay together and listen carefully.\"\n\nThe bus stopped near a beautiful garden. There were many colorful flowers. Red flowers. Yellow flowers. Purple flowers. White flowers. The air smelled sweet. The students got off the bus. A friendly farmer walked toward them. He wore a white suit and a special hat with a net over his face. \"My name is Mr. Harris,\" he said. \"I take care of the bees.\" Ben looked surprised. \"Why are you wearing that funny suit?\" Mr. Harris laughed. \"The bees do not know me. This suit protects me.\" The students smiled.\n\nMr. Harris took the class to the beehives. There were many wooden boxes in the field. Thousands of bees flew from flower to flower. \"They are very busy,\" Emma said. \"Yes,\" Mr. Harris answered. \"Bees work all day. They collect nectar from flowers.\" \"What is nectar?\" asked Lily. Mr. Harris picked a yellow flower. \"Nectar is a sweet liquid inside flowers. The bees drink a little nectar. They also carry pollen.\" \"What is pollen?\" Ben asked. \"It is the yellow powder inside flowers. When bees fly to another flower, they carry pollen with them. This helps flowers grow seeds and fruit.\" The students looked carefully. Tiny bees landed on the flowers. Then they flew away again.\n\nMr. Harris opened one beehive very carefully. The students stood a safe distance away. Inside the hive were hundreds of bees. \"They all have different jobs,\" Mr. Harris explained. \"There is one queen bee. She lays eggs. There are many worker bees. They clean the hive. They make honey. They feed the baby bees. There are also a few male bees.\" Every bee had an important job. Emma smiled. \"They work like a big family.\" Mr. Harris nodded. \"Exactly.\"\n\nThe students walked to another part of the farm. There they saw a machine for making honey. Mr. Harris showed them a frame from the hive. \"The bees store honey here.\" He carefully turned the machine. Golden honey slowly came out. \"It looks delicious!\" Ben said. Mr. Harris smiled. \"Would you like to taste some?\" \"Yes!\" Each student received a small piece of bread with fresh honey. \"It is sweet!\" Lily said. \"I have never tasted honey like this.\" Mr. Harris laughed. \"The bees worked very hard to make it.\"\n\nAfter lunch, Mrs. Brown asked everyone to sit under a large tree. She held up a picture of different fruits. \"Who likes apples?\" Everyone raised a hand. \"Who likes strawberries?\" Again, every hand went up. \"What about cucumbers?\" The students laughed. \"We like them too.\" Mrs. Brown smiled. \"Many fruits and vegetables grow because bees help flowers. If there were no bees, we would have much less food.\" The students looked surprised. \"I didn't know that,\" Emma said. \"I thought bees only made honey.\" Mr. Harris smiled. \"Honey is important. But helping plants grow is even more important.\"\n\nBefore going home, every student planted one small flower near the farm. Mrs. Brown said, \"These flowers will help bees next spring.\" Ben smiled. \"So we are helping the bees.\" \"Yes,\" Mrs. Brown answered. \"And when we help bees, we also help nature.\"\n\nOn the bus ride home, Emma looked out of the window. She saw many flowers beside the road. A few small bees were flying between them. She smiled. Before today, bees were just tiny insects. Now she knew they were amazing workers. They helped flowers. They helped farmers. They helped people. And they helped the whole world.\n\nWhen Emma arrived home, she told her family everything she had learned. Her father smiled. \"The smallest animals can sometimes do the biggest jobs.\" Emma nodded. \"I will never forget the busy bees.\"",

{id:'story-A1-Documentary-2', level:'A1', genre:'Documentary', title:{en:'The Amazing Sea Turtles', tr:'Harika Deniz Kaplumbağaları'},
 text:"One warm summer morning, Class 5A visited the Blue Ocean Nature Center. The students were excited because they were going to learn about sea turtles. Their science teacher, Mrs. Green, smiled. \"Today, we will discover how sea turtles live. We will also learn how we can protect them.\"\n\nThe students entered a large room. There were pictures of beaches, oceans, and sea animals on the walls. A marine biologist named Mr. Daniel welcomed everyone. \"Hello, everyone! Who has seen a sea turtle before?\" Only three students raised their hands. Mr. Daniel smiled. \"By the end of today, all of you will know many interesting facts about them.\"\n\nMr. Daniel showed a large picture of a sea turtle. \"Sea turtles have lived on Earth for more than 100 million years.\" The students looked surprised. \"That is older than dinosaurs?\" Emma asked. Mr. Daniel laughed. \"Dinosaurs disappeared about 66 million years ago. So yes, sea turtles are very ancient animals.\" He pointed to the turtle's large front flippers. \"These are called flippers. They help turtles swim. They do not have hands or feet like people.\" Ben asked, \"Can sea turtles breathe underwater?\" \"No,\" Mr. Daniel answered. \"They breathe air, just like us. They must come to the surface to breathe.\"\n\nNext, the class watched a short video. A mother sea turtle slowly climbed onto a sandy beach at night. She dug a hole in the sand. Then she laid about one hundred eggs. \"Wow!\" Lily whispered. \"When the eggs hatch,\" Mr. Daniel explained, \"the baby turtles must find the ocean by themselves. They are very small. They are only about the size of your hand.\" The students watched tiny turtles crawl toward the sea. Some birds flew above them. Some crabs waited on the beach. \"Many baby turtles do not survive,\" Mr. Daniel said. \"They face many dangers.\" The room became very quiet.\n\nMr. Daniel continued. \"People can also create problems for sea turtles.\" He showed pictures of plastic bags floating in the ocean. \"Sometimes turtles think plastic bags are jellyfish. They eat the plastic. But plastic can make them very sick.\" The students looked sad. Emma said, \"I never knew plastic was so dangerous.\" Mr. Daniel nodded. \"Plastic pollution is one of the biggest problems in our oceans.\" He also explained that fishing nets can trap turtles. Sometimes boats hit them by accident. Bright lights near beaches can confuse baby turtles. \"They may walk toward the city instead of the sea.\"\n\nAfter the presentation, the students visited a small rescue center. There they met a sea turtle named Hope. Hope had hurt one of her flippers after getting caught in an old fishing net. A veterinarian carefully cleaned her injury every day. \"Will Hope get better?\" Ben asked. \"Yes,\" the veterinarian said. \"She is much stronger now. When she is healthy, we will return her to the ocean.\" The students smiled. Emma gently watched Hope swim. \"She is beautiful.\"\n\nBefore leaving, every student received a small poster. It listed five simple ways to help sea turtles: use less plastic; put trash in the correct bin; keep beaches clean; respect sea animals; teach other people about protecting the ocean. Mrs. Green looked at the class. \"Can we all do these things?\" \"Yes!\" everyone answered together.\n\nOn the bus ride home, the students talked about everything they had learned. Ben said, \"I thought turtles were just slow animals. Now I know they are incredible travelers.\" Emma smiled. \"I want to help keep beaches clean.\"\n\nWhen Emma arrived home, she showed the poster to her family. The next weekend, they visited a nearby beach. Together, they picked up plastic bottles, food wrappers, and empty cans. Emma looked at the clean sand. She smiled proudly. \"Maybe one day a baby sea turtle will safely walk across this beach.\" Her father smiled. \"Small actions can protect big lives.\" Emma nodded. She knew she would never look at the ocean the same way again.",
 vocab:[{word:'sea turtle', en:'A turtle that lives in the ocean.', tr:'deniz kaplumbağası', fa:'لاک‌پشت دریایی'},{word:'ocean', en:'A very large body of salt water.', tr:'okyanus', fa:'اقیانوس'},{word:'flipper', en:'A flat limb that helps sea animals swim.', tr:'yüzgeç', fa:'باله'},{word:'hatch', en:'To come out of an egg.', tr:'yumurtadan çıkmak', fa:'از تخم بیرون آمدن'},{word:'pollution', en:'Harmful waste that damages nature.', tr:'kirlilik', fa:'آلودگی'},{word:'fishing net', en:'A net used to catch fish.', tr:'balık ağı', fa:'تور ماهیگیری'},{word:'rescue', en:'To save someone or something from danger.', tr:'kurtarmak', fa:'نجات دادن'},{word:'veterinarian', en:'A doctor for animals.', tr:'veteriner', fa:'دامپزشک'},{word:'protect', en:'To keep someone or something safe.', tr:'korumak', fa:'محافظت کردن'}],

{id:'story-A1-Documentary-3', level:'A1', genre:'Documentary', title:{en:'Life in the Rainforest', tr:'Yağmur Ormanında Yaşam'},
 text:"One Monday morning, Mrs. Wilson entered the classroom with a big green box. The students looked at the box with curiosity. \"What is inside?\" Ben asked. Mrs. Wilson smiled. \"Today, we are going on a rainforest adventure.\" The students laughed. \"But we are at school,\" Emma said. Mrs. Wilson nodded. \"Yes, but today we will learn about one of the most amazing places on Earth.\"\n\nShe opened the box. Inside were green leaves, colorful bird feathers, pictures of monkeys, frogs, butterflies, and a globe. The students gathered around the table. Mrs. Wilson pointed to the globe. \"Rainforests are found near the Equator. They are warm and rainy all year. There are rainforests in South America, Africa, Asia, and other parts of the world.\" Lily raised her hand. \"Why are they called rainforests?\" \"Because they receive a lot of rain,\" Mrs. Wilson answered. \"Sometimes it rains almost every day.\"\n\nNext, Mrs. Wilson showed a large picture of the Amazon Rainforest. \"This is one of the biggest rainforests in the world.\" The students looked carefully. There were tall trees. Long vines hung from the branches. Bright flowers covered the ground. Many colorful birds flew above the trees. \"It looks beautiful,\" Emma said. \"It is,\" Mrs. Wilson replied. \"Millions of animals and plants live there.\"\n\nMrs. Wilson held up pictures of different animals. \"This is a toucan.\" It had a large, colorful beak. \"This is a sloth. It moves very slowly.\" The students laughed. \"Why is it so slow?\" Ben asked. \"It saves energy,\" Mrs. Wilson explained. She showed another picture. \"This is a poison dart frog.\" It was bright blue. \"It is very small. But in nature, bright colors often tell other animals to stay away.\" The students listened carefully. Finally, Mrs. Wilson showed a picture of a jaguar. \"It is one of the strongest animals in the rainforest. It is an excellent hunter.\" Emma whispered, \"I would not want to meet one.\" Everyone laughed.\n\nAfter lunch, the class watched a short documentary. They saw monkeys swinging from tree to tree. They watched parrots flying through the forest. They saw butterflies landing on colorful flowers. Then they watched heavy rain fall over the trees. \"The rainforest helps the Earth,\" Mrs. Wilson said. \"It gives us oxygen. It stores large amounts of carbon. It is home to many living things.\" Ben looked surprised. \"So rainforests help people too?\" \"Yes,\" Mrs. Wilson answered. \"They help everyone, even people who live far away.\"\n\nMrs. Wilson then showed two pictures. The first picture showed a healthy rainforest. The second picture showed many trees cut down. The students became quiet. \"What happened?\" Lily asked. \"This is called deforestation,\" Mrs. Wilson explained. \"Sometimes people cut down too many trees. When forests disappear, animals lose their homes.\" Emma looked sad. \"What can we do?\" Mrs. Wilson smiled. \"We can recycle paper. We can plant trees. We can use less waste. And we can teach other people why forests are important.\"\n\nBefore the lesson ended, every student planted a small tree in the school garden. Mrs. Wilson gave each student a name tag for their tree. Emma named her tree Hope. Ben named his tree Strong Oak. Lily named hers Green Friend. Mrs. Wilson smiled proudly. \"These trees will grow for many years. They will give shade. They will help birds. And they will clean the air.\" The students looked at their little trees. They imagined them becoming tall and strong.\n\nThat evening, Emma told her parents everything she had learned. She showed them the rainforest pictures. She explained what deforestation means. Her father smiled. \"You learned a lot today.\" Emma nodded. \"I didn't know forests were so important.\"\n\nThe next weekend, Emma and her family joined a community clean-up day at a local park. They collected plastic bottles, paper, and other litter. Emma looked at the clean park and smiled. \"Protecting nature starts with small actions.\" Her mother nodded. \"Every person can help.\" Emma looked up at the trees moving gently in the wind. She thought about the distant rainforests. Although they were thousands of kilometers away, she understood something important. Nature connects everyone. When we protect forests, we protect animals, people, and the future.",
 vocab:[{word:'rainforest', en:'A warm forest with a lot of rain.', tr:'yağmur ormanı', fa:'جنگل بارانی'},{word:'Equator', en:'The imaginary line around the middle of the Earth.', tr:'Ekvator', fa:'خط استوا'},{word:'vine', en:'A long plant that climbs trees.', tr:'sarmaşık', fa:'پیچک'},{word:'sloth', en:'A slow-moving animal that lives in trees.', tr:'tembel hayvan', fa:'تنبل (حیوان)'},{word:'jaguar', en:'A large wild cat found in the Americas.', tr:'jaguar', fa:'جگوار'},{word:'oxygen', en:'The gas that people and animals need to breathe.', tr:'oksijen', fa:'اکسیژن'},{word:'deforestation', en:'Cutting down many trees in a forest.', tr:'ormansızlaşma', fa:'جنگل‌زدایی'},{word:'recycle', en:'To use materials again instead of throwing them away.', tr:'geri dönüştürmek', fa:'بازیافت کردن'},{word:'shade', en:'A cool area away from direct sunlight.', tr:'gölge', fa:'سایه'},{word:'litter', en:'Trash left on the ground.', tr:'çöp', fa:'زباله'}],

 message:{en:'Rainforests are some of the most valuable places on Earth. They provide homes for countless animals, help keep our planet healthy, and support life around the world. Even small actions — like planting a tree, recycling, or keeping parks clean — can help protect nature for future generations.'}}

{id:'story-A2-Fiction-1', level:'A2', genre:'Fiction', title:{en:'The Bicycle That Changed Everything', tr:'Her Şeyi Değiştiren Bisiklet'},
 text:"When Lucas turned fourteen, he wanted only one thing for his birthday—a bicycle. He had dreamed about owning one for almost two years. Every afternoon, he watched other children ride through the streets of his town. They laughed, raced each other, and explored places that Lucas had never visited.\n\nHis family did not have much money. His father worked as a bus driver, and his mother worked in a bakery. They always paid for the important things first. One evening, Lucas said quietly, \"I know a bicycle is expensive. You don't have to buy one.\" His mother smiled. \"We know how much you want one.\" His father added, \"Sometimes good things take time.\" Lucas understood. He stopped asking, but he never stopped dreaming.\n\nThree months later, summer vacation began. Lucas decided to earn some money. Every morning he walked his neighbor's dog. In the afternoon, he watered plants for an elderly couple who were visiting their daughter. On weekends, he helped his uncle wash cars. The work was not easy. Some days were very hot. Some days he felt tired. But every evening he counted the money in a small glass jar. Slowly, the jar became fuller.\n\nOne Saturday, his best friend Maya visited him. \"What are you saving for?\" Lucas showed her the jar. \"My bicycle.\" Maya smiled. \"You are getting closer.\" \"I know. But I still need more.\"\n\nOne afternoon, while Lucas was walking home, he noticed an old bicycle beside a repair shop. Its paint was faded. One wheel was flat. The chain looked rusty. But the frame was strong. He walked into the shop. The owner, Mr. Karim, looked up from his work. \"Can I help you?\" Lucas pointed to the bicycle. \"Is that bike for sale?\" Mr. Karim smiled. \"It belonged to my son. He has a new one now. It needs a lot of work.\" Lucas looked carefully. \"How much is it?\" The old man thought for a moment. \"If you promise to repair it yourself, I'll sell it for fifty dollars.\" Lucas could hardly believe it. He had exactly fifty dollars. \"I'll take it!\"\n\nThe next morning, Lucas proudly pushed the bicycle home. His father laughed. \"It looks older than I am.\" Lucas smiled. \"I know. But I think it can become beautiful.\" His father opened the garage. \"Then let's begin.\"\n\nFor the next two weeks, they worked together. They cleaned every part. They changed the tires. They fixed the brakes. Lucas learned how to oil the chain. He learned how to tighten loose screws. He even painted the bicycle a bright blue color. When they finished, it looked almost new. His mother came outside. \"I can't believe that's the same bicycle!\" Lucas smiled proudly. \"Neither can I.\"\n\nThe first ride was wonderful. The wind blew through Lucas's hair as he rode down the quiet streets. He visited the park. He rode beside the river. He discovered small roads he had never seen before. For the first time, the town felt much bigger than he imagined.\n\nEvery evening, Lucas and Maya rode together. Sometimes they raced. Sometimes they stopped to watch the sunset. Sometimes they simply talked while riding slowly. One afternoon, they saw a young boy sitting alone near the playground. The boy looked upset. His bicycle lay on the ground. The front wheel was bent. Lucas stopped. \"What's wrong?\" The boy sighed. \"I crashed into a rock. My bike is broken. My parents can't buy another one.\" Lucas looked at Maya. Then he smiled. \"Let's see if we can fix it.\"\n\nThey carefully examined the bicycle. The wheel was bent. The chain had fallen off. One brake was loose. Lucas remembered everything Mr. Karim had taught him. Together, they repaired the chain. They straightened the wheel as much as possible. They tightened the brake. After half an hour, the bicycle worked again. The little boy climbed onto it carefully. \"It works! Thank you!\" His face became bright with happiness. Lucas smiled. \"You're welcome.\"\n\nAs the boy rode away, Maya looked at Lucas. \"You know... when you wanted a bicycle, you thought it would only make you happy. But today, it helped someone else too.\" Lucas smiled. \"I never thought about that.\"\n\nA few weeks later, Mr. Karim visited Lucas's house. \"I've heard something. People say you're very good at repairing bicycles.\" Lucas laughed. \"I'm still learning.\" Mr. Karim smiled. \"I need help in my shop on Saturdays. Would you like a part-time job?\" Lucas's eyes became wide. \"Really?\" \"Yes. You work hard. You learn quickly. And you enjoy helping people.\" Lucas accepted immediately.\n\nBy the end of the summer, he had repaired many bicycles. He had earned more money. He had made new friends. Most importantly, he had discovered a skill he truly loved. One evening, he rode his blue bicycle home. The sun was setting behind the hills. He smiled. Months earlier, he believed his dream was simply to own a bicycle. Now he understood something much bigger. Sometimes, the journey toward a dream changes you more than the dream itself.",

{id:'story-A2-Fiction-2', level:'A2', genre:'Fiction', title:{en:"The Stranger's Notebook", tr:'Yabancının Defteri'},
 text:"Every Friday after school, Ava visited Maple Street Café. It was a small, quiet café with large windows and shelves full of books. People came there to read, study, or simply enjoy a cup of coffee or hot chocolate. Ava's favorite place was a small table by the window. She usually ordered hot chocolate and spent two hours reading or writing in her notebook.\n\nOne rainy Friday afternoon, the café was almost empty. Soft music played in the background while raindrops gently touched the windows. Ava sat down with her notebook and opened her favorite novel. After about an hour, she noticed something unusual. There was a small brown notebook on the table next to hers. No one was sitting there. She looked around. The café owner, Mrs. Lopez, was making coffee behind the counter. Two university students were talking quietly. An elderly man was reading a newspaper. Nobody seemed to be looking for a notebook.\n\nAva picked it up carefully. On the first page, she read: \"If you are reading this, please don't throw this notebook away. It contains stories from people I have met while traveling. If you find it, please read one story and, if you want, write one of your own before returning it. Thank you.\" Ava smiled. \"What an interesting idea.\"\n\nShe turned to the first story. It was written by a young woman from Italy. She described how a stranger helped her when she missed her train. Another story came from Japan. A teacher wrote about a student who gave away his lunch to someone who had forgotten theirs. There was a story from Brazil about a street musician who made an entire crowd smile during a power outage. Each story was different. But they all had something in common. Every story was about kindness.\n\nAva kept reading. She forgot about the rain outside. She forgot about the time. She felt as if she were traveling around the world without leaving her chair. Mrs. Lopez walked over. \"You've been reading that notebook for a long time.\" Ava looked up. \"It isn't mine. I found it.\" Mrs. Lopez smiled. \"Oh. That notebook has been here before. It belongs to a traveler named Daniel. He visits our café every few months. He always leaves it behind for a day or two.\" \"Really?\" \"Yes. He says every town has a story worth collecting.\"\n\nAva looked at the notebook again. \"I love that idea.\" She turned to a blank page. She thought for a long moment. \"What should I write?\" Finally, she picked up her pen. She wrote about her grandfather. Every Sunday morning, he visited a local park with a bag of birdseed. He fed the birds. He greeted everyone he met. He remembered people's names. One winter morning, he noticed an elderly woman sitting alone on a bench. She looked cold and lonely. Instead of walking past her, he sat beside her and started a conversation. After that day, they met every Sunday. Eventually, many other people joined them. What started as two strangers talking became a small group of friends who met every weekend. Ava ended her story with one sentence: Kindness grows when someone is brave enough to say \"hello.\" She smiled as she closed the notebook.\n\nJust then, the café door opened. A tall man wearing a green backpack walked inside. His jacket was wet from the rain. Mrs. Lopez smiled. \"Daniel! You came back.\" The man laughed. \"I think I forgot something.\" Mrs. Lopez pointed toward Ava. \"I think she found it.\" Daniel walked over. \"Thank you. I was hoping someone would read it.\" Ava handed him the notebook. \"I did. And I wrote a story.\" Daniel looked surprised. \"Would you mind if I read it?\" \"Not at all.\" He quietly read her page. When he finished, he smiled warmly. \"Your grandfather sounds like a wonderful person.\" \"He is,\" Ava replied.\n\nDaniel carefully closed the notebook. \"You know why I started this project? Many years ago, I believed the world was becoming less friendly. I wanted to prove myself wrong. So I asked strangers to write true stories about kindness.\" \"And what happened?\" Ava asked. Daniel smiled. \"The notebook became full. So I bought another. And another. I've filled more than twenty notebooks.\" Ava's eyes grew wide. \"Twenty?\" \"Yes. Every notebook reminds me that good people are everywhere.\"\n\nBefore leaving, Daniel reached into his backpack. He took out a small empty notebook. \"I think you're ready.\" Ava looked confused. \"Ready for what?\" \"To begin your own collection.\" She held the notebook in her hands. Its pages were completely blank. \"For me?\" Daniel nodded. \"You notice people. You listen. You care. Those are the best qualities of a storyteller.\" Ava smiled. She felt both surprised and excited.\n\nAs she walked home through the light rain, she thought about all the people she met every week. The bus driver who always smiled. The baker who gave free bread to people in need. The neighbor who watered everyone's flowers during holidays. Maybe every ordinary person carried an extraordinary story.\n\nThat evening, Ava wrote the first sentence in her new notebook. Everyone has a story. Sometimes, all we have to do is ask. She closed the notebook gently. She knew this was only the beginning.",
 vocab:[{word:'traveler', en:'A person who travels to different places.', tr:'gezgin', fa:'مسافر'},{word:'stranger', en:'A person you do not know.', tr:'yabancı', fa:'غریبه'},{word:'collect', en:'To gather things over time.', tr:'toplamak', fa:'جمع‌آوری کردن'},{word:'notice', en:'To see or realize something.', tr:'fark etmek', fa:'متوجه شدن'},{word:'eventually', en:'Finally, after some time.', tr:'sonunda', fa:'سرانجام'},{word:'ordinary', en:'Normal; not unusual.', tr:'sıradan', fa:'معمولی'},{word:'extraordinary', en:'Very special or unusual.', tr:'olağanüstü', fa:'خارق‌العاده'},{word:'storyteller', en:'A person who tells or writes stories.', tr:'hikâye anlatıcısı', fa:'قصه‌گو'},{word:'remind', en:'To help someone remember something.', tr:'hatırlatmak', fa:'یادآوری کردن'},{word:'quality', en:'A good characteristic or ability.', tr:'özellik', fa:'ویژگی'}],
