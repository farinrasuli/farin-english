{id:'story-A2-Fiction-3', level:'A2', genre:'Fiction', title:{en:'The Summer of Second Chances', tr:'İkinci Şansların Yazı'},
 text:"The last school bell of the year rang loudly. Students rushed out of the building, laughing and talking about their summer plans. Some were going to the beach. Others were visiting their grandparents. Some were traveling to different countries. But Ethan had no exciting plans. He walked home slowly with his backpack over one shoulder. His mother noticed his disappointed face. \"What's wrong?\" she asked. \"Everyone is doing something interesting this summer,\" Ethan replied. \"I'm just staying here.\" His mother smiled. \"Sometimes the best adventures happen close to home.\" Ethan wasn't convinced. \"I don't think so.\"\n\nThe next morning, Ethan was helping his grandfather clean the attic. The attic was full of old boxes, dusty books, broken toys, and forgotten furniture. \"I haven't opened some of these boxes for twenty years,\" Grandpa said. As Ethan moved one heavy box, he found a small wooden chest underneath it. It had a tiny brass lock. \"Grandpa, what's this?\" Grandpa looked surprised. \"I completely forgot about that.\" He searched his pocket and found an old key. The lock opened with a soft click. Inside the chest were old photographs, postcards, newspaper articles, and several journals. \"Whose are these?\" Ethan asked. Grandpa smiled. \"They belonged to your great-grandmother, Clara. She loved writing.\"\n\nEthan carefully opened one of the journals. The first page read: This summer, I decided to try something new every week. Life becomes exciting when we say yes to new experiences. Ethan became curious. Every journal described one summer adventure. One week, Clara learned how to bake bread. Another week, she planted vegetables for the first time. She learned to paint with watercolors. She climbed a mountain. She volunteered at a local animal shelter. She even learned a few words in another language. At the end of each week, she always wrote the same question: What did this experience teach me? Ethan looked at Grandpa. \"She did all of this in one summer?\" Grandpa laughed. \"Yes. She believed every person should keep learning.\"\n\nThat evening, Ethan had an idea. \"I'm going to do the same thing.\" His mother smiled. \"What will you try first?\" Ethan thought for a moment. \"I've always wanted to learn photography.\" The next day, Grandpa gave Ethan an old digital camera. \"It still works. You just need to charge the battery.\" Ethan spent hours taking photographs. He photographed flowers after the rain. He photographed birds in the park. He photographed old buildings, bicycles, sunsets, and smiling people. At first, many pictures were blurry. Some were too dark. Some were too bright. But every day, he improved.\n\nDuring the second week, Ethan visited the public library. A photography club met there every Thursday. The club leader, Ms. Harper, welcomed him warmly. \"Everyone starts as a beginner,\" she said. \"You don't need expensive equipment. You only need curious eyes.\" Those words stayed in Ethan's mind. The club members walked around the town together. They looked for interesting colors, reflections, and shapes. Instead of walking quickly, they learned to slow down and notice small details. Ethan realized he had passed the old fountain hundreds of times without really looking at it. Now he noticed tiny birds drinking water there every morning.\n\nFor his third challenge, Ethan volunteered at the local animal shelter. At first, he felt nervous. He had never worked with animals before. The shelter manager, Mrs. Collins, showed him what to do. \"You can fill the water bowls. You can brush the dogs. And you can play with the puppies.\" One shy dog named Charlie followed Ethan everywhere. Charlie had been rescued from the streets. He was gentle but afraid of strangers. Every afternoon, Ethan sat quietly beside him. He didn't force Charlie to play. He simply waited. Little by little, Charlie began to trust him. One day, Charlie brought Ethan his favorite toy. Mrs. Collins smiled. \"I've never seen Charlie do that before.\"\n\nAs the weeks passed, Ethan completed more challenges. He learned to cook a simple pasta dish. He planted tomatoes in the garden. He visited a museum for the first time. He wrote letters to his cousins. He even gave a short speech at the library about his photography. Each Sunday evening, he wrote in his own journal. Like Clara, he answered the same question: What did this experience teach me? Sometimes the answer was: Be patient. Sometimes: Don't be afraid to make mistakes. Or: Every person knows something you can learn.\n\nAt the end of the summer, the photography club organized a small exhibition. Each member chose three favorite photographs. Ethan selected: Charlie sleeping peacefully in the sunshine; a rainbow after a summer storm; his grandfather smiling while reading Clara's journal. Many visitors came to the exhibition. They admired the pictures. One visitor stopped in front of Ethan's photographs. \"They tell a story,\" she said. \"They don't just show pictures.\" Ethan smiled. \"Thank you.\" Ms. Harper stood beside him. \"You've improved a lot. But your greatest success isn't your photography.\" \"It isn't?\" \"No. You learned to see the world differently.\"\n\nOn the evening before school started, Ethan sat in the garden with Grandpa. The sky was orange as the sun slowly disappeared behind the hills. Grandpa asked, \"So... did you have a boring summer?\" Ethan laughed. \"It was the busiest summer of my life.\" He opened Clara's journal one last time. On the final page she had written: Every new experience changes you a little. By the end of a lifetime, those little changes become the person you are.\n\nEthan quietly closed the journal. When summer began, he believed adventure meant traveling far away. Now he understood something different. Adventure was not about the distance. It was about having the courage to try something new. And sometimes, a second chance begins with a single decision.",
 vocab:[{word:'attic', en:'The space under the roof of a house.', tr:'çatı katı', fa:'زیرشیروانی'},{word:'journal', en:'A notebook where someone writes about their life.', tr:'günlük', fa:'دفترچه خاطرات'},{word:'experience', en:'Something that happens to you or that you do.', tr:'deneyim', fa:'تجربه'},{word:'photography', en:'The art of taking pictures.', tr:'fotoğrafçılık', fa:'عکاسی'},{word:'blurry', en:'Not clear or sharp.', tr:'bulanık', fa:'تار'},{word:'reflection', en:'An image seen in water, glass, or a mirror.', tr:'yansıma', fa:'انعکاس'},{word:'volunteer', en:'To work without being paid to help others.', tr:'gönüllü olmak', fa:'داوطلبانه کار کردن'},{word:'shelter', en:'A safe place for animals or people.', tr:'barınak', fa:'پناهگاه'},{word:'exhibition', en:'A public display of art or photographs.', tr:'sergi', fa:'نمایشگاه'},{word:'admire', en:'To look at something with pleasure or respect.', tr:'hayranlıkla bakmak', fa:'تحسین کردن'},{word:'patient', en:'Able to wait calmly without getting angry.', tr:'sabırlı', fa:'صبور'},{word:'courage', en:'The ability to face something difficult or new.', tr:'cesaret', fa:'شجاعت'}],

{id:'story-A2-Adventure-1', level:'A2', genre:'Adventure', title:{en:'The Hidden Valley', tr:'Gizli Vadi'},
 text:"Oliver had always loved maps. While his friends spent their weekends playing video games, Oliver often visited the town library. He enjoyed reading books about explorers, mountains, forests, and hidden places.\n\nOne Saturday morning, his grandmother invited him to help clean her old house. \"There are many boxes in the attic,\" she said. \"Maybe you'll find something interesting.\" Oliver smiled. \"I always do.\"\n\nThe attic was full of old furniture, paintings, and dusty books. Near an old wooden chair, Oliver noticed a long tube tied with a red ribbon. Inside the tube was an old map. The paper was yellow with age. Some corners were torn. Across the top, someone had written: The Hidden Valley. Oliver carefully opened it. The map showed a forest, a river, a bridge, and a large hill. Near the hill was a red circle. Beside it were the words: \"Where three rivers become one, the valley waits.\"\n\nOliver became excited. \"Grandma! Where is this?\" His grandmother looked at the map. Her eyes became wide. \"I haven't seen this in years. It belonged to my grandfather. He loved hiking.\" \"Did he find the valley?\" She smiled. \"He always said... some places can only be found by people who enjoy the journey.\"\n\nThe next morning, Oliver showed the map to his best friends, Sofia and Noah. Sofia loved nature. She knew the names of many birds and plants. Noah enjoyed solving puzzles. Within minutes, all three agreed. \"We're going to find the Hidden Valley.\"\n\nThey packed carefully. Water bottles. Sandwiches. A first-aid kit. Flashlights. Rain jackets. A compass. Oliver folded the old map and placed it safely inside his backpack.\n\nThe adventure began early Sunday morning. The forest was quiet except for birds singing in the trees. Sunlight shone through the leaves. Everything looked peaceful. For the first hour, the map was easy to follow. They crossed a small wooden bridge. They walked beside a clear river. They climbed a gentle hill. Then... the path suddenly disappeared. Tall grass covered the ground. No signs pointed in any direction. Noah looked around. \"I think we're lost.\" Oliver unfolded the map again. \"It says there should be a large rock. But I don't see one.\"\n\nSofia walked a little farther. \"Wait! I found something.\" Half of a huge rock was hidden behind climbing plants. Oliver smiled. \"The map is right.\" They carefully pushed the plants aside. Behind the rock was a narrow path.\n\nThe path became steeper. Soon they reached a fast-moving river. There was no bridge. Only a few large stones crossed the water. Noah looked nervous. \"What if we fall?\" Sofia tested one stone carefully. \"It feels stable.\" Oliver had an idea. \"We don't have to hurry. We'll cross one at a time.\" Slowly and carefully, they crossed the river. No one slipped. When Noah reached the other side, he laughed. \"I was much more afraid than I needed to be.\" Oliver smiled. \"Sometimes that's true.\"\n\nAfter lunch, dark clouds filled the sky. A light rain began to fall. The old map became difficult to read. They stood under a large tree. \"What should we do?\" Sofia asked. \"We could go home.\" Oliver looked around. Then he remembered something his grandmother had once said. \"When you're unsure... stop. Look carefully. Don't panic.\" He climbed onto a large fallen tree. From there, he could see much farther. In the distance, three small rivers came together. Oliver smiled. \"There! Three rivers become one.\" They hurried toward the place.\n\nAs they reached the rivers, they noticed something unusual. Behind a group of tall trees was a narrow opening between two rocks. It almost looked like a secret doorway. The three friends walked through it. Suddenly... everything changed. The noisy river disappeared behind them. The air became calm. Wildflowers covered the ground. Butterflies flew everywhere. A small waterfall flowed into a crystal-clear lake. Birds sang from every direction. It was the most beautiful place they had ever seen. \"The Hidden Valley,\" Sofia whispered. \"We found it.\"\n\nNear the lake stood a small wooden bench. Someone had carved words into the wood many years ago. Oliver brushed away the dust. The message said: For the people who discover this valley... Take nothing except memories. Leave nothing except kindness. Protect this place so others may enjoy it too. The three friends stood quietly. Noah smiled. \"I thought we'd find treasure.\" Oliver looked around. \"I think we did.\" Sofia nodded. \"The treasure is this place.\"\n\nBefore leaving, they collected a few pieces of litter that someone had left behind—plastic bottles, food wrappers, an empty bag—and placed everything in a recycling bin back in town.\n\nWhen Oliver arrived home, he showed his grandmother a photograph of the valley. She smiled with tears in her eyes. \"My grandfather would be very happy. You finished the journey he started.\" Oliver shook his head. \"No. He started it. We continued it.\" His grandmother smiled. \"That's what adventures are for. They connect people across time.\"\n\nThat evening, Oliver placed the old map inside a protective folder. He wrote one sentence on the back: Some treasures cannot be bought. They must be discovered with curiosity, patience, and respect. He knew this would not be his last adventure. It was only the first page of many more to come.",
 vocab:[{word:'valley', en:'Low land between mountains or hills.', tr:'vadi', fa:'دره'},{word:'compass', en:'A tool that shows direction (north, south, east, west).', tr:'pusula', fa:'قطب‌نما'},{word:'explorer', en:'A person who travels to discover new places.', tr:'kâşif', fa:'کاشف'},{word:'torn', en:'Damaged with a rip or hole.', tr:'yırtık', fa:'پاره'},{word:'stable', en:'Strong and not likely to move or fall.', tr:'sağlam', fa:'محکم و پایدار'},{word:'steep', en:'Rising or falling sharply.', tr:'dik', fa:'شیب‌دار'},{word:'waterfall', en:'Water falling from a high place.', tr:'şelale', fa:'آبشار'},{word:'crystal-clear', en:'Very clean and easy to see through.', tr:'berrak', fa:'زلال'},{word:'carve', en:'To cut words or pictures into wood or stone.', tr:'oymak', fa:'حکاکی کردن'},{word:'treasure', en:'Something very valuable.', tr:'hazine', fa:'گنج'},{word:'protect', en:'To keep something safe from harm.', tr:'korumak', fa:'محافظت کردن'},{word:'curiosity', en:'A strong desire to learn or discover something.', tr:'merak', fa:'کنجکاوی'}],

 writingPractice:{prompt:'Write 8-10 sentences about an imaginary adventure. You can answer: Where did you go? Who went with you? What challenges did you face? What did you discover? What lesson did you learn?'},
 funFacts:['Many famous explorers succeeded because they worked as a team, not alone.','Maps are helpful, but explorers also observe nature, such as rivers, hills, and the position of the sun.','Modern hikers often carry a compass, a map, water, and a first-aid kit for safety.',"Some of the world's most beautiful places are protected as national parks so future generations can enjoy them."],
 message:{en:'The greatest treasures are not always made of gold or jewels. Sometimes they are beautiful places, unforgettable experiences, and the memories we create with others. True adventurers respect nature and leave every place better than they found it.'}},

{id:'story-A2-Adventure-2', level:'A2', genre:'Adventure', title:{en:'The Island of Forgotten Lights', tr:'Unutulmuş Işıklar Adası'},
 text:"Every summer, sixteen-year-old Nora visited her grandfather in the small fishing village of White Harbor. She loved the quiet streets, the salty sea air, and the colorful boats that gently moved on the water. But there was one place that interested her more than anything else. Far across the sea stood a tiny island. On top of the island was an old lighthouse. It had not worked for many years. People in the village called it The Island of Forgotten Lights.\n\nOne evening, Nora asked her grandfather about it. \"Why doesn't anyone use the lighthouse anymore?\" Grandfather looked toward the island. \"Long ago, ships depended on its light. But modern technology replaced it. Now the island is empty.\" Nora smiled. \"It still looks beautiful.\" Grandfather nodded. \"It is. But very few people visit it.\"\n\nThe next morning, Nora met her two friends, Leo and Maya. Leo loved building and fixing machines. Maya enjoyed painting and taking photographs. Nora unfolded a small map of the bay. \"I have an idea. What if we visit the lighthouse?\" Leo smiled immediately. \"I've always wanted to see it.\" Maya laughed. \"And I'll bring my camera.\" Grandfather agreed to lend them his small fishing boat. \"But promise me something. Respect the island. Take nothing. Leave nothing behind.\" \"We promise,\" the three friends answered together.\n\nThe sea was calm. The boat moved slowly across the blue water. Seagulls flew above them. Small fish jumped beside the boat. After thirty minutes, they reached the island. The lighthouse stood quietly on a rocky hill. Its white paint had faded. Some windows were broken. Wild flowers grew around the path. \"It feels like time stopped here,\" Maya whispered.\n\nThey climbed the winding path until they reached the wooden door. It opened with a loud creak. Inside, everything was covered with dust. There was an old desk. A wooden chair. A large clock that no longer worked. On the wall hung black-and-white photographs of lighthouse keepers from many years ago. Nora carefully picked up a guest book. The last entry was written fifteen years earlier. It said: Thank you for keeping the light alive. Safe journeys begin with a single light.\n\nThey climbed the narrow stairs to the top of the lighthouse. The glass windows looked out across the endless sea. The giant light was still there. Leo examined it carefully. \"The lamp is broken. But the main structure is still strong.\" He noticed an old toolbox in the corner. Inside were screwdrivers, oil, and a small notebook. The notebook contained instructions for maintaining the lighthouse. Leo smiled. \"I think we can clean it.\"\n\nFor the next two hours, everyone helped. Maya cleaned the dusty windows. Nora organized the old tools. Leo carefully removed rust from the moving parts. Although they could not fully repair the lighthouse, the room slowly came back to life. Sunlight shone brightly through the clean glass. \"It already looks much better,\" Maya said.\n\nAs they prepared to leave, Nora noticed something behind the old desk. It was a metal box. Inside were dozens of letters. Most were written by sailors. One letter said: Your light guided us home during the worst storm of our lives. Thank you for never giving up. Another letter read: My children are alive today because we found the harbor safely. Nora became quiet. \"I never realized how important this lighthouse was.\" Grandfather had been right. It wasn't just a building. It had protected thousands of people.\n\nOutside, dark clouds suddenly gathered. The wind became stronger. \"We should leave now,\" Leo said. They quickly returned to the boat. Small waves began to hit the sides. Nora stayed calm. \"Everyone put on your life jacket.\" The rain started. Visibility became poor. For a few minutes, they could barely see the village. Maya pointed ahead. \"I can see the harbor!\" Slowly, they guided the boat toward the shore. Soon they arrived safely. Grandfather smiled with relief. \"I was beginning to worry.\" Nora hugged him. \"We're fine.\"\n\nThat evening, the three friends showed the letters and photographs to the village mayor. The mayor looked at them carefully. \"I had forgotten how important this lighthouse was.\" Several older villagers shared stories about family members who had worked there. One woman smiled. \"My father was the last lighthouse keeper.\" Everyone agreed that the lighthouse should not be forgotten.\n\nOver the next few months, volunteers cleaned the island. Engineers repaired the building. Artists painted new signs. Students planted flowers along the path. Finally, one autumn evening, the village gathered to celebrate. The lighthouse would not guide ships anymore—modern navigation systems already did that—but its light would shine once every evening as a symbol of the village's history.\n\nAs darkness covered the sea, the old lighthouse lit up once again. A warm golden light spread across the water. Everyone applauded. Grandfather looked at Nora. \"You know... you didn't just explore an island. You helped people remember their own history.\" Nora smiled. \"I only wanted an adventure.\" Grandfather laughed. \"The best adventures leave the world a little better than before.\"\n\nNora looked at the lighthouse one last time. Its light reflected on the quiet sea. She realized that some lights are not only for ships. Some lights remind people where they came from. And those lights should never be forgotten.",
 vocab:[{word:'lighthouse', en:'A tall building with a powerful light that helps ships.', tr:'deniz feneri', fa:'فانوس دریایی'},{word:'harbor', en:'A safe place where boats stay.', tr:'liman', fa:'بندر'},{word:'fishing village', en:'A small village where many people catch fish.', tr:'balıkçı köyü', fa:'روستای ماهیگیری'},{word:'faded', en:'Having lost its bright color over time.', tr:'solmuş', fa:'کم‌رنگ‌شده'},{word:'maintain', en:'To keep something in good condition.', tr:'bakımını yapmak', fa:'نگهداری کردن'},{word:'sailor', en:'A person who works on a ship.', tr:'denizci', fa:'ملوان'},{word:'visibility', en:'How far you can see.', tr:'görüş mesafesi', fa:'میدان دید'},{word:'engineer', en:'A person who designs or repairs machines and buildings.', tr:'mühendis', fa:'مهندس'},{word:'navigation', en:'Finding the correct way to travel.', tr:'navigasyon', fa:'ناوبری'},{word:'symbol', en:'Something that represents an idea or history.', tr:'sembol', fa:'نماد'}],

 funFacts:['Before GPS, lighthouses were one of the most important tools for helping ships travel safely.','Some famous lighthouses have protected sailors for more than 200 years.','Many old lighthouses are now museums or historical landmarks.','Volunteers around the world help restore historical buildings so future generations can enjoy them.'],

{id:'story-A2-Adventure-3', level:'A2', genre:'Adventure', title:{en:'The Mountain Above the Clouds', tr:'Bulutların Üzerindeki Dağ'},
 text:"For as long as she could remember, Sophie had dreamed of climbing Eagle Mountain. It was the highest mountain near her hometown. On clear mornings, people could see its snowy peak from almost every street in the city. Many experienced hikers climbed it every year. But Sophie had never climbed a mountain before.\n\nOne evening during dinner, she looked at her parents. \"I want to climb Eagle Mountain this summer.\" Her father smiled. \"That is a big goal.\" Her mother nodded. \"You'll need to prepare.\" Sophie's grandfather, who had climbed the mountain many years earlier, smiled quietly. \"The mountain doesn't care how old you are. It only cares if you are ready.\"\n\nThe next morning, Grandpa invited Sophie for a walk. Instead of driving to the mountain, they walked through nearby hills. \"You don't begin with the biggest challenge,\" Grandpa explained. \"You begin with small steps.\" Every Saturday, they hiked together. The first walk lasted only one hour. The second was two hours. Later, they climbed steeper hills. Sometimes they carried heavy backpacks. Sometimes they walked in light rain. Sometimes they practiced reading maps. Grandpa taught Sophie many important skills: always tell someone where you're going; carry enough water; never leave trash behind; respect nature. Sophie listened carefully. She wrote everything in a small notebook. After six weeks of training, Grandpa smiled. \"I think you're ready.\"\n\nThe climbing group would leave early on Saturday morning. Besides Sophie and Grandpa, four other hikers joined the trip: Anna, a science teacher; David, a firefighter; Mr. Kim, who had climbed the mountain ten times; and twelve-year-old Liam, who was climbing it for the first time too. Everyone introduced themselves. Mr. Kim smiled. \"Today is not a race. We climb together. No one climbs alone.\" Sophie liked those words.\n\nThe hike began before sunrise. The forest was cool and quiet. Birds were just beginning to sing. Sunlight slowly appeared between the trees. For the first two hours, the trail was easy. Everyone talked and laughed. Anna pointed out different flowers. David showed everyone how to use walking poles correctly. Liam asked hundreds of questions. Grandpa answered each one patiently. Soon the path became steeper. The air felt cooler. The trees became smaller. The group stopped often to drink water.\n\nAround noon, dark clouds covered the sky. A cold wind began to blow. Mr. Kim looked upward. \"We may have rain.\" Everyone quickly put on waterproof jackets. Ten minutes later, rain began to fall. The rocks became slippery. Walking became slower. Liam looked worried. \"I don't know if I can do this.\" Grandpa smiled kindly. \"You don't need to climb the whole mountain. You only need to take the next step.\" David added, \"Then the step after that. And then another.\" Liam nodded. One careful step at a time, the group continued.\n\nBy late afternoon, they reached a small mountain shelter. It was simple but warm. Everyone prepared dinner together. Anna made hot vegetable soup. Grandpa made tea. Outside, the wind became stronger. The hikers sat around a wooden table. Mr. Kim shared stories from his earlier climbs. He told them about mountain goats, beautiful sunrises, and unexpected snowstorms. Sophie listened with excitement. She realized that every climber had faced difficult moments. Nobody reached the top without challenges.\n\nThe next morning, everyone woke before dawn. The sky was clear again. They packed quietly. Only the sound of birds broke the silence. The final part of the climb was the hardest. The trail became narrow. Large rocks covered the ground. The air felt thinner. Sophie became tired. Her legs hurt. She wanted to stop. Grandpa noticed. \"Look behind you.\" She turned around. The view took her breath away. The forest looked tiny. The rivers looked like silver lines. Clouds floated below them. \"We're above the clouds,\" Liam whispered. Everyone smiled.\n\nOne hour later, the group reached the summit. A small wooden sign read: Eagle Mountain, 2,840 meters. Nobody spoke for a moment. The view stretched in every direction. Snow covered distant mountains. Lakes reflected the blue sky. Tiny villages looked like toy houses. Sophie felt proud. Not because she had reached the top. But because she had never given up. Grandpa placed a gentle hand on her shoulder. \"You've earned this view.\"\n\nBefore leaving, everyone signed the visitor's book kept inside a weatherproof box. Sophie wrote: I thought climbing a mountain was about reaching the top. Now I know it's about every step, every lesson, and every person who helps you along the way. Mr. Kim smiled after reading it. \"That's exactly right.\"\n\nThe walk down was much easier. Everyone laughed more. They took photographs. They helped each other across rocky paths. Back in the village, Sophie's parents were waiting. Her mother hugged her tightly. \"We're so proud of you.\"\n\nThat evening, Sophie looked at the mountain from her bedroom window. It was still tall. Still powerful. Still beautiful. But it no longer looked impossible. She opened her notebook and wrote one final sentence. Every big dream begins with one small step—and the courage to take it. She closed the notebook with a smile. She already knew her next adventure was waiting somewhere beyond the horizon.",
 vocab:[{word:'summit', en:'The highest point of a mountain.', tr:'zirve', fa:'قله'},{word:'trail', en:'A path used for walking or hiking.', tr:'patika', fa:'مسیر'},{word:'hiker', en:'A person who walks long distances in nature.', tr:'doğa yürüyüşçüsü', fa:'کوه‌نورد'},{word:'slippery', en:'Easy to slide on because it is wet or smooth.', tr:'kaygan', fa:'لغزنده'},{word:'shelter', en:'A safe place that protects people from weather.', tr:'sığınak', fa:'پناهگاه'},{word:'waterproof', en:'Not damaged by water.', tr:'su geçirmez', fa:'ضدآب'},{word:'steep', en:'Rising sharply.', tr:'dik', fa:'شیب‌دار'},{word:'horizon', en:'The place where the sky seems to meet the land.', tr:'ufuk', fa:'افق'},{word:'breathtaking', en:'Extremely beautiful or impressive.', tr:'nefes kesici', fa:'نفس‌گیر'},{word:'perseverance', en:'Continuing even when something is difficult.', tr:'azim, sebat', fa:'پشتکار'}],

{id:'story-A2-Romance-1', level:'A2', genre:'Romance', title:{en:'The Book Between Us', tr:'Aramızdaki Kitap'},
 text:"When the new school year began, Noah noticed something unusual in the library. Every Tuesday afternoon, the same girl sat at the table by the window. She always arrived exactly at four o'clock. She always carried three books. And she always left before anyone else. Her name was Emma. Noah didn't know much about her. She was in a different class. She wasn't loud. She wasn't quiet either. She simply enjoyed reading.\n\nOne afternoon, Noah accidentally chose the same chair across from her. Emma looked up from her book. \"You can sit here,\" she said with a smile. \"Thanks.\" For the next hour, neither of them spoke. They simply read. When the library closed, Emma stood up. \"See you next Tuesday.\" Noah smiled. \"I guess so.\"\n\nThe following Tuesday, Noah returned. Emma was already there. She looked at the book in his hands. \"You like adventure stories?\" \"They're my favorite.\" Emma laughed. \"Mine too.\" \"What are you reading?\" Noah showed her the cover. Emma smiled. \"I've read that. It's really good. But don't read the last page first.\" \"I never do,\" Noah laughed.\n\nThat afternoon, they talked for almost thirty minutes. They discovered they both loved hiking, old bookstores, photography, and rainy days. When Noah walked home, he realized something. He was already looking forward to next Tuesday.\n\nOver the next few weeks, Tuesday became their favorite day. Sometimes they exchanged books. Sometimes they recommended authors to each other. Other times they simply sat together reading quietly. Neither of them felt uncomfortable with the silence.\n\nOne rainy afternoon, the librarian announced a competition. \"Next month, we are organizing a reading festival. We need volunteers.\" Emma immediately raised her hand. So did Noah. The librarian smiled. \"Wonderful. You'll work together.\"\n\nTheir first task was decorating the library. Emma carefully made colorful signs with famous book quotes. Noah built small wooden stands to display the books. One afternoon, while hanging decorations, Noah accidentally dropped a box of paper stars. Hundreds of stars fell across the floor. Emma laughed so hard that she almost dropped her paintbrush. \"I guess the library has its own night sky now.\" Noah laughed too. Together they picked up every paper star.\n\nAs the festival became closer, they spent more time together. After finishing their work, they often stopped at a small café near the library. Emma always ordered lemon tea. Noah always chose hot chocolate. One evening Emma looked a little worried. \"Everything okay?\" Noah asked. She sighed. \"My family is moving.\" Noah looked surprised. \"Moving?\" \"Yes. But only to another town. It's about forty minutes away.\" \"When?\" \"At the end of summer.\" Noah suddenly felt sad. He hadn't expected that news.\n\nThe reading festival finally arrived. Families filled the library. Children listened to stories. Students recommended books. There were games, quizzes, and writing activities. Everything looked beautiful. Near the entrance stood a large \"Favorite Book\" wall. Visitors wrote the names of books that had changed their lives. Emma looked around proudly. \"We did a good job.\" Noah smiled. \"We really did.\" The librarian thanked all the volunteers. \"This has been our most successful festival.\" Everyone applauded.\n\nLater that afternoon, Noah noticed a small package on one of the tables. It had his name on it. Inside was a bookmark made of wood. Emma had carved a small mountain and an open book into it. On the back she had written: Every good story continues, even after the last page. Noah smiled. He searched for Emma.\n\nHe found her standing outside beneath a large tree. \"I have something for you too.\" He handed her a wrapped book. Inside the cover he had written: For every Tuesday we shared... And for every adventure still waiting. Emma looked up. \"Thank you.\" She carefully hugged the book against her chest.\n\nA few weeks later, Emma moved to her new town. The library felt different without her. Every Tuesday, Noah still visited. Sometimes he sat alone by the window. Sometimes he reread the books they had recommended to each other. Then one afternoon his phone buzzed. It was a message from Emma. Guess what? There's a library in my new town. Would you like to have an online reading club every Tuesday? Noah smiled immediately. I'd love that.\n\nSoon every Tuesday evening, they met through video calls. They discussed new books. Sometimes they laughed about funny characters. Sometimes they disagreed about the ending. Sometimes they simply read together in comfortable silence. Even though they lived in different towns, their friendship continued to grow.\n\nOne year later, Emma visited her old town during the summer holiday. She walked into the library. Noah was already sitting by the window. He looked up. \"You still arrive at four o'clock.\" Emma laughed. \"And you still choose the same chair.\" The librarian smiled as she watched them. Some friendships begin with conversations. Others begin with shared silence.\n\nEmma sat down. She placed three books on the table, just as she had done on the very first day. Noah opened his book. \"So... what are we reading today?\" Emma smiled. \"A new story.\" Outside, the rain began to fall softly against the windows. Inside, another chapter quietly began.",
 vocab:[{word:'exchange', en:'To give something and receive something else.', tr:'değiş tokuş yapmak', fa:'مبادله کردن'},{word:'recommend', en:'To suggest something because it is good.', tr:'tavsiye etmek', fa:'پیشنهاد دادن'},{word:'decorate', en:'To make a place more beautiful.', tr:'süslemek', fa:'تزئین کردن'},{word:'festival', en:'A special event or celebration.', tr:'festival', fa:'جشنواره'},{word:'volunteer', en:'A person who helps without payment.', tr:'gönüllü', fa:'داوطلب'},{word:'bookmark', en:'A small object used to keep your place in a book.', tr:'kitap ayracı', fa:'نشانگر کتاب'},{word:'carve', en:'To cut a design into wood or another material.', tr:'oymak', fa:'حکاکی کردن'},{word:'chapter', en:'One part of a book.', tr:'bölüm', fa:'فصل (کتاب)'},{word:'comfortable', en:'Relaxed and at ease.', tr:'rahat', fa:'راحت'},{word:'relationship', en:'The way two people know and care about each other.', tr:'ilişki', fa:'رابطه'}],

{id:'story-A2-Romance-2', level:'A2', genre:'Romance', title:{en:'Letters Across the Seasons', tr:'Mevsimler Boyunca Mektuplar'},
 text:"Olivia loved writing letters. While most of her friends sent short messages on their phones, Olivia preferred paper, envelopes, and handwritten words. She believed that letters lasted longer than text messages. \"You can read a letter again years later,\" she often said. \"They keep memories alive.\"\n\nOne autumn afternoon, Olivia visited her grandmother. While helping clean an old wooden cupboard, she found a small box tied with a blue ribbon. Inside were dozens of old letters. \"Grandma,\" Olivia asked, \"who wrote these?\" Her grandmother smiled softly. \"Your grandfather. He wrote me one letter every month before we got married.\" Olivia carefully opened one. The handwriting was neat. The paper smelled old. At the end of the letter, her grandfather had written: Distance can change where we live, but it cannot change how much we care. Olivia read several more letters. Each one told a simple story about daily life. But together, they felt like a beautiful book.\n\nThe next week, Olivia shared the story with her best friend, Ethan. They often met after school in the town park. Ethan listened carefully. \"I've never written a letter before.\" \"You should try,\" Olivia said. \"It feels different. It makes you think about every word.\" Ethan laughed. \"I'm not sure anyone would want to receive a letter from me.\" Olivia smiled. \"I would.\"\n\nThat evening, Ethan bought a notebook and some envelopes. He wasn't sure what to write. He started three different letters. He crossed out many sentences. Finally, he wrote: Dear Olivia, today I learned that writing is harder than texting. But maybe that's why letters are special. They take time, and time shows that someone matters.\n\nThe next morning, he quietly placed the envelope inside Olivia's locker. When Olivia found it, she smiled from ear to ear. She wrote a reply that evening. Soon, they had a new tradition. Every Friday, they exchanged one handwritten letter.\n\nAs the weeks passed, the letters became longer. They didn't write only about school. They shared dreams. Favorite books. Funny memories from childhood. Places they wanted to visit. Sometimes they included small drawings. Sometimes they pressed colorful autumn leaves between the pages. One Friday, Ethan wrote: If you could travel anywhere, where would you go? Olivia answered: A small village in Switzerland. I want to wake up and see mountains outside my window. What about you? Ethan replied: Japan during the cherry blossom season. I'd like to walk through streets full of pink flowers. Every letter helped them know each other a little better.\n\nWinter arrived. Snow covered the streets. One Friday afternoon, a heavy snowstorm closed the school early. The buses stopped running. Students hurried home. Olivia looked worried. \"I won't get your letter this week.\" Ethan smiled. \"Wait here.\" He ran across the snowy playground toward the bicycle parking area. Five minutes later, he returned, covered in snow. He handed Olivia a carefully protected envelope inside a plastic folder. \"I didn't want the snow to ruin it.\" Olivia laughed. \"You ran through a snowstorm just to deliver this?\" Ethan smiled. \"It was worth it.\"\n\nSpring arrived with warm sunshine and colorful flowers. The town organized a community festival in the central square. There were music performances, food stands, games, and art exhibitions. Olivia and Ethan volunteered at a booth where children could decorate postcards. A little girl looked at Olivia. \"Who do you write letters to?\" Olivia smiled. \"My friend.\" The little girl thought for a moment. \"My grandma lives far away. I think I'll send her one.\" Olivia handed her a colorful postcard. \"I think she'll love it.\" Ethan smiled quietly. \"It's funny. You inspired someone today.\" Olivia looked at the little girl writing carefully. \"I guess letters can travel farther than we think.\"\n\nAs summer approached, Ethan received exciting news. His father had been offered a new job in another city. The family would move at the end of June. Ethan looked nervous when he told Olivia. \"I didn't know how to tell you.\" Olivia stayed silent for a moment. Then she smiled gently. \"We already know how to stay in touch.\" Ethan laughed. \"You're right. We've been practicing all year.\"\n\nOn Ethan's last day in town, they met beneath the large oak tree in the park. It was the same place where they had talked so many afternoons. Olivia handed him a small gift. It was a leather notebook. The first page was blank except for one sentence. Every new place becomes home when someone writes to you. Ethan smiled. \"I'll fill every page.\" \"I know you will,\" Olivia replied. He reached into his backpack. \"I have something for you too.\" He handed her a wooden box. Inside were all the letters Olivia had written during the year. \"I made copies of mine. But these belong to you.\" Olivia carefully held the box. \"I'll keep them forever.\"\n\nMonths passed. Autumn returned once again. Every Friday, a letter arrived. Sometimes it included photographs of Ethan's new city. Sometimes Olivia sent sketches of places around her town. One Friday, Ethan wrote: I've met many new people here. But whenever I write to you, it still feels like I'm sitting under the old oak tree. Olivia smiled as she folded the letter. She looked outside. Golden leaves floated gently through the air.\n\nHer grandmother sat beside her. \"Another letter?\" Olivia nodded. Her grandmother smiled. \"Your grandfather always said something.\" \"What did he say?\" \"He said... the best relationships are not measured by how often people meet. They are measured by how much they care.\"\n\nOlivia carefully placed Ethan's newest letter into the wooden box. The seasons had changed. The town had changed. Life had changed. But some traditions were too meaningful to lose. Every Friday, a new letter arrived. And with every letter, their story quietly continued.",
 vocab:[{word:'envelope', en:'A paper cover used to send a letter.', tr:'zarf', fa:'پاکت نامه'},{word:'handwriting', en:'The way someone writes by hand.', tr:'el yazısı', fa:'دست‌خط'},{word:'tradition', en:'Something people do regularly over time.', tr:'gelenek', fa:'سنت'},{word:'pressed leaf', en:'A dried leaf kept flat inside a book.', tr:'preslenmiş yaprak', fa:'برگ خشک‌شده'},{word:'postcard', en:'A card with a picture, sent without an envelope.', tr:'kartpostal', fa:'کارت پستال'},{word:'community', en:'People living in the same area.', tr:'topluluk', fa:'جامعه'},{word:'inspire', en:'To encourage someone to do something.', tr:'ilham vermek', fa:'الهام بخشیدن'},{word:'leather', en:'Strong material made from animal skin.', tr:'deri', fa:'چرم'},{word:'meaningful', en:'Important and full of value.', tr:'anlamlı', fa:'معنادار'},{word:'measure', en:'To judge or compare something.', tr:'ölçmek', fa:'سنجیدن'}],

{id:'story-A2-Romance-3', level:'A2', genre:'Romance', title:{en:'The Music Under the Stars', tr:'Yıldızların Altında Müzik'},
 text:"Every Friday evening during the summer, the town park became full of music. Families spread blankets on the grass. Children played near the fountain. Food trucks sold fresh sandwiches, lemonade, and ice cream. As the sun slowly disappeared, local musicians performed on a small wooden stage. For Mia, these concerts were the best part of summer. She never missed one.\n\nThis year, however, was different. The town announced a special event. Young musicians could perform before the main concert. Mia had played the violin since she was eight years old. Her teacher encouraged her to join. \"You play beautifully,\" Mrs. Harris said. \"But music is not only about perfect notes. It's about sharing a feeling.\" Mia nodded. She wanted to perform. But she was afraid of standing in front of hundreds of people.\n\nOne afternoon, while practicing in the park, Mia noticed someone sitting on a nearby bench. A boy around her age was sketching in a notebook. Every few minutes, he looked up at the trees before drawing again. When Mia finished playing, the boy smiled. \"That was beautiful.\" \"Thank you,\" Mia replied. \"I'm Leo.\" \"I'm Mia.\" Leo showed her his notebook. Inside were detailed pencil drawings of birds, flowers, musicians, and people walking through the park. \"These are amazing,\" Mia said. Leo smiled. \"I like drawing people when they don't know I'm watching.\" Mia laughed. \"I hope I looked okay.\" \"You looked happy.\"\n\nOver the next few weeks, Mia and Leo met every Friday before the concerts. While Mia practiced her violin, Leo sketched nearby. Sometimes they talked. Sometimes they sat quietly, enjoying the evening breeze. One day Leo asked, \"Why do you always stop playing after fifteen minutes?\" Mia looked down. \"I'm practicing for the concert. But every time I imagine the audience, I get nervous.\" Leo closed his notebook. \"Can I tell you something? When I started drawing, I was afraid too.\" \"Afraid people would laugh?\" \"Exactly.\" \"So what changed?\" Leo smiled. \"I realized something. If one person smiles because of my drawing, that's enough.\" Mia thought about those words all evening.\n\nThe concert was only two weeks away. Mrs. Harris organized a rehearsal for all the young musicians. When Mia walked onto the empty stage, her hands began to shake. She played the first few notes, then stopped. \"I'm sorry. I can't.\" Mrs. Harris walked over kindly. \"Look at the empty chairs. What do you see?\" \"Nothing.\" \"Exactly. Now imagine every chair belongs to someone who hopes your music will make them happy. They're not waiting for perfection. They're waiting for a feeling.\" Mia took a deep breath. This time she played the entire song. When she finished, everyone applauded.\n\nThe evening before the concert, Leo handed Mia a folded piece of paper. \"Don't open it until tomorrow.\" \"What is it?\" \"You'll see.\" Mia smiled. \"Okay.\"\n\nThe park was more crowded than ever. Colorful lights hung between the trees. The stage looked beautiful under the evening sky. Dozens of families filled the grass. Children laughed near the fountain. Food filled the air with wonderful smells. Backstage, Mia felt her heart beating faster. She remembered the folded paper. She opened it carefully. Inside was a drawing. Leo had sketched her playing the violin beneath a sky full of stars. At the bottom he had written: The stars don't worry about shining perfectly. They simply shine. Mia smiled. Her hands became steady.\n\nThe announcer called her name. \"Ladies and gentlemen... please welcome Mia Carter.\" She walked onto the stage. For one second, she wanted to run away. Then she remembered Leo's drawing. She remembered Mrs. Harris's words. She remembered why she loved music. She closed her eyes. The first note floated into the warm evening air. The park became completely quiet. Every note sounded clear and gentle. The music told a story. Some people smiled. Some closed their eyes. A little girl quietly held her mother's hand. When the final note faded away, there was a moment of complete silence. Then the audience stood up and applauded. Mia could hardly believe it. She had done it.\n\nAfter the concert, Leo found her near the fountain. \"You were incredible.\" \"I wasn't perfect.\" Leo laughed. \"I know. That's why it felt real.\" Mrs. Harris joined them. \"I'm proud of you. You didn't just play music. You shared your heart.\" Mia smiled. \"I think I finally understand.\"\n\nAs summer continued, Mia and Leo kept meeting every Friday. Sometimes Mia played while Leo drew. Other times they explored art museums or visited the old bookstore downtown. One evening, Leo surprised Mia. He had entered one of his drawings into the town's annual art exhibition. \"What made you do it?\" Mia asked. Leo smiled. \"You. You were brave enough to stand on a stage. I figured I could hang one drawing on a wall.\" A week later, they visited the exhibition together. Leo's drawing of the summer concert won second prize. Mia laughed happily. \"So... we both conquered our fears this summer.\" \"I guess we did.\"\n\nOn the final Friday of summer, the park held one last concert. After the music ended, people lay on the grass watching the stars appear. Leo looked up. \"Do you remember what I wrote?\" Mia smiled. \"The stars don't worry about shining perfectly. They simply shine.\" Leo nodded. \"I think people should do the same.\" Mia looked across the peaceful park. Music still echoed softly in the distance. Children laughed. Families talked. The stars quietly filled the sky. She realized something. The best moments in life are rarely perfect. They are simply honest. She picked up her violin. \"One more song?\" Leo smiled. \"I'd like that.\" As the music floated into the warm summer night, the stars seemed to sparkle just a little brighter.",
 vocab:[{word:'perform', en:'To play music, act, or entertain people.', tr:'performans sergilemek', fa:'اجرا کردن'},{word:'rehearsal', en:'Practice before a performance.', tr:'prova', fa:'تمرین (اجرا)'},{word:'audience', en:'The people watching a performance.', tr:'seyirci', fa:'تماشاگران'},{word:'sketch', en:'A quick drawing.', tr:'eskiz', fa:'طرح'},{word:'stage', en:'The place where performers stand.', tr:'sahne', fa:'صحنه'},{word:'applause', en:'Clapping to show appreciation.', tr:'alkış', fa:'تشویق'},{word:'steady', en:'Calm and not shaking.', tr:'sabit, sakin', fa:'آرام و ثابت'},{word:'exhibition', en:'A public display of artwork.', tr:'sergi', fa:'نمایشگاه'},{word:'conquer', en:'To successfully overcome something difficult.', tr:'üstesinden gelmek', fa:'غلبه کردن بر'},{word:'sparkle', en:'To shine with small flashes of light.', tr:'parıldamak', fa:'درخشیدن'}],

 grammarFocus:[{point:'Simple Past and Past Continuous', example:'Leo was sketching when Mia finished playing.'},{point:'Present Perfect (review): She has become more confident.', example:'She has become more confident.'},{point:'Infinitives: to perform, to practice, to share', example:'She wanted to perform for the audience.'},{point:'Comparatives: more confident, brighter', example:'The stars seemed to sparkle a little brighter.'},{point:'Time expressions: the evening before, after the concert, by the end of summer', example:'The evening before the concert, Leo gave her a drawing.'}],
 discussionQuestions:['Have you ever been nervous before speaking or performing in front of others?','Do you enjoy music, drawing, or another creative hobby?','What helps you become more confident when trying something new?'],
 writingPractice:{prompt:'Write 8-10 sentences about a talent or hobby you have. You can answer: What is your hobby? How did you learn it? What do you enjoy most about it? Have you ever shared it with other people? What would you like to improve?'},
 funFacts:["Many friendships and relationships grow stronger when people encourage each other's dreams.",'Music can express emotions even when words are difficult to find.','Artists and musicians often become more confident by practicing and sharing their work with others.','Supporting someone during a difficult moment can create lasting memories.'],
 message:{en:'Real confidence does not come from being perfect—it comes from having the courage to share your true self. The best relationships are built on encouragement, trust, and helping each other grow into the people we want to become.'}},

{id:'story-A2-Thriller-1', level:'A2', genre:'Thriller', title:{en:'The Train That Never Appeared', tr:'Hiç Görünmeyen Tren'},
 text:"Nathan had lived in the town of Ashwood for almost ten years. It was a quiet place with small cafés, friendly neighbors, and an old train station that was over one hundred years old. Most trains arrived exactly on time. People trusted the station clock more than their watches.\n\nBut every October, something unusual happened. People talked about Train 47. According to an old local story, Train 47 appeared once every year on the same foggy evening. The strange part was that it never stopped at the station. It simply passed through without slowing down. No one could explain why. Some people believed it was only a legend. Others said they had seen it with their own eyes.\n\nNathan loved solving mysteries. When he heard the story, he decided to discover the truth. One Friday afternoon, Nathan visited the town library. Mrs. Brooks, the librarian, smiled as he walked in. \"Looking for another mystery?\" Nathan laughed. \"You know me too well. I'm searching for information about Train 47.\" Mrs. Brooks became quiet. \"I wondered when someone would ask.\" She walked toward a shelf filled with old newspapers. After several minutes, she placed a thick folder on the table. \"These articles are more than fifty years old.\"\n\nNathan carefully opened the folder. The first newspaper headline read: UNSCHEDULED TRAIN SEEN DURING HEAVY FOG. Another article from twelve years later said: MYSTERIOUS LOCOMOTIVE RETURNS AGAIN. Every report described the same thing. A train. Heavy fog. No passengers visible through the windows. No stop at the station. Nathan frowned. \"This can't be a coincidence.\"\n\nThat evening, Nathan met his friends Lily and Adam. He showed them the newspaper articles. Adam looked excited. \"We have to see it.\" Lily wasn't so sure. \"What if it's dangerous?\" Nathan smiled. \"We'll stay on the platform. We're only watching.\" They agreed to meet the following Friday. According to the old reports, that was the exact night Train 47 usually appeared.\n\nFriday evening arrived. A thick fog covered the streets. The station looked almost empty. Only the station master, Mr. Wilson, sat inside his office. Nathan looked at the large clock. 7:58 p.m. The articles all mentioned 8:00 p.m. Two minutes later, the station became strangely quiet. Even the birds stopped singing. Adam whispered, \"Do you hear that?\" Far away, they heard the sound of a train whistle. Slowly, the sound became louder. The rails began to vibrate beneath their feet. Then, through the fog, a bright headlight appeared. A long silver train rushed past the station. It was moving fast. Much faster than the normal trains. Nathan tried to read the number on the side. For one second, he saw it clearly. 47. Then it disappeared into the fog. The whole event lasted less than fifteen seconds. Lily looked amazed. \"So... it really exists.\"\n\nThe next morning, Nathan returned to the station. Mr. Wilson was sweeping the platform. Nathan walked over. \"Excuse me. Can I ask you something?\" The old station master smiled. \"You saw Train 47.\" Nathan looked surprised. \"How did you know?\" Mr. Wilson laughed. \"Everyone who sees it has the same expression.\" Nathan asked, \"What is it?\" Mr. Wilson pointed toward a small building beside the station. \"Come with me.\"\n\nInside was a room filled with old railway equipment. Maps covered the walls. There were black-and-white photographs everywhere. Mr. Wilson opened a dusty book. \"Train 47 was a railway inspection train. It traveled across the country checking the tracks. It never carried passengers.\" Nathan looked confused. \"But why isn't it on the schedule?\" Mr. Wilson smiled. \"Because it hasn't existed for many years.\"\n\nNathan became even more curious. \"What happened?\" Mr. Wilson showed him another photograph. \"The railway company changed the routes thirty years ago. The inspection train was retired.\" \"So what did we see?\" Mr. Wilson shrugged. \"I think people enjoy mysteries. But there may be another explanation.\" He unfolded a modern railway map. \"The old tracks still exist. They're hidden behind the forest. Sometimes a maintenance train uses them. It passes here only once a year. The fog makes it look mysterious.\" Nathan studied the map carefully. Everything suddenly made sense.\n\nThe following weekend, Nathan, Lily, and Adam followed one of the old walking paths through the forest. After nearly an hour, they found the forgotten railway line. The tracks were rusty in some places but still usable. Beside them stood a small sign: Railway Maintenance Route, Authorized Vehicles Only. Adam smiled. \"So Train 47 wasn't a ghost.\" Lily laughed. \"It was just very well hidden.\" Nathan nodded. \"The mystery wasn't magic. It was history.\"\n\nA month later, the town museum opened a new exhibition about the old railway. Nathan donated copies of the newspaper articles. Mr. Wilson donated several old photographs. Visitors loved learning the real story. Many children asked questions about trains. Some wanted to become engineers. Some wanted to become historians.\n\nAs Nathan looked around the exhibition, he smiled. The mystery had not disappeared. It had simply changed. Instead of asking, \"Was Train 47 real?\" People now asked, \"What other forgotten stories are waiting to be discovered?\" Nathan realized something. Sometimes the most exciting mysteries do not end when we find the answer. They simply lead us to a new question.\n\nAs he left the museum, he looked toward the railway one last time. The tracks disappeared into the trees. Quiet. Peaceful. Still full of stories.",

{id:'story-A2-Thriller-2', level:'A2', genre:'Thriller', title:{en:'The Key in Locker 214', tr:'214 Numaralı Dolaptaki Anahtar'},
 text:"Emily had attended Westbridge High School for only three weeks. Everything was still new. She was learning the teachers' names, finding her classrooms, and making new friends.\n\nOne rainy Monday morning, she arrived early. The hallways were almost empty. As she walked toward her locker, she noticed something shining on the floor. It was a small silver key. Attached to it was a faded paper tag. On the tag, someone had written: Locker 214. Emily looked around. There was no one nearby. She picked up the key. \"I'll give it to the office later,\" she thought. But first, she wanted to see where Locker 214 was.\n\nLocker 214 was at the end of the second-floor hallway. It looked older than the other lockers. There were scratches on the blue paint, and a small sticker with a mountain was peeling off. Emily tried the key. Click. The locker opened. Inside, there were no books. Instead, she found only three things: an old notebook, a small compass, and a folded piece of paper. The note simply said: \"If you found this, follow the clues—but don't rush.\" Emily smiled. \"This must be some kind of game.\"\n\nJust then, her classmate Ben walked by. \"What are you doing?\" Emily showed him the note. Ben laughed. \"Now I'm curious too.\" The notebook contained short riddles. The first one read: \"Knowledge sleeps where stories never end.\" Ben thought for a moment. \"The library!\" They hurried there after school. Inside one of the history books, they found another note. It read: \"The next clue waits where time is always watched.\" Emily looked puzzled. \"The clock tower?\" Ben shook his head. \"No... maybe the main hallway clock.\" Behind the large school clock, they discovered a tiny envelope. Inside was another clue. Both friends laughed. \"This is getting interesting.\"\n\nFor the next few days, Emily and Ben solved one clue after another. One led them to the music room. Another pointed toward the science laboratory. The last clue brought them to the school garden. Hidden beneath a loose stone was a small wooden box. Emily carefully opened it. Inside was an old photograph of four teenagers. There was also a letter.\n\nThe letter explained everything. Twenty years earlier, four best friends had studied at Westbridge High. Before graduating, they created a treasure hunt around the school. Their goal was simple. They wanted future students to explore the school, solve problems together, and make new friends. At the end of the letter, it said: \"If you're reading this, our game is still alive. Please continue it for the next generation.\" Emily smiled. \"I love this.\" Ben nodded. \"It wasn't really about the treasure. It was about the adventure.\"\n\nThe next week, Emily and Ben met with the school principal. They showed him the notebook and the letter. The principal smiled as soon as he saw the old photograph. \"I remember these students. They graduated before I became principal.\" He laughed. \"I never knew they left a secret game behind.\" He asked, \"Would you like to create new clues for next year's students?\" Emily and Ben looked at each other. \"Absolutely.\"\n\nFor the next month, they wrote new riddles and carefully hid clues around the school—with the principal's permission. On the first page of the notebook, Emily added one sentence: \"Every mystery begins with curiosity, but the best adventures end with friendship.\" Every September after that, new students found the silver key. And every year, a new adventure quietly began.",

{id:'story-A2-Thriller-3', level:'A2', genre:'Thriller', title:{en:'The Voice on Channel Seven', tr:'Yedinci Kanaldaki Ses'},
 text:"Ryan loved old electronics. While his friends collected football cards or video games, Ryan collected old radios. One Saturday, he visited a neighborhood flea market with his uncle. On a small table, he noticed an old portable radio covered in dust. \"Does it still work?\" Ryan asked. The seller smiled. \"I'm not sure. It belonged to my grandfather.\" Ryan bought it for a low price and took it home.\n\nThat evening, he cleaned the radio and put in new batteries. At first, it made only static. Then he slowly turned the dial. Music... news... weather... Suddenly, a clear voice appeared. \"If anyone can hear this... please check the old oak tree behind the train station.\" The message repeated once and then disappeared. Ryan frowned. \"That was strange.\" His cousin Mia was visiting. She heard the message too. \"So... did we really hear that?\" Ryan nodded. \"I think we should find out.\"\n\nThe next morning, they rode their bicycles to the old train station. Behind it stood a huge oak tree. The ground looked normal, but Mia noticed a loose stone near the roots. \"Help me move this.\" Together they lifted the stone. Under it was a small metal box. Inside they found an old memory card and a handwritten note. The note read: \"For the person who finds this: please give these recordings to the town museum.\"\n\nRyan and Mia visited the museum that afternoon. The museum director carefully examined the memory card. His face lit up. \"I can't believe this!\" \"What is it?\" Ryan asked. The director smiled. \"These are interviews with people who built our town's first railway. We thought these recordings had been lost forever. They are an important part of our history.\" \"But... what about the radio message?\" Mia asked. The director laughed. \"A local history club recorded that message years ago. They hid the box as part of a community history project. The radio must have picked up the old recording.\" Ryan smiled. \"So it wasn't a secret spy message.\" \"No,\" the director said. \"But it helped recover something valuable.\"\n\nA week later, the museum opened a small exhibition using the recovered recordings. Visitors listened to the voices of people who had lived many years before. Ryan and Mia were invited to the opening ceremony. The director thanked them in front of everyone. \"You proved that curiosity can protect history.\"\n\nAs they left the museum, Ryan looked at the old radio in his backpack. \"It still has a few mysteries left,\" he said. Mia smiled. \"Then let's keep listening.\"",

{id:'story-A2-Documentary-1', level:'A2', genre:'Documentary', title:{en:'The Return of the Wolves', tr:'Kurtların Dönüşü'},
 text:"Many years ago, Gray Valley National Park was full of wildlife. Deer, foxes, rabbits, and wolves all lived there. The animals kept the forest healthy. However, over time, people became afraid of wolves. Little by little, the wolves disappeared from the park. At first, people thought this was good news. But after a few years, unexpected problems began.\n\nWithout wolves, the number of deer increased quickly. There were too many deer in the park. They ate young trees, flowers, and small plants. Soon, many parts of the forest became empty. Birds had fewer places to build nests. Beavers could not find enough trees to build their homes. Even small insects began to disappear. Scientists realized that removing one animal had changed the whole ecosystem.\n\nAfter many years of research, the park decided to bring wolves back. Some people were worried. They thought the wolves would be dangerous. The scientists explained that wolves usually avoid humans. Their job was to keep nature balanced. In the spring, several wolves were carefully released into the park. Each wolf wore a GPS collar. The collars helped scientists follow their movements without disturbing them.\n\nDuring the first year, the wolves hunted mainly deer. As the number of deer slowly decreased, something surprising happened. Young trees began to grow again. Grass became greener. Wildflowers returned. More birds built nests in the forest. Beavers came back and built dams along the rivers. The rivers even changed shape because plants helped keep the soil in place. Nature slowly repaired itself.\n\nFive years later, Gray Valley looked completely different. Tourists visited the park to see its beautiful forests and wildlife. Local guides taught visitors about the importance of every animal. People learned that even animals they feared had an important role in nature. The wolves were no longer seen as monsters. They became a symbol of balance and healthy forests.\n\nOne scientist said, \"Nature works like a puzzle. If one important piece is missing, the whole picture changes.\"\n\nToday, schools often visit Gray Valley National Park. Children learn that protecting nature means protecting every part of it—not only the animals people like the most.",

{id:'story-A2-Documentary-2', level:'A2', genre:'Documentary', title:{en:'The City That Planted One Million Trees', tr:'Bir Milyon Ağaç Diken Şehir'},
 text:"Ten years ago, the city of Greenfield looked very different. There were many roads, buildings, and parking lots, but there were not enough trees. During the summer, the streets became extremely hot. The air was polluted because of traffic. Many people stayed indoors because the parks were small and there was little shade.\n\nThe city council decided something had to change. They started a project called \"One Million Trees.\" Their goal was simple: plant one million trees in ten years. At first, many people did not believe the project would succeed. \"One million trees?\" one shop owner said. \"That's impossible.\" However, volunteers quickly joined the project. Schools planted trees in playgrounds. Families planted trees in their gardens. Businesses donated money and equipment. Every spring and autumn, hundreds of people worked together in parks and empty spaces. Even young children helped carry water for the new trees.\n\nThe city also worked with environmental experts. The experts explained that not every tree could grow in every place. Some trees needed more water. Others grew better in dry areas. The city chose different kinds of trees for different neighborhoods. This helped the trees stay healthy for many years. Each newly planted tree received a small label with the planting date and the name of the volunteer who planted it. Many families returned every year to see how \"their\" tree was growing.\n\nAfter five years, people began to notice big changes. The streets felt cooler during hot weather. More birds built nests in the trees. Butterflies and bees became easier to find in parks. People walked and rode bicycles more often because the streets were more comfortable. Doctors even reported that some residents spent more time exercising outdoors. The project was improving both nature and people's daily lives.\n\nFinally, ten years after the project began, the city planted its one millionth tree. A large celebration took place in the central park. The mayor gave a short speech. \"This project was never only about trees,\" she said. \"It was about working together. It was about creating a healthier future.\" A twelve-year-old student planted the final tree with her grandfather. Everyone applauded. The moment was shared on television and social media.\n\nSoon, other cities became interested in the project. They contacted Greenfield to learn how they could start similar programs. Today, Greenfield is known as one of the greenest cities in the country. Visitors enjoy its beautiful parks, clean air, and peaceful streets. One visitor wrote in a travel book: \"The best time to plant a tree was years ago. The second-best time is today.\"\n\nThe people of Greenfield smiled when they read those words. They knew their city had changed because thousands of ordinary people decided to do one small thing together.",

{id:'story-A2-Documentary-3', level:'A2', genre:'Documentary', title:{en:'The School Built from Plastic Bottles', tr:'Plastik Şişelerden Yapılan Okul'},
 text:"In a small village near the coast, there was only one school. The building was very old. When it rained, water came through the roof. Some classrooms became too hot during summer and too cold during winter. The teachers wanted a better school, but building a new one was expensive.\n\nOne day, an engineer named Sofia visited the village. She had worked on environmental projects in different countries. She had an unusual idea. \"What if we build the new school using plastic bottles?\" At first, everyone was surprised. \"A school made of bottles?\" one parent asked. \"Is that safe?\" Sofia smiled. \"Yes. The bottles will be filled with sand and packed tightly. They can become very strong building blocks.\"\n\nThe whole village decided to help. Families collected empty plastic bottles from their homes. Restaurants and cafés saved bottles instead of throwing them away. Students cleaned the bottles and filled them with dry sand. It took several weeks to prepare thousands of bottles. Soon, large piles of bottles were ready for construction. Builders placed the bottles inside strong metal frames and covered them with cement. Little by little, the walls began to rise. Children watched the school grow every day.\n\nAfter several months, the new school was finished. The classrooms were bright and comfortable. The thick bottle walls helped keep the rooms cool during summer and warm during winter. Large windows let in plenty of natural light. Solar panels on the roof produced electricity for the classrooms. Rainwater was collected in special tanks and used to water the school garden. The building was not only beautiful—it was also environmentally friendly.\n\nWhen the school opened, visitors came from many different towns. They wanted to see the unusual building. Some engineers took notes. Teachers asked questions. Students proudly showed visitors around the classrooms. One reporter asked a young student, \"What is your favorite part of the new school?\" The girl smiled. \"I like knowing that we turned trash into something useful.\"\n\nThe project became famous across the country. Other villages started building libraries, community centers, and small health clinics using the same idea. People realized that recycling could solve more than one problem. It reduced plastic waste and created useful buildings at the same time.\n\nSofia visited the village one year later. The trees around the school had grown taller. Children were studying happily inside their classrooms. She smiled and said, \"The strongest buildings are not always made from expensive materials. Sometimes they are built with creative ideas and people who work together.\"\n\nThe students applauded. They knew they had learned something more important than any lesson in a textbook. They had learned that even small actions—like saving a plastic bottle—could help build a better future.",
 vocab:[{word:'recycle', en:'To use something again instead of throwing it away.', tr:'geri dönüştürmek', fa:'بازیافت کردن'},{word:'engineer', en:'A person who designs and builds things.', tr:'mühendis', fa:'مهندس'},{word:'construction', en:'The process of building something.', tr:'inşaat', fa:'ساخت‌وساز'},{word:'cement', en:'A material used to make buildings strong.', tr:'çimento', fa:'سیمان'},{word:'solar panel', en:'A device that changes sunlight into electricity.', tr:'güneş paneli', fa:'پنل خورشیدی'},{word:'electricity', en:'Power used to operate lights and machines.', tr:'elektrik', fa:'برق'},{word:'rainwater', en:'Water that comes from rain.', tr:'yağmur suyu', fa:'آب باران'},{word:'environmentally friendly', en:'Not harmful to nature.', tr:'çevre dostu', fa:'سازگار با محیط زیست'},{word:'waste', en:'Materials that are thrown away.', tr:'atık', fa:'زباله'},{word:'creative', en:'Using new and original ideas.', tr:'yaratıcı', fa:'خلاق'}],

 message:{en:'A better future is built through creativity, teamwork, and respect for the environment. When people work together and think differently, even everyday waste can become something valuable.'}}

{id:'story-B1-Fiction-1', level:'B1', genre:'Fiction', title:{en:"The Clockmaker's Journal", tr:'Saatçinin Günlüğü'},
 text:"Oliver had always been fascinated by old clocks. While other children spent their weekends playing football or video games, Oliver often visited antique shops with his grandfather. His grandfather was a retired clockmaker who believed that every clock had its own story. \"A clock doesn't only tell time,\" he often said. \"It remembers the people who lived with it.\"\n\nAfter his grandfather passed away, Oliver inherited his small workshop on the edge of town. Inside, hundreds of clocks covered the walls. Some were large enough to stand on the floor, while others were small enough to fit in a pocket. Although Oliver worked as a graphic designer during the day, he spent every evening repairing old clocks.\n\nOne rainy Saturday, he found a hidden drawer inside an old wooden cabinet. Inside the drawer lay a worn leather journal. On the first page were the words: \"To the person who loves this workshop as much as I did...\" Oliver immediately recognized his grandfather's handwriting.\n\nThe journal was unlike anything he had expected. Instead of repair notes, it contained stories about the people who had owned the clocks. One chapter described a sailor who carried a small pocket watch across the Atlantic Ocean. Another told the story of a teacher whose classroom clock had stopped at the exact moment her students celebrated the end of World War II. Oliver wondered whether the stories were true or simply his grandfather's imagination. Still, he couldn't stop reading.\n\nSeveral pages near the end of the journal were empty. Only one sentence appeared at the top: \"The final story has not been written yet.\" Oliver smiled. \"What does that mean?\"\n\nThe next morning, an elderly woman entered the workshop carrying a dusty wall clock. \"It belonged to my parents,\" she explained. \"It hasn't worked for twenty years.\" Oliver carefully opened the clock. While examining the gears, he discovered a folded photograph hidden inside. The picture showed a young couple standing in front of the workshop nearly fifty years earlier. On the back someone had written: \"Thank you for giving us more time.\" Oliver looked at the woman. \"Were these your parents?\" She nodded. \"My father brought this clock here before he asked my mother to marry him. He said your grandfather repaired it for free because he knew they couldn't afford it.\" Oliver smiled quietly. His grandfather had never mentioned that story.\n\nInspired by the journal, Oliver decided to ask customers about the history behind their clocks. Every repair became more than a job. One man brought a clock that had survived a house fire. A young woman carried a broken alarm clock that had belonged to her grandmother. A little boy arrived with a tiny music box that no longer played. Each object carried memories that were just as valuable as the object itself. Oliver began writing every story in the empty pages of the journal. Slowly, the final chapter started to grow.\n\nMonths later, the town museum announced an exhibition called \"Objects That Tell Stories.\" Oliver was invited to display several repaired clocks along with the journal. Visitors didn't only admire the beautiful clocks. They stopped to read the stories beside them. Some smiled. Others wiped away tears. Many began sharing stories about objects in their own homes. The exhibition became far more popular than anyone expected.\n\nOn the final evening, a young boy approached Oliver. \"My grandfather has an old watch,\" he said. \"It doesn't work anymore. Can you fix it?\" Oliver smiled. \"I'll try.\" The boy hesitated. \"My grandfather says the watch reminds him of his father.\" Oliver looked at the journal in his hands. For the first time, he truly understood his grandfather's words. A clock didn't simply measure time. It measured memories.\n\nThat night, Oliver returned to the workshop. He opened the journal to the last page and wrote: \"Every object tells two stories: the one it has lived... and the one we choose to remember.\" He gently closed the journal. The workshop was quiet except for the soft ticking of dozens of clocks. For Oliver, it no longer sounded like time passing. It sounded like hundreds of lives continuing, one second at a time.",
 vocab:[{word:'fascinated', en:'Very interested in something.', tr:'büyülenmiş, çok ilgili', fa:'مجذوب'},{word:'antique', en:'Old and valuable because of its age.', tr:'antika', fa:'عتیقه'},{word:'inherit', en:'To receive something after someone dies.', tr:'miras almak', fa:'به ارث بردن'},{word:'workshop', en:'A place where things are repaired or made.', tr:'atölye', fa:'کارگاه'},{word:'examine', en:'To look at something carefully.', tr:'incelemek', fa:'بررسی کردن'},{word:'gears', en:'The moving parts inside a machine or clock.', tr:'dişliler', fa:'چرخ‌دنده‌ها'},{word:'exhibition', en:'A public display of objects or art.', tr:'sergi', fa:'نمایشگاه'},{word:'memory', en:'Something remembered from the past.', tr:'anı', fa:'خاطره'},{word:'valuable', en:'Important or worth a lot.', tr:'değerli', fa:'باارزش'},{word:'hesitate', en:'To pause because you are unsure.', tr:'tereddüt etmek', fa:'مردد بودن'},{word:'repair', en:'To fix something that is broken.', tr:'tamir etmek', fa:'تعمیر کردن'},{word:'remind', en:'To make someone remember something.', tr:'hatırlatmak', fa:'یادآوری کردن'}],

 writingPractice:{prompt:'Write 10-12 sentences about an object that is important to you. Include: What the object is. Who gave it to you. Why it is meaningful. What memories it brings back.'},
