<meta charset="UTF-8">
<title>Farin English</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farin English">
<style>
  :root{
    --bg:#fdfbf8; --bg-elevated:#ffffff; --bg-sunken:#f0efe9;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#7c5cfc; --cat-diag-soft:#ece5ff;
    --cat-gram:#ff9500; --cat-gram-soft:#ffedd1;
    --cat-voc:#00bfa6; --cat-voc-soft:#d6f5ef;
    --cat-lis:#ff3d8f; --cat-lis-soft:#ffe1ef;
    --cat-story:#4c6fff; --cat-story-soft:#e5eaff;
    --cat-review:#ffc22e; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    --shadow:0 1px 2px rgba(20,51,46,.08), 0 8px 24px -12px rgba(20,51,46,.22);
    --glow-badge:0 0 0 2px rgba(46,204,113,.55), 0 0 30px 4px rgba(46,204,113,.55);
    --radius:20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
      --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
      --border:#2b433d; --border-soft:#203330;
      --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
      --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
      --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
      --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
      --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
      --cat-story:#7c93ff; --cat-story-soft:#232a4a;
      --cat-review:#ffd83d; --cat-review-soft:#3a3012;
      --success:#4ade80; --success-soft:#1c3a28;
      --error:#ff6b6b; --error-soft:#3d2420;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --glow-badge:0 0 0 2px rgba(74,222,128,.5), 0 0 30px 4px rgba(74,222,128,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
    --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
    --border:#2b433d; --border-soft:#203330;
    --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
    --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
    --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
    --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
    --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
    --cat-story:#7c93ff; --cat-story-soft:#232a4a;
    --cat-review:#ffd83d; --cat-review-soft:#3a3012;
    --success:#4ade80; --success-soft:#1c3a28;
    --error:#ff6b6b; --error-soft:#3d2420;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#fdfbf8; --bg-elevated:#ffffff; --bg-sunken:#f0efe9;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#7c5cfc; --cat-diag-soft:#ece5ff;
    --cat-gram:#ff9500; --cat-gram-soft:#ffedd1;
    --cat-voc:#00bfa6; --cat-voc-soft:#d6f5ef;
    --cat-lis:#ff3d8f; --cat-lis-soft:#ffe1ef;
    --cat-story:#4c6fff; --cat-story-soft:#e5eaff;
    --cat-review:#ffc22e; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px;}
  @media (min-width:481px){
    body{background:var(--bg-sunken);}
    #app{min-height:100dvh; box-shadow:var(--shadow); border-left:1px solid var(--border); border-right:1px solid var(--border);}
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font:inherit; cursor:pointer;}
  input{font:inherit;}
  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  .heart-wrap{position:relative; display:inline-flex; vertical-align:-3px;}
  .heart-pulse{display:inline-flex; animation:heart-beat 1.7s ease-in-out infinite;}
  @keyframes heart-beat{0%,100%{transform:scale(1);} 50%{transform:scale(1.18);}}
  .sparkle{position:absolute; width:7px; height:7px; background:currentColor; clip-path:polygon(50% 0%,61% 35%,100% 50%,61% 65%,50% 100%,39% 65%,0% 50%,39% 35%); opacity:0; animation:sparkle-twinkle 1.8s ease-in-out infinite;}
  .sparkle-1{top:-6px; right:-8px; animation-delay:0s;}
  .sparkle-2{bottom:-4px; left:-9px; width:5px; height:5px; animation-delay:.6s;}
  .sparkle-3{top:1px; right:13px; width:5px; height:5px; animation-delay:1.2s;}
  @keyframes sparkle-twinkle{0%,100%{opacity:0; transform:scale(0) rotate(0deg);} 50%{opacity:1; transform:scale(1) rotate(25deg);}}

  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);}
  .display{font-weight:800; letter-spacing:-.01em;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 8px; gap:10px;}
  .wordmark{font-weight:800; font-size:19px; letter-spacing:-.01em;}
  .wordmark span{color:var(--accent);}
  .streak-chip{display:flex; align-items:center; gap:5px; background:var(--bg-elevated); border:1px solid var(--border); padding:6px 10px 6px 8px; border-radius:999px; font-weight:700; font-size:13px;}
  .icon-btn{background:none; border:1px solid var(--border); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;}
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
  .lang-btn{background:var(--bg-elevated); border:1px solid var(--border); border-radius:999px; height:34px; padding:0 12px; font-weight:800; font-size:12px; letter-spacing:.03em; color:var(--ink-soft); flex:0 0 auto;}
  .lang-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

  /* ---- generic layout ---- */
  .screen{padding:4px 20px 28px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .card{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .card-flat{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px;}
  .badge-unlock-shine{position:relative; overflow:hidden; box-shadow:var(--glow-badge), var(--shadow); animation:badge-pulse 1.6s ease-in-out infinite;}
  .badge-unlock-shine::after{content:''; position:absolute; top:-60%; left:-60%; width:35%; height:220%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent); transform:rotate(22deg); animation:badge-shine-sweep 2.2s ease-in-out infinite; pointer-events:none;}
  @keyframes badge-pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.02);}}
  @keyframes badge-shine-sweep{0%{left:-60%;} 55%{left:130%;} 100%{left:130%;}}
  .card-name{background:radial-gradient(circle at 88% -14%, rgba(255,255,255,.6), transparent 55%), linear-gradient(135deg, var(--cat-diag-soft) 0%, var(--bg-elevated) 145%); border-color:var(--cat-diag-soft);}
  .greeting-banner{position:relative; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius); padding:15px 16px; font-weight:800; font-size:17px; margin-bottom:14px;}
  .greeting-banner .sparkle-1{top:6px; right:10%;}
  .greeting-banner .sparkle-2{bottom:8px; left:8%; width:5px; height:5px;}
  .greeting-banner .sparkle-3{top:40%; right:22%; width:5px; height:5px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:13px 20px; font-weight:700; font-size:15px; border:1px solid transparent; width:100%; transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-whatsapp{background:#2e9e5b; color:#fff;}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn-block{width:100%;}
  .link-btn{background:none;border:none;color:var(--ink-soft); font-size:13px; font-weight:600; text-decoration:underline; padding:6px;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.02em;}
  .badge-recommended{background:var(--accent-soft); color:var(--accent-strong);}
  .badge-done{background:var(--success-soft); color:var(--success);}

  .progress-track{height:7px; background:var(--bg-sunken); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease;}

  /* ---- diagnostic ---- */
  .diag-hero{padding:26px 20px 14px; text-align:center; position:relative;}
  .diag-hero .display{font-size:28px; line-height:1.15;}
  .compass-mark{width:56px;height:56px;border-radius:20px;background:var(--cat-diag-soft);color:var(--cat-diag);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .opt-list{display:flex; flex-direction:column; gap:10px;}
  .opt{display:flex; align-items:center; gap:12px; text-align:start; padding:15px 16px; border-radius:18px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); width:100%;}
  .opt:hover{border-color:var(--ink-faint);}
  .opt.selected{border-color:var(--accent); background:var(--accent-soft);}
  .opt .opt-ic{flex:0 0 auto; color:var(--ink-faint);}
  .opt.selected .opt-ic{color:var(--accent-strong);}
  .opt-main{font-weight:600; font-size:15px;}
  .opt-sub{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}

  .q-progress{display:flex; gap:6px; padding:16px 20px 0;}
  .q-progress i{flex:1; height:4px; border-radius:2px; background:var(--border);}
  .q-progress i.done{background:var(--accent);}

  .name-input{width:100%; padding:15px 16px; border-radius:18px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); font-size:16px;}
  .name-input:focus{border-color:var(--accent);}
  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .unlock-error{background:var(--error-soft); color:var(--error); border-radius:14px; padding:10px 13px; font-size:13px; font-weight:600;}
  .lead-box{width:100%; resize:none; border:1.5px dashed var(--border); border-radius:14px; background:var(--bg-sunken); color:var(--ink); font-family:inherit; font-size:13px; line-height:1.6; padding:12px 13px; -webkit-user-select:all; user-select:all;}
  .lead-box:focus{border-color:var(--accent); border-style:solid;}

  /* ---- tiles ---- */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tile{border-radius:var(--radius); padding:16px; text-align:start; border:1px solid var(--border-soft); background:var(--bg-elevated); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:26px; min-height:118px;}
  .tile-ic{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .tile-title{font-weight:800; font-size:14.5px;}
  .tile-sub{font-size:11.5px; color:var(--ink-faint); font-weight:600;}

  /* ---- badges ---- */
  .badge-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .badge-cell{border-radius:var(--radius); padding:12px 8px; text-align:center; border:1px solid var(--border-soft); background:var(--bg-elevated); display:flex; flex-direction:column; align-items:center; gap:6px;}
  .badge-cell.locked{opacity:.4;}
  .badge-cell .badge-ic{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .badge-cell .badge-name{font-size:10.5px; font-weight:700; line-height:1.25;}

  /* ---- list rows ---- */
  .item-row{display:flex; align-items:center; gap:13px; padding:15px 16px; border-radius:18px; border:1px solid var(--border-soft); background:var(--bg-elevated); width:100%; text-align:start;}
  .item-row:hover{border-color:var(--ink-faint);}
  .item-ic{flex:0 0 auto; width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:700; font-size:14.5px;}
  .item-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .chevron{color:var(--ink-faint); flex:0 0 auto;}

  /* ---- level chips / tabs ---- */
  .level-chip-row{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 14px; margin:0 -2px;}
  .level-chip{flex:0 0 auto; padding:8px 15px; border-radius:999px; border:1.5px solid var(--border); background:var(--bg-elevated); font-weight:800; font-size:12.5px; color:var(--ink-soft);}
  .level-chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .tab-row{display:flex; gap:8px; margin-bottom:12px;}
  .tab-btn{flex:1; padding:11px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg-elevated); font-weight:700; font-size:13px; color:var(--ink-soft); text-align:center;}
  .tab-btn.active.cat-vocab{background:var(--cat-voc-soft); color:var(--cat-voc); border-color:var(--cat-voc);}
  .tab-btn.active.cat-slang{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent);}

  /* ---- section header ---- */
  .section-head{padding:22px 20px 6px;}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-soft);background:none;border:none;font-weight:600;font-size:13px;padding:0 0 12px;}
  html[dir="rtl"] .back svg, html[dir="rtl"] .chevron svg{transform:scaleX(-1);}
  .section-head h1{font-size:22px;}
  .section-head p{color:var(--ink-soft); font-size:13.5px; margin-top:5px;}

  /* ---- trap / content intro ---- */
  .contrast{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
  .contrast-line{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:14px; font-size:14px;}
  .contrast-line.wrong{background:var(--error-soft); color:var(--error);}
  .contrast-line.right{background:var(--success-soft); color:var(--success);}
  .contrast-line b{font-weight:800;}
  .contrast-line span.txt{color:var(--ink);}

  /* ---- quiz ---- */
  .quiz-prompt{font-size:19px; font-weight:700; line-height:1.4; margin:6px 0 18px;}
  .quiz-opt{display:block; width:100%; text-align:start; padding:14px 16px; border-radius:18px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); font-size:15px; font-weight:600; margin-bottom:10px;}
  .quiz-opt.correct{border-color:var(--success); background:var(--success-soft); color:var(--success);}
  .quiz-opt.wrong{border-color:var(--error); background:var(--error-soft); color:var(--error);}
  .quiz-opt:disabled{opacity:.7;}
  .why-box{background:var(--bg-sunken); border-radius:14px; padding:13px 14px; font-size:13.5px; color:var(--ink-soft); margin-top:4px;}

  /* ---- flashcards ---- */
  .flash-wrap{perspective:1200px; margin:10px 0;}
  .flashcard{min-height:220px; border-radius:20px; position:relative; cursor:pointer;}
  .flash-face{border-radius:20px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:10px; min-height:220px; border:1px solid var(--border-soft); box-shadow:var(--shadow);}
  .flash-word{font-size:23px; font-weight:800;}
  .flash-hint{font-size:12px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .flash-sentence{font-size:15px; color:var(--ink-soft); line-height:1.5;}
  .flash-note{background:var(--accent-soft); color:var(--accent-strong); border-radius:14px; padding:10px 12px; font-size:12.5px; font-weight:600; text-align:start;}
  .flash-dots{display:flex; justify-content:center; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .flash-dots i{width:6px;height:6px;border-radius:50%;background:var(--border);}
  .flash-dots i.active{background:var(--accent); width:16px; border-radius:3px;}
  .flash-nav{display:flex; gap:10px; margin-top:16px;}

  .phrase-row{display:flex; flex-direction:column; gap:3px; padding:12px 0; border-bottom:1px solid var(--border-soft);}
  .phrase-row:last-child{border-bottom:none;}
  .phrase-term{font-weight:700; font-size:14.5px;}
  .phrase-mean{font-size:13px; color:var(--ink-soft);}

  /* ---- results ---- */
  .result-ring{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:8px auto 4px;}
  .result-ring .big{font-size:30px; font-weight:800;}
  .result-ring .small{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;}

  .whatsapp-card{background:linear-gradient(135deg, var(--cat-diag-soft), var(--bg-elevated)); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px;}

  .intro-glow{position:relative; animation:intro-heartbeat 2.6s ease-in-out infinite; box-shadow:0 0 0 2px rgba(255,194,46,.65), 0 0 26px 6px rgba(255,194,46,.5);}
  .intro-glow .sparkle{color:#ffc22e;}
  @keyframes intro-heartbeat{0%,100%{transform:scale(1);} 50%{transform:scale(1.035);}}

  /* ---- bottom nav ---- */
  .bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg-elevated); border-top:1px solid var(--border); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom,0)); gap:4px; z-index:20;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); padding:8px 4px; border-radius:14px; font-size:10.5px; font-weight:700;}
  .nav-btn.active{color:var(--accent);}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat-box{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:18px; padding:12px 8px; text-align:center;}
  .stat-num{font-size:20px; font-weight:800;}
  .stat-lab{font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---- press feedback: box color changes the instant you tap it ---- */
  .btn, .opt, .quiz-opt, .item-row, .tile, .level-chip, .tab-btn, .icon-btn, .lang-btn, .flashcard, .nav-btn{cursor:pointer; transition:background .1s ease, border-color .1s ease, transform .1s ease;}
  .btn-primary:active{background:var(--accent-strong);}
  .btn-whatsapp:active{filter:brightness(.88);}
  .btn-ghost:active, .icon-btn:active, .lang-btn:active{background:var(--accent-soft); border-color:var(--accent);}
  .opt:active{background:var(--accent-soft); border-color:var(--accent); transform:scale(.98);}
  .quiz-opt:active{background:var(--accent-soft); border-color:var(--accent); transform:scale(.98);}
  .item-row:active{background:var(--accent-soft); border-color:var(--accent); transform:scale(.98);}
  .tile:active{background:var(--accent-soft); border-color:var(--accent); transform:scale(.97);}
  .level-chip:active{background:var(--accent); color:var(--accent-ink); transform:scale(.95);}
  .tab-btn:active{background:var(--accent-soft); border-color:var(--accent); transform:scale(.96);}

        const emphasized = rec.emphasize.includes(sec.key);
        return `<button class="item-row" data-action="nav" data-view="${sec.view}">
          <span class="item-ic" style="background:var(--cat-${sec.cat}-soft); color:var(--cat-${sec.cat});">${ICONS[sec.icon]}</span>
          <div class="item-body">
            <div class="item-title">${esc(L(sec.label.en,sec.label.tr,sec.label.fa))}</div>
          </div>
          ${emphasized ? `<span class="pill badge-recommended">${L('Start here','Buradan başla','از اینجا شروع کن')}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

/* ============================= GRAMMAR (50 items, A1-C1) ============================= */
const GRAMMAR_ITEMS = [
 {id:'g-A1-1', level:'A1', title:'Verb "To Be"', titleTr:'"To Be" Fiili',
  exp:{en:'The single most essential structure in English — used constantly.', tr:'Türkçede "-im/-sin/-dir" gibi eklerle yapılan "olmak" fiili, İngilizcede bağımsız bir kelime olarak var olur ve özneye göre değişir: I am, you/we/they are, he/she/it is. Bu, Türk öğrencilerin en sık atladığı yapılardan biridir çünkü Türkçede ayrı bir "fiil" olarak hissedilmez.'},
  wrong:'I student.', right:'I am a student.', blank:{sentence:'She ___ a doctor.', word:'is', distractors:['am','are']},
  wrong2:'They is happy.', right2:'They are happy.', blank2:{sentence:'We ___ from Istanbul.', word:'are', distractors:['is','am']}},
 {id:'g-A1-2', level:'A1', title:'Subject Pronouns', titleTr:'Özne Zamirleri',
  exp:{en:'I, you, he, she, it, we, they — the subject of every sentence.', tr:'Türkçede fiil çekiminden özne bellidir, bu yüzden zamir genelde söylenmez ("Geliyorum" — kim geldiği bellidir). İngilizcede ise zamir cümlede zorunludur; fiil çekimi tek başına özneyi belli etmez.'},
  wrong:'Is coming tomorrow.', right:'She is coming tomorrow.', blank:{sentence:'___ is my brother.', word:'He', distractors:['Him','His']},
  wrong2:'Called me yesterday.', right2:'He called me yesterday.', blank2:{sentence:'___ is my colleague.', word:'She', distractors:['Her','Hers']}},
 {id:'g-A1-3', level:'A1', title:'Plural Nouns', titleTr:'Çoğul İsimler',
  exp:{en:'Add -s/-es for most nouns, but some are irregular.', tr:'Çoğul yapmak için genelde -s/-es eklenir (book→books, box→boxes), ama sık kullanılan bazı kelimeler kuraldışıdır (child→children, person→people, man→men). Bu kuraldışı kelimeler ayrıca ezberlenmelidir çünkü kurala uydurma hatası çok yaygındır.'},
  wrong:'I have two childs.', right:'I have two children.', blank:{sentence:'There are three ___ in the room.', word:'people', distractors:['persons','peoples']},
  wrong2:'I saw three mans.', right2:'I saw three men.', blank2:{sentence:'She has two ___.', word:'watches', distractors:['watchs','watch']}},
 {id:'g-A1-4', level:'A1', title:'This / That / These / Those', titleTr:'This / That / These / Those',
  exp:{en:'Near vs. far, singular vs. plural — four words for one Turkish idea.', tr:'"This/these" konuşmacıya yakın, "that/those" konuşmacıya uzak nesneler için kullanılır. Ayrıca "this/that" tekil, "these/those" çoğul nesneler içindir — iki değişkenin (yakınlık + sayı) aynı anda düşünülmesi gerektiği için başlangıç seviyesinde kafa karıştırıcıdır.'},
  wrong:'This is my keys.', right:'These are my keys.', blank:{sentence:'___ are my keys, over here.', word:'These', distractors:['This','That']},
  wrong2:'That are my shoes.', right2:'Those are my shoes.', blank2:{sentence:'___ is my bag, right here.', word:'This', distractors:['These','That']}},
 {id:'g-A1-5', level:'A1', title:'Simple Present (-s)', titleTr:'Geniş Zaman (-s)',
  exp:{en:"Describing habits and facts — don't forget the third-person -s.", tr:'Alışkanlıkları ve genel gerçekleri anlatır. En kritik kural: özne "he/she/it" olduğunda fiile -s/-es eklenir (she works, he watches). Bu, Türk öğrencilerin en sık unuttuğu ya da fazladan eklediği kuraldır — hem unutma hem yanlış yerde kullanma hatası sık görülür.'},
  wrong:'She go to work by bus.', right:'She goes to work by bus.', blank:{sentence:'He ___ coffee every morning.', word:'drinks', distractors:['drink','drinking']},
  wrong2:'They goes to school.', right2:'They go to school.', blank2:{sentence:'My sister ___ English.', word:'teaches', distractors:['teach','teaching']}},
 {id:'g-A1-6', level:'A1', title:'Possessive Adjectives', titleTr:'İyelik Sıfatları',
  exp:{en:'my/your/his/her/our/their before a noun to show ownership.', tr:'Türkçede iyelik kelimenin sonuna ek olarak eklenir (kitab-ım), İngilizcede ise ayrı bir kelime olarak isimden önce gelir (my book). Bu yapısal fark, öğrencilerin genelde iyelik sıfatını unutup direkt ismi söylemesine yol açar ("Book is red" yerine "My book is red").'},
  wrong:'This is car my.', right:'This is my car.', blank:{sentence:'Is that ___ bag?', word:'your', distractors:['you','yours']},
  wrong2:'That is bag her.', right2:'That is her bag.', blank2:{sentence:'We love ___ new house.', word:'our', distractors:['us','we']}},
 {id:'g-A1-7', level:'A1', title:'There is / There are', titleTr:'There is / There are',
  exp:{en:'Saying something exists — singular vs. plural.', tr:'Bir şeyin varlığını belirtmek için kullanılır. Tekil ve sayılamayan isimler için "there is", çoğul isimler için "there are" kullanılır. Türkçede "var" tek bir kelimeyle her durumda kullanıldığı için bu ayrım öğrencilere açıkça gösterilmelidir.'},
  wrong:'It is a cat in the garden.', right:'There is a cat in the garden.', blank:{sentence:'___ many people at the party.', word:'There are', distractors:['There is','It is']},
  wrong2:'There is many books.', right2:'There are many books.', blank2:{sentence:'___ a problem with this.', word:'There is', distractors:['There are','It is']}},
 {id:'g-A1-8', level:'A1', title:'Prepositions of Place', titleTr:'Yer Edatları',
  exp:{en:'in / on / under — small words, big meaning.', tr:'Türkçede yer ilişkileri isme ek olarak eklenir (masa-da, masa-nın altı-nda); İngilizcede bu ilişkiler ayrı kelimelerle (in, on, under, next to) ifade edilir. Öğrenciler bu edatları genelde atlar veya yanlış kullanır çünkü kendi dillerinde "ayrı kelime" olarak düşünmezler.'},
  wrong:'The keys are in the table.', right:'The keys are on the table.', blank:{sentence:'The cat is ___ the box.', word:'under', distractors:['on','at']},
  wrong2:'The dog is in the sofa.', right2:'The dog is on the sofa.', blank2:{sentence:'She sat ___ me at dinner.', word:'next to', distractors:['in','on']}},
 {id:'g-A1-9', level:'A1', title:'Articles (a/an)', titleTr:'Tanımlıklar (a/an)',
  exp:{en:"A tiny word Turkish doesn't have at all — so it's easy to forget completely.", tr:'Türkçede karşılığı olmayan bir yapıdır. Sessiz harfle başlayan kelimelerden önce "a" (a book), sesli harfle başlayanlardan önce "an" (an apple) kullanılır — kural harfin kendisine değil, telaffuzdaki sese dayanır (an hour, çünkü "h" sessiz okunur).'},
  wrong:'She is engineer.', right:'She is an engineer.', blank:{sentence:'I need ___ umbrella.', word:'an', distractors:['a','the']},
  wrong2:'He is honest man.', right2:'He is an honest man.', blank2:{sentence:'I saw ___ dog in the park.', word:'a', distractors:['an','the']}},
 {id:'g-A1-10', level:'A1', title:'Basic Questions', titleTr:'Temel Sorular',
  exp:{en:'Question words flip the word order compared to a statement.', tr:'Soru kelimeleri cümlenin başına gelir ve fiil-özne sırası değişir (yardımcı fiil öne gelir): "You are from Turkey" → "Where are you from?" Türkçede kelime sırası değişmediği için (Nerelisin?) bu devrik yapı yeni bir kavram olarak öğretilmelidir.'},
  wrong:'Where you are going?', right:'Where are you going?', blank:{sentence:'___ is your name?', word:'What', distractors:['Where','Who']},
  wrong2:'What time it is?', right2:'What time is it?', blank2:{sentence:'___ is your teacher?', word:'Who', distractors:['What','Where']}},

 {id:'g-A2-1', level:'A2', title:'Past Simple', titleTr:'Geçmiş Zaman',
  exp:{en:'Finished past events — regular -ed and tricky irregulars.', tr:'Bitmiş geçmiş olayları anlatır. Düzenli fiillere -ed eklenir (worked, played), ama en sık kullanılan fiillerin çoğu düzensizdir (go→went, see→saw, eat→ate). Türk öğrenciler düzensiz fiilleri düzenliymiş gibi çekimleme hatası yapar ("goed", "eated" gibi) çünkü Türkçe geçmiş zaman tamamen kuralcıdır.'},
  wrong:'I goed to the market yesterday.', right:'I went to the market yesterday.', blank:{sentence:'She ___ a movie last night.', word:'watched', distractors:['watch','watching']},
  wrong2:'She buyed a new car.', right2:'She bought a new car.', blank2:{sentence:'They ___ to Paris last summer.', word:'flew', distractors:['flied','fly']}},
 {id:'g-A2-2', level:'A2', title:'"Going to" Future', titleTr:'"Going to" Geleceği',
  exp:{en:'Talking about plans and intentions already decided.', tr:'Önceden planlanmış gelecek eylemleri anlatır — "will"den farklı olarak, "going to" genelde daha önceden karar verilmiş, somut planlar için kullanılır. Örneğin "I\'m going to visit my parents this weekend" zaten planlanmış bir eylemdir, "I will visit them" ise o an alınan bir kararı ima edebilir.'},
  wrong:'I go to visit my aunt tomorrow.', right:"I'm going to visit my aunt tomorrow.", blank:{sentence:'We ___ to travel next month.', word:'are going', distractors:['go','will']},
  wrong2:'She going to call you.', right2:"She's going to call you.", blank2:{sentence:'He ___ to start a new job.', word:'is going', distractors:['going','go']}},
 {id:'g-A2-3', level:'A2', title:'Comparatives', titleTr:'Karşılaştırma Sıfatları',
  exp:{en:'Comparing two things: -er for short words, "more" for long ones.', tr:'İki şeyi karşılaştırırken kısa kelimelere (1-2 hece) -er eklenir (bigger, faster), uzun kelimelerde (3+ hece) "more" kullanılır (more interesting). Bazı kelimeler kuraldışıdır (good→better, bad→worse). Öğrenciler genelde her iki kuralı karıştırıp "more bigger" gibi hatalar yapar.'},
  wrong:'This book is more good than that one.', right:'This book is better than that one.', blank:{sentence:'Istanbul is ___ than Ankara.', word:'bigger', distractors:['more big','biggest']},
  wrong2:'He is more strong than me.', right2:'He is stronger than me.', blank2:{sentence:'This test is ___ than the last one.', word:'harder', distractors:['more hard','hardest']}},
 {id:'g-A2-4', level:'A2', title:'Superlatives', titleTr:'Üstünlük Sıfatları',
  exp:{en:'The biggest, the best — comparing three or more, or naming an extreme.', tr:'Üç veya daha fazla şey arasında en üstün olanı belirtir; her zaman "the" ile başlar. Kısa kelimeler -est alır (the biggest), uzun kelimeler "the most" alır (the most expensive).'},
  wrong:'She is the more talented singer.', right:'She is the most talented singer.', blank:{sentence:'This is ___ restaurant in town.', word:'the best', distractors:['the better','best']},
  wrong2:'It is more expensive hotel.', right2:'It is the most expensive hotel.', blank2:{sentence:'He is ___ player on the team.', word:'the fastest', distractors:['faster','fastest']}},
 {id:'g-A2-5', level:'A2', title:'Some / Any', titleTr:'Some / Any',
  exp:{en:'Some for positive statements, any for questions and negatives.', tr:'Olumlu cümlelerde "some", soru ve olumsuz cümlelerde "any" kullanılır. İstisna: bir şey teklif ederken veya rica ederken olumlu soruda da "some" kullanılabilir ("Would you like some tea?") — bu, kural dışı gibi görünen ama çok sık karşılaşılan bir durumdur.'},
  wrong:"I don't have some money.", right:"I don't have any money.", blank:{sentence:'Do you have ___ questions?', word:'any', distractors:['some','no']},
  wrong2:'Is there some milk left?', right2:'Is there any milk left?', blank2:{sentence:'I need ___ help with this box.', word:'some', distractors:['any','no']}},
 {id:'g-A2-6', level:'A2', title:'Can / Could (Ability)', titleTr:'Can / Could (Yetenek)',
  exp:{en:'Can = present ability, could = past ability.', tr:'Şimdiki zamanda yetenek için "can", geçmiş zamanda yetenek için "could" kullanılır. Bu, modal fiillere ilk giriş noktasıdır ve B1\'de görülecek daha karmaşık modallar (must, should, might) için temel oluşturur.'},
  wrong:'She can swim when she was five.', right:'She could swim when she was five.', blank:{sentence:'I ___ speak French when I was a child.', word:'could', distractors:['can',"can't"]},
  wrong2:'She can to drive.', right2:'She can drive.', blank2:{sentence:'___ you help me carry this?', word:'Can', distractors:["Can't",'Do']}},
 {id:'g-A2-7', level:'A2', title:'Adverbs of Frequency', titleTr:'Sıklık Zarfları',
  exp:{en:'always/usually/sometimes/never — and their tricky position in the sentence.', tr:'Bir eylemin ne sıklıkla yapıldığını belirtir. Kritik kural: bu zarflar ana fiilden ÖNCE, ama "to be" fiilinden SONRA gelir. Bu, öğrencilerin en sık karıştırdığı kelime sırası kurallarından biridir.'},
  wrong:'I always am late.', right:'I am always late.', blank:{sentence:'He ___ drinks coffee in the morning.', word:'usually', distractors:['usually is','is usually']},
  wrong2:'She sometimes is late.', right2:'She is sometimes late.', blank2:{sentence:'I ___ eat breakfast.', word:'never', distractors:['am never','never am']}},
 {id:'g-A2-8', level:'A2', title:'Present Continuous', titleTr:'Şimdiki Zaman',
  exp:{en:'Actions happening right now — vs. simple present for habits.', tr:'Şu anda olan eylemleri anlatır (I am reading now) ve simple present (alışkanlıklar: I read every day) ile net bir şekilde ayrılmalıdır. Türkçede bu ayrım daha az belirgin olduğu için ("okuyorum" hem şimdi hem genel anlamda kullanılabilir), İngilizcedeki bu iki zamanın farklı bağlamlarda kullanıldığı özellikle vurgulanmalıdır.'},
  wrong:'I go to the gym right now.', right:"I'm going to the gym right now.", blank:{sentence:'Look! It ___ outside.', word:'is raining', distractors:['rains','rain']},
  wrong2:'They studies right now.', right2:'They are studying right now.', blank2:{sentence:'Why ___ you laughing?', word:'are', distractors:['do','is']}},
 {id:'g-A2-9', level:'A2', title:'Object Pronouns', titleTr:'Nesne Zamirleri',
  exp:{en:'me/him/her/them — used once sentences get longer.', tr:'Cümlede nesne konumundaki zamirlerdir (me, him, her, it, us, them) ve özne zamirlerinden (I, he, she) farklıdır. Türkçede bu ayrım ek olarak yapılır (ben→beni, o→onu), İngilizcede tamamen farklı kelimeler kullanılır, bu yüzden ayrı bir liste olarak öğrenilmelidir.'},
  wrong:'Give it to she.', right:'Give it to her.', blank:{sentence:'Can you help ___ ?', word:'me', distractors:['I','my']},
  wrong2:'Tell it to they.', right2:'Tell it to them.', blank2:{sentence:'I saw ___ at the mall.', word:'him', distractors:['he','his']}},
 {id:'g-A2-10', level:'A2', title:'Imperatives', titleTr:'Emir Cümleleri',
  exp:{en:'Giving instructions and commands — no subject needed.', tr:'Talimat, tavsiye veya emir verirken kullanılır; özne söylenmez, fiil doğrudan cümlenin başına gelir. Olumsuz emir için "don\'t + fiil" kullanılır. Bu yapı yön tarifi ve tarif/talimat metinlerinde sürekli karşımıza çıkar.'},
  wrong:'You turn left at the corner.', right:'Turn left at the corner.', blank:{sentence:"___ touch that, it's hot!", word:"Don't", distractors:['Not','No']},
  wrong2:'You be quiet, please.', right2:'Be quiet, please.', blank2:{sentence:'___ forget your passport.', word:"Don't", distractors:['Not','No']}},

 {id:'g-B1-1', level:'B1', title:'Present Perfect vs. Past Simple', titleTr:'Present Perfect - Past Simple Farkı',
  exp:{en:'Finished time (yesterday) → past simple. Unfinished/life experience → present perfect.', tr:'Bu, Türk öğrenciler için en kritik ve en sık hata yapılan gramer noktasıdır çünkü Türkçede bu ikisi arasındaki ayrım yoktur (tek bir geçmiş zaman eki "-di" her ikisini de karşılar). Belirli bir zaman ifadesi varsa (yesterday, in 2020) past simple; deneyim veya henüz bitmemiş bir zaman dilimi söz konusuysa present perfect kullanılır.'},
  wrong:'I have seen that movie yesterday.', right:'I saw that movie yesterday.', blank:{sentence:'I ___ this book — I recommend it.', word:'have read', distractors:['read','was reading']},
  wrong2:'Have you seen him yesterday?', right2:'Did you see him yesterday?', blank2:{sentence:'She ___ to five countries so far.', word:'has traveled', distractors:['traveled','was traveling']}},
 {id:'g-B1-2', level:'B1', title:'Since vs. For', titleTr:'Since - For Farkı',
  exp:{en:'Since + starting point. For + a length of time.', tr:'Present perfect ile birlikte kullanılan bu iki edat sık karıştırılır. "Since" bir başlangıç noktasını belirtir (since 2020, since Monday), "for" ise bir süreyi belirtir (for three years, for two hours).'},
  wrong:"I've lived here for 2019.", right:"I've lived here since 2019.", blank:{sentence:"She's worked here ___ six months.", word:'for', distractors:['since','from']},
  wrong2:"He's worked here since five years.", right2:"He's worked here for five years.", blank2:{sentence:'I have known them ___ college.', word:'since', distractors:['for','from']}},
 {id:'g-B1-3', level:'B1', title:'First Conditional', titleTr:'Birinci Koşul Cümlesi',
  exp:{en:'If + present, will + base verb — for real, likely future situations.', tr:'Gerçekleşmesi muhtemel/olası gelecek durumları anlatır: If + present simple, will + fiil (yalın). Türkçedeki "-se/-sa" koşul ekiyle benzer bir mantığı vardır ama İngilizcede "if" cümleciğinde asla "will" kullanılmaz — bu, öğrencilerin en sık yaptığı hatalardan biridir ("If it will rain...").'},
  wrong:'If it will rain, I stay home.', right:'If it rains, I will stay home.', blank:{sentence:'If you study, you ___ pass.', word:'will', distractors:['would','will to']},
  wrong2:'If you will hurry, you will catch it.', right2:'If you hurry, you will catch it.', blank2:{sentence:'If she calls, I ___ answer.', word:'will', distractors:['would','am']}},
 {id:'g-B1-4', level:'B1', title:'Must / Have to / Should', titleTr:'Must / Have to / Should',
  exp:{en:'Strong obligation, external requirement, and advice — three different ideas.', tr:'Üç modal fiil arasındaki nüans farkı önemlidir: "must" güçlü, çoğunlukla içsel bir zorunluluğu (I must call my mom), "have to" dış kaynaklı bir kuralı (I have to wear a uniform — kural gereği), "should" ise sadece bir tavsiyeyi ifade eder.'},
  wrong:"You must to wear a seatbelt, it's the law.", right:"You have to wear a seatbelt, it's the law.", blank:{sentence:'You look tired — you ___ rest.', word:'should', distractors:['must','have']},
  wrong2:'You should to see a doctor.', right2:'You should see a doctor.', blank2:{sentence:'Employees ___ wear a badge here.', word:'have to', distractors:['should to','must to']}},
 {id:'g-B1-5', level:'B1', title:'Passive Voice (basic)', titleTr:'Edilgen Çatı (Temel)',
  exp:{en:'Shifting focus away from who did the action.', tr:'Eylemi kimin yaptığından çok, eylemin kendisinin veya sonucunun önemli olduğu durumlarda kullanılır. "The window was broken" cümlesinde kimin kırdığı bilinmiyor veya önemli değil. Haber, talimat ve resmi yazıda sık kullanılır.'},
  wrong:'The window broke by the storm.', right:'The window was broken by the storm.', blank:{sentence:'The letter ___ yesterday.', word:'was sent', distractors:['sent','was send']},
  wrong2:'This song was sing by her.', right2:'This song was sung by her.', blank2:{sentence:'The email ___ this morning.', word:'was sent', distractors:['sent','was send']}},
 {id:'g-B1-6', level:'B1', title:'Relative Clauses (who/which/that)', titleTr:'İlgi Cümlecikleri',
  exp:{en:'Combining two ideas into one sentence.', tr:'İki cümleyi tek bir cümlede birleştirmeye yarar. "Who" insanlar için, "which" nesneler/hayvanlar için, "that" ise her ikisi için de (daha gündelik) kullanılabilir. Doğru kullanıldığında konuşmayı çok daha akıcı gösterir.'},
  wrong:'The man which called you is my boss.', right:'The man who called you is my boss.', blank:{sentence:'The book ___ I read was amazing.', word:'that', distractors:['who','whom']},
  wrong2:'The house which I grew up it was small.', right2:'The house which I grew up in was small.', blank2:{sentence:'The teacher ___ helped me retired.', word:'who', distractors:['which','whom']}},
 {id:'g-B1-7', level:'B1', title:'"Used to"', titleTr:'"Used to" Kalıbı',
  exp:{en:'Past habits that no longer happen.', tr:'Artık yapılmayan geçmiş alışkanlıkları veya durumları anlatır. "Be used to" ile karıştırılır — anlamı tamamen farklıdır. "Would" bazen yerine kullanılabilir ama sadece tekrarlanan eylemler için, durumlar için kullanılamaz.'},
  wrong:'I use to smoke, but I stopped.', right:'I used to smoke, but I stopped.', blank:{sentence:'She ___ live in Izmir, but she moved.', word:'used to', distractors:['use to','is used to']},
  wrong2:'She use to live here.', right2:'She used to live here.', blank2:{sentence:'We ___ play outside as kids.', word:'used to', distractors:['use to','are used to']}},
 {id:'g-B1-8', level:'B1', title:'Gerunds vs. Infinitives', titleTr:'Gerund - Infinitive Farkı',
  exp:{en:'-ing or "to + verb" — depends on the main verb, no fixed rule.', tr:'Bazı fiiller kendinden sonra -ing (gerund) alır (enjoy swimming), bazıları "to + fiil" (infinitive) alır (want to swim). Bu konuda net, tek bir kural yoktur — hangi fiilin hangi yapıyı aldığı ezberlenmelidir.'},
  wrong:'I enjoy to swim.', right:'I enjoy swimming.', blank:{sentence:'She wants ___ a new job.', word:'to find', distractors:['finding','find']},
  wrong2:'He avoids to answer.', right2:'He avoids answering.', blank2:{sentence:'They decided ___ early.', word:'to leave', distractors:['leaving','leave']}},
 {id:'g-B1-9', level:'B1', title:'Question Tags', titleTr:'Soru Ekleri (Tag Questions)',
  exp:{en:'The short tag at the end of a statement — it changes every time.', tr:'Cümlenin sonuna eklenen kısa doğrulama sorusudur. Kural: cümle olumluysa tag olumsuz, cümle olumsuzsa tag olumlu olur. Türkçede tek bir sabit ifade ("değil mi?") her cümlede kullanılırken, İngilizcede tag her cümlede değişir.'},
  wrong:"You're coming, isn't it?", right:"You're coming, aren't you?", blank:{sentence:"She can swim, ___ ?", word:"can't she", distractors:["isn't she","doesn't she"]},
  wrong2:"It's cold, is it?", right2:"It's cold, isn't it?", blank2:{sentence:'He plays tennis, ___ ?', word:"doesn't he", distractors:["isn't he",'does he']}},
 {id:'g-B1-10', level:'B1', title:'Reported Speech (basic)', titleTr:'Aktarılan Konuşma (Temel)',
  exp:{en:'Reporting what someone said — the tense shifts back one step.', tr:'Birinin söylediğini aktarırken zaman genelde bir adım geriye kayar (backshift): "I am tired" → "She said she was tired." Türkçede bu zaman kayması gerçekleşmediği için, İngilizcedeki bu kural yeni bir kavram olarak öğretilmelidir.'},
  wrong:'She said she is tired.', right:'She said she was tired.', blank:{sentence:'He said he ___ busy.', word:'was', distractors:['is','has been']},
  wrong2:'He said he is busy.', right2:'He said he was busy.', blank2:{sentence:'They said they ___ tired.', word:'were', distractors:['are','have been']}},

 {id:'g-B2-1', level:'B2', title:'Second Conditional', titleTr:'İkinci Koşul Cümlesi',
  exp:{en:'If + past simple, would + base verb — hypothetical present/future.', tr:'Gerçek olmayan veya olası olmayan şimdiki/gelecek durumları anlatır: If + past simple, would + fiil (yalın). Burada kullanılan "past simple" gerçek bir geçmiş zamanı değil, hayali/varsayımsal bir durumu ifade eder — bu, öğrencilerin kavramsal olarak en çok zorlandığı noktalardan biridir.'},
  wrong:'If I would have more time, I would travel.', right:'If I had more time, I would travel.', blank:{sentence:'If I ___ you, I would apologize.', word:'were', distractors:['was','am']},
  wrong2:'If I would be rich, I would travel.', right2:'If I were rich, I would travel.', blank2:{sentence:'If we had more staff, we ___ finish faster.', word:'would', distractors:['will','had']}},
 {id:'g-B2-2', level:'B2', title:'Third Conditional', titleTr:'Üçüncü Koşul Cümlesi',
  exp:{en:'If + past perfect, would have + past participle — hypothetical past.', tr:'Geçmişte gerçekleşmemiş hayali durumları ve bunların hayali sonuçlarını anlatır: If + past perfect, would have + fiil3. Genelde pişmanlık ifade etmek için kullanılır ve iki farklı geçmiş zaman formunu (past perfect + would have) birleştirdiği için yapısal olarak en karmaşık koşul cümlelerinden biridir.'},
  wrong:'If I had known, I would go.', right:'If I had known, I would have gone.', blank:{sentence:'If she had studied, she ___ passed.', word:'would have', distractors:['would','will have']},
  wrong2:'If she had come, we would go.', right2:'If she had come, we would have gone.', blank2:{sentence:'If he had asked, I ___ helped him.', word:'would have', distractors:['would','will have']}},
 {id:'g-B2-3', level:'B2', title:'Passive Voice (advanced)', titleTr:'Edilgen Çatı (İleri)',
  exp:{en:'Passive across tenses: has been done, will be done, is being done.', tr:'B1\'deki basit passive yapının (was/were + fiil3) ötesine geçerek farklı zamanlarda passive kullanımı öğretilir: gelecek zaman (will be done), şimdiki zaman süreklilik (is being done), ve present perfect (has been done). Her zaman formunun kendi passive yapısı vardır.'},
  wrong:'The project will finished next week.', right:'The project will be finished next week.', blank:{sentence:'The bridge ___ built right now.', word:'is being', distractors:['is','was being']},
  wrong2:'The results will announced tomorrow.', right2:'The results will be announced tomorrow.', blank2:{sentence:'The building ___ renovated at the moment.', word:'is being', distractors:['is','was']}},
 {id:'g-B2-4', level:'B2', title:'Reported Speech (advanced)', titleTr:'Aktarılan Konuşma (İleri)',
  exp:{en:'Reporting questions and commands, not just statements.', tr:'B1\'deki basit ifade aktarımının ötesine geçerek soru ve emirleri aktarma, ayrıca "said" dışında raporlama fiilleri (mentioned, suggested, warned, denied) öğretilir. Sorular aktarılırken kelime sırası düz cümle sırasına döner: "Are you coming?" → "She asked if I was coming."'},
  wrong:'He asked where I am going.', right:'He asked where I was going.', blank:{sentence:'She told me ___ the door.', word:'to close', distractors:['close','closing']},
  wrong2:'She asked what time is it.', right2:'She asked what time it was.', blank2:{sentence:'He warned me ___ be late.', word:'not to', distractors:['to not','not']}},
 {id:'g-B2-5', level:'B2', title:'Modals of Deduction', titleTr:'Çıkarım Kipleri',
  exp:{en:"must/might/can't have — expressing certainty about the past or present.", tr:'Geçmiş veya şimdiki durumlar hakkında tahmin ve kesinlik derecesi belirtmek için kullanılır. "Must" yüksek kesinlik (She must be tired), "might/could" olasılık, "can\'t" ise imkansızlık/güçlü şüphe ifade eder. Geçmiş tahminler için "must have/might have/can\'t have + fiil3" kullanılır.'},
  wrong:'She must left already, her coat is gone.', right:'She must have left already, her coat is gone.', blank:{sentence:"He can't ___ that — he wasn't even there.", word:'have said', distractors:['say','said']},
  wrong2:'She might has forgotten.', right2:'She might have forgotten.', blank2:{sentence:"They can't ___ arrived already.", word:'have', distractors:['has','be']}},
 {id:'g-B2-6', level:'B2', title:'Inversion for Emphasis', titleTr:'Vurgu için Devrik Yapı',
  exp:{en:'Flipping normal word order for emphasis or formality.', tr:'Vurgu yapmak için normal özne-fiil sırasının değiştirilmesidir, daha çok yazılı ve resmi/edebi dilde kullanılır. "Never", "rarely" gibi olumsuz/sınırlayıcı zarflar cümlenin başına geldiğinde, ardından yardımcı fiil + özne sırası gelir (soru sırası gibi).'},
  wrong:'I have never seen such a mess.', right:'Never have I seen such a mess.', blank:{sentence:'___ have I been so surprised.', word:'Rarely', distractors:['Rare','Rarely have']},
  wrong2:'Not until I got home I realized it.', right2:'Not until I got home did I realize it.', blank2:{sentence:'___ had she sat down when the phone rang.', word:'Hardly', distractors:['Hard','Hardly had']}},
 {id:'g-B2-7', level:'B2', title:'Phrasal Verbs (advanced)', titleTr:'İleri Seviye Phrasal Verbs',
  exp:{en:"Multi-word verbs whose meaning you can't guess from the parts.", tr:'Kelimelerin tek tek anlamından tahmin edilemeyen çok kelimeli fiillerdir. "Come across" (rastlamak) kelimenin gerçek anlamıyla hiç ilgili değildir. Bu fiiller genelde İngilizcenin en zor alanlarından biridir çünkü ezberlenmeleri gerekir ve genelde bağlamdan öğrenilirler.'},
  wrong:'He got away from paying the fine.', right:'He got away with not paying the fine.', blank:{sentence:'I finally came ___ my keys.', word:'across', distractors:['into','over']},
  wrong2:'I need to look the report.', right2:'I need to look into the report.', blank2:{sentence:'She always puts ___ with his jokes.', word:'up', distractors:['on','out']}},
 {id:'g-B2-8', level:'B2', title:'Wish / If Only', titleTr:'Wish / If Only',
  exp:{en:'Expressing regret about the present or past.', tr:'Pişmanlık veya farklı bir durum isteğini ifade eder. Şimdiki bir durumdan pişmanlık için "wish + past simple" (I wish I had more time), geçmiş bir durumdan pişmanlık için "wish + past perfect" (I wish I had studied) kullanılır. "If only" aynı işlevi görür ama biraz daha güçlü/duygusaldır.'},
  wrong:'I wish I study more.', right:'I wish I had studied more.', blank:{sentence:'If only I ___ him the truth.', word:'had told', distractors:['told','would tell']},
  wrong2:'I wish I am taller.', right2:'I wish I were taller.', blank2:{sentence:'If only he ___ me sooner.', word:'had told', distractors:['told','tells']}},
 {id:'g-B2-9', level:'B2', title:'Advanced Relative Clauses', titleTr:'İleri İlgi Cümlecikleri',
  exp:{en:'Non-defining and reduced relative clauses.', tr:'B1\'deki temel relative clause\'ların (defining clauses) ötesine geçerek, ekstra/opsiyonel bilgi veren non-defining clause\'lar öğretilir. Bu tür cümlecikler virgülle ayrılır ve cümlenin ana anlamı için gerekli değildir — çıkarılsa da cümle anlamlı kalır.'},
  wrong:'The report which was published yesterday, it was excellent.', right:'The report, which was published yesterday, was excellent.', blank:{sentence:'My brother, ___ lives in Berlin, is visiting.', word:'who', distractors:['that','which']},
  wrong2:'My car, that is new, broke down.', right2:'My car, which is new, broke down.', blank2:{sentence:'Paris, ___ I visited last year, is beautiful.', word:'which', distractors:['that','who']}},
 {id:'g-B2-10', level:'B2', title:'Linking Devices', titleTr:'Bağlaçlar',
  exp:{en:'however, nevertheless, moreover — formal connectors for writing.', tr:'Resmi yazıda kullanılan bağlaçlardır ve B1\'deki basit bağlaçların (but, also) daha akademik/resmi karşılıklarıdır. "However" bir noktalı virgül veya nokta ile başlar, cümlenin ortasında "but" gibi kullanılamaz — bu noktalama farkı sık yapılan bir hatadır.'},
  wrong:'It was raining, but also we went out.', right:'It was raining; nevertheless, we went out.', blank:{sentence:'The plan failed. ___, we learned a lot.', word:'Nevertheless', distractors:['Despite','Because']},
  wrong2:'She failed, however she tried hard.', right2:'She failed; however, she tried hard.', blank2:{sentence:'The plan is risky. ___, it could work.', word:'Nevertheless', distractors:['Despite','But']}},

 {id:'g-C1-1', level:'C1', title:'Inversion Structures (advanced)', titleTr:'İleri Devrik Yapılar',
  exp:{en:'Emphatic and formal patterns beyond basic inversion.', tr:'B2\'deki temel inversion yapılarının (Never have I...) ötesine geçerek, daha karmaşık ve resmi inversion kalıpları öğretilir: "Not only...but also", "Under no circumstances...". Bu yapılar özellikle akademik yazıda ve resmi konuşmalarda vurgu yaratmak için kullanılır.'},
  wrong:'She not only arrived late, but she also forgot the documents.', right:'Not only did she arrive late, but she also forgot the documents.', blank:{sentence:'___ did I realize my mistake.', word:'Only later', distractors:['Only late','Late only']},
  wrong2:'No sooner I arrived than it started raining.', right2:'No sooner had I arrived than it started raining.', blank2:{sentence:'___ anyone leave before the alarm stops.', word:'Under no circumstances should', distractors:['Under no circumstances','No circumstances should']}},
 {id:'g-C1-2', level:'C1', title:'Cleft Sentences', titleTr:'Cleft Cümleler',
  exp:{en:'Restructuring a sentence to emphasize one specific part.', tr:'Cümlenin belirli bir kısmını vurgulamak için yeniden yapılandırılmasıdır. "It was John who called" (John\'u vurgular) ve "What I need is more time" (ihtiyacı vurgular) en yaygın iki cleft yapısıdır. Bu yapılar, normal cümlede mümkün olmayan bir vurgu seviyesi sağlar.'},
  wrong:'John called you, not me.', right:'It was John who called you, not me.', blank:{sentence:'___ I need is more time.', word:'What', distractors:['That','It']},
  wrong2:'What I need it is more time.', right2:'What I need is more time.', blank2:{sentence:'___ was Sarah who suggested the idea.', word:'It', distractors:['That','What']}},
 {id:'g-C1-3', level:'C1', title:'Advanced Passive Constructions', titleTr:'İleri Edilgen Yapılar',
  exp:{en:'Passive with modal verbs and complex tenses.', tr:"B2'deki temel passive yapıların ötesine geçerek, modal fiillerle birleşen passive yapılar (should have been done, must be considered) öğretilir. Bu yapılar özellikle resmi rapor ve analiz metinlerinde sıkça kullanılır."},
  wrong:'The issue should addressed sooner.', right:'The issue should have been addressed sooner.', blank:{sentence:'The results ___ published next week.', word:'will be', distractors:['will','are being to be']},
  wrong2:'This should be finish by Friday.', right2:'This should be finished by Friday.', blank2:{sentence:'The matter ___ addressed sooner.', word:'should have been', distractors:['should be','has been']}},
 {id:'g-C1-4', level:'C1', title:'Nuanced Modals', titleTr:'İncelikli Kipler',
  exp:{en:'would rather, had better, may as well — subtle preference and suggestion.', tr:'Tercih ve hafif tehdit/güçlü öneri bildiren modal yapılardır. "Would rather" bir tercihi ifade eder; "had better" ise bir tavsiyeden daha güçlü, neredeyse bir uyarı niteliğinde bir öneridir ve genelde olumsuz bir sonucu ima eder. Türkçede tek bir kelimeye karşılık gelmez, kalıp olarak öğrenilir.'},
  wrong:'I would rather to stay home tonight.', right:'I would rather stay home tonight.', blank:{sentence:"You ___ leave now, it's getting late.", word:'had better', distractors:['would better','should to']},
  wrong2:'You had better to leave now.', right2:'You had better leave now.', blank2:{sentence:'I would rather ___ at home tonight.', word:'stay', distractors:['to stay','staying']}},
 {id:'g-C1-5', level:'C1', title:'Complex Conditionals', titleTr:'Karma Koşul Cümleleri',
  exp:{en:'Mixed conditionals combining past and present hypotheticals.', tr:'B2\'deki standart second/third conditional\'ların ötesine geçerek, geçmiş ve şimdiki zamanı aynı cümlede birleştiren "mixed conditional" yapıları öğretilir. Örneğin "If I had studied harder (geçmiş), I would be fluent now (şimdiki sonuç)" — İngilizcenin en karmaşık gramer yapılarından biridir.'},
  wrong:'If I studied harder, I would have been fluent now.', right:'If I had studied harder, I would be fluent now.', blank:{sentence:'If she ___ that job, she would be in London now.', word:'had taken', distractors:['took','would take']},
  wrong2:'If she took that job, she would be in London now.', right2:'If she had taken that job, she would be in London now.', blank2:{sentence:'If I ___ harder, I would be fluent now.', word:'had studied', distractors:['studied','would study']}},
 {id:'g-C1-6', level:'C1', title:'Participle Clauses', titleTr:'Ortaç Cümlecikleri',
  exp:{en:'Compressing information using -ing or -ed clauses.', tr:'Bilgiyi -ing (aktif) veya -ed (pasif) cümlecikleriyle sıkıştırarak daha ekonomik ve edebi bir cümle yapısı oluşturur. "Having finished the report, she left the office" cümlesi, "After she finished the report..." cümlesinin daha kısa ve zarif bir versiyonudur — ileri seviye yazının bir işaretidir.'},
  wrong:'Because she finished the report, she left the office.', right:'Having finished the report, she left the office.', blank:{sentence:'___ by the noise, he woke up immediately.', word:'Startled', distractors:['Startling','To startle']},
  wrong2:'Feeling exhausted, but she kept working.', right2:'Feeling exhausted, she kept working.', blank2:{sentence:'___ by the news, she sat down slowly.', word:'Shocked', distractors:['Shocking','To shock']}},
 {id:'g-C1-7', level:'C1', title:'Discourse Markers & Cohesion', titleTr:'Söylem Belirteçleri ve Tutarlılık',
  exp:{en:'that said, having said that, on balance — guiding a listener through an argument.', tr:'Konuşma veya yazıyı akıcı şekilde bağlayan, dinleyici/okuyucuyu yönlendiren ifadelerdir. "That said" ve "having said that" bir önceki noktayı kabul edip farklı bir yöne geçerken kullanılır; "on balance" tüm faktörleri tarttıktan sonra genel bir sonuca varmayı ifade eder.'},
  wrong:'It was expensive. But also it was worth it.', right:'It was expensive. That said, it was worth it.', blank:{sentence:'___, the plan has more benefits than risks.', word:'On balance', distractors:['On the other','At balance']},
  wrong2:'On the other, we should consider the cost.', right2:'On the other hand, we should consider the cost.', blank2:{sentence:'___, the results were disappointing.', word:'All things considered', distractors:['All things consider','All thing considered']}},
 {id:'g-C1-8', level:'C1', title:'Ellipsis & Substitution', titleTr:'Eksiltili Anlatım ve Yerine Kullanım',
  exp:{en:'Leaving out or replacing words understood from context.', tr:'Bağlamdan zaten anlaşılan kelimelerin atlanması (ellipsis) veya daha kısa bir kelimeyle değiştirilmesi (substitution) doğal, akıcı konuşmanın bir özelliğidir. "I can if you can" cümlesinde tam hali tekrar gerektirirdi ama tekrar gereksizdir — bu ekonomikleştirme, ana dili İngilizce olanların doğal konuşma biçimidir.'},
  wrong:'I can go if you can go.', right:'I can go if you can.', blank:{sentence:'She likes coffee and I do ___.', word:'too', distractors:['also','either']},
  wrong2:'She can cook and he can cook too.', right2:'She can cook and he can too.', blank2:{sentence:'I hope so, and I think ___ too.', word:'so', distractors:['it','that']}},
 {id:'g-C1-9', level:'C1', title:'Emphatic Structures', titleTr:'Vurgulu Yapılar (do/does/did)',
  exp:{en:'Adding stress to a statement with do/does/did + verb.', tr:'Normal bir cümleye "do/does/did" eklenerek ekstra vurgu ve stres yaratılır — genelde bir iddiayı doğrulamak veya bir yanlış anlamayı düzeltmek için kullanılır. "I did tell you" cümlesi "I told you"dan daha güçlü bir vurgu taşır ve genelde "ama sen inanmadın" ima eder.'},
  wrong:'I told you already, really.', right:'I did tell you already.', blank:{sentence:'She ___ try her best, even though she failed.', word:'did', distractors:['does','was']},
  wrong2:'She does liked the gift, really.', right2:'She did like the gift, really.', blank2:{sentence:'He ___ finish the report, I saw it myself.', word:'did', distractors:['does','was']}},
 {id:'g-C1-10', level:'C1', title:'Reported Speech with Modal Shifts', titleTr:'Kip Değişimli Aktarılan Konuşma',
  exp:{en:'will→would, can→could, must→had to — how modals shift when reporting.', tr:"B2'deki reported speech konusunun bir ileri uzantısıdır ve modal fiillerin aktarılırken nasıl değiştiğine odaklanır: will→would, can→could, may→might, must→had to. Bu değişimler otomatik değildir; bağlama göre bazı modallar (should, would, could, might) genelde değişmeden kalır."},
  wrong:'He said he will help me.', right:'He said he would help me.', blank:{sentence:'She said she ___ finish it by Friday.', word:'could', distractors:['can','will']},
  wrong2:'She said she can come.', right2:'She said she could come.', blank2:{sentence:'He said he ___ finish it by Friday.', word:'would', distractors:['will','can']}}
];

 text:"Emma was eight years old. She lived in a small town with her mother, father, and little brother, Tom. Every weekday, she walked to school with her best friend, Mia. They liked talking about school, games, and their dreams.\n\nOne Monday morning, Emma woke up very early. \"Today is special!\" she said. Her grandmother visited on Sunday and gave her a beautiful blue backpack. Emma loved it. It had two big pockets, three small pockets, and a picture of a white butterfly on the front.\n\nHer mother smiled. \"Are you ready for school?\" \"Yes!\" Emma answered happily. She put her English book, math book, notebook, pencil case, and lunch box into the backpack.\n\nAfter breakfast, Emma heard her father. \"Hurry! We are late!\" Emma quickly picked up her backpack and ran outside. Mia was waiting. \"Wow!\" Mia said. \"Your backpack is beautiful.\" \"Thank you! It is my favorite gift.\"\n\nWhen they arrived at school, Mrs. Green welcomed everyone. The first lesson was English. Emma loved reading stories. After English, it was time for math. Mrs. Green said, \"Please open your math books.\" Emma smiled and opened her backpack. She looked inside. Then she looked again. Her smile disappeared. \"My math book isn't here.\" She checked every pocket. Nothing. \"My notebook is gone too.\"\n\nMrs. Green walked to Emma. \"Is everything okay?\" \"I can't find my books.\" Mrs. Green smiled kindly. \"Don't worry. You can share Mia's book today.\" Emma still felt sad.\n\nAt lunchtime, she couldn't stop thinking about her missing books. Mia sat next to her. \"What happened this morning?\" Emma thought carefully. \"I packed everything. I ate breakfast. My father said we were late. I ran outside.\" Then she stopped. \"Wait... This backpack feels different.\" Mia looked surprised. \"What do you mean?\"\n\nEmma looked inside the bag again. There was a football sticker. \"There wasn't a football sticker yesterday.\" She looked at the name tag. It said: Lucas Brown. Emma laughed. \"This isn't my backpack!\" Mia laughed too. \"So where is yours?\"\n\nEmma looked around the playground. Then she saw a boy sitting alone. He looked worried. He had a blue backpack with a butterfly picture. Emma walked to him. \"Hi.\" \"Hi.\" \"Is your name Lucas?\" \"Yes.\" \"I think you have my backpack.\" Lucas looked surprised. He opened the bag. Inside were Emma's books. \"Oh! And you have mine!\" Both children laughed.\n\n\"I'm sorry,\" Lucas said. \"Our backpacks look the same. It was an accident.\" Emma smiled. \"It's okay.\" They exchanged backpacks. Emma opened hers immediately. \"My math book! My notebook! My lunch box! Everything is here!\" Lucas smiled too. \"My football is back. My science book is here too.\" Mrs. Green watched them. \"I'm happy you solved the problem together.\"\n\nAfter school, Emma and Lucas walked to the school gate. \"What games do you like?\" Lucas asked. \"I like drawing and riding my bicycle.\" \"I like football.\" \"My brother likes football too,\" Emma said. \"Maybe you can play together.\"\n\nThe next Saturday, Lucas came to the park. Tom joined the game. Emma and Mia sat on a bench and talked. Emma smiled. \"I thought I lost my books. But I found a new friend.\"\n\nOne week later, Emma put a colorful butterfly keychain on her backpack. Lucas put a red football keychain on his. Now everyone knew whose backpack was whose. Mrs. Green laughed. \"Sometimes a small mistake brings something wonderful.\" Emma agreed. \"If I didn't take the wrong backpack... I would never meet Lucas.\" She walked home happily, carrying her blue backpack and thinking about her new friend.",
 vocab:[{word:'backpack', en:'A bag that you carry on your back.', tr:'sırt çantası', fa:'کوله‌پشتی'},{word:'pocket', en:'A small place in a bag or clothes for keeping things.', tr:'cep', fa:'جیب'},{word:'butterfly', en:'An insect with colorful wings.', tr:'kelebek', fa:'پروانه'},{word:'keychain', en:'A small object that holds keys together.', tr:'anahtarlık', fa:'جاکلیدی'},{word:'worried', en:'Thinking something bad may happen.', tr:'endişeli', fa:'نگران'},{word:'exchange', en:'To give something and receive another thing.', tr:'değiştirmek', fa:'مبادله کردن'},{word:'accident', en:'Something that happens without planning.', tr:'kaza, yanlışlık', fa:'تصادف، اتفاق ناخواسته'},{word:'playground', en:'A place where children play.', tr:'oyun alanı', fa:'زمین بازی'},{word:'solve', en:'To find the answer to a problem.', tr:'çözmek', fa:'حل کردن'},{word:'favorite', en:'The one you like the most.', tr:'favori, en sevilen', fa:'مورد علاقه'},{word:'together', en:'With another person.', tr:'birlikte', fa:'با هم'}],

{id:'story-A1-Fiction-2', level:'A1', genre:'Fiction', title:{en:'The Lost Puppy', tr:'Kayıp Yavru Köpek'},
 text:"It was a warm Saturday morning. The sun was shining, and the birds were singing. Maya was nine years old. She loved animals more than anything. Every weekend, she helped her grandfather in his small garden. She watered the flowers, picked vegetables, and fed the birds.\n\nAfter breakfast, Maya walked to her grandfather's house. It was only ten minutes from her home. \"Good morning, Grandpa!\" Maya called. \"Good morning, Maya,\" her grandfather said with a smile. \"The tomatoes need some water today.\"\n\nMaya picked up the watering can and started working. She liked spending time in the garden because it was quiet and peaceful. Suddenly, she heard a soft sound. \"Woof... woof...\" Maya looked around. \"Did you hear that?\" she asked. Grandpa nodded. \"I think it came from behind the old tree.\"\n\nThey walked slowly to the tree. There, under a wooden bench, was a tiny brown puppy. It looked scared. Its fur was dirty, and its ears were shaking. \"Oh!\" Maya said softly. \"You're so little.\" The puppy looked at her with big brown eyes. Grandpa knelt beside the puppy. \"I don't think it has a home.\"\n\nMaya carefully held out her hand. The puppy smelled her fingers. Then it slowly walked toward her. \"It's hungry,\" Maya said. Grandpa brought a bowl of water and some dog food from his house. The puppy ate quickly. \"It must be very hungry,\" Maya said. After eating, the puppy wagged its tail. Maya laughed. \"I think it likes us!\"\n\nThey gave the puppy a warm blanket and a small box to sleep in. All afternoon, Maya played with the puppy. She threw a small ball. The puppy ran after it. Sometimes it fell down because its legs were still very small. Maya laughed every time. \"You are very funny.\"\n\nWhen Maya's mother came to pick her up, she saw the puppy. \"Where did this little dog come from?\" she asked. \"We found it behind the tree,\" Maya answered. \"We need to find its family.\"\n\nThe next morning, Maya and Grandpa made colorful posters. The posters said: LOST PUPPY. Brown fur. Small. Friendly. Please call us if this puppy is yours. They put the posters on trees, shops, and bus stops. For two days, nobody called. Maya became worried. \"What if nobody wants the puppy?\" Grandpa smiled. \"Let's wait one more day.\"\n\nOn Tuesday afternoon, the phone rang. Grandpa answered. After a few minutes, he smiled. \"I think we found the owner.\" An hour later, a woman and a little boy arrived. The boy ran to the puppy. \"Biscuit!\" The puppy jumped into the boy's arms. It licked his face happily. The little boy laughed. \"I missed you so much!\" His mother smiled. \"Biscuit ran away during the storm last week. We looked everywhere. Thank you for taking care of him.\"\n\nMaya felt happy but also a little sad. She hugged Biscuit one last time. \"Goodbye. Be a good dog.\" The little boy smiled. \"Thank you. You can visit Biscuit anytime.\"\n\nThe next Saturday, Maya visited the family. Biscuit remembered her immediately. He ran to her and wagged his tail. The little boy and Maya became friends. They played in the park while Biscuit chased butterflies.\n\nOn the way home, Grandpa smiled. \"Are you sad?\" Maya shook her head. \"No. I miss Biscuit. But I'm happy because he is with his family.\" Grandpa nodded. \"Sometimes loving someone means helping them go home.\" Maya looked back. Biscuit was running happily beside his owner. She smiled. Helping the puppy had not only saved an animal. It had also given Maya a new friend and a beautiful memory.",
 vocab:[{word:'puppy', en:'A very young dog.', tr:'yavru köpek', fa:'توله‌سگ'},{word:'garden', en:'A place where flowers or vegetables grow.', tr:'bahçe', fa:'باغ'},{word:'bench', en:'A long seat for two or more people.', tr:'bank', fa:'نیمکت'},{word:'scared', en:'Feeling afraid.', tr:'korkmuş', fa:'ترسیده'},{word:'fur', en:'The soft hair on an animal.', tr:'kürk, tüy', fa:'پشم (حیوان)'},{word:'wag', en:'To move a tail from side to side.', tr:'kuyruğunu sallamak', fa:'تکان دادن دم'},{word:'blanket', en:'A warm cover used for sleeping.', tr:'battaniye', fa:'پتو'},{word:'poster', en:'A large paper with information or a picture.', tr:'afiş', fa:'پوستر'},{word:'owner', en:'The person who has something.', tr:'sahip', fa:'صاحب'},{word:'storm', en:'Bad weather with strong wind and rain.', tr:'fırtına', fa:'طوفان'},{word:'chase', en:'To run after someone or something.', tr:'kovalamak', fa:'تعقیب کردن'},{word:'memory', en:'Something you remember from the past.', tr:'anı', fa:'خاطره'}],

{id:'story-A1-Fiction-3', level:'A1', genre:'Fiction', title:{en:'The Secret Birthday Gift', tr:'Gizli Doğum Günü Hediyesi'},
 text:"It was Friday morning, and everyone in Class 3B was excited. Their teacher, Mrs. Wilson, smiled at the students. \"Good morning, everyone!\" \"Good morning!\" the class answered. Mrs. Wilson looked at the calendar. \"Tomorrow is Anna's birthday.\" The students clapped. Anna smiled. \"I can't wait! My grandmother is coming to visit.\"\n\nAfter class, Anna left with her mother. When she was gone, Mrs. Wilson closed the classroom door. \"I have an idea,\" she said. \"Let's surprise Anna with a birthday party on Monday.\" The students became excited. \"Yes!\" they shouted together.\n\nMrs. Wilson wrote a list on the board. \"We need decorations. We need a birthday card. We need a cake. And we need a special gift.\" Every student wanted to help. Ben loved drawing. \"I will make the birthday card.\" Lily liked colorful paper. \"I can make paper flowers.\" David said, \"My father owns a bakery. I can bring a chocolate cake.\" Mrs. Wilson smiled. \"Wonderful.\"\n\nThen she looked at Emma. \"What would you like to do?\" Emma thought for a moment. \"I want to make a photo album.\" \"A photo album?\" asked Mia. \"Yes. I have many school pictures. We can remember our happy days together.\" Everyone liked the idea.\n\nThat afternoon, Emma went home and looked through many old photos. She found pictures from sports day, the school picnic, and a funny picture of Anna wearing a very big hat during the school play. Emma laughed. \"She will love this.\"\n\nOn Saturday, Emma bought a small blue notebook. She carefully glued every picture inside. Under each picture, she wrote a short sentence: \"Our first day at school.\" \"The class picnic.\" \"Our science project.\" \"The football match.\"\n\nOn Sunday, Mia came to Emma's house. \"I brought colorful stickers!\" Together they decorated every page. They added stars, hearts, flowers, and balloons. The album became more beautiful.\n\nMonday finally arrived. Anna came to school with a big smile. She carried a box of cookies. \"My grandmother made these for everyone.\" Mrs. Wilson smiled. \"Thank you, Anna. Can you help me in the library for a few minutes?\" \"Of course.\"\n\nAs Anna walked away, the class quickly started working. Ben put the birthday card on the teacher's desk. Lily hung the paper flowers on the walls. David carefully placed the cake on a table. Emma put the photo album in the middle. Everyone turned off the classroom lights and waited quietly.\n\nOutside, they heard footsteps. The classroom door slowly opened. Anna walked inside. \"SURPRISE!\" Everyone shouted together. Anna stopped. Her eyes became very big. Then she smiled. \"Oh! I didn't know!\" She looked around the room. The walls were colorful. The cake smelled wonderful. The card was full of kind messages.\n\nMrs. Wilson gave Anna the photo album. \"This is from all of us.\" Anna opened the first page. She saw a picture from the first day of school. Then another. And another. She laughed. She smiled. Finally, a small tear came into her eye. \"These are my favorite memories. Thank you.\" Emma smiled. \"We wanted to give you something special.\" Anna hugged her friends. \"This is the best birthday gift I have ever received.\"\n\nThe class sang \"Happy Birthday.\" Then everyone ate cake and cookies. They laughed, played games, and took new pictures together. Before going home, Mrs. Wilson gathered the students. \"Do you know why this gift is special?\" Ben answered, \"Because we made it ourselves.\" Mrs. Wilson nodded. \"Yes. Sometimes love, friendship, and time are the greatest gifts.\"\n\nThat evening, Anna showed the photo album to her grandmother. Her grandmother smiled as she looked through every page. \"This is a beautiful gift. You can buy toys. You can buy clothes. But you cannot buy memories.\" Anna closed the album carefully. She knew she would keep it for many years. Every time she looked at it, she would remember her wonderful friends and the surprise birthday they planned with love.",
 vocab:[{word:'surprise', en:'Something unexpected that makes people happy or excited.', tr:'sürpriz', fa:'غافلگیری'},{word:'birthday', en:'The day each year when a person was born.', tr:'doğum günü', fa:'تولد'},{word:'decoration', en:'Something used to make a place look beautiful.', tr:'süsleme', fa:'تزئین'},{word:'bakery', en:'A shop where bread and cakes are made and sold.', tr:'fırın, pastane', fa:'نانوایی'},{word:'photo album', en:'A book for keeping photographs.', tr:'fotoğraf albümü', fa:'آلبوم عکس'},{word:'glue', en:'To stick things together with a special liquid or stick.', tr:'yapıştırmak', fa:'چسباندن'},{word:'sticker', en:'A picture that sticks to a surface.', tr:'çıkartma', fa:'برچسب'},{word:'hug', en:'To put your arms around someone to show love or friendship.', tr:'sarılmak', fa:'در آغوش گرفتن'},{word:'wonderful', en:'Very good and enjoyable.', tr:'harika', fa:'فوق‌العاده'},{word:'gather', en:'To bring people together in one place.', tr:'toplamak, bir araya getirmek', fa:'جمع کردن'}],

       {prompt:'Why did Anna think the photo album was the best gift?', options:['Because it was full of memories money cannot buy','Because it was the most expensive gift','Because it had the most stickers'], correct:0}],
 grammarFocus:[{point:'Simple Present', example:'Sometimes love and friendship are the greatest gifts.'},{point:'Simple Past', example:'Emma glued every picture into the notebook.'},{point:'Future with will', example:'She will keep the album for many years.'},{point:'Imperatives (Let\'s..., Open..., Wait...)', example:"Let's surprise Anna with a party."},{point:'Adjectives (beautiful, colorful, special, wonderful)', example:'The photo album was beautiful and special.'}],
 discussionQuestions:['What is the best birthday gift you have ever received?','Do you like giving handmade gifts? Why or why not?','How would you surprise your best friend on their birthday?'],
