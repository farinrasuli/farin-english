{id:'story-B2-Romance-1', level:'B2', genre:'Romance', title:{en:'The Photograph That Changed Everything', tr:'Her Şeyi Değiştiren Fotoğraf'},
 text:"When Emma moved into her grandmother's old house, she expected to spend a few quiet months organizing family belongings before selling the property. The house had been empty for almost a year. Every room contained memories: old books, handmade decorations, faded paintings, and photographs from another time. Emma had always loved stories about the past, but she never expected one photograph to change the way she saw her own family.\n\nWhile cleaning the attic, Emma discovered a small wooden box hidden behind an old suitcase. Inside were dozens of photographs. Most showed ordinary moments: family dinners, holidays, and birthdays. But one photograph immediately caught her attention. It showed her grandmother as a young woman standing beside a man Emma had never seen before. On the back of the photograph, someone had written: \"Paris, 1978. The beginning of everything.\" Emma was confused. She knew her grandfather had lived in the same town his entire life. Who was this man?\n\nThe next morning, Emma visited her grandmother's old friend, Clara. When Clara saw the photograph, she became silent. \"I wondered when someone would find this,\" she said. Emma looked surprised. \"You knew about him?\" Clara nodded. \"His name was Daniel. Your grandmother met him while studying in Paris. He was the person who encouraged her to follow her dreams.\" Emma wanted to know more. Clara explained that Daniel and Emma's grandmother had shared a deep connection. They both loved art, literature, and traveling. However, after returning home, life took them in different directions. Emma's grandmother chose a different path and built a family. Daniel continued traveling and became a famous photographer.\n\nCurious about the mysterious man in the photograph, Emma searched online. After several days, she found Daniel's photography exhibition in a nearby city. She decided to visit. Inside the gallery, she saw hundreds of photographs from around the world. Then she noticed one familiar image. It was a photograph of her grandmother. Emma approached Daniel, who was now an elderly man. When she introduced herself, his expression changed. \"You are her granddaughter?\" Emma nodded. Daniel smiled. \"She always told me she hoped someone in her family would love stories as much as she did.\"\n\nThey spent the afternoon talking. Daniel shared stories about Emma's grandmother's dreams, creativity, and kindness. Before Emma left, he gave her a small envelope. Inside was a letter written many years earlier. It was from her grandmother to Daniel. Emma did not read it. She believed some words belonged only to the people who received them. Instead, she gave it back. Daniel smiled. \"She always respected people's feelings.\"\n\nA few months later, Emma decided not to sell the house. Instead, she transformed the old building into a small cultural center where people could share stories, photographs, and memories. Daniel became one of the first visitors. Standing in the garden, he looked at the house and smiled. \"Your grandmother would have loved this.\" Emma looked at the old photograph on the wall. She finally understood something. Love does not always mean staying with someone forever. Sometimes, love means leaving something meaningful behind for another person to discover.",
 vocab:[{word:'belonging', en:'Something owned by a person.', tr:'eşya, ait olan şey', fa:'وسیله شخصی'},{word:'attic', en:'A room under the roof of a house.', tr:'çatı katı', fa:'زیرشیروانی'},{word:'photograph', en:'A picture taken with a camera.', tr:'fotoğraf', fa:'عکس'},{word:'connection', en:'A strong relationship between people.', tr:'bağ', fa:'پیوند'},{word:'encourage', en:'To give someone confidence or support.', tr:'cesaretlendirmek', fa:'تشویق کردن'},{word:'complicated', en:'Difficult to understand or deal with.', tr:'karmaşık', fa:'پیچیده'},{word:'exhibition', en:'A public display of art or objects.', tr:'sergi', fa:'نمایشگاه'},{word:'creativity', en:'The ability to create new ideas.', tr:'yaratıcılık', fa:'خلاقیت'},{word:'transform', en:'To completely change something.', tr:'dönüştürmek', fa:'دگرگون کردن'},{word:'meaningful', en:'Having importance or value.', tr:'anlamlı', fa:'معنادار'}],

{id:'story-B2-Romance-2', level:'B2', genre:'Romance', title:{en:'The Garden of Unspoken Words', tr:'Söylenmemiş Sözler Bahçesi'},
 text:"At the edge of a quiet village stood an old garden surrounded by a tall stone wall. For many years, nobody entered it. The villagers called it The Garden of Unspoken Words because of an old story connected to the place. According to the legend, the garden had once belonged to a writer named Adrian and a musician named Clara. They had loved each other deeply, but they were both too afraid to express their true feelings. When they finally separated, they left behind a garden filled with flowers, letters, and memories.\n\nYears later, a young woman named Lily moved to the village. She was a botanist who studied rare plants. While exploring the area, she discovered the forgotten garden. The gate was covered with vines, but it opened easily. Inside, she found a beautiful place hidden from the world. Wildflowers grew everywhere. Old trees provided shade. Near the center of the garden stood a small wooden bench with a metal box underneath. Curious, Lily opened the box. Inside were dozens of letters.\n\nThe first letter was written by Adrian. It described his love for Clara and his fear of losing her. He wrote about all the things he wanted to say but never had the courage to express. The next letters were from Clara. She had felt the same way. She had also been afraid of rejection. Lily realized something painful. Two people had cared deeply for each other, but silence had separated them.\n\nLily spent weeks reading the letters and restoring the garden. She planted new flowers, repaired broken paths, and cleaned the old fountain. During this time, she became friends with Noah, a local photographer. Noah often visited the garden to take pictures. \"You seem connected to this place,\" he said one afternoon. Lily smiled. \"I think this garden has a lesson to teach.\" \"What lesson?\" \"That people should say what they feel before it is too late.\"\n\nAs the seasons changed, Lily and Noah became closer. They shared their dreams, fears, and hopes. However, Lily noticed something familiar. Sometimes Noah wanted to say something but stopped himself. One evening, while sitting near the old fountain, Lily asked: \"Is there something you want to tell me?\" Noah looked nervous. \"I was afraid that saying too much might change our friendship.\" Lily smiled. \"Not saying anything can change it too.\" Noah finally admitted that he cared about her. He explained that he admired her kindness, curiosity, and passion for protecting nature. Lily felt relieved. She realized that honesty did not always create perfect moments, but it created real ones.\n\nMonths later, the garden became a peaceful place where villagers could visit. Lily placed a sign near the entrance: \"The most beautiful words are the ones we are brave enough to say.\" People came to enjoy the flowers, but many also came to think about their own relationships. Some wrote letters to people they loved. Others finally had conversations they had avoided for years.\n\nOne evening, Lily and Noah sat in the garden watching the sunset. \"Do you think Adrian and Clara would be happy to see this place now?\" Noah asked. Lily looked at the flowers moving gently in the wind. \"I think they would. Maybe their story was not only about lost love. Maybe it was about teaching others not to lose their chance.\" The garden remained a place of beauty and reflection. And every year, new flowers grew among the old ones. A reminder that love needs care, honesty, and the courage to speak.",
 vocab:[{word:'surrounded', en:'Having something around all sides.', tr:'çevrili', fa:'احاطه‌شده'},{word:'legend', en:'An old story that may not be completely true.', tr:'efsane', fa:'افسانه'},{word:'express', en:'To communicate thoughts or feelings.', tr:'ifade etmek', fa:'بیان کردن'},{word:'courage', en:'The ability to face fear.', tr:'cesaret', fa:'شجاعت'},{word:'rejection', en:'The feeling of being refused or not accepted.', tr:'reddedilme', fa:'طرد شدن'},{word:'restore', en:'To repair and bring something back to good condition.', tr:'restore etmek, yenilemek', fa:'مرمت کردن'},{word:'fountain', en:'A structure where water flows.', tr:'çeşme', fa:'فواره'},{word:'admire', en:'To respect or like someone greatly.', tr:'hayran olmak', fa:'تحسین کردن'},{word:'honesty', en:'The quality of telling the truth.', tr:'dürüstlük', fa:'صداقت'},{word:'reflection', en:'Deep thinking about something.', tr:'düşünme, yansıtma', fa:'تأمل'}],

{id:'story-B2-Romance-3', level:'B2', genre:'Romance', title:{en:'The Letter That Arrived Twenty Years Later', tr:'Yirmi Yıl Sonra Gelen Mektup'},
 text:"When Daniel opened his mailbox on a cold winter morning, he expected to find the usual things: bills, advertisements, and newspapers. Instead, he found a yellow envelope. There was no return address. Only his name was written on the front. The handwriting immediately felt familiar. Daniel stood silently for a moment. He had not seen that handwriting in twenty years. It belonged to Sophie.\n\nDaniel and Sophie had been best friends since university. They shared everything: dreams, fears, and plans for the future. They both loved literature and often spent evenings discussing books in a small café near campus. Everyone believed they would stay close forever. But after graduation, life changed. Daniel accepted a job in another country. Sophie stayed behind to care for her family. They promised to keep in touch. At first, they exchanged messages and letters. Then, slowly, the distance became larger. One day, the communication stopped. Neither of them knew why.\n\nDaniel looked at the envelope again. His hands shook slightly as he opened it. Inside was a letter written twenty years earlier. The date was from the year he had moved away. The first sentence made his heart stop: \"Dear Daniel, I don't know if you will ever read this...\" Sophie explained that she had written the letter after he left. She wanted to tell him something important. But she had been afraid. She worried that her words would change their friendship forever.\n\nAs Daniel continued reading, he discovered that Sophie had not been angry. She had missed him. She had wanted to tell him that he was one of the most important people in her life. However, she also understood that people sometimes choose different paths. At the end of the letter, she wrote: \"If life brings us together again, I hope we can talk honestly.\"\n\nDaniel spent the entire day thinking about the past. He wondered why the letter had arrived after twenty years. The next morning, he searched online. After several hours, he found Sophie. She was living in a small coastal town and worked as a literature teacher. Daniel hesitated before sending a message. What if too much time had passed? What if they had become completely different people? But he remembered Sophie's words: \"I hope we can talk honestly.\" So he wrote.\n\nA week later, they met in the same café where they had spent so many evenings as students. At first, they felt like strangers. They talked about their careers, families, and experiences. They laughed about old memories. They also spoke about the years they had lost. \"I thought you didn't want to hear from me anymore,\" Sophie admitted. Daniel looked surprised. \"I thought you had forgotten me.\" They both laughed softly. They realized that the silence between them had been created by misunderstanding, not by a lack of care.\n\nOver the following months, Daniel and Sophie slowly rebuilt their connection. They did not try to recreate the past. Instead, they created something new. They understood that people change. They understood that time can separate people. But they also learned that meaningful connections can survive when people are willing to be honest.\n\nYears later, Daniel kept that old yellow envelope in a special box. Not because it represented lost time. But because it reminded him of something important: sometimes life gives people a second chance. But someone must be brave enough to open the door.",
 vocab:[{word:'envelope', en:'A paper cover used for sending letters.', tr:'zarf', fa:'پاکت نامه'},{word:'familiar', en:'Known from past experience.', tr:'tanıdık', fa:'آشنا'},{word:'graduation', en:'The completion of a course of study.', tr:'mezuniyet', fa:'فارغ‌التحصیلی'},{word:'distance', en:'The space or separation between people or places.', tr:'mesafe', fa:'فاصله'},{word:'communication', en:'The act of sharing information or feelings.', tr:'iletişim', fa:'ارتباط'},{word:'hesitate', en:'To pause because you are uncertain.', tr:'tereddüt etmek', fa:'مردد بودن'},{word:'misunderstanding', en:'A situation where people understand something incorrectly.', tr:'yanlış anlama', fa:'سوءتفاهم'},{word:'rebuild', en:'To create something again after damage or loss.', tr:'yeniden kurmak', fa:'بازسازی کردن'},{word:'meaningful', en:'Having importance or emotional value.', tr:'anlamlı', fa:'معنادار'},{word:'connection', en:'A relationship or bond between people.', tr:'bağ', fa:'پیوند'}],

 discussionQuestions:['Do you think people can reconnect after many years? Why?','Why do people sometimes avoid honest conversations?','Is the past something we should hold onto or let go of?'],

// ===================== THRILLER =====================
{id:'story-B2-Thriller-1', level:'B2', genre:'Thriller', title:{en:'The Room Behind the Painting', tr:'Tablonun Arkasındaki Oda'},
 text:"When Sofia Laurent became the new director of the Bellmont Museum, she expected to spend her time organizing exhibitions and protecting valuable artworks. She never expected to discover a secret hidden inside one of the museum's oldest paintings. The painting was called \"The Silent Garden.\" It had been hanging in the museum for more than eighty years. Visitors admired its beautiful colors and mysterious atmosphere, but nobody knew much about the artist, Victor Bell. He had disappeared shortly after creating the painting. No one knew where he went or why he stopped making art.\n\nOne evening, Sofia stayed late at the museum to examine the painting more carefully. She noticed something unusual. The wooden frame was much thicker than normal. Curious, she removed the painting from the wall and inspected the back. There, hidden beneath layers of dust, she found a small metal lock. Her heart started beating faster. Why would a painting have a lock?\n\nThe next morning, Sofia asked the museum's security expert, Marcus, for help. Together, they carefully opened the hidden compartment behind the frame. Inside was a small notebook. The pages were old and fragile. The first page contained a sentence written by Victor Bell: \"The truth is not always meant to be displayed.\" Sofia and Marcus began reading. The notebook described Victor's final years as an artist. He explained that he had discovered a secret about the museum's history and wanted to protect it. However, he feared that revealing the information would create conflict.\n\nThe notebook included several clues. Victor mentioned a forgotten room, an unfinished painting, and a person who had been removed from official records. Sofia became determined to solve the mystery. She searched through old museum documents and discovered something strange. The original plans of the building showed an extra room that no longer appeared on modern maps. A room hidden behind the main exhibition hall.\n\nWith the help of Marcus, Sofia examined the old walls. After hours of searching, they discovered a narrow door covered by a large wooden panel. Behind it was a small room filled with forgotten artworks. On the walls were paintings by unknown artists. Among them was Victor Bell's unfinished masterpiece. But the greatest discovery was not the artwork. It was a collection of letters.\n\nThe letters revealed that Victor had once worked with a group of young artists who created revolutionary paintings. Their work challenged traditional ideas, but many of them were ignored because they did not have powerful connections. Victor had secretly preserved their paintings because he believed their talent deserved recognition. He had hidden the room to protect their legacy.\n\nSofia faced a difficult decision. The museum could become famous if it revealed the secret room immediately. However, she worried that the artists' stories would become just another attraction. Instead, she organized a careful exhibition. She presented the artists' work with their personal stories, explaining their struggles and dreams. The exhibition became one of the museum's most successful events.\n\nYears later, people still visited Bellmont Museum to see the hidden collection. When visitors asked Sofia how she discovered such an important secret, she always answered: \"I didn't discover a room. I discovered voices that had been waiting to be heard.\"",

{id:'story-B2-Thriller-2', level:'B2', genre:'Thriller', title:{en:'The Code Hidden in the Old Book', tr:'Eski Kitaptaki Gizli Şifre'},
 text:"When Oliver Grant bought an old book from a small second-hand bookstore, he expected nothing more than an interesting story to read on a quiet weekend. The book was called \"The Forgotten Kingdom.\" It was a history book published almost one hundred years ago. The cover was damaged, the pages were yellow, and several notes had been written in the margins. Normally, Oliver would have ignored these marks. But one sentence caught his attention: \"The truth is hidden between the words.\"\n\nOliver was a professor of history who loved solving mysteries. He carefully examined the book. At first, the notes seemed random. Some pages had numbers. Others had strange symbols. There were also several words underlined with a red pencil. He wondered if someone had simply studied the book in an unusual way. However, after comparing the marked pages, he noticed a pattern. The numbers matched the chapters, pages, and sentences. Someone had created a code.\n\nOliver spent several evenings studying the message. The first letters of certain sentences created new words. The symbols represented old writing techniques used by secret societies. Slowly, the hidden message appeared: \"Find the place where history sleeps.\" Oliver was fascinated. What did it mean? Was it referring to a building, a city, or something else?\n\nHe returned to the bookstore and asked the owner about the book. The elderly owner, Mr. Harris, became quiet when he saw it. \"I was wondering when someone would find that,\" he said. Oliver looked surprised. \"You knew about the code?\" Mr. Harris nodded. \"The book belonged to a historian named Edward Vale. He disappeared thirty years ago while searching for something connected to the old kingdom.\"\n\nOliver searched through historical records. He discovered that Edward Vale had been investigating a lost collection of documents believed to belong to an ancient royal family. According to the records, the documents contained information about forgotten events that had never been officially recorded. The final note in Edward's research mentioned: \"Where the first stories were written, the final answers wait.\"\n\nOliver believed the clue pointed to the oldest library in the city. He visited the building and searched through its historical archives. After several hours, he found a strange symbol carved into the side of an old wooden shelf. The symbol matched the one from the book. Behind the shelf was a small hidden compartment. Inside was a leather folder. The folder contained letters written by Edward Vale. They explained that he had discovered the lost documents years earlier. However, he chose not to publish them immediately. The documents contained sensitive information about powerful historical figures. Edward wanted to make sure the information was understood correctly before sharing it with the world.\n\nOliver faced a difficult choice. Publishing the documents would make him famous. Many people would want to read them. But without proper explanation, the information could create confusion and conflict. He decided to work with historians and researchers before making anything public. Together, they carefully analyzed the documents.\n\nTwo years later, the discovery became one of the most important historical findings of the decade. Edward Vale's name became respected around the world. When journalists asked Oliver what the greatest discovery was, he answered: \"It wasn't the documents. It was understanding that knowledge has responsibility.\"\n\nThe old book remained in Oliver's office. He kept it on his desk as a reminder. Sometimes, the most valuable secrets are not hidden because someone wants to keep them forever. Sometimes, they are hidden because the world needs time to understand them.",
 vocab:[{word:'second-hand', en:'Previously owned by another person.', tr:'ikinci el', fa:'دست‌دوم'},{word:'margin', en:'The empty space around the edge of a page.', tr:'sayfa kenarı', fa:'حاشیه صفحه'},{word:'symbol', en:'A sign that represents an idea.', tr:'sembol', fa:'نماد'},{word:'pattern', en:'A repeated or organized design.', tr:'düzen, örüntü', fa:'الگو'},{word:'investigate', en:'To examine something carefully to discover facts.', tr:'araştırmak', fa:'بررسی کردن'},{word:'archive', en:'A collection of historical documents.', tr:'arşiv', fa:'آرشیو'},{word:'compartment', en:'A small hidden section inside something.', tr:'bölme', fa:'محفظه مخفی'},{word:'publish', en:'To make information available to the public.', tr:'yayınlamak', fa:'منتشر کردن'},{word:'sensitive', en:'Needing careful handling because it may cause problems.', tr:'hassas', fa:'حساس'},{word:'responsibility', en:'A duty to act correctly.', tr:'sorumluluk', fa:'مسئولیت'}],

{id:'story-B2-Thriller-3', level:'B2', genre:'Thriller', title:{en:'The Photograph That Was Taken Tomorrow', tr:'Yarın Çekilen Fotoğraf'},
 text:"Maya Chen was a documentary photographer who traveled around the world searching for unusual stories. She believed every photograph captured more than an image. It captured a moment that would never happen again. One rainy evening, while cleaning her old camera equipment, Maya discovered a strange memory card inside a camera she had not used for years. She did not remember taking the card. Curious, she opened the files. There was only one photograph. The name of the file was: \"Tomorrow_09_15.jpg.\" Maya looked at the date. The photograph was dated for the next day.\n\nAt first, she thought it was a technical error. Maybe the camera's date settings were incorrect. But when she opened the image, she became completely confused. The photograph showed the central train station in her city. People were standing on the platform. A red suitcase was placed near a bench. A newspaper was lying on the ground. Everything looked ordinary. Except for one detail. In the corner of the photograph, Maya saw herself. She was standing near the train tracks. And she was holding a letter.\n\nMaya stared at the image for several minutes. She had no memory of taking this photograph. More importantly, she did not know why she would be at the train station the next day. The following morning, she decided to investigate. She arrived at the station at 9:00 AM. She carried the photograph with her. Every detail was exactly the same. The red suitcase. The newspaper. The people. Everything.\n\nThen she saw the letter. A man approached the platform and accidentally dropped an envelope. Maya picked it up. Before she could return it, she noticed the name on the envelope. It was her own name. Her hands became cold. Why was someone sending her a letter? She opened it carefully. Inside was a message: \"You will have to choose what kind of person you want to become.\" There was no signature.\n\nMaya spent the rest of the day trying to understand what had happened. She examined the photograph again. This time, she noticed something she had missed before. In the background, there was a small reflection in a shop window. Someone was taking the photograph. Someone had been watching her.\n\nMaya began researching the history of her camera. She discovered that it had belonged to a famous photographer named Daniel Cross. He had disappeared fifteen years earlier while working on a project about human decisions and future possibilities. According to his notes, he believed technology could capture moments that had not happened yet. Most people considered his theories impossible.\n\nMaya returned to her studio and searched through old files. She found a hidden folder containing Daniel's research. His work suggested that future events were not fixed. A photograph of the future was not a prediction. It was a possibility. People could still change what happened.\n\nThe next day, Maya returned to the train station. She found the person who had been watching her. It was an elderly man. He introduced himself as Daniel Cross. He explained that he had left the photograph for her because he believed she was someone who understood the power of choices. \"I wanted to show you something,\" he said. \"The future is not a road we follow. It is a road we create.\"\n\nYears later, Maya became famous for her photography. But she never published the mysterious photograph. When people asked why, she simply answered: \"Some moments are not meant to be displayed. Some moments are meant to change us.\"",
 vocab:[{word:'documentary', en:'A factual record of real events or people.', tr:'belgesel', fa:'مستند'},{word:'capture', en:'To record or preserve a moment.', tr:'yakalamak, kaydetmek', fa:'ثبت کردن'},{word:'equipment', en:'Tools or objects used for a purpose.', tr:'ekipman', fa:'تجهیزات'},{word:'platform', en:'The area where passengers wait for trains.', tr:'peron', fa:'سکو'},{word:'investigate', en:'To search for information and discover the truth.', tr:'araştırmak', fa:'بررسی کردن'},{word:'reflection', en:'An image seen in a mirror or glass surface.', tr:'yansıma', fa:'انعکاس'},{word:'theory', en:'An idea that explains something and needs testing.', tr:'teori', fa:'نظریه'},{word:'possibility', en:'Something that may happen.', tr:'olasılık', fa:'احتمال'},{word:'prediction', en:'A statement about what may happen in the future.', tr:'tahmin', fa:'پیش‌بینی'},{word:'decision', en:'A choice made after thinking.', tr:'karar', fa:'تصمیم'}],
 quiz:[{prompt:'Why was Maya surprised when she saw the photograph?', options:['It was dated for the next day and showed her at a place she had no memory of visiting','It showed a place she had never been to','It was completely blank'], correct:0},
       {prompt:'What message was hidden inside the letter?', options:['That she would have to choose what kind of person she wanted to become','A warning about a dangerous person','Directions to a hidden treasure'], correct:0},
       {prompt:'What did Maya learn about the future?', options:['That the future is not fixed—it is a possibility people can still change through their choices','That the future can always be predicted exactly','That cameras can travel through time'], correct:0}],
 grammarFocus:[{point:'Mixed Conditional (Introduction)', example:'If Maya had ignored the photograph, she might never have discovered the truth.'},{point:'Passive Voice', example:'The photograph was taken before Maya knew about it.'},{point:'Reported Speech', example:'Daniel explained that the future was not fixed.'}],

 writingPractice:{prompt:'Write 150-180 words about finding an object that shows something about the future. Include: What the object is. How you find it. What it shows. How it changes your decisions.'},
 message:{en:'The future is not only something that happens to us. Our choices, actions, and courage help create the person we become.'}},

{id:'story-B2-Documentary-1', level:'B2', genre:'Documentary', title:{en:'The Scientist Who Listened to Trees', tr:'Ağaçları Dinleyen Bilim İnsanı'},
 text:"For most of his childhood, Dr. Elias Morgan felt more comfortable in forests than in crowded cities. While other children played video games, Elias spent hours observing trees, insects, and birds near his home. He was fascinated by one question: \"How do trees survive and communicate in a changing world?\" Many people believed trees were silent and independent. However, Elias wondered if forests were much more connected than humans understood.\n\nAfter becoming a scientist, Elias dedicated his career to studying forests. He traveled to different parts of the world, collecting information about ancient forests, endangered plants, and changing ecosystems. During his research, he discovered something surprising. Trees were not simply individual organisms competing for sunlight and water. They were part of a complex network. Through underground fungal systems, trees could exchange nutrients and send chemical signals to each other.\n\nElias called this network \"the forest conversation.\" He explained that trees could react when they faced danger. For example, when insects attacked one tree, nearby trees could receive signals and increase their natural defenses. The forest was not speaking with words. It was communicating through chemistry, roots, and time.\n\nHowever, Elias noticed a serious problem. Many forests around the world were disappearing. Human activities, climate change, and pollution were damaging ecosystems that had developed over thousands of years. Some scientists warned that losing forests would affect not only wildlife but also human life. Trees helped clean the air, protect water systems, and regulate the planet's temperature.\n\nElias began working with local communities to protect forests. He believed that science alone was not enough. People needed to feel connected to nature. In one village near a large rainforest, he created an education program for children. Instead of only teaching from books, he took students into the forest. He showed them how to identify different trees, understand animal behavior, and observe changes in the environment. One student asked him: \"Why should we protect trees if they cannot talk to us?\" Elias smiled. \"They do talk,\" he answered. \"We just need to learn their language.\"\n\nThe students began recording information about the forest. They created maps, photographed plants, and monitored changes over time. Their project later helped scientists understand how the ecosystem was changing.\n\nYears later, Elias became known internationally for his research. He received awards and gave lectures around the world. However, he always returned to the forest. He believed that technology and science were important, but direct experience with nature was equally valuable. \"The more time we spend with nature,\" he often said, \"the more we understand that we are not separate from it.\"\n\nToday, many scientists continue studying forest communication. New discoveries show that ecosystems are far more connected and intelligent than people once imagined. Elias's work changed the way many people viewed forests. They were no longer seen as collections of trees. They were understood as living communities with their own relationships and systems.",
 vocab:[{word:'organism', en:'A living thing such as a plant, animal, or human.', tr:'organizma', fa:'موجود زنده'},{word:'ecosystem', en:'A community of living things and their environment.', tr:'ekosistem', fa:'اکوسیستم'},{word:'research', en:'Careful study to discover new information.', tr:'araştırma', fa:'پژوهش'},{word:'communicate', en:'To exchange information or ideas.', tr:'iletişim kurmak', fa:'ارتباط برقرار کردن'},{word:'nutrient', en:'A substance needed for growth and health.', tr:'besin maddesi', fa:'ماده مغذی'},{word:'network', en:'A connected system of people or things.', tr:'ağ', fa:'شبکه'},{word:'endangered', en:'At risk of disappearing forever.', tr:'nesli tehlikede', fa:'در معرض انقراض'},{word:'pollution', en:'Harmful substances that damage nature.', tr:'kirlilik', fa:'آلودگی'},{word:'monitor', en:'To watch and check something over time.', tr:'izlemek', fa:'پایش کردن'},{word:'protect', en:'To keep something safe from harm.', tr:'korumak', fa:'محافظت کردن'}],
 quiz:[{prompt:'What question inspired Elias to study trees?', options:['How trees survive and communicate in a changing world','How trees can be sold for higher profit','Why forests attract more tourists than cities'], correct:0},
       {prompt:'How do trees communicate with each other?', options:['Through underground fungal networks that exchange nutrients and chemical signals','By making sounds audible to humans','Through radio signals detected by satellites'], correct:0},
       {prompt:'Why did Elias believe education was important for protecting forests?', options:['He believed people needed to feel personally connected to nature, not just learn facts from books','He believed only scientists should be allowed in forests','He thought children should avoid nature for safety reasons'], correct:0}],
 grammarFocus:[{point:'Present Perfect', example:'Scientists have discovered many connections in forests.'},{point:'Passive Voice', example:'Many forests are damaged by human activities.'},{point:'Relative Clauses', example:'The students who joined the project learned about ecosystems.'}],
 discussionQuestions:['Do you think humans understand nature enough?','Should protecting forests be a global responsibility?','What can people learn from plants and animals?'],
 writingPractice:{prompt:'Write 150-180 words about a scientist or inventor who changed the world. Include: Who the person is. What they discovered. Why it was important. How their work influenced people.'},

{id:'story-B2-Documentary-2', level:'B2', genre:'Documentary', title:{en:'The Village Powered by the Wind', tr:'Rüzgarla Çalışan Köy'},
 text:"High in the northern hills of Denmark, there was a small village called Vesterholm. For many years, the village faced a common problem. The weather was often cold and windy, but the community depended almost entirely on energy brought from outside. Electricity prices increased every year, and many families worried about the future. The villagers knew they needed a different solution. They began asking an important question: \"Could the wind that surrounds us become the energy that supports us?\"\n\nAt first, many people were doubtful. Building wind turbines required money, planning, and cooperation. Some residents worried that the turbines would change the appearance of the landscape. Others believed the project was too ambitious for a small village. However, a local engineer named Anna Larsen believed the idea was possible. She studied renewable energy and returned to her hometown with a plan.\n\nAnna organized community meetings where people could share their opinions. She explained how wind turbines worked and how they could create clean energy. Unlike traditional energy sources, wind power did not require burning fuels that released harmful gases into the atmosphere. After many discussions, the villagers voted to begin the project. It became a community effort. Farmers offered land. Workers helped with construction. Families invested small amounts of money. Everyone had a role.\n\nTwo years later, the first wind turbines were completed. At the beginning, people watched them carefully. Would they produce enough energy? Would they really help the village? Slowly, the results became clear. The turbines generated more electricity than expected. The village could provide energy for its own homes and even sell extra electricity to nearby towns.\n\nThe success of the project brought unexpected changes. The village created new jobs related to maintenance and technology. Young people who had moved away began returning because they saw new opportunities. Schools started teaching students about renewable energy and environmental responsibility. The wind turbines became more than machines. They became symbols of cooperation and innovation.\n\nHowever, the journey was not always easy. During one winter, several turbines stopped working because of extreme weather conditions. Some villagers questioned whether the project had been a mistake. Anna reminded them that every new idea has challenges. \"Success does not mean everything works perfectly from the beginning,\" she said. \"It means people continue improving.\"\n\nThe community repaired the turbines and developed better systems. They also invested in battery technology to store energy for days when the wind was weaker. Over time, the village became an example for other communities interested in clean energy. Researchers, students, and visitors came from different countries to learn from their experience.\n\nYears later, Vesterholm was known as one of the most sustainable villages in the region. But when people asked Anna what the greatest achievement was, she did not mention the turbines. She talked about the people. \"The technology was important,\" she said. \"But the real power came from cooperation.\"\n\nThe story of Vesterholm showed that solving environmental problems does not always begin with large governments or huge companies. Sometimes, change begins with ordinary people who decide to work together. A small village, a strong idea, and the power of the wind transformed the future.",
 vocab:[{word:'renewable', en:'Able to be replaced naturally and used again.', tr:'yenilenebilir', fa:'تجدیدپذیر'},{word:'energy', en:'Power used to operate machines, homes, and technology.', tr:'enerji', fa:'انرژی'},{word:'turbine', en:'A machine that produces energy from wind or water.', tr:'türbin', fa:'توربین'},{word:'sustainable', en:'Able to continue without harming the environment.', tr:'sürdürülebilir', fa:'پایدار'},{word:'community', en:'A group of people living or working together.', tr:'topluluk', fa:'جامعه'},{word:'electricity', en:'A form of energy used for lights and machines.', tr:'elektrik', fa:'برق'},{word:'environment', en:'The natural world around us.', tr:'çevre', fa:'محیط زیست'},{word:'innovation', en:'A new idea, method, or technology.', tr:'yenilik', fa:'نوآوری'},{word:'maintain', en:'To keep something working properly.', tr:'bakımını yapmak', fa:'نگهداری کردن'},{word:'cooperation', en:'Working together toward a common goal.', tr:'iş birliği', fa:'همکاری'}],
 quiz:[{prompt:'Why did the people of Vesterholm decide to use wind energy?', options:['They faced rising electricity costs and wanted an independent, clean energy source','The government forced them to switch energy sources','They wanted to attract more tourists'], correct:0},
       {prompt:'What challenges did the village face during the project?', options:['Some turbines stopped working during extreme winter weather','The turbines were stolen by a rival village','The wind never blew strongly enough to matter'], correct:0},
       {prompt:'Why did Anna believe cooperation was more important than technology?', options:['Because real success came from the whole community working together, not just the machines','Because the turbines actually failed completely','Because she disliked technology'], correct:0}],
 grammarFocus:[{point:'Passive Voice', example:'The wind turbines were built by the villagers.'},{point:'Present Perfect', example:'The village has become an example of sustainable development.'},{point:'First Conditional', example:'If communities work together, they can create positive change.'}],
 discussionQuestions:['Should communities invest more in renewable energy?','What environmental problems exist in your city or country?','Can ordinary people create large changes?'],
 writingPractice:{prompt:"Write 150-180 words about a community project that improves people's lives. Include: Where the project happens. What problem it solves. Who participates. How it changes the community."},
 message:{en:'Technology can change the world, but people create the real transformation. When communities cooperate, even small ideas can create meaningful results.'}},

{id:'story-B2-Documentary-3', level:'B2', genre:'Documentary', title:{en:'The Woman Who Saved an Ancient Language', tr:'Kadim Bir Dili Kurtaran Kadın'},
 text:"Deep in the mountains of northern Georgia, there was a small village where only a few elderly people still spoke an ancient language called Lazuri. For centuries, the language had been passed from parents to children. It carried stories about the land, traditional songs, local customs, and the history of the people who lived there. But over time, fewer young people learned Lazuri. Many moved to larger cities for education and work. Slowly, the language began disappearing.\n\nDr. Elena Petrov, a linguist, first heard Lazuri during a research trip when she was a university student. She was fascinated by its unique sounds and expressions. Unlike many modern languages, Lazuri contained words that described specific relationships between humans and nature. There were special words for different types of forests, rivers, and mountain landscapes. Elena realized that losing the language would mean losing a whole way of understanding the world.\n\nAfter becoming a researcher, Elena returned to the village. She met with elderly speakers and asked them to share their memories, stories, and songs. At first, some people were unsure. They wondered why anyone would be interested in a language that so few people spoke. One elderly man named Giorgi told her: \"Our language is old. Maybe it is not useful anymore.\" Elena answered: \"Something does not lose its value because it becomes rare.\"\n\nElena began recording conversations. She collected thousands of words, expressions, and traditional stories. She created a digital archive where future generations could listen to native speakers. She also worked with local schools to create language classes for children. The project was challenging. Some young people believed learning Lazuri would not help their future careers. They preferred learning languages with more global importance.\n\nHowever, Elena changed her approach. She did not teach Lazuri only as a language. She taught it as a connection to identity. Students learned traditional songs, interviewed grandparents, and collected family stories. They discovered that their language was not just a collection of words. It was a bridge between generations.\n\nOver the years, the number of young speakers increased. Children who had never heard Lazuri before began using it at home and in cultural events. The village organized festivals where people celebrated traditional music, food, and storytelling. The language that once seemed close to disappearing began to return.\n\nInternational researchers later studied Elena's work. They explained that preserving endangered languages was important because every language contained unique knowledge. A language was not only a tool for communication. It was a record of human experience. When a language disappears, humanity loses a different way of describing emotions, nature, and life.\n\nYears later, Elena stood in the village square listening to children speaking Lazuri. A journalist asked her: \"Do you think you saved the language?\" Elena smiled. \"No,\" she said. \"The people saved it. I only helped them remember what was already theirs.\"\n\nToday, Lazuri continues to exist because a community decided that its history was worth protecting. The story shows that languages are not only words. They are memories, traditions, and voices from the past that continue speaking to the future.",
 vocab:[{word:'ancient', en:'Very old, from a distant past.', tr:'antik, eski', fa:'باستانی'},{word:'language', en:'A system people use to communicate.', tr:'dil', fa:'زبان'},{word:'preserve', en:'To protect something and keep it alive.', tr:'korumak, yaşatmak', fa:'حفظ کردن'},{word:'linguist', en:'A person who studies languages.', tr:'dilbilimci', fa:'زبان‌شناس'},{word:'identity', en:'The qualities that make a person or group unique.', tr:'kimlik', fa:'هویت'},{word:'expression', en:'A word or phrase that communicates an idea.', tr:'ifade', fa:'عبارت'},{word:'disappear', en:'To stop existing or become impossible to find.', tr:'kaybolmak', fa:'ناپدید شدن'},{word:'archive', en:'A collection of saved information or documents.', tr:'arşiv', fa:'آرشیو'},{word:'generation', en:'A group of people born around the same time.', tr:'nesil', fa:'نسل'},{word:'heritage', en:'Traditions and culture passed from the past.', tr:'miras', fa:'میراث فرهنگی'}],
 quiz:[{prompt:'Why was the Lazuri language disappearing?', options:['Fewer young people learned it as many moved to larger cities for education and work','It was banned by the government','No one had ever spoken it fluently'], correct:0},
       {prompt:'How did Elena help protect the language?', options:['She recorded native speakers, built a digital archive, and taught it as a connection to identity','She translated it entirely into English','She forced schools to stop teaching other languages'], correct:0},
       {prompt:'Why did Elena say that the people saved the language, not her?', options:['Because the community itself chose to protect and pass on their own heritage','Because she never actually did any real research','Because the government funded the entire project'], correct:0}],
 grammarFocus:[{point:'Present Perfect', example:'The community has preserved its language for many years.'},{point:'Passive Voice', example:'Thousands of words were recorded by Elena.'},{point:'Relative Clauses', example:'The language that people spoke contained important cultural knowledge.'}],
 discussionQuestions:['Why are endangered languages important?','Should schools teach local languages as well as global languages?','What traditions from your culture should be protected?'],
 writingPractice:{prompt:'Write 150-180 words about a tradition, language, or cultural practice that should be protected. Include: What it is. Why it is important. Why it is disappearing. How people can preserve it.'},
 message:{en:'A language is more than communication. It is a living memory of human experience. Protecting languages means protecting the stories and knowledge of generations.'}}

{id:'story-C1-Fiction-1', level:'C1', genre:'Fiction', title:{en:'The Library of Impossible Books', tr:'İmkansız Kitaplar Kütüphanesi'},
 text:"In the oldest district of the city, hidden between abandoned buildings and narrow streets, there was a library that did not appear on any official map. People called it The Library of Impossible Books. Nobody knew when it had been built. Nobody knew who managed it. Some said it had existed for hundreds of years. Others believed it appeared only when someone was searching for a story they desperately needed to find.\n\nAmelia Voss was a writer who had spent years studying forgotten literature. She had published several successful novels, but recently she had lost her inspiration. Every idea she created felt incomplete. Every story seemed like something she had already seen before. She began questioning whether she still had anything meaningful to say.\n\nOne evening, while walking through the old part of the city, she noticed a door between two buildings. She was certain the door had not been there before. Above it was a small sign: The Library of Impossible Books. Inside, the library was enormous. Thousands of shelves extended into darkness. Books filled every corner. Some were made of unusual materials. Some had no titles. Others appeared to change their names whenever Amelia looked away.\n\nAn old librarian approached her. His name was Elias. \"Are you looking for something?\" he asked. Amelia smiled sadly. \"I don't know anymore.\" Elias looked at her carefully. \"Then perhaps you are looking for the right thing.\" Elias explained that the library contained books that had never been written. Books about possible lives, forgotten dreams, and choices people never made. \"They are not predictions,\" he said. \"They are possibilities.\" Amelia was confused. \"How can a book exist if nobody wrote it?\" Elias answered: \"Every story begins somewhere. Sometimes it begins with a person who has not yet imagined it.\"\n\nThe librarian gave Amelia a small black book. The cover had no title. When she opened it, she saw her own name. Inside were pages describing her childhood, her fears, her ambitions, and moments she had forgotten. She quickly closed the book. \"How is this possible?\" Elias remained calm. \"The book does not know your future. It understands your possibilities.\"\n\nAmelia spent several hours exploring the library. She discovered books about people she had never met. One described a scientist who would discover a new form of energy. Another described an artist who would create a new style of painting. Another described a person who would change the world through a simple act of kindness. Every book showed a different possibility.\n\nBefore leaving, Amelia asked Elias one final question. \"Why does this library exist?\" The old librarian looked at the endless shelves. \"Because humans often forget that they are not finished stories. They believe they are limited by their past. But every day, they write another page.\"\n\nWhen Amelia returned home, she began writing again. However, she changed her approach. Before, she had tried to create perfect stories. Now, she focused on honest ones. Her next novel was not about extraordinary heroes or impossible worlds. It was about ordinary people discovering their hidden potential. The book became her greatest success.\n\nYears later, people asked Amelia where she found the inspiration for her most famous novel. She always gave the same answer: \"I found a library. But the most important book I discovered was my own.\"\n\nMany people searched for the mysterious library after hearing her story. Some claimed they found it. Others searched their entire lives and never discovered the door. Perhaps the library was real. Perhaps it was only a symbol. But those who believed in it understood one important truth: Every person carries unwritten stories inside them.",
 vocab:[{word:'inspiration', en:'A feeling or idea that encourages creativity.', tr:'ilham', fa:'الهام'},{word:'incomplete', en:'Not finished or missing something important.', tr:'eksik, tamamlanmamış', fa:'ناقص'},{word:'desperately', en:'With a strong need or great urgency.', tr:'çaresizce', fa:'ناامیدانه'},{word:'enormous', en:'Extremely large.', tr:'devasa', fa:'عظیم'},{word:'possibility', en:'Something that may happen.', tr:'olasılık', fa:'احتمال'},{word:'ambition', en:'A strong desire to achieve something.', tr:'hırs, hedef', fa:'جاه‌طلبی'},{word:'potential', en:'The ability to develop or become something.', tr:'potansiyel', fa:'پتانسیل'},{word:'approach', en:'A way of dealing with something.', tr:'yaklaşım', fa:'رویکرد'},{word:'extraordinary', en:'Very unusual or remarkable.', tr:'olağanüstü', fa:'خارق‌العاده'}],
 quiz:[{prompt:'Why did Amelia visit the Library of Impossible Books?', options:['She noticed a mysterious door and was searching for something, though unsure what, having lost her creative inspiration','She was researching a historical building for an article','She was invited by Elias to see his private collection'], correct:0},
       {prompt:'What was unusual about the books inside the library?', options:['They contained possible lives and choices people had never made, not predictions','They were all written in ancient, untranslatable languages','They could only be read once before disappearing'], correct:0},
       {prompt:"How did the library change Amelia's way of writing?", options:['She stopped trying to write perfect stories and instead focused on honest ones about ordinary people','She stopped writing novels entirely and became a librarian','She began writing only fantasy stories about impossible worlds'], correct:0}],

{id:'story-C1-Fiction-2', level:'C1', genre:'Fiction', title:{en:'The Man Who Remembered Every Life', tr:'Her Anı Hatırlayan Adam'},
 text:"For most people, memory was a collection of moments. A childhood birthday. A forgotten conversation. A face that appeared briefly in a crowd. Memories were valuable because they were limited. They faded, changed, and sometimes disappeared. But for Adrian Cole, memory was not limited at all. He remembered everything.\n\nAdrian first realized something was different about him when he was a child. At the age of six, he could describe events that had happened years earlier with perfect accuracy. He remembered conversations between his parents before he was born. He remembered the exact smell of the house where his family had lived when he was three. Doctors called it an unusual neurological ability. Researchers called it a rare form of extraordinary autobiographical memory. But Adrian simply called it a burden.\n\nAs he grew older, his memory became both a gift and a problem. He could learn languages quickly. He could recall information from books he had read decades earlier. He became a respected historian because he could describe historical documents without needing to look at them. However, he could never escape his past. Every mistake he had made remained alive. Every painful conversation returned with the same emotional intensity. Every goodbye felt as recent as the first time.\n\nAdrian often wondered why humans were designed to forget. At university, he asked his professor: \"Why do we consider memory important if forgetting is part of being human?\" His professor replied: \"Because forgetting allows us to continue. Without it, the past would constantly compete with the present.\" Adrian never forgot those words.\n\nYears later, Adrian became involved in a research project studying memory and identity. Scientists wanted to understand whether memory created personality or whether personality existed independently. During the project, Adrian met Dr. Lena Hart, a neuroscientist who specialized in human consciousness. Unlike other researchers, Lena was not interested only in Adrian's ability. She was interested in his experience. \"People see your memory as a superpower,\" she told him. \"But they don't understand what it feels like.\"\n\nFor the first time, Adrian felt someone understood him. He explained that remembering everything made it difficult to change. Most people could look back at their mistakes and say: \"I was a different person then.\" Adrian could not. The person he was twenty years ago was always present. His past never became truly past.\n\nOne day, Lena asked him a difficult question: \"If you could remove certain memories, would you?\" Adrian remained silent. For years, he had imagined forgetting as a form of freedom. But now he considered another possibility. His memories, even the painful ones, had shaped him. Without them, would he still be himself?\n\nAfter months of research, Adrian made his decision. He refused the experimental treatment that could reduce his memories. Instead, he began working with psychologists to develop healthier ways of living with his unique ability. He learned that acceptance did not mean loving every memory. It meant understanding that every experience had contributed to who he had become.\n\nMany years later, Adrian wrote a book about his life. People expected it to be a story about an extraordinary mind. Instead, it became a reflection on ordinary human experiences. He wrote: \"The difference between people is not how much they remember. It is how they choose to understand what they remember.\"\n\nThe book became famous worldwide. Readers were fascinated by Adrian's ability, but they connected with something deeper. Everyone carried memories. Everyone had moments they wished to change, return to, or forget. Adrian's story reminded people that identity was not created only by what happened to them. It was created by how they gave meaning to what happened.\n\nIn his final interview, Adrian was asked: \"Do you think remembering everything made your life better?\" He smiled. \"I used to think memory was a prison. Now I understand it is a library. The question is not how many books we have. The question is whether we know how to read them.\"",
 vocab:[{word:'autobiographical', en:"Related to a person's own life story.", tr:'otobiyografik', fa:'زندگی‌نامه‌ای'},{word:'neurological', en:'Related to the nervous system and brain.', tr:'nörolojik', fa:'عصب‌شناختی'},{word:'burden', en:'A difficult responsibility or problem.', tr:'yük, ağır sorumluluk', fa:'بار سنگین'},{word:'intensity', en:'The strength or power of a feeling or experience.', tr:'yoğunluk', fa:'شدت'},{word:'consciousness', en:'Awareness of oneself and the world.', tr:'bilinç', fa:'آگاهی'},{word:'contribute', en:'To help create or develop something.', tr:'katkıda bulunmak', fa:'کمک کردن'},{word:'acceptance', en:'The process of recognizing and dealing with reality.', tr:'kabullenme', fa:'پذیرش'},{word:'experimental', en:'Based on testing new ideas or methods.', tr:'deneysel', fa:'آزمایشی'},{word:'perspective', en:'A particular way of viewing something.', tr:'bakış açısı', fa:'دیدگاه'}],

       {prompt:'What philosophical question about identity does the story explore?', options:['Whether identity comes from what happens to us or from how we choose to understand it','Whether memory can be transferred between people','Whether forgetting is always harmful to society'], correct:0},
